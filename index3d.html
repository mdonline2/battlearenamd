/* 單位移動類型（單位的moveType欄位，沒填＝'walk'）。目前只有步行；之後飛行/游泳在這裡加一種，
   stepCost()會依類型查表，現在先把「類型」這個旋鈕留好，不用改規則函式的呼叫端。 */
const MOVE_TYPE_DB = {
  walk: { label:'步行' },
};
function moveTypeOf(u){ return (u && MOVE_TYPE_DB[u.moveType]) ? u.moveType : 'walk'; }

const DIRS4 = [[1,0],[-1,0],[0,1],[0,-1]];

/* ---------- 地圖資料 → 執行用物件 ---------- */
function parseMapDef(id, def){
  const out = { id, ok:false, errors:[], warnings:[] };
  if(!def || !Array.isArray(def.terrain) || !Array.isArray(def.height)){ out.errors.push('缺少 terrain/height 矩陣'); return out; }
  const rows = def.terrain.length, cols = rows ? def.terrain[0].length : 0;
  if(rows < 2 || cols < 2){ out.errors.push('地圖太小（至少2×2）'); return out; }
  if(def.height.length !== rows) out.errors.push(`height列數(${def.height.length})與terrain列數(${rows})不同`);
  const T = [], H = [];
  for(let y=0;y<rows;y++){
    const tr = def.terrain[y], hr = def.height[y];
    if(typeof tr !== 'string' || tr.length !== cols){ out.errors.push(`terrain第${y}列長度不是${cols}`); continue; }
    if(typeof hr !== 'string' || hr.length !== cols){ out.errors.push(`height第${y}列長度不是${cols}`); continue; }
    const hrow = [];
    for(let x=0;x<cols;x++){
      if(!TERRAIN_DB[tr[x]]) out.errors.push(`terrain(${x},${y})未知地形字元「${tr[x]}」`);
      const hv = hr.charCodeAt(x) - 48;
      if(!(hv >= 0 && hv <= 9)) out.errors.push(`height(${x},${y})不是0~9的數字「${hr[x]}」`);
      hrow.push(hv);
    }
    T.push(tr); H.push(hrow);
  }
  Object.assign(out, {
    cols, rows, T, H,
    allySpawns: (def.allySpawns || []).map(p=>[p[0],p[1]]),
    enemySpawns: (def.enemySpawns || []).map(p=>[p[0],p[1]]),
    floorItems: (def.floorItems || []).map(f=>({x:f.x,y:f.y,item:f.item})),
    effects: (def.effects || []).map(e=>({x:e.x,y:e.y,type:e.type||'fire',turns:e.turns!=null?e.turns:FIRE_DEFAULT_TURNS})),
    events: def.events || [],   // 【預留】場地事件，目前只存不執行
  });
  out.ok = out.errors.length === 0;
  return out;
}
function mapIn(map,x,y){ return x>=0 && y>=0 && x<map.cols && y<map.rows; }
function mapTerrain(map,x,y){ return TERRAIN_DB[map.T[y][x]]; }
function mapHeight(map,x,y){ return map.H[y][x]; }

/* ---------- 單步移動成本：從(ax,ay)走到相鄰的(bx,by)；Infinity＝不可走 ----------
   這是「能不能走、走一步多貴」的唯一規則函式，玩家移動、敵方AI、距離場、地圖驗證全部共用。 */
function mapStepCost(map, mt, ax,ay, bx,by){
  const tb = mapTerrain(map,bx,by);
  if(!tb.passable) return Infinity;
  const dh = Math.abs(mapHeight(map,bx,by) - mapHeight(map,ax,ay));
  if(dh >= HEIGHT_DIFF_BLOCK_AT) return Infinity;
  let c = tb.cost;
  if(dh >= HEIGHT_DIFF_EXTRA_AT) c += HEIGHT_DIFF_EXTRA_COST;
  return c;
}

/* ---------- 小型最小堆（Dijkstra用，地圖變大也不會變慢） ---------- */
function MinHeap(){ this.k = []; this.p = []; }
MinHeap.prototype.size = function(){ return this.k.length; };
MinHeap.prototype.push = function(key, pri){
  const K = this.k, P = this.p; let i = K.length; K.push(key); P.push(pri);
  while(i > 0){ const j = (i-1)>>1; if(P[j] <= P[i]) break; const tk=K[i],tp=P[i]; K[i]=K[j];P[i]=P[j];K[j]=tk;P[j]=tp; i=j; }
};
MinHeap.prototype.pop = function(){
  const K = this.k, P = this.p, n = K.length; if(!n) return null;
  const top = [K[0], P[0]]; const lk = K.pop(), lp = P.pop();
  if(n > 1){ K[0]=lk; P[0]=lp; let i=0; const m=K.length;
    for(;;){ let a=i*2+1,b=a+1,s=i; if(a<m && P[a]<P[s]) s=a; if(b<m && P[b]<P[s]) s=b; if(s===i) break; const tk=K[i],tp=P[i]; K[i]=K[s];P[i]=P[s];K[s]=tk;P[s]=tp; i=s; } }
  return top;
};

/* ---------- 通用Dijkstra（多起點、可限制最大成本） ----------
   starts:[[x,y,d0],…]；o.maxCost 超過就不展開；o.step(ax,ay,bx,by)→成本；o.pass(x,y)→能不能「進入」該格。
   回傳 { dist:Float64Array(Infinity=到不了), prev:Int32Array(-1=無), cols, rows } */
function mapDijkstra(map, starts, o){
  const N = map.cols * map.rows;
  const dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1);
  const heap = new MinHeap(), maxCost = (o && o.maxCost != null) ? o.maxCost : Infinity;
  starts.forEach(s=>{ const k = s[1]*map.cols + s[0]; if((s[2]||0) < dist[k]){ dist[k] = s[2]||0; heap.push(k, dist[k]); } });
  for(;;){
    const it = heap.pop(); if(!it) break;
    const k = it[0], d = it[1]; if(d > dist[k]) continue;
    const cx = k % map.cols, cy = (k - cx) / map.cols;
    for(let i=0;i<4;i++){
      const nx = cx + DIRS4[i][0], ny = cy + DIRS4[i][1];
      if(!mapIn(map,nx,ny)) continue;
      if(o.pass && !o.pass(nx,ny)) continue;
      const c = o.step(cx,cy,nx,ny); if(c === Infinity) continue;
      const nd = d + c; if(nd > maxCost) continue;
      const nk = ny*map.cols + nx;
      if(nd < dist[nk]){ dist[nk] = nd; prev[nk] = k; heap.push(nk, nd); }
    }
  }
  return { dist, prev, cols:map.cols, rows:map.rows };
}
function pathFromPrev(r, x, y){
  const out = []; let k = y*r.cols + x;
  while(k >= 0){ out.push([k % r.cols, Math.floor(k / r.cols)]); k = r.prev[k]; }
  return out.reverse();
}

/* ---------- 地圖驗證：載入時檢查，不合格就拒絕開戰 ----------
   檢查項：尺寸一致、字元合法、出生點在地圖內且可站且不重複、我方每個出生點都走得到敵方每個出生點、
   沒有「可站立卻永遠走不到」的孤島格、可站立格數夠用、物品/效果位置合法。
   unitCount={allies,enemies}：實際單位數（開戰時才知道），可省略（只驗地圖本身）。 */
function validateMapDef(map, unitCount){
  const errors = map.errors.slice(), warnings = map.warnings.slice();
  if(errors.length) return { ok:false, errors, warnings };
  const std = (x,y)=> mapIn(map,x,y) && mapTerrain(map,x,y).passable;
  const seen = {};
  const checkSpawns = (list, label)=>{
    if(!list.length) errors.push(`${label}出生點是空的`);
    list.forEach(([x,y])=>{
      if(!mapIn(map,x,y)){ errors.push(`${label}出生點(${x},${y})在地圖外`); return; }
      if(!std(x,y)) errors.push(`${label}出生點(${x},${y})是${mapTerrain(map,x,y).name}，不能站`);
      const k = x+','+y; if(seen[k]) errors.push(`出生點(${x},${y})重複（${seen[k]}與${label}）`); seen[k] = label;
    });
  };
  checkSpawns(map.allySpawns, '我方'); checkSpawns(map.enemySpawns, '敵方');
  // 可站立格數
  let open = 0; for(let y=0;y<map.rows;y++) for(let x=0;x<map.cols;x++) if(std(x,y)) open++;
  const units = unitCount ? (unitCount.allies + unitCount.enemies) : (map.allySpawns.length + map.enemySpawns.length);
  const need = Math.max(MAP_MIN_OPEN_TILES, units * MAP_OPEN_TILES_PER_UNIT);
  if(open < need) errors.push(`可站立格子只有${open}，至少需要${need}`);
  // 連通性：從第一個我方出生點出發（只看地形規則，不看單位）
  const firstOk = map.allySpawns.find(([x,y])=>std(x,y));
  if(firstOk){
    const r = mapDijkstra(map, [[firstOk[0],firstOk[1],0]], { step:(ax,ay,bx,by)=>mapStepCost(map,'walk',ax,ay,bx,by) });
    const reach = (x,y)=> r.dist[y*map.cols+x] < Infinity;
    map.allySpawns.concat(map.enemySpawns).forEach(([x,y])=>{ if(std(x,y) && !reach(x,y)) errors.push(`出生點(${x},${y})與其他出生點不連通`); });
    const islands = [];
    for(let y=0;y<map.rows;y++) for(let x=0;x<map.cols;x++) if(std(x,y) && !reach(x,y)) islands.push(`(${x},${y})`);
    if(islands.length) errors.push(`有${islands.length}格可站立的地面被圍住走不到：${islands.slice(0,6).join(' ')}${islands.length>6?' …':''}`);
  }
  // 物品／效果
  const itemSeen = {};
  map.floorItems.forEach(f=>{
    if(!std(f.x,f.y)){ errors.push(`物品(${f.x},${f.y})不在可站立的格子上`); return; }
    if(typeof ITEM_DB !== 'undefined' && !ITEM_DB[f.item]) errors.push(`物品(${f.x},${f.y})的key「${f.item}」不存在於ITEM_DB`);
    const k = f.x+','+f.y; if(itemSeen[k]) errors.push(`物品位置(${f.x},${f.y})重複`); itemSeen[k] = 1;
    if(seen[k]) warnings.push(`物品(${f.x},${f.y})放在出生點上`);
  });
  map.effects.forEach(e=>{ if(!mapIn(map,e.x,e.y)) errors.push(`效果(${e.x},${e.y})在地圖外`); else if(e.type!=='fire') warnings.push(`效果(${e.x},${e.y})類型「${e.type}」尚未實作`); });
  return { ok: errors.length === 0, errors, warnings };
}

const BATTLE_MAP_CACHE = {};
function getBattleMap(id){
  if(!BATTLE_MAP_CACHE[id]){
    const m = parseMapDef(id, BATTLE_MAPS[id]);
    if(m.ok){ const v = validateMapDef(m); m.errors = v.errors; m.warnings = v.warnings; m.ok = v.ok; }
    BATTLE_MAP_CACHE[id] = m;
  }
  return BATTLE_MAP_CACHE[id];
}
function validateAllMaps(){
  const report = {};
  Object.keys(BATTLE_MAPS).forEach(id=>{
    delete BATTLE_MAP_CACHE[id];
    const m = getBattleMap(id);
    report[id] = { ok:m.ok, errors:m.errors, warnings:m.warnings, size:m.cols ? m.cols+'x'+m.rows : '?' };
    if(!m.ok) console.error('[map] 地圖「'+id+'」驗證失敗：', m.errors);
    else if(m.warnings.length) console.warn('[map] 地圖「'+id+'」警告：', m.warnings);
  });
  return report;
}

/* ============================================================
   BATTLE STATE
============================================================ */
let battle = null;

// 行動順序規則開關：
//   true  = 每回合都重新擲速度排序（原本的行為，速度快的人不保證每回合都排前面，因為有隨機值）
//   false = 只有第1回合擲一次排序，之後每回合都照第1回合定下的順序走（速度快的人永遠排在同一位置）
// 想切換時只要改這一行的 true/false 即可，其餘程式碼不用動。
const REROLL_ORDER_EACH_ROUND = false;

/* v0.48：單位是否由AI操控——敵方一律AI；測試模式(battle.auto)下我方也交給AI（自動對戰壓力測試用） */
function isAiControlled(u){ return !!u && (u.side === 'enemy' || !!(battle && battle.auto)); }
/* v0.48：「有人掉血」的紀錄，供膠著判定用（見DEADLOCK_NO_DAMAGE_ROUNDS） */
function noteProgress(){ if(battle) battle.lastProgressRound = battle.round; }

/* v0.48：依出生點清單擺放單位；單位比出生點多時，不再疊在同一格（舊版會疊），改成找最近的空地 */
function placeOnSpawns(units, spawns, map, taken){
  units.forEach((u,i)=>{
    let p = spawns[i];
    if(!p || taken.has(p[0]+','+p[1])){
      const base = spawns.length ? spawns[Math.min(i, spawns.length-1)] : [0,0];
      let found = null;
      for(let rad=1; rad<Math.max(map.cols,map.rows) && !found; rad++){
        for(let dy=-rad; dy<=rad && !found; dy++) for(let dx=-rad; dx<=rad && !found; dx++){
          if(Math.max(Math.abs(dx),Math.abs(dy)) !== rad) continue;
          const x = base[0]+dx, y = base[1]+dy;
          if(mapIn(map,x,y) && mapTerrain(map,x,y).passable && !taken.has(x+','+y)) found = [x,y];
        }
      }
      p = found || base;
    }
    taken.add(p[0]+','+p[1]);
    u.x = p[0]; u.y = p[1];
  });
}

/* startBattle：opts（選填，給自動測試用）= {test:true 跳過開場/結算演出、auto:true 我方也由AI操控、roundCap、onEnd(result)}；
   回傳true＝成功開戰，false＝被擋下（沒角色/地圖不合格） */
function startBattle(battleKey, chapterId, opts){
  opts = opts || {};
  if(battle && (battle.introPlaying || battle.outroPlaying)) return false; // v0.47：演出中不重複開戰
  if(state.party.filter(p=>p.active).length === 0){
    toast('請先在準備畫面選擇至少1名角色上場');
    return false;
  }
  const def = BATTLES[battleKey];
  // v0.48：每場戰鬥自己的地圖（def.map＝BATTLE_MAPS的key，沒填就用平地flat12）；不合格的地圖拒絕開戰
  const mapId = def.map || 'flat12';
  const map = getBattleMap(mapId);
  if(!map.ok){
    console.error('[battle] 地圖「'+mapId+'」不合格，無法開戰：', map.errors);
    toast('地圖資料有誤，無法開戰（詳見console）：' + map.errors[0]);
    return false;
  }
  __goblinNameCounter = 0; // 每次開戰重置顯示名稱計數器，讓哥布林命名固定從A開始，不會累計到上次挑戰的字母
  __byakheeNameCounter = 0; // 拜亞基同理重置
  const allies = state.party.filter(p=>p.active).map(p=>({
    id:p.id, name:p.name, side:'ally', ref:p, moveType:'walk',
    hp:p.hp, maxHp:p.maxHp + trainingBonus(p,'hp'),
    // v0.26：atk/def/armor → patk/pdef/pres，另外三系新欄位一併烘焙（目前多數是0，之後裝備/角色天生值出現再自然吃到）
    patk:p.patk + equipBonus(p,'patk') + trainingBonus(p,'atk'), pdef:p.pdef + equipBonus(p,'pdef') + trainingBonus(p,'def'),
    pres:p.pres + equipBonus(p,'pres'),
    eatk:p.eatk + equipBonus(p,'eatk'), edef:p.edef + equipBonus(p,'edef'), eres:p.eres + equipBonus(p,'eres'),
    matk:p.matk + equipBonus(p,'matk'), mdef:p.mdef + equipBonus(p,'mdef'), mres:p.mres + equipBonus(p,'mres'),
    spd:p.spd + equipBonus(p,'spd'),
    sanity:p.sanity, maxSanity:p.maxSanity, toughness:p.toughness, reflex:p.reflex, will:p.will,
    resName:p.resName, res:p.resMax + trainingBonus(p,'sp') + equipBonus(p,'res'), resMax:p.resMax + trainingBonus(p,'sp') + equipBonus(p,'res'),
    skills:p.skills.filter(Boolean).map(iid=>{ const inst = skillInstOf(iid); return inst ? inst.key : null; }).filter(Boolean),
    skillLevels: (()=>{ // 每個技能key目前的強化等級，供executeSkill算加成用
      const m = {};
      p.skills.filter(Boolean).forEach(iid=>{ const inst = skillInstOf(iid); if(inst) m[inst.key] = inst.level; });
      return m;
    })(),
    items:p.items.filter(Boolean).map(iid=>{ const inst = itemInstOf(iid); return inst ? inst.key : null; }).filter(Boolean),
    alive:true, x:-1,y:-1, cooldowns:{}, statuses:[],
  }));
  const enemies = def.enemies().map(e=> Object.assign({ moveType:'walk' }, e, {x:-1,y:-1, cooldowns:{}, items:[], statuses:[]}));

  if(opts.allyStationary) allies.forEach(a=>{ a.stationary = true; }); // 測試用：我方不移動（驗證敵方尋路）
  // v0.48：單位數量決定後，用實際數量再驗一次地圖（可站格數是否夠、出生點是否連通）
  const vr = validateMapDef(map, { allies: allies.length, enemies: enemies.length });
  if(!vr.ok){
    console.error('[battle] 地圖「'+mapId+'」與本場單位數不合：', vr.errors);
    toast('地圖與單位數不合，無法開戰：' + vr.errors[0]);
    return false;
  }
  // 棋盤尺寸改成「每場戰鬥自己的」：BOARD_COLS/ROWS是let，開戰時依地圖設定
  BOARD_COLS = map.cols; BOARD_ROWS = map.rows;

  // v0.48：開戰站位改吃地圖資料的 allySpawns/enemySpawns（依上場/生成順序對應；超出的單位找最近空地，不會疊格）
  const taken = new Set();
  placeOnSpawns(allies, map.allySpawns, map, taken);
  placeOnSpawns(enemies, map.enemySpawns, map, taken);

  const effects = {};
  map.effects.forEach(e=>{ effects[e.x+','+e.y] = { type:e.type, turns:e.turns }; });
  const floorItems = {};
  map.floorItems.forEach(f=>{ floorItems[f.x+','+f.y] = f.item; });

  battle = {
    def, allies, enemies, map,
    chapterId: chapterId != null ? chapterId : null,
    key: battleKey,         // v0.47：這場戰鬥的BATTLES key，結算時用來判斷「是不是第一次勝利」
    introPlaying: false,    // v0.47：開場演出進行中(true)時鎖住輸入、行動面板不自動彈出、敵方不行動
    outroPlaying: false,    // v0.47：結算演出進行中
    round: 1,
    order: [],
    orderIdx: 0,
    log: [],
    selected: { skill:null, mode:null }, // mode: 'move'|'skill'|'inspect'（普通攻擊已併入技能系統，不再有獨立的'attack'模式）
    sidePanelTab: 'action', // 'action'|'item'：v0.21新增，側邊欄「技能8格／道具8格」分頁狀態，固定的移動/檢查/脫逃/結束回合4格不受此影響
    finished:false,
    floorItems,             // 場上可拾取物品，key格式 "x,y" -> ITEM_DB的鍵名（v0.48起來自地圖資料，不再隨機灑）
    effects,                // v0.48：效果層，key "x,y" -> {type:'fire', turns:剩餘回合}；回合結束時結算並倒數
    inspectorFocusUnit: null, // v0.39新增：狀態面板目前聚焦在哪個單位；null=顯示全部(icon開的那種)，有值=只顯示這一個(點單位chip開的)
    movePreview: null, // v0.42新增：「移動悔棋」——{x,y}代表目前行動者試探性移動到的預覽位置，尚未定案(actor.x/y、movePts都還沒變)；null代表沒有正在悔棋
    lastProgressRound: 1,   // v0.48：最後一次有人掉血的回合數（膠著判定用）
    roundCap: opts.roundCap || DEADLOCK_ROUND_CAP, // v0.48：回合數上限
    drawReason: null,       // v0.48：非null＝本場判定膠著收場（'cap'回合上限／'stalemate'連續多回合無人掉血）
    aiActions: 0,           // v0.48：敵方本回合已做幾次決策（防無限迴圈）
    test: !!opts.test, auto: !!opts.auto, onEnd: opts.onEnd || null, violations: [], // v0.48：自動測試用
  };
  rollOrder();
  startActorTurn(currentActor()); // 第一位行動者的三旗標名額初始化
  idleReset();
  if(opts.test){
    // 測試模式：跳過開場演出，直接進戰場（仍會完整建立3D畫面，確保渲染程式碼一起被測到）
    switchView('battle');
    renderBattle();
    return true;
  }
  // v0.47：進場改成完整開場序列（黑幕→標題→退去→單位進場→COMMENCE→開戰），見playBattleIntro()。
  // 畫面蓋滿黑幕的當下才真正切到戰鬥畫面；序列期間battle.introPlaying=true，序列結束才解鎖並開始第一個行動。
  battle.introPlaying = true;
  playBattleIntro(def, ()=>{
    // v0.28：不再只靠isBoss二分，改吃每場戰鬥自己的bgm欄位，沒設定就用預設值
    playBgm(def.bgm || 'assets/bgms/bgm006.mp3');
    switchView('battle');
    setNavLocked(true);
    allUnits().forEach(u=>{ u._introHide = true; }); // v0.48：單位先藏起來，等「人物進場」那一步才從兩側滑入
    renderBattle();
  }).catch(err=> console.error('battle intro error', err)).finally(finishBattleIntro);
  return true;
}

/* ============================================================
   【v0.48】回合結束結算：地形傷害（毒沼）、效果層（火場）、掛勾
   在advanceOneSlot()「一輪結束」時呼叫，順序：冷卻/資源/DOT → 這裡 → 回合數+1。
============================================================ */
function settleRoundEndTerrain(){
  allUnits().forEach(u=>{
    if(u.hp <= 0 || u.x < 0) return;
    const t = mapTerrain(battle.map, u.x, u.y), ef = battle.effects[u.x+','+u.y];
    let dmg = 0; const why = [];
    if(t.hazardDmg){ dmg += t.hazardDmg; why.push(`${t.hazardName||t.name}-${t.hazardDmg}`); }
    if(ef && ef.type === 'fire'){ dmg += FIRE_DMG; why.push(`火場-${FIRE_DMG}`); }
    if(dmg > 0){
      u.hp = clamp(u.hp - dmg, HAZARD_CAN_KILL ? 0 : Math.min(u.hp,1), u.maxHp);
      noteProgress();
      logMsg(`<b>${u.name}</b> 站在危險地帶（${why.join('、')}），損失了 ${dmg} 點HP。${u.hp<=0?'<b>'+u.name+'</b> 倒下了。':''}`);
    }
  });
  Object.keys(battle.effects).forEach(k=>{
    const ef = battle.effects[k]; ef.turns -= 1;
    if(ef.turns <= 0){ delete battle.effects[k]; }
  });
  ROUND_END_HOOKS.forEach(fn=>{ try{ fn(battle); }catch(e){ console.error('round-end hook error', e); } });
}
/* 膠著判定：回傳null（正常）或'cap'／'stalemate'。advanceOneSlot()在回合數+1後呼叫，結果放battle.drawReason，由checkBattleEnd()收場。 */
function checkDeadlock(){
  if(battle.round > battle.roundCap) return 'cap';
  const mobileEnemy = battle.enemies.some(e=> e.hp > 0 && !e.stationary);
  if(mobileEnemy && (battle.round - battle.lastProgressRound) > DEADLOCK_NO_DAMAGE_ROUNDS) return 'stalemate';
  return null;
}
/* 測試模式收場：記錄結果並通知測試程式，不發獎勵、不存檔、不放演出 */
function finishTestBattle(result){
  battle.finished = true;
  battle.result = result;
  const cb = battle.onEnd; battle.onEnd = null;
  if(cb){ try{ cb({ result, round:battle.round, key:battle.key, violations:battle.violations.slice(0,10), nViol:battle.violations.length, drawReason:battle.drawReason, allies:battle.allies.map(u=>({n:u.name,hp:u.hp})), enemies:battle.enemies.map(u=>({n:u.name,hp:u.hp})) }); }catch(e){ console.error(e); } }
}

function allUnits(){
  return battle.allies.concat(battle.enemies);
}
function aliveUnits(){
  return allUnits().filter(u=>u.hp>0 || u.downButAlive); // hp<=0 units stay but skip turn
}
function equipBonus(p, key){
  return Object.values(p.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid, key), 0);
}

function rollOrder(){
  const units = allUnits();
  units.forEach(u=>{ u._speedRoll = u.spd + 1 + Math.floor(Math.random()*20); });
  battle.order = units.slice().sort((a,b)=> b._speedRoll - a._speedRoll);
  battle.orderIdx = 0;
}

function currentActor(){
  return battle.order[battle.orderIdx];
}

function logMsg(html){
  battle.log.push(html);
  if(battle.log.length > 100) battle.log.shift();
  miniLogPush(html); // v0.47：同步丟一份給底部迷你戰報
}

function playBgm(file){
  const bgm = document.getElementById('bgm');
  if(bgm.getAttribute('data-cur') === file) return;
  bgm.src = file;
  bgm.setAttribute('data-cur', file);
  bgm.volume = 0.35;
  bgm.play().catch(()=>{});
}

/* ============================================================
   【v0.48新增】3D戰場渲染層 B3D（原生WebGL，不依賴任何函式庫）
   ────────────────────────────────────────────────────────────
   取代舊的DOM格子(#grid/.cell/.unit-chip)。地形用文字矩陣(見BATTLE_MAPS)建成3D網格，
   角色是「永遠面向鏡頭的2D貼圖看板」（不翻轉、不轉向）。

   ■ 分工：
     - 規則/資料全在遊戲本體（地圖、移動、技能、AI），B3D只負責「畫」與「把點擊換算成格子/單位」。
     - 遊戲每次狀態改變(renderGrid)呼叫 B3D.setScene() 交代：誰在哪格、哪些格子要標黃/紅、地上有什麼；
       B3D自己每幀重畫。點擊透過 B3D.onTap(單位,格子) 回報給遊戲。
     - 血條／狀態圖示／傷害數字／對話泡泡用DOM疊在畫面上（B3D.setTags + 每幀投影定位），
       沿用原本的 .status-badge/.unit-hp/.dmg-float/.bubble 樣式。
   ■ 單位貼圖來源：scene.spriteSrc(u)（遊戲本體提供，沿用CHIP_MAP與待命動畫）；沒圖/載入失敗/本機file://不能讀
     → 自動改畫「陣營色＋姓名縮寫」的色塊看板。
   ■ 已知限制：以 file:// 直接開啟HTML時，瀏覽器不允許把圖片載入WebGL貼圖（安全限制），
     角色會全部顯示成色塊看板；請用http(s)網址或本機伺服器開啟。偵測到時會跳一次提示。
   ■ 近鏡頭的岩壁會自動變半透明（STAGE3D.wallFadeAlpha），避免擋住後面的單位。
============================================================ */
/* ---------- 3D畫面設定區（想調畫面手感只改這裡） ---------- */
const STAGE3D = {
  pitchOblique: 1.0,     // 預設斜視角（弧度，0.2=幾乎平視，1.45=正上方俯視）
  pitchTop: 1.42,        // 「俯視」按鈕切到的角度
  pitchMin: 0.35,        // 手動拖曳時允許的最低視角（太低會看不到地面）
  pitchMax: 1.45,
  fov: 0.72,             // 視野（弧度）
  zoomMinDist: 6,        // 最近能拉到多近（鏡頭到目標的距離，單位＝格）
  zoomMaxMul: 3.0,       // 最遠＝地圖最長邊×此值
  dragThresholdPx: 6,    // 手指/滑鼠移動超過幾px才算「拖曳」，沒超過算「點擊」
  rotateSensYaw: 0.006,  // 拖曳旋轉靈敏度（水平）
  rotateSensPitch: 0.005,// 拖曳旋轉靈敏度（垂直）
  wheelZoomSens: 0.001,  // 滾輪縮放靈敏度
  spriteH: 1.45,         // 角色看板高度（單位＝格）
  spriteMaxW: 1.5,       // 角色看板最大寬度
  moveSecPerTile: 0.16,  // 單位走一格要幾秒（移動動畫）
  hopHeight: 0.16,       // 走路時每步小跳的高度
  moveAnim: true,        // false＝移動時直接瞬移
  wallFadeAlpha: 0.28,   // 擋住單位的岩壁變成多透明
  wallFadeSpeed: 8,      // 岩壁淡入淡出速度
  gridLineAlpha: 0.16,   // 格線濃度
  introSlideTiles: 4,    // 開場進場滑入的距離（格）

   xxx_normal這組PORTRAIT_MAP資料先保留，之後有別的用途要用再接回來，不影響其他功能 */
function renderPortraits(){
  const actor = currentActor();
  if(!actor) return;
  const allyBox = document.getElementById('portraitAlly');
  const enemyBox = document.getElementById('portraitEnemy');
  if(!allyBox || !enemyBox) return;

  function portraitHtml(unit, defaultLabel){
    if(!unit) return `<div class="portrait-placeholder">${defaultLabel}<br>（尚未設定圖片）</div>`;
    const skillKey = (battle.selected.mode === 'skill' && battle.selected.skillKey) ? battle.selected.skillKey : 'default';

    const mapKey = baseKey + '_' + skillKey;

    if(imgFile){

    }
    return `<div class="portrait-placeholder">${unit.name}<br><span style="opacity:.6;">(${mapKey})</span><br>尚未設定圖片</div>`;
  }

  const currentAlly = actor.side === 'ally' ? actor : null;

/* ============================================================

   3) 組出每個單位頭上的血條/狀態/傷害數字/泡泡(DOM)  → 全部交給 B3D，由B3D每幀重畫。

function stageSpriteSrc(u){ return idleFrameSrc(u) || CHIP_MAP[u.portraitKey || u.id] || null; }
function stageVisualPath(u, fx, fy, tx, ty){
  const r = unitReach(u, fx, fy, 99, true); // 只為了畫走路路線：無視單位阻擋、不限移動力
  if(!(r.dist[ty*r.cols+tx] < Infinity)) return null;
  return pathFromPrev(r, tx, ty);
}
function stageHoverPath(x, y){
  if(!battle || battle.selected.mode !== 'move' || !battle._reach || battle._reachActor !== currentActor()) return null;
  const r = battle._reach, k = y*r.cols+x;
  if(!(r.dist[k] > 0 && r.dist[k] < Infinity) || !reachCanStop(r,x,y)) return null;
  return pathFromPrev(r, x, y).slice(1);
}
function stageTap(unit, tile){

}
