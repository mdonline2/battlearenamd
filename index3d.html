
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>0.48DW(戰棋版・第一階段)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-night:#10121B; --panel:#181B27; --panel-2:#1F2333; --border:#2C3145;
  --gold:#C9A227; --gold-bright:#E4C34F; --text:#E7E4DA; --text-dim:#9A9CAE;
  --hp:#c14b4b; --hp-low:#e2604a; --ally:#3E8E82; --enemy:#C2542E;
  /* v0.37新增：有角色小圖的unit-chip，腳下陣營色改用這兩個半透明版本(alpha .32，想更透明/更明顯直接改最後的.32) */
  --ally-soft: rgba(62,142,130,.32); --enemy-soft: rgba(194,84,46,.32);
  --hp-flash:#e8c93a; /* 受傷時黃色殘影的顏色 */
  /* 裝備部位標籤色（色票先暫定，之後想改直接換這幾個hex即可）*/
  --eq-head:#8a95a5; --eq-chest:#b8763f; --eq-hands:#a8895f;
  --eq-waist:#7c9b6f; --eq-feet:#6f8a7c; --eq-acc:#a67cc4;
  /* 屬性八宮格色票（暫定，之後想改直接換這幾個hex即可）*/
  --attr-lv:#C9A227; --attr-sp:#6f8fc4; --attr-atk:#c47a4f; --attr-def:#6fae95;
  /* v0.26新增：稀有度色票(灰白金沿用上面既有變數，這裡只補綠/藍/紫/紅四個新的) */
  --rarity-green:#4CAF7D; --rarity-blue:#4F8FE4; --rarity-purple:#9B6FE0; --rarity-red:#E4574F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink-night);color:var(--text);font-family:'Inter',-apple-system,"PingFang TC","Noto Sans TC",sans-serif;}
.serif{font-family:'Spectral',Georgia,serif;}
.slot{ position:relative; min-width:0; }
/* ============================================================
   🔧 裝備部位顏色標記（小圓點）位置/大小怎麼調
   - 這個小圓點是靠 .slot 設定 position:relative 當定位基準，
     .slot-tagdot 用 position:absolute 相對於.slot的右上角定位
   - 想移動位置：改下面 top / right 這兩個數字（單位px，數字越大離邊角越遠）
   - 想改大小：改 width / height（兩個要一起改，保持正圓形）
   - 想改顏色：不要改這裡，去最上面 :root{} 裡改 --eq-head/--eq-chest/
     --eq-hands/--eq-waist/--eq-feet/--eq-acc 這幾個hex色碼即可
============================================================ */
/* v0.23：右上角分類色點全數刪除（裝備/技能已改用左側色條標色，色點變成重複資訊），
   .slot-tagdot 保留CSS定義以防之後別處還在用，但裝備/技能已不再輸出這個div */
.slot-tagdot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; }
/* v0.23：已裝備格的卸除按鈕，改成右上角Windows關閉鈕風格的✕，取代原本卡片底部的整排文字按鈕 */
.slot-close-btn{ position:absolute; top:4px; right:4px; width:18px; height:18px; line-height:16px; text-align:center;
  border-radius:4px; background:var(--panel); border:1px solid var(--border); color:var(--text-dim); font-size:12px; cursor:pointer; }
.slot-close-btn:hover{ background:var(--enemy); border-color:var(--enemy); color:#fff; }
/* v0.23：裝備／技能強化等級角標，統一右下角「+X」（X=強化次數，未強化顯示+0，不是隱藏），道具沒有強化系統不套用 */
.slot-level-badge{ position:absolute; bottom:4px; right:6px; font-size:10.5px; font-weight:700; color:var(--gold-bright); }
/* ============================================================
   🔧 卡片左側顏色條（v0.23比照MOMO參考的舊分支做法統一套用到所有.slot卡片）
   - 條的顏色吃每張卡自己inline style設定的 --accent 變數（跟.slot-tagdot共用同一個顏色值即可）
   - 沒有設定--accent的卡片（目前是道具卡，ITEM_DB還沒有分類/顏色資料）會fallback顯示--border，
     視覺上等於沒有特別標色，之後道具補上分類欄位後再接上即可
   - 想改粗細：改width（目前3px）；想改要不要圓角：改border-radius
============================================================ */
.slot::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:10px 0 0 10px; background:var(--accent, var(--border)); }
/* v0.26新增：裝備稀有度標示——只有裝備卡片(.has-rarity)用雙色分割版本，上半稀有度色/下半沿用原本分類色(--accent)，
   技能/道具卡片沒有.has-rarity class，維持原本單色不受影響 */
.slot.has-rarity::before{
  background: linear-gradient(to bottom,
    var(--rarity, var(--border)) 0%,  var(--rarity, var(--border)) 50%,
    var(--accent, var(--border)) 50%, var(--accent, var(--border)) 100%);
}
/* v0.26新增：戰報「無法穿透」高亮，跟一般白字傷害訊息明顯區隔 */
.log-block{ color:var(--gold-bright); font-weight:700; }
.app{


  
  max-width:1200px;margin:0 auto;padding:16px 14px 60px;


}
button{font-family:inherit;cursor:pointer;border:none;}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;}
.btn:hover{border-color:#454b66;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--gold);color:#20180a;border-color:var(--gold);}
.btn.primary:hover{background:var(--gold-bright);}
.btn.small{padding:5px 9px;font-size:11px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;}
/* v0.23：立繪底圖獨立成一層蓋在.card底下，只有這層負責淡入，不會連文字內容一起閃爍
   0.2秒是初始值，之後想調整動畫速度直接改這裡的transition時間即可 */
.card-bg-layer{ position:absolute; inset:0; background-size:cover; background-position:top center; opacity:0; transition:opacity .2s ease; z-index:0; pointer-events:none; }
.card-bg-layer.visible{ opacity:1; }
.card > *:not(.card-bg-layer){ position:relative; z-index:1; }

/* NAV */
.nav{display:flex;gap:8px;margin-bottom:16px;}
.navbtn{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.navbtn.active{color:var(--gold-bright);border-color:var(--gold);}
.navbtn:disabled{opacity:.35;cursor:not-allowed;}

/* CHAPTER SCREEN */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.chcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:left;}
.chcard.locked{opacity:.4;}
.chcard .num{font-size:10px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;}
.chcard .ttl{font-family:'Spectral',serif;font-size:15px;margin:4px 0 6px;}
.chcard .desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;}

/* CHAPTER PAGINATION */
.ch-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.ch-pager .ch-pager-title-wrap{flex:1;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:8px;}
.ch-pager .ch-pager-title{font-family:'Spectral',serif;font-size:18px;margin:0;}
.ch-pager .ch-pager-count{font-size:11px;color:var(--text-dim);letter-spacing:.05em;white-space:nowrap;}
.ch-pager-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;}
.ch-pager-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-bright);}
.ch-pager-btn:disabled{opacity:.3;cursor:not-allowed;}

/* PREP SCREEN */
.party-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.party-tab{flex:1 1 120px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px;text-align:center;font-size:12.5px;font-weight:600;}
.party-tab.active{border-color:var(--gold);color:var(--gold-bright);background:var(--panel-2);}
.prep-tabs{display:flex;gap:6px;margin-bottom:14px;}
.prep-pagination{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 8px;font-size:11.5px;color:var(--text-dim);}
.prep-pagination button{min-width:32px;}
.slot.owned .slot-tagdot{ box-shadow:0 0 0 2px var(--panel-2); }
.slot-status-badge{ position:absolute; top:6px; left:6px; font-size:9px; padding:1px 5px; border-radius:6px; background:var(--panel); color:var(--gold-bright); border:1px solid var(--gold); }
/* 【v0.22】共用說明浮動視窗：貼在.card底部，玩家自行收合/展開（狀態存在state.prepPanelOpen，會存檔記住） */
.prep-info-panel{ margin-top:14px; border:1px solid var(--border); border-radius:10px; background:var(--panel-2); overflow:hidden; }
.prep-info-head{ display:flex; justify-content:space-between; align-items:center; padding:8px 12px; cursor:pointer; font-size:12px; color:var(--gold-bright); font-weight:600; }
.prep-info-body{ padding:0 12px 12px; font-size:12px; color:var(--text); }
.prep-info-body .d{ color:var(--text-dim); font-size:11px; margin:4px 0 10px; line-height:1.5; }
.prep-info-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.prep-tab{flex:1;background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;color:var(--text-dim);font-weight:600;}
.prep-tab.active{background:var(--panel-2);color:var(--gold-bright);border-color:var(--gold);}
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.slot{background:rgba(31,35,51,0.6);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center;font-size:11.5px;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.slot .k{font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.slot .v{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;}
.slot.empty{color:var(--text-dim);border-style:dashed;}
.slot-effect{font-size:10px;color:var(--gold-bright);line-height:1.4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;}
.stat-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-row .k{color:var(--text-dim);}
.stat-row .v{font-weight:600;font-family:'Spectral',serif;}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.shop-item:last-child{border-bottom:none;}
.shop-item .d{color:var(--text-dim);font-size:10.5px;}

/* BATTLE SCREEN */
.battle-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px;}
.battle-top-zone{position:relative;overflow:hidden;}
.battle-layout{display:flex;gap:8px;align-items:stretch;}
.portrait-box{
  width:100px; flex:0 0 100px;
  border:2px dashed var(--border); border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel-2);
}
.portrait-placeholder{
  font-size:10.5px; color:var(--text-dim); text-align:center; line-height:1.6; padding:8px;
}
@media (max-width:760px){
  .portrait-box{ width:64px; flex:0 0 64px; }
  .portrait-placeholder{ font-size:9px; }
}
.battle-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5);}
.battle-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;gap:10px;flex-wrap:wrap;}
.turn-order{background:rgba(15,17,21,.72);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
.turn-order .lbl{font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.turn-order .row{display:flex;gap:5px;}
.tu{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;border:1px solid var(--border);background:var(--panel);flex:0 0 auto;position:relative;}
.tu.ally{color:var(--ally);}
.tu.enemy{color:var(--enemy);}
.tu.current{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bright) inset;}
.tu.dead{opacity:.3;}
.battle-actions-top{background:rgba(15,17,21,.72);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;}

.grid-wrap{position:relative;z-index:2;padding:0 10px 10px;}
/* v0.35：戰場12x4→12x12（配合三個常駐UI icon化騰出的垂直空間），改用aspect-ratio讓格子維持正方形、
   隨容器寬度等比放大，不再靠固定px列高手動維護（欄/列數改成共用BOARD_COLS/BOARD_ROWS常數，見JS） */
/* 【斜紋雙色demo】預覽用，目前沒有任何指令實際套用這個class，純粹展示效果，
   實際套色靠JS內聯style動態設定（見下方stripeCellBackground()），這裡只是把它視覺化的容器。
   要拿掉這個demo時，把下面的.cell.stripe-preview規則跟stripeCellBackground()/applyStripePreviewDemo()一起刪掉即可。 */
/* v0.37新增：有圖的角色，腳下色塊換成半透明版本，比CSS規則順序後面的.unit-chip.ally/.enemy寫得更精確(兩個class)，
   會優先套用；沒圖的敵人不會有.has-img這個class，維持原本全不透明色塊 */
/* v0.35.1修正：改成絕對定位置中放大(145%)，允許超出格子範圍顯示，角色看起來更明顯；
   原本overflow:hidden是為了裁切圖片用，但一併把bubble(施法對話框，bottom:38px定位在格子外)、
   status-badge、hp條(這兩個也定位在格子邊界外一點點)都裁掉了，這次拿掉.unit-chip的overflow:hidden，
   改用z-index讓角色圖疊在陣營色塊上面、但疊在bubble/status-badge/hp條下面 */
/* v0.28新增：▲buff/▼debuff標記，疊在chip正上方，兩者可並存 */
.status-badge{ position:absolute; top:-11px; left:50%; transform:translateX(-50%); display:flex; gap:1px; font-size:10px; line-height:1; pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.8); z-index:2; }
.status-badge .buff-mark{ color:var(--gold-bright); }
.status-badge .debuff-mark{ color:var(--rarity-purple); }
/* v0.34新增：暈眩/束縛/恐懼/DOT共用一個符號(還沒細分每種狀態各自圖示)，跟target-red同色，呼應「控制/持續傷害」語意 */
.status-badge .special-mark{ color:#ff5b45; }
/* 施放預覽：紅底＝「點下去會生效/命中」的統一語意，同時用在棋盤unit-chip跟laser方向面板按鈕上 */
.btn.target-red{background:var(--enemy);color:#fff;border-color:var(--enemy);}
.btn.target-red:hover{background:#d8663e;}
/* laser 8方向面板：3x3排列，中間格放取消鍵 */
/* laser 8方向面板（.dir-panel）已於v0.15改回點格子版，不再需要，此CSS規則已移除 */
.unit-hp{position:absolute;bottom:-6px;left:2px;right:2px;height:3px;background:#000;border-radius:2px;overflow:hidden;z-index:2;}
/* v0.37新增：HP條改雙層——fill-back(黃色殘影，受傷時從舊寬度動畫縮到新寬度)疊在下面，
   fill-front(實際血量顏色)疊在上面直接顯示新寬度，兩者差的那一截就是視覺上的「黃色殘影」。
   衰減動畫時間目前1秒，想調快/慢直接改這裡的transition秒數即可 */
.unit-hp .fill{position:absolute;top:0;bottom:0;left:0;}
.unit-hp .fill-back{background:var(--hp-flash);z-index:1;transition:width 1s linear;}
.unit-hp .fill-front{background:var(--hp-low);z-index:2;}
/* v0.37新增：受傷飄字「-N」，浮在角色頭上方1秒內淡出上移；時間/顏色都在這裡調 */
.dmg-float{position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:#ff5b45;font-size:11px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none;z-index:4;animation:dmgFloat 1s ease-out forwards;}
@keyframes dmgFloat{ 0%{opacity:1; transform:translate(-50%,0);} 100%{opacity:0; transform:translate(-50%,-14px);} }
.bubble{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1a1a;font-size:10px;padding:4px 7px;border-radius:6px;white-space:nowrap;max-width:160px;white-space:normal;width:max-content;max-width:150px;text-align:center;line-height:1.3;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.bubble:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff;}

.side-panel{position:relative;z-index:2;background:rgba(15,17,21,.85);border-top:1px solid var(--border);padding:12px;}
.actor-info{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.actor-info .name{font-weight:600;font-size:14px;}
.actor-info .hp{font-size:11.5px;color:var(--text-dim);}
.actionbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.skillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.skillgrid button{font-size:11px;padding:8px 4px;}
.skillgrid button.locked{color:var(--text-dim);border-style:dashed;}

.msglog{position:relative;z-index:2;background:#0D0F17;border-top:1px solid var(--border);padding:8px 12px;font-size:12px;line-height:1.7;color:#C9C6BA;max-height:150px;overflow-y:auto;}
.msglog .row{padding:1px 0;}
.msglog .row b{color:var(--text);}
.logbar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border);}
.logbar span{font-size:11px;color:var(--text-dim);}

.result-banner{position:relative;z-index:3;background:var(--gold);color:#20180a;text-align:center;padding:14px;font-weight:700;font-size:15px;}

/* 戰鬥結算浮動列：疊加在戰場畫面下方，不清空/遮擋整個戰場，讓玩家可以先看清楚戰場最終狀態再按返回 */
.battle-result-overlay{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:linear-gradient(180deg, transparent, var(--ink-night) 35%);
  padding:26px 16px 18px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  animation:resultFadeUp .3s ease;
}
.battle-result-overlay .result-banner{
  border-radius:10px; max-width:480px; width:100%;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
}
@keyframes resultFadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
/* v0.44新增：進入戰鬥／返回準備畫面的轉場效果，三種共用「先蓋滿畫面→切換內容→再撤掉」的流程，
   差別只在蓋住的樣子。z-index刻意設很高(400)，蓋住整個App含nav列，蓋住期間pointer-events:auto
   避免手滑點到底下還沒切換完的畫面。duration/延遲都是JS動態設定inline style，這裡的transition
   只是預設保底值。 */
.battle-transition-solid{position:fixed;inset:0;z-index:400;background:#000;opacity:0;pointer-events:auto;transition:opacity 700ms linear, box-shadow 700ms linear;}
.battle-transition-solid.show{opacity:1;}
/* 「燃燒感」＝黑色轉場+邊緣一圈艷紅光暈，不是真的火焰圖案(MOMO確認純黑轉場即可) */
.battle-transition-solid.burn.show{box-shadow:inset 0 0 140px 55px rgba(255,55,20,.65);}
.battle-transition-tiles{position:fixed;inset:0;z-index:400;display:grid;pointer-events:auto;}
.battle-transition-tiles > div{background:#000;opacity:0;transform:scale(.82);transition-property:opacity,transform;}
.battle-transition-tiles > div.show{opacity:1;transform:scale(1);}
/* v0.45新增：「剝落」轉場——不是蓋黑，是把「舊畫面」本身複製一份、切成格子疊在新畫面上面，
   格子再一片片剝落消失，露出底下真正的新畫面。.peel-tile是挖空窗口(overflow:hidden)，
   裡面的.peel-tile-inner是舊畫面的完整複製，用負的left/top位移，只讓對應那一小塊透過窗口露出來 */
.battle-transition-peel{position:fixed;z-index:400;display:grid;pointer-events:auto;}
.peel-tile{overflow:hidden;position:relative;opacity:1;transform:scale(1) rotate(0deg);transition-property:opacity,transform;}
.peel-tile.peeled{opacity:0;transform:scale(.55) rotate(10deg);}
.peel-tile-inner{position:absolute;pointer-events:none;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--gold);color:var(--gold-bright);padding:10px 18px;border-radius:10px;font-size:12.5px;opacity:0;transition:all .25s ease;z-index:60;pointer-events:none;font-weight:600;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.fullscreen-fx{
  position:fixed; inset:0; background:#000; z-index:200;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .25s ease;
}
.fullscreen-fx.show{ opacity:1; }
.fullscreen-fx.fx-fadeout{ opacity:0; }
.fullscreen-fx img{ max-width:100%; max-height:100%; }
.fx-placeholder{ color:#fff; text-align:center; font-family:'Spectral',serif; font-size:22px; line-height:1.7; padding:20px; }
.fx-placeholder .fx-sub{ font-size:12px; color:#888; display:block; margin-top:10px; font-family:'Inter'; }
footer.foot{text-align:center;margin-top:20px;font-size:11px;color:var(--text-dim);}
.version-tag{color:var(--text-dim);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-box .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-box .modal-close{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);width:26px;height:26px;font-size:14px;line-height:1;cursor:pointer;}
/* v0.35新增：戰場三個常駐UI icon化（左下=行動／右下=戰報／右上=狀態），
   點擊後以現有.modal-overlay/.modal-box樣式展開（跟版本紀錄/單位數值面板同一套元件，維持風格統一），
   優先度(z-index:150)高於網格，不用另外做一套疊層樣式 */
.battle-icon{position:absolute;z-index:30;width:38px;height:38px;border-radius:50%;background:rgba(15,17,21,.85);border:1px solid var(--gold);color:var(--gold-bright);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);}
.battle-icon:active{transform:scale(.92);}
.icon-action{left:10px;bottom:10px;}
.icon-log{right:10px;bottom:10px;}
.icon-status{right:10px;top:10px;}

/* ============================================================
   v0.47 戰場演出／戰場UI 新增樣式
============================================================ */
/* 面板半透明：行動/戰報/生物檢視/全體生物檢視（想更透明改rgba最後的數字，backdrop-filter的blur可改0關掉毛玻璃） */
.modal-overlay.glass{background:rgba(0,0,0,.12);}
.modal-overlay.glass .modal-box{background:linear-gradient(160deg,rgba(31,35,51,.74),rgba(24,27,39,.58));border-color:rgba(201,162,39,.4);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 8px 30px rgba(0,0,0,.35);}
/* 右上角提示小卡（在「狀態」icon下方） */
.skill-tip{position:absolute;right:10px;top:56px;z-index:29;max-width:min(270px,64vw);padding:8px 12px 9px 26px;border-radius:10px;border-right:3px solid var(--tip-color,var(--gold));background:linear-gradient(90deg,rgba(16,18,27,0),rgba(16,18,27,.72) 38%,rgba(16,18,27,.82));opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease;pointer-events:none;text-align:right;}
.skill-tip.show{opacity:1;transform:none;}
.skill-tip .st-tag{font-size:9.5px;letter-spacing:.14em;color:var(--tip-color,var(--gold-bright));font-weight:700;}
.skill-tip .st-name{font-size:14.5px;font-weight:700;color:var(--text);margin-top:1px;}
.skill-tip .st-eff{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.45;}
/* 技能/道具發動提示：跳入畫面中上，約1.3秒淡出（總長改CAST_BANNER_MS，同步改下面動畫秒數） */
.cast-banner{position:fixed;left:50%;top:15%;z-index:230;transform:translateX(-50%);min-width:180px;max-width:80vw;padding:9px 22px 10px;border-radius:12px;text-align:center;pointer-events:none;background:linear-gradient(90deg,rgba(16,18,27,0),rgba(16,18,27,.78) 22%,rgba(16,18,27,.78) 78%,rgba(16,18,27,0));animation:castBannerAnim 1.4s ease both;}
.cast-banner .cb-who{font-size:10.5px;letter-spacing:.12em;color:var(--text-dim);}
.cast-banner .cb-name{font-family:'Spectral',Georgia,serif;font-size:22px;font-weight:700;color:var(--gold-bright);text-shadow:0 2px 10px rgba(0,0,0,.6);}
.cast-banner .cb-eff{font-size:12px;color:var(--text);margin-top:2px;}
@keyframes castBannerAnim{0%{opacity:0;transform:translateX(-50%) translateY(-18px) scale(.92);}14%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.03);}22%{transform:translateX(-50%) translateY(0) scale(1);}78%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-6px) scale(1);}}
/* 底部迷你戰報：每筆約1秒後淡出（MINI_LOG設定） */
.mini-log{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:45;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(560px,92vw);}
.mini-log-row{font-size:12.5px;color:var(--text);padding:5px 16px;border-radius:999px;background:linear-gradient(90deg,rgba(16,18,27,0),rgba(16,18,27,.78) 18%,rgba(16,18,27,.78) 82%,rgba(16,18,27,0));text-align:center;animation:miniLogIn .18s ease both;transition:opacity .35s ease;}
.mini-log-row.out{opacity:0;}
@keyframes miniLogIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
/* ---- 開場序列 ---- */
.battle-intro{position:fixed;inset:0;z-index:420;pointer-events:auto;}
.battle-intro .intro-curtain{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s ease;}
.battle-intro .intro-curtain.show{opacity:1;}
.battle-intro .intro-title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) scale(.96);text-align:center;opacity:0;transition:opacity .7s ease,transform .7s ease;pointer-events:none;padding:0 16px;}
.battle-intro .intro-title.show{opacity:1;transform:translateY(-50%) scale(1);}
.battle-intro .it-en{font-family:'Spectral',Georgia,serif;font-size:clamp(28px,6.5vw,58px);font-weight:700;letter-spacing:.12em;color:var(--gold-bright);text-transform:uppercase;text-shadow:0 0 24px rgba(201,162,39,.45);}
.battle-intro .it-line{height:2px;width:min(360px,60vw);margin:12px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.battle-intro .it-zh{font-size:clamp(14px,2.6vw,20px);letter-spacing:.3em;color:var(--text);}
.battle-intro.boss .it-en{color:#ff8a70;text-shadow:0 0 28px rgba(226,96,74,.65);letter-spacing:.16em;}
.battle-intro.boss .it-line{background:linear-gradient(90deg,transparent,#e2604a,transparent);height:3px;}
.battle-intro .intro-commence{position:absolute;left:0;right:0;top:46%;text-align:center;opacity:0;transform:scale(1.5);transition:opacity .28s ease,transform .28s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;}
.battle-intro .intro-commence.show{opacity:1;transform:scale(1);}
.battle-intro .intro-commence span{display:block;font-family:'Spectral',Georgia,serif;font-size:clamp(34px,8vw,72px);font-weight:700;letter-spacing:.22em;color:#fff;text-shadow:0 0 22px rgba(228,195,79,.8),0 3px 12px rgba(0,0,0,.7);}
.battle-intro .intro-commence small{display:block;margin-top:4px;font-size:15px;letter-spacing:.5em;color:var(--gold-bright);}
/* ---- 結算演出（勝利／戰敗） ---- */
#viewBattle.defeat-gray{filter:grayscale(.9) brightness(.7);transition:filter 1.2s ease;}
.outro-layer{position:fixed;inset:0;z-index:300;pointer-events:auto;}
.outro-layer .outro-dim{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .8s ease;}
.outro-layer.dimmed .outro-dim{background:rgba(0,0,0,.45);}
.outro-layer .outro-vignette{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(20,0,0,.85) 100%);}
.outro-layer.defeat .outro-vignette{opacity:1;}
.outro-layer .outro-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.outro-layer .outro-flash.go{animation:outroFlash .7s ease-out both;}
@keyframes outroFlash{0%{opacity:.75;}100%{opacity:0;}}
.outro-banner{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%) scale(.85);text-align:center;opacity:0;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.3,1.15),top .6s ease;pointer-events:none;}
.outro-banner.show{opacity:1;transform:translateY(-50%) scale(1);}
.outro-banner.up{top:12%;transform:translateY(-50%) scale(.62);}
.outro-banner .ob-en{font-family:'Spectral',Georgia,serif;font-size:clamp(40px,10vw,92px);font-weight:700;letter-spacing:.2em;padding-left:.2em;}
.outro-banner .ob-zh{font-size:clamp(15px,3vw,22px);letter-spacing:.6em;margin-top:2px;}
.outro-banner.victory .ob-en{color:var(--gold-bright);text-shadow:0 0 30px rgba(228,195,79,.7),0 4px 14px rgba(0,0,0,.6);}
.outro-banner.victory .ob-zh{color:var(--text);}
.outro-banner.defeat .ob-en{color:#b5b8c4;text-shadow:0 0 26px rgba(120,20,20,.8),0 4px 14px rgba(0,0,0,.7);}
.outro-banner.defeat .ob-zh{color:#c46a5a;}
.reward-panel{position:absolute;left:50%;top:54%;transform:translate(-50%,-46%);width:min(440px,92vw);max-height:66vh;display:flex;flex-direction:column;padding:16px 18px 16px;border-radius:14px;background:linear-gradient(160deg,rgba(31,35,51,.82),rgba(24,27,39,.68));border:1px solid rgba(201,162,39,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;}
.reward-panel.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto;}
.reward-panel .rp-title{font-family:'Spectral',Georgia,serif;font-size:15px;color:var(--gold-bright);letter-spacing:.14em;margin-bottom:8px;}
.reward-panel .rp-title small{font-size:11px;color:var(--text-dim);letter-spacing:.2em;margin-left:8px;}
.reward-panel .rp-sec{font-size:10.5px;letter-spacing:.16em;color:var(--text-dim);margin:12px 0 5px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px;}
.reward-panel .rp-sec.first{color:var(--gold-bright);}
.rw-row{display:flex;align-items:center;gap:10px;padding:5px 2px;opacity:0;transform:translateX(-10px);transition:opacity .3s ease,transform .3s ease;}
.rw-row.in{opacity:1;transform:none;}
.rw-row .rw-ico{width:26px;text-align:center;font-size:18px;}
.rw-row .rw-lbl{flex:1;font-size:13px;}
.rw-row .rw-lbl small{color:var(--text-dim);margin-left:6px;font-size:11px;}
.rw-row .rw-val{font-family:'Spectral',Georgia,serif;font-size:17px;font-weight:700;color:var(--gold-bright);min-width:56px;text-align:right;}
.rw-card{display:flex;align-items:center;gap:10px;padding:7px 10px;margin:4px 0;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);opacity:0;transform:translateX(-10px);transition:opacity .3s ease,transform .3s ease;}
.rw-card.in{opacity:1;transform:none;}
.rw-card .rw-kind{font-size:9.5px;letter-spacing:.12em;color:var(--text-dim);width:74px;line-height:1.3;}
.rw-card .rw-name{flex:1;font-size:13px;font-weight:600;}
.rw-card .rw-new{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:#20180a;background:var(--gold-bright);padding:2px 7px;border-radius:5px;}
.reward-panel .rp-msg{font-size:13px;color:var(--text);line-height:1.7;text-align:center;padding:6px 0 4px;}
.reward-panel .rp-scroll{overflow-y:auto;min-height:0;flex:1 1 auto;padding-right:2px;}
.reward-panel .rp-btn{display:block;width:100%;margin-top:12px;flex:0 0 auto;opacity:0;transition:opacity .4s ease;}
.reward-panel .rp-btn.in{opacity:1;}

/* ---- v0.47 毀滅者等 boss 開場：標題四周浮現金色紋路 → 之後標題與紋路一起擊碎 ---- */
.battle-intro .intro-focus{position:relative;display:inline-block;}
.battle-intro.boss .intro-focus{margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(820px,94vw);aspect-ratio:800/260;}
.battle-intro .ornament{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;filter:drop-shadow(0 0 7px rgba(228,195,79,.65));}
.battle-intro .orn{fill:none;stroke:url(#ornGold);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;}
.battle-intro .orn.thin{stroke-width:1.4;opacity:.75;}
.battle-intro .orn-fill{fill:url(#ornGold);opacity:0;}
.battle-intro .ornament.show .orn{animation:ornDraw var(--orn-ms,1100ms) cubic-bezier(.3,.6,.3,1) forwards;}
.battle-intro .ornament.show .orn.d2{animation-delay:.18s;}
.battle-intro .ornament.show .orn-fill{animation:ornFade .7s ease .55s forwards;}
@keyframes ornDraw{to{stroke-dashoffset:0;}}
@keyframes ornFade{to{opacity:1;}}
.battle-intro .shard{pointer-events:none;will-change:transform,opacity;}
.battle-intro .shard .orn{animation:none !important;stroke-dashoffset:0 !important;}
.battle-intro .shard .orn-fill{animation:none !important;opacity:1 !important;}
.battle-intro .intro-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(255,231,150,.6),rgba(0,0,0,0) 58%);opacity:0;pointer-events:none;}
/* ---- v0.48：3D戰場（取代舊的.grid/.cell/.unit-chip DOM格子） ---- */
.stage3d{position:relative;width:100%;aspect-ratio:1/1;max-height:78vh;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
.stage3d-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.stage3d-ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.stage3d-ctl{position:absolute;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5;}
.stage3d-ctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--gold);background:rgba(15,17,21,.78);color:var(--gold-bright);font-size:16px;line-height:1;cursor:pointer;padding:0;}
.stage3d-ctl button:active{transform:scale(.92);}
.stage3d-nogl{position:absolute;inset:0;padding:30px;color:var(--text);z-index:6;}
/* 單位頭上的DOM標籤：.utag定位在腳下，由B3D每幀投影更新transform與--h(單位像素高)/--w(一格像素寬) */
.utag{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:3;will-change:transform;}
.utag .head{position:absolute;left:0;bottom:var(--h,40px);width:0;height:0;}
.utag .unit-hp{bottom:auto;top:2px;left:calc(var(--w,30px) / -2);right:auto;width:var(--w,30px);height:4px;}
.utag .bubble{bottom:16px;}
</style>

<script>
(function(){
"use strict";

/* ============================================================
   STATIC DATA
============================================================ */
// ARCS：大章節（篇章/卷）分類。目前只有一卷，之後新增卷數時，

];

const CHAPTERS = [
  {id:0, arcId:'arc1', name:'序章：意外來客', desc:'哥布林巡邏隊擋在城鎮的邊界。學會戰鬥的基礎。', unlocked:true, battle:'goblin_patrol'},
  {id:1, arcId:'arc1', name:'第一章（測試用）', desc:'不會動的訓練人偶——HP5000、三系防禦都是45，一直使用超級修復自癒，測「破敵外掛」把防禦打下去後傷害有沒有變化。', unlocked:true, battle:'training_dummy_solo'},

/* v0.34新增：分段技能(d.stages)沒有頂層dmgType/power，抓stages裡第一個damage段代打——
   給skillSummaryText()跟AI的scoreTarget()這種只需要「一個代表性數值」的地方共用，
   沒有stages的技能直接回傳d本身，跟v0.33以前完全一樣，零影響 */
function primaryDamageStage(d){
  if(!d.stages) return d;
  return d.stages.find(s=> s.type === 'damage') || d;
}
/* v0.34新增：同理，分段技能沒有頂層effect，抓stages裡第一個status段代表——
   給skillSummaryText()的buff/debuff摘要文字、跟AI判斷「這個debuff是否已經生效中」用，
   兩處都只需要一個代表性的狀態key，不用列出全部段落 */
function primaryStatusStage(d){
  if(!d.stages) return d;
  return d.stages.find(s=> s.type === 'status') || d;
}

/* 依技能資料自動組出一句效果摘要文字（例如「劈砍 18・冷卻3回合・消耗10」），
   不用每個技能手動寫desc，資料改了摘要就自動跟著變 */
function skillSummaryText(d){
  let parts = [];
  if(d.type === 'attack'){
    // v0.28修正：dmgType改成數字碼後這裡忘了查表，原本會直接顯示數字(例如"0 10")，改成查DAMAGE_TYPE_DB還原文字
    // v0.34修正：分段技能改抓primaryDamageStage()代表的那一段，不然會顯示"undefined"
    const pd = primaryDamageStage(d);
    const catInfo = DAMAGE_TYPE_DB[pd.dmgType];
    parts.push(`${catInfo ? catInfo.name : '傷害'} ${pd.power}${d.stages ? '(＋附加效果)' : ''}`);
  } else if(d.type === 'heal'){
    parts.push(`治療 ${d.power}`);
  } else if(d.type === 'buff' || d.type === 'debuff'){
    // v0.28新增：直接寫出影響哪個屬性、漲跌多少、持續幾回合，取代原本的「功能性技能」空泛字樣
    // v0.34修正：分段技能(如詛咒之詩) 改抓primaryStatusStage()代表的那一段來顯示，
    // 有多段(curseDebuff+bind)時額外註明「(＋附加效果)」，避免看起來只有一種效果
    const ps = primaryStatusStage(d);
    const sdef = STATUS_DB[ps.effect];
    const stats = sdef ? (Array.isArray(sdef.stat) ? sdef.stat : [sdef.stat]) : [];
    const labels = stats.map(s=> STAT_LABELS[s] || s).join('/');
    const effectValue = ps.effectValue, statusDuration = ps.statusDuration;
    if(sdef && (sdef.category === 'cc' || sdef.category === 'dot')){
      parts.push(`附加${sdef.name}，持續${statusDuration}回合${d.stages && d.stages.length>1 ? '(＋附加效果)' : ''}`);
    } else {
      const sign = (effectValue||0) >= 0 ? '+' : '';
      parts.push(`${labels || '狀態'}${sign}${effectValue}，持續${statusDuration}回合${d.stages && d.stages.length>1 ? '(＋附加效果)' : ''}`);
    }
  } else if(d.type === 'utility' && d.effect === 'resetCooldowns'){
    parts.push('重置自身所有技能冷卻');
  } else {
    parts.push('功能性技能');
  }
  if(d.cd) parts.push(`冷卻${d.cd}回合`);
  if(d.cost && d.cost.res) parts.push(`消耗${d.cost.res}`);
  return parts.join(' · ');
}

/* 依裝備資料自動組出屬性摘要文字（例如「+5 鎧甲值, +1 防禦」），

// v0.26：atk/def/armor改名，STAT_LABELS要跟著換，不然equipSummaryText()查不到欄位、
// 所有裝備的摘要文字都會變成「（無屬性加成）」——這裡順便把新增的元素/神秘系欄位也一起補上標籤
const STAT_LABELS = {
  patk:'物理攻擊', pdef:'物理防禦', pres:'物理減免',

// 顯示成「物 5/5/5」這樣。想換成emoji(⚔️🌙🔮)之類的圖案，直接改這裡的label即可，
// 三個keys的順序(atk,def,res)決定「/」分隔的數字順序，不要打亂
const STAT_GROUPS = [
  { label:'物', keys:['patk','pdef','pres'] },

/* 【v0.25】卡片上的效果說明文字硬截斷：CSS的ellipsis在grid/flex巢狀結構裡有時會失效（子項預設min-width:auto，
   內容撐爆容器寬度），這裡直接在字串層級砍掉超出的部分當雙重保險，不管CSS有沒有生效，卡片版面都不會被拉長。
   maxLen預設14個字，想改長度直接調這個數字就好；說明浮動視窗顯示完整文字時不要套用這個函式 */
function truncateText(str, maxLen=14){
  if(!str) return str;
  return str.length>maxLen ? str.slice(0,maxLen)+'…' : str;
}
function equipSummaryText(d){
  const parts = Object.keys(STAT_LABELS)
    .filter(k => d[k])
    .map(k => `+${d[k]} ${STAT_LABELS[k]}`);
  return parts.length ? parts.join(', ') : '（無屬性加成）';
}

/* 依道具資料自動組出效果摘要文字（例如「恢復30點HP」），
   跟 skillSummaryText / equipSummaryText 同一套邏輯：不用手動寫lore。
   想讓道具支援新效果（例如解除異常、增益等），直接在這裡加一個 if 判斷即可。 */
function itemSummaryText(d){
  let parts = [];
  if(d.heal) parts.push(`恢復${d.heal}點HP`);
  return parts.length ? parts.join(', ') : '（無效果）';
}

/* ============================================================
   【range 系統改版：shape enum 換成 reach + shape 兩參數，見 range_sim.html 模擬器與 dev4_design_todo.md 第十二節】
   - reach（number）：切比雪夫距離上限，決定「這個技能可以把錨點放在哪」
     reach:0 代表唯一合法錨點就是施放者自己，UI上會直接自動觸發，不用玩家再點一次
   - shape（number | 'all' | 'laser'）：以錨點為中心展開的命中範圍
     N（正整數）= N×N方塊，N=1即單體技能，N為偶數時往右下多蓋一格
     'all'      = 不看reach，直接套用在 targetSide 篩選出的「全部」單位身上（原本的 ally_all）
     'laser'    = 沿方向直線打到底（尚未實作，UI互動方式待設計，見 dev4_design_todo.md 第十節「尚待解決」；
                  目前 SKILL_DB 沒有技能使用這個值，資料格式先預留）
   - 錨點合法性規則：shape===1（單體）時，錨點必須落在有合法目標（matchesSide通過）的格子上才算數，
     所以由 onUnitClick 直接點單位判定；shape>1（AOE）允許空放，範圍內有沒有目標交給執行時的 matchesSide 判定，
     所以由 onCellClick 點格子判定，錨點只受 reach 限制、不要求該格有人
   - targetSide：不變，純粹決定套用在哪個陣營，相對於施放者自身陣營計算，敵我雙方共用同一套判斷：
     'enemy' = 施放者的敵對陣營　'ally' = 施放者的同陣營　'all' = 不分敵我　'self' = 僅施放者自己
   - reach 數值目前為暫定值（尤其 REACH_UNLIMITED 用來保留舊版「不限位置」行為，例如重擊/火球原本就能點全場任意格），
     之後平衡測試時可能會依角色設計調整（例如重擊改成真正的近戰限定射程），不影響本次架構
============================================================ */
const REACH_UNLIMITED = 99; // 全場任一格都在範圍內（12x4棋盤最大切比雪夫距離遠小於這個值），僅為保留舊版「不限位置」行為的權宜值

/* ============================================================
   【施放確認階段】不是每個技能單獨設定的欄位，而是由 shape 自動決定要走幾段確認流程，
   目前存在的3種：

   階段A（0次確認，按下即發動）：目前沒有任何技能在用。
     v0.13以前 self（reach:0）跟 shape:'all' 是這樣（選取後自動觸發），
     v0.14拿掉了，因為容易手滑誤觸、也沒有反悔機會。架構上還是可以做，
     只要在renderSidePanel()技能按鈕的onclick裡跳過「只選取」那段、直接showFullscreenFX+executeSkill即可，
     但目前刻意不用，全部技能都至少要求1次確認。

   階段B（1次確認，選取後立即預覽紅底，點紅底即發動）：shape===1（單體/自身）、shape==='all'（全體）、shape==='laser'。
     這幾種的共通點是「選了技能的當下，候選目標就已經是確定的」，不需要額外的「選範圍」步驟，
     紅底在點技能的那一刻就會立即顯示（不用等玩家做任何動作）。
     - shape===1：紅底顯示在 singleTargetCandidates() 篩出的unit-chip上（可能是敵人/隊友/自己）。
       如果選取後棋盤上完全沒有紅底，通常代表「目前沒有合法目標在範圍內」（例如相鄰系技能reach:1，
       但沒有敵人真的站在自己旁邊），這是正常情況、不是bug——移動靠近目標後重新選取技能，紅底就會出現。
     - shape==='all'：紅底顯示在所有matchesSide()篩出的unit-chip上，另外整場棋盤標黃（純視覺提示「這是全場技能」）。
     - shape==='laser'：紅底/黃底顯示在8條方向線的沿途格子上（見computeSkillHighlights），
       因為reach通常很大（例如聖光reach:12），幾乎每次選取都會立刻看到紅底，這是reach數值造成的差異，
       不是shape===1跟shape==='laser'的確認邏輯不同——兩者都是「選取當下就預覽，點一次confirm」。

   階段C（2次確認，先選範圍/方向再對範圍內容確認發動）：shape>1的AOE技能（例如fireball）。
     第一次確認＝選定/改選錨點（點黃底候選格，棋盤即時預覽該錨點展開的N×N紅底範圍）；
     第二次確認＝點紅底範圍內任一格才真正發動。改點別的黃底格會直接重新預覽新錨點，不用先取消。
     這是唯一需要「先看範圍長怎樣、才決定要不要打」的類型，因為AOE的錨點是連續空間、不像laser只有8個離散方向可選。

   之後如果想讓某個技能刻意套用不同階段（例如想讓某個技能維持階段A秒發），
   目前沒有專屬欄位可以直接標記，要靠shape間接決定——真的有需要時再討論是否要加一個獨立的confirmStage欄位覆寫這個預設對應規則。
============================================================ */
/* ============================================================
   傷害分類編碼表（v0.26新增，dev4_design_todo0908.md 第十節延伸討論定案）
   - 技能資料的 dmgType 欄位改用數字碼，不再手打中文字串：既省得每次手key打錯字，
     也讓「哪些細分類算同一大類」變成查表決定，而不是散落在各處的字串比對
   - category 欄位才是機制真正查表用的（決定用哪組atk/def/res三連、扣哪個減免stat），
     name 純粹是戰報/UI顯示文字
   - 編號分段：0-9物理／10-19元素／20-29神秘／90-99特殊（治療/無傷害），
     這只是骨架，想改哪個編號對應哪個細分類直接調整這裡即可，不影響其他程式邏輯
============================================================ */
const DAMAGE_TYPE_DB = {
  0:  { name:'劈砍', category:'physical' },
  1:  { name:'敲擊', category:'physical' },
  2:  { name:'穿刺', category:'physical' },
  10: { name:'燃燒', category:'element' },
  11: { name:'閃電', category:'element' },
  12: { name:'冷凍', category:'element' },
  13: { name:'強酸', category:'element' },
  20: { name:'黑暗', category:'mystic' },
  21: { name:'神聖', category:'mystic' },
  22: { name:'精神', category:'mystic' },
  23: { name:'力場', category:'mystic' }, // arcane_bolt改用這個（MOMO：奧術系歸神秘類的force）
  90: { name:'治療', category:'heal' },
  99: { name:'無傷害', category:'none' },
};
/* 大類別 → 這次「傷害門檻(方案A無法穿透)」查哪個減免stat／攻防三連用哪一組。
   目前三類都是真的stat（patk/pdef/pres、eatk/edef/eres、matk/mdef/mres），
   heal/none兩類沒有對應的atk/def三連，傷害公式遇到這兩類會直接跳過門檻判定。 */
const RESIST_STAT_BY_CATEGORY = {
  physical: { atk:'patk', def:'pdef', res:'pres' },
  element:  { atk:'eatk', def:'edef', res:'eres' },
  mystic:   { atk:'matk', def:'mdef', res:'mres' },
};

/* ============================================================
   STATUS_DB（v0.26新增，buff/debuff情境一：固定回合數）
   - 只定義「這個效果影響哪個stat、疊加規則」，實際數值/持續回合數由技能自己帶
     （SKILL_DB的effectValue／statusDuration），同一個status key不同技能可以給不同強度
   - stackRule目前只用'refresh'（重複施放=重新計時，不疊加），之後要做'stack'/'highest'
     再回來擴充分支
   - 這一版只做「固定回合數」，被動(情境四)留給之後milestone的grantPassive一起做
============================================================ */
const STATUS_DB = {
  defup:       { name:'格擋姿態', stat:'pres', stackRule:'refresh' },   // guard格擋 → 物理減免門檻值提升
  atkup:       { name:'鼓舞', stat:'patk', stackRule:'refresh' },   // song_buff鼓舞之歌 → 物理攻擊提升
  curseDebuff: { name:'詛咒', stat:'pdef', stackRule:'refresh' },   // curse_verse詛咒之詩 → 物理防禦下降
  // v0.28新增：stat欄位改支援陣列——一個status同時影響「三種攻擊/三種防禦」，
  // 測試用技能「我方外掛」/「破敵外掛」需要這個（見effectiveStat()的比對邏輯同步更新）
  allAtkUp:    { name:'我方外掛', stat:['patk','eatk','matk'], stackRule:'refresh' }, // 我方外掛 → 三系攻擊同時提升
  allDefDown:  { name:'破敵外掛', stat:['pdef','edef','mdef'], stackRule:'refresh' }, // 破敵外掛 → 三系防禦同時下降
  // v0.34新增：狀態抵抗系統。跟上面的數值型buff/debuff不同，這四個沒有stat欄位(不走effectiveStat疊加)，
  // 改用category標記走另一套邏輯：category:'cc' → startActorTurn()鎖三旗標名額；category:'dot' → endActorTurn()回合結束扣血。
  // resistStat指向角色/敵人身上的抵抗欄位(toughness/reflex/will，目前全員都是0，純測試佔位，之後有非0數值才會真的擋下來)。
  stun: { name:'暈眩', category:'cc', ccType:'stun', resistStat:'toughness' },
  bind: { name:'束縛', category:'cc', ccType:'bind', resistStat:'reflex' },
  fear: { name:'恐懼', category:'cc', ccType:'fear', resistStat:'will' },
  painBurnDot: { name:'痛苦燃燒', category:'dot', resistStat:'toughness', dotDamage:5 },
};

/* 施加狀態：value/duration由呼叫端（executeSkill）從技能資料帶進來，不查STATUS_DB要用多少 */
function applyStatus(target, statusKey, value, duration){
  const def = STATUS_DB[statusKey];
  if(!def) return;
  target.statuses = target.statuses || [];
  const existing = target.statuses.find(s=> s.key === statusKey);
  if(existing){
    // 目前只有refresh規則：新的數值/時間直接蓋掉舊的，不疊加
    existing.value = value;
    existing.duration.remaining = duration;
  } else {
    target.statuses.push({ key:statusKey, value, duration:{type:'turns', remaining:duration} });
  }
}

/* v0.34新增：狀態命中/抵抗判定。沒有resistStat的狀態(現有guard/song_buff/curse_verse等數值型buff/debuff)
   完全不受影響，維持必然成功；只有帶resistStat的新狀態(暈眩/束縛/恐懼/DOT)才會真的骰：
   技能/該段(stage)的successValue + 亂數(5~100) > 目標對應抵抗值 才算成功。
   MOMO開工前確認：目前TOU/REF/WIL(toughness/reflex/will)全員數值都是0，純測試佔位，
   所以現階段所有帶resistStat的狀態一樣是必定成功，等之後角色/敵人開始有非0抵抗值才會真的擋下來。 */
function rollStatusSuccess(stageOrSkillDef, target){
  const sdef = STATUS_DB[stageOrSkillDef.effect];
  if(!sdef || !sdef.resistStat) return true;
  const roll = (stageOrSkillDef.successValue || 0) + (5 + Math.floor(Math.random()*96));
  return roll > (target[sdef.resistStat] || 0);
}

/* 讀取「含buff/debuff後」的實際數值，取代原本直接讀 unit[statKey]。
   之後被動(情境四)接上時，這裡會再加一段讀角色被動清單的邏輯，現在先只處理statuses陣列。 */
function effectiveStat(unit, statKey){
  let val = unit[statKey] || 0;
  (unit.statuses || []).forEach(s=>{
    const def = STATUS_DB[s.key];
    if(!def) return;
    const stats = Array.isArray(def.stat) ? def.stat : [def.stat];
    if(stats.includes(statKey)) val += s.value;
  });
  // v0.31新增：被動能力(PASSIVE_DB)疊加——放在STATUS_DB之後，同樣是加總；
  // condition每次都即時判斷，不快取，狀態一變（例如HP回升）下次算就自動反映
  getUnitPassiveIds(unit).forEach(pid=>{
    const def = PASSIVE_DB[pid];
    if(!def) return;
    const stats = Array.isArray(def.stat) ? def.stat : [def.stat];
    if(stats.includes(statKey) && evaluatePassiveCondition(unit, def.condition)) val += def.value;
  });
  return val;
}
/* 判斷某單位目前是否掛著buff／debuff（給戰場▲▼標記用），任一狀態的value>=0算buff，<0算debuff，
   同一單位身上buff/debuff可能同時存在（各自來源不同狀態），兩個符號都要顯示 */
function unitStatusFlags(unit){
  let hasBuff = false, hasDebuff = false, hasSpecial = false;
  (unit.statuses || []).forEach(s=>{
    const def = STATUS_DB[s.key];
    // v0.34新增：暈眩/束縛/恐懼/DOT沒有數值意義的value，不該被硬塞進▲▼判斷(之前s.value若給0會被誤判成▲金色buff)，
    // 改用category標記獨立分流成一個新符號
    if(def && (def.category === 'cc' || def.category === 'dot')) hasSpecial = true;
    else if(s.value >= 0) hasBuff = true;
    else hasDebuff = true;
  });
  return { hasBuff, hasDebuff, hasSpecial };
}
/* v0.29新增：判斷某單位身上是否已經掛著某個status且尚未到期——給AI用，
   避免重複施放已生效的buff/debuff（見decideEnemyAction第3步）。
   statusKey為空（技能沒有effect欄位）時一律回傳false，維持原本行為不跳過。 */
function statusAlreadyActive(target, statusKey){
  if(!statusKey) return false;
  return (target.statuses || []).some(s => s.key === statusKey && s.duration && s.duration.remaining > 0);
}

/* ============================================================
   PASSIVE_DB（v0.31新增，被動能力系統／情境四）
   - 跟STATUS_DB同樣的stat/value疊加寫法，差別是：沒有到期時間(永久生效)，
     多一個condition欄位——effectiveStat()每次都即時判斷condition成不成立，
     不是「觸發當下定值就不再變」，例如狂暴的HP門檻，回血後加成會立刻消失
   - condition用target欄位統一處理「自身」跟「跨單位」兩種情況，底層比較邏輯共用：
       target:'self'   → 讀單位自己身上的stat
       target:'linked' → 先讀unit[linkKey]拿到參照的另一個單位，再讀那個單位的stat
     （linkKey怎麼被接上是各自場景的事，例如毀滅者本體的armorUnit要在建立戰鬥時手動接好）
   - stat支援'hpRatio'這個虛擬值(=hp/maxHp)，其餘直接讀單位對應欄位
   - 下面兩筆是設計階段的示範／預留條目，還沒有milestone或敵人實際掛上去，
     之後guran/daren/sete/charlotte的grantPassive節點、或毀滅者部位的passives欄位，
     直接指到這裡的key即可
============================================================ */
const PASSIVE_DB = {
  iron_body: { name:'鋼鐵之軀', stat:'pdef', value:20 }, // 無condition = 永久生效
  berserk:   { name:'狂暴', stat:'patk', value:30,
    condition:{ target:'self', stat:'hpRatio', op:'<', value:0.5 } },
  // v0.32新增：毀滅者本體的防禦加成——跨單位條件的實際案例，armorUnitId在battle建立時手動接好
  armor_guard: { name:'護甲防禦', stat:['pdef','edef','mdef'], value:100,
    condition:{ target:'linked', linkKey:'armorUnitId', stat:'hp', op:'>', value:0.5 } },
};
// v0.32新增：護甲裝置閾值——本體防禦加成、左手是否開始維修，兩處都即時比較HP vs這個值，
// 不用broken旗標。目前定案值0，之後想做「搖搖欲墜」式提前失能，改成正值(如maxHp*0.2)即可
const DESTROYER_ARMOR_THRESHOLD = 0;
function comparePassiveOp(a, op, b){
  switch(op){
    case '<': return a < b;
    case '<=': return a <= b;
    case '>': return a > b;
    case '>=': return a >= b;
    case '==': return a === b;
    default: return false;
  }
}
function readPassiveStat(unit, stat){
  if(stat === 'hpRatio') return unit.maxHp ? unit.hp / unit.maxHp : 0;
  return unit[stat] || 0;
}
function evaluatePassiveCondition(unit, condition){
  if(!condition) return true; // 沒有condition欄位 = 永久生效
  if(condition.target === 'linked'){
    // v0.33修正：linkKey存的是「參照單位的id」而不是物件本身直接參照——
    // 因為startBattle()會用Object.assign({}, e, {...})把enemies()產生的每個單位複製成新物件，
    // 複製後任何「A單位身上存B單位的物件參照」都會變成指向複製前的舊物件(陳舊參照，B的hp再怎麼變化A都讀不到最新值)。
    // id是字串，複製時會被正確帶過去，所以改成每次都用allUnits()即時查id，不會有這個問題
    const linkedId = unit[condition.linkKey];
    const linked = linkedId != null ? allUnits().find(u => u.id === linkedId) : null;
    if(!linked) return false; // 參照的單位id沒設定/戰場上找不到，安全起見視為條件不成立
    return comparePassiveOp(readPassiveStat(linked, condition.stat), condition.op, condition.value);
  }
  return comparePassiveOp(readPassiveStat(unit, condition.stat), condition.op, condition.value);
}
/* 取得某單位目前實際擁有的被動id清單：
   - 敵人（含毀滅者各部位）：直接讀模板上的passives陣列(靜態)
   - 玩家角色：透過ally.ref拿回state.party的角色物件，依目前等級即時篩MILESTONE_DB裡
     type==='grantPassive'且level<=目前等級的節點——不需要另外存一份「已解鎖」清單，
     等級本身就是唯一真相來源，跟前面護甲裝置閾值判斷同一個原則 */
function getUnitPassiveIds(unit){
  if(Array.isArray(unit.passives)) return unit.passives;
  if(unit.ref){
    const list = MILESTONE_DB[unit.ref.id] || [];
    return list.filter(m => m.type === 'grantPassive' && m.level <= unit.ref.level).map(m => m.passiveId);
  }
  return [];
}

/* ============================================================
   【角色池解鎖／上場替補 編輯教學】
   makeChar 最後兩個參數：
   - unlockChapter：從第幾章開始，這個角色會出現在「可選名單」裡。

}

const SKILL_CAP_BASE = 4;             // 技能欄基礎上限，可修改

let state = null;

/* ============================================================
   個體實例模型（設計文件第二節／第十六節定案，Stage 2 實作）
   - state.equipInstances / skillInstances / itemInstances：
     { [iid]: {key, level, status} }，status: 'unowned' | 'owned' | 'equipped'
   - c.equipment[slot] / c.skills[i] / c.items[i] 現在存的是 iid，不是key字串
   - 商店庫存＝篩選 status==='unowned' 的實例；倉庫＝status==='owned'；
     角色身上＝status==='equipped'
   - 起始角色配裝（makeChar給的原始key字串）與商店庫存是分開各自建立的
     實例，不互相共用同一份（起始配裝不會佔用商店的庫存數量）
   - 目前每個key先各建1個「unowned」商店庫存（暫定數量，見設計文件
     待辦清單第1項，之後要改成逐項設計的正式數量，直接改 seedInstances()
     裡的迴圈次數即可）
============================================================ */
function makeIid(st, prefix){ st.iidCounter = (st.iidCounter||0) + 1; return prefix+'_'+st.iidCounter; }

/* v0.23新增：想讓某個key一開始就有多份庫存（例如同一把火球要備4份給玩家買齊、
   湊出4種不同強化等級），在這裡加一行 key:數量 即可；沒列到的key預設維持1份，不用逐一補。
   範例：SKILL_STOCK_OVERRIDE = { fireball: 4 } 代表商店一開始有4份「火球」技能書庫存，
   買了幾份、每份卸下後各自的等級都會分開記錄，因為每一份都是各自獨立的iid實例，不是共用一份數量疊加 */
const EQUIP_STOCK_OVERRIDE = {};
const SKILL_STOCK_OVERRIDE = {};
const ITEM_STOCK_OVERRIDE = {};

function seedInstances(st){
  // 起始角色配裝：把 makeChar 給的原始key字串轉成「已裝備」的個體實例
  st.party.forEach(c=>{
    c.skills = c.skills.map(key=>{
      if(!key) return null;
      const iid = makeIid(st,'sk');
      st.skillInstances[iid] = { key, level:1, status:'equipped' };
      return iid;
    });
    c.items = c.items.map(key=>{
      if(!key) return null;
      const iid = makeIid(st,'it');
      st.itemInstances[iid] = { key, level:1, status:'equipped' };
      return iid;
    });
    // c.equipment 起始全部是null，不用轉換
  });
  // 商店庫存：裝備(含寶物庫)/技能/道具，每個key預設1個unowned實例，除非在上面XXX_STOCK_OVERRIDE裡有另外指定數量
  Object.keys(EQUIP_DB).forEach(key=>{
    const count = EQUIP_STOCK_OVERRIDE[key] || 1;
    for(let i=0;i<count;i++){ const iid = makeIid(st,'eq'); st.equipInstances[iid] = { key, level:1, status:'unowned' }; }
  });
  // v0.26：寶物庫已併入EQUIP_DB，上面那個迴圈已經涵蓋，這裡不用再另外跑一次
  SKILL_SHOP_KEYS.forEach(key=>{
    const count = SKILL_STOCK_OVERRIDE[key] || 1;
    for(let i=0;i<count;i++){ const iid = makeIid(st,'sk'); st.skillInstances[iid] = { key, level:1, status:'unowned' }; }
  });
  Object.keys(ITEM_DB).forEach(key=>{
    const count = ITEM_STOCK_OVERRIDE[key] || 1;
    for(let i=0;i<count;i++){ const iid = makeIid(st,'it'); st.itemInstances[iid] = { key, level:1, status:'unowned' }; }
  });
}

const EQUIP_UPGRADE_CAP = 5;
const SKILL_UPGRADE_CAP = 5;
function equipUpgradeCost(nextLevel){ return 20 * nextLevel; } // 金幣，暫定
function skillUpgradeCost(nextLevel){ return 20 * nextLevel; } // 水晶，暫定
const EQUIP_LEVEL_STAT_BONUS_PER_LEVEL = 1; // 裝備每級各數值欄位+1，暫定
const SKILL_LEVEL_POWER_BONUS_PER_LEVEL = 3; // 技能每級power/heal+3，暫定
function skillLevelBonus(actor, key){
  const lvl = (actor.skillLevels && actor.skillLevels[key]) || 1;
  return (lvl - 1) * SKILL_LEVEL_POWER_BONUS_PER_LEVEL;
}

function equipInstOf(iid){ return iid ? state.equipInstances[iid] : null; }
function equipDefOf(iid){ const inst = equipInstOf(iid); return inst ? lookupEquip(inst.key) : null; }
/* 裝備某個數值欄位「含強化等級加成」後的實際數值。沒有這個欄位就回傳0（方便直接加總）。 */
function equipEffectiveStat(iid, statKey){
  const inst = equipInstOf(iid);
  const def = equipDefOf(iid);
  if(!inst || !def || !def[statKey]) return 0;
  return def[statKey] + (inst.level - 1) * EQUIP_LEVEL_STAT_BONUS_PER_LEVEL;
}
function eqTagColor(slot){
  // 裝備部位色票（暫定，之後想改直接調整 :root 裡的 --eq-xxx hex 即可）
  const map = { head:'--eq-head', chest:'--eq-chest', hands:'--eq-hands', waist:'--eq-waist', feet:'--eq-feet', acc:'--eq-acc' };
  return `var(${map[slot] || '--eq-acc'})`;
}
function skillTypeColor(type){
  // 技能/道具共用同一套type色票：attack→敵方紅、heal→我方綠、buff→金(跟▲標記同色)、debuff→紫(跟▼標記同色)
  // v0.28：原本buff/debuff顏色相反(buff紫/debuff金)，這次跟戰場▲▼標記顏色統一，一致才好辨識
  const map = { attack:'var(--enemy)', heal:'var(--ally)', buff:'var(--gold-bright)', debuff:'var(--rarity-purple)' };
  return map[type] || 'var(--border)';
}
function skillInstOf(iid){ return iid ? state.skillInstances[iid] : null; }
function skillDefOf(iid){ const inst = skillInstOf(iid); return inst ? SKILL_DB[inst.key] : null; }
function itemInstOf(iid){ return iid ? state.itemInstances[iid] : null; }
function itemDefOf(iid){ const inst = itemInstOf(iid); return inst ? ITEM_DB[inst.key] : null; }

function freshState(){
  const st = {
    chapterProgress: {0:'available'},
    party: freshParty(),
    gold: 600000,
    crystal: 32000, // 技能商店專用貨幣
    sphere: 500000, // 天賦天球（原「鍛鍊結晶」改名）：屬性鍛鍊專用資源，單純數值，跟金幣/水晶同等級，不走個體實例。起始值5000（MOMO指定）
    expPool: 500000, // 人物等級系統共用經驗池，全體角色共用同一池，升級花費從這裡扣。起始值5000（MOMO指定）
    flags: {}, // 通用旗標：紀錄擊敗過的敵人、達成的事件，供商店解鎖/回顧圖鑑解鎖使用
    maxChapterReached: 0, // 玩家目前打贏過的最高章節，用來判斷角色池要解鎖到誰
    iidCounter: 0,

  };
  seedInstances(st);

function hasFlag(key){ return !!(state.flags && state.flags[key]); }
function setFlag(key){ state.flags = state.flags || {}; state.flags[key] = true; }
function saveGame(){
  try{ window.storage.set('rpg-p1-save', JSON.stringify(state), false).catch(()=>{}); }catch(e){}
}
async function loadGame(){
  try{
    const res = await window.storage.get('rpg-p1-save', false);
    if(res && res.value){ state = JSON.parse(res.value); return true; }
  }catch(e){}
  return false;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>t.classList.remove('show'), 2000);
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ============================================================
   NAV
   【分頁開關】想暫時關閉某個大分頁，把對應值改成 false 就好，
   不用刪程式碼、不用找位置，存檔重整後該分頁按鈕會直接消失。
============================================================ */
const TAB_ENABLED = {
  chapters: true,
  prep: true,
  codex: true,
};
const NAV_TABS = [
  {key:'chapters', label:'章節'},
  {key:'prep', label:'準備'},
  {key:'codex', label:'回顧'},
];
function renderNav(){
  const bar = document.getElementById('navBar');
  bar.innerHTML = '';
  NAV_TABS.filter(t=>TAB_ENABLED[t.key]).forEach(t=>{
    const b = document.createElement('button');
    b.className = 'navbtn';
    b.dataset.view = t.key;
    b.textContent = t.label;
    b.onclick = ()=>{ if(!b.disabled) switchView(t.key); };
    bar.appendChild(b);
  });
}
function switchView(v){
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('viewChapters').style.display = v==='chapters' ? '' : 'none';
  document.getElementById('viewPrep').style.display = v==='prep' ? '' : 'none';
  document.getElementById('viewCodex').style.display = v==='codex' ? '' : 'none';
  document.getElementById('viewBattle').style.display = v==='battle' ? '' : 'none';
  if(v!=='battle' && typeof B3D !== 'undefined') B3D.pause(); // v0.48：離開戰場畫面就停掉3D繪製迴圈
  if(v==='chapters') renderChapters();
  if(v==='prep'){ advancePrepBg(); renderPrep(); }
  if(v==='codex') renderCodex();
  if(v==='codex') renderCodex();
}
function setNavLocked(locked){
  document.querySelectorAll('.navbtn').forEach(b=>{
    if(b.dataset.view === 'battle') return;
    b.disabled = locked;
    b.title = locked ? '戰鬥尚未結束，請先脫逃或完成戰鬥' : '';
  });
}

// 記住玩家目前瀏覽到第幾頁（0-indexed），重新進入章節畫面時維持在原本的頁面
let chapterPageIndex = 0;

function renderChapters(){
  const el = document.getElementById('viewChapters');
  const totalPages = Math.max(1, Math.ceil(CHAPTERS.length / CHAPTERS_PER_PAGE));
  // 邊界保護：避免資料變動後頁碼超出範圍
  if(chapterPageIndex >= totalPages) chapterPageIndex = totalPages - 1;
  if(chapterPageIndex < 0) chapterPageIndex = 0;

  const pageStart = chapterPageIndex * CHAPTERS_PER_PAGE;
  const pageChapters = CHAPTERS.slice(pageStart, pageStart + CHAPTERS_PER_PAGE);

  // 目前這頁章節所屬的Arc（用第一筆章節的arcId去查對應大章節名稱，
  // 供標題顯示用；同一頁理論上章節都屬於同一卷）
  const arc = ARCS.find(a => a.id === (pageChapters[0] && pageChapters[0].arcId));
  const arcName = arc ? arc.name : '故事 · 章節選擇';

  el.innerHTML = `<div class="card">
    <div class="ch-pager">
      <button class="ch-pager-btn" id="chPrevBtn" ${chapterPageIndex<=0 ? 'disabled' : ''}>‹</button>
      <div class="ch-pager-title-wrap">
        <h2 class="ch-pager-title">${arcName}</h2>
        <span class="ch-pager-count">${chapterPageIndex+1} / ${totalPages}</span>
      </div>
      <button class="ch-pager-btn" id="chNextBtn" ${chapterPageIndex>=totalPages-1 ? 'disabled' : ''}>›</button>
    </div>
    <div class="chgrid" id="chGrid"></div>
  </div>`;

  const grid = document.getElementById('chGrid');
  pageChapters.forEach(ch=>{
    const div = document.createElement('div');
    div.className = 'chcard' + (ch.unlocked ? '' : ' locked');
    div.innerHTML = `<div class="num">Chapter ${ch.id}</div><div class="ttl serif">${ch.name}</div><div class="desc">${ch.desc}</div>
      ${ch.recruitHint ? `<div style="font-size:11px;color:var(--gold-bright);margin-top:6px;">★ ${ch.recruitHint}</div>` : ''}
      ${ch.unlocked ? '<button class="btn primary" style="margin-top:10px;width:100%;">出發</button>' : ''}`;
    if(ch.unlocked){
      div.querySelector('button').onclick = ()=> startBattle(ch.battle, ch.id);
    }
    grid.appendChild(div);
  });

  const prevBtn = document.getElementById('chPrevBtn');
  const nextBtn = document.getElementById('chNextBtn');
  if(prevBtn) prevBtn.onclick = ()=>{ chapterPageIndex--; renderChapters(); };
  if(nextBtn) nextBtn.onclick = ()=>{ chapterPageIndex++; renderChapters(); };
}

/* 【v0.22】角色底圖鋪底：每人3張變體，隨機選一張套在準備畫面.card背景。
   圖檔路徑還沒提供時直接fallback成不套背景（維持原本面板色），不會出現破圖。
   之後把對應檔名的圖丟進 assets/portraits/ 就會自動生效，不用改程式碼。 */
const CHAR_BG_MAP = {
  daren: ['assets/portraits/daren_bg1.png','assets/portraits/daren_bg2.png','assets/portraits/daren_bg3.png'],
  sete:  ['assets/portraits/sete_bg1.png','assets/portraits/sete_bg2.png','assets/portraits/sete_bg3.png'],
  guran: ['assets/portraits/guran_bg1.png','assets/portraits/guran_bg2.png','assets/portraits/guran_bg3.png'],
  charlotte: ['assets/portraits/charlotte_bg1.png','assets/portraits/charlotte_bg2.png','assets/portraits/charlotte_bg3.png'],
};
const _bgLoadCache = {}; // 記住每個路徑載入成功/失敗，避免重複嘗試載入同一張圖
/* v0.23：底圖改用獨立圖層(.card-bg-layer)淡入，cardEl參數改傳「圖層本身」而不是整個.card，
   這樣文字內容不會跟著閃，只有立繪本身有0.2秒淡入效果 */
function applyCardBg(bgLayerEl, charId){
  bgLayerEl.classList.remove('visible');
  bgLayerEl.style.backgroundImage = '';
  const pool = CHAR_BG_MAP[charId];
  if(!pool || !pool.length) return;
  if(prepState.bgIndex[charId] == null) prepState.bgIndex[charId] = 0; // 保險：萬一還沒被advancePrepBg()初始化過
  const src = pool[prepState.bgIndex[charId]];
  function setBg(){
    bgLayerEl.style.backgroundImage = `linear-gradient(rgba(24,27,39,.88),rgba(24,27,39,.88)), url('${src}')`;
    requestAnimationFrame(()=> bgLayerEl.classList.add('visible')); // 下一幀才加class，確保transition吃得到起始的opacity:0
  }
  if(_bgLoadCache[src] === true){ setBg(); return; }
  if(_bgLoadCache[src] === false){ return; } // 已知載入失敗，不用再試一次
  const img = new Image();
  img.onload = ()=>{ _bgLoadCache[src] = true; setBg(); };
  img.onerror = ()=>{ _bgLoadCache[src] = false; };
  img.src = src;
}

let prepState = { selectedId:null, tab:'equip', bgIndex:{}, panelTarget:null, page:{equip:1, skill:1, item:1, milestone:1}, statPage:1 };
/* v0.23：立繪改成「照順序輪播」（不再隨機），每次按下準備鍵（switchView進prep）才往前走一格，
   同一次停留在準備畫面期間（買裝備、切分頁等重繪）不會再變動，見switchView()裡的advancePrepBg() */
function advancePrepBg(){
  Object.keys(CHAR_BG_MAP).forEach(charId=>{
    const pool = CHAR_BG_MAP[charId];
    if(!pool || !pool.length) return;
    const cur = prepState.bgIndex[charId] != null ? prepState.bgIndex[charId] : -1;
    prepState.bgIndex[charId] = (cur+1) % pool.length;
  });
}

  if(c){

  }

  /* ============================================================
     【上場/替補 星星切換 教學】
     每個角色分頁按鈕旁邊會有一顆星星（★=上場中／☆=替補中）。
     點星星本身：切換該角色上場/替補（不影響你正在編輯誰）。
     點角色名字文字：切換「目前正在編輯的角色」（裝備/技能/道具畫面）。
     兩個動作分開處理，互不影響。
     上場上限固定4人、至少要保留1人上場（最後一人星星會鎖住不能點）。

  const tabsEl = document.getElementById('partyTabs');

/* ============================================================
   【v0.22】準備畫面：裝備/技能/道具三分頁共用的輔助函式
   - paginate()：切頁，每頁固定8項，不足補空卡（由呼叫端補，這裡只算頁碼/切片）
   - renderPager()：畫「上一頁 頁X/共Y 下一頁」，總頁數＝項目數/8無條件進位（至少1頁）
   - openPrepPanel()／renderPrepInfoPanel()：三分頁共用同一塊浮動說明視窗，
     點卡片只更新內容（prepState.panelTarget），是否顯示由state.prepPanelOpen（玩家自行收合/展開，存檔記住）決定，
     不會因為點卡片就強制展開，尊重玩家自己收合的選擇
============================================================ */
const PREP_PAGE_SIZE = 8;
function paginate(list, page){
  const totalPages = Math.max(1, Math.ceil(list.length / PREP_PAGE_SIZE));
  const clampedPage = clamp(page, 1, totalPages);
  const start = (clampedPage-1) * PREP_PAGE_SIZE;
  return { pageItems: list.slice(start, start+PREP_PAGE_SIZE), totalPages, page: clampedPage };
}
function renderPager(containerId, category, page, totalPages){
  const el = document.getElementById(containerId);
  if(!el) return;
  if(totalPages<=1){ el.innerHTML=''; return; }
  el.innerHTML = `
    <button class="btn small" id="${containerId}Prev" ${page<=1?'disabled':''}>‹ 上一頁</button>
    <span>頁 ${page} / 共 ${totalPages}</span>
    <button class="btn small" id="${containerId}Next" ${page>=totalPages?'disabled':''}>下一頁 ›</button>
  `;
  document.getElementById(containerId+'Prev').onclick = ()=>{ prepState.page[category]--; renderPrepBody(state.party.find(p=>p.id===prepState.selectedId)); };
  document.getElementById(containerId+'Next').onclick = ()=>{ prepState.page[category]++; renderPrepBody(state.party.find(p=>p.id===prepState.selectedId)); };
}
function openPrepPanel(target){
  prepState.panelTarget = target;
  renderPrepInfoPanel();
}
/* target格式：
   { title, desc, actions:[{label, onClick, disabled}] }
   actions由呼叫端組好（賣出/強化各自的花費/上限判斷交給呼叫端），這裡只負責畫面 */
function renderPrepInfoPanel(){
  const el = document.getElementById('prepInfoPanel');
  if(!el) return;
  const open = state.prepPanelOpen !== false; // 存檔沒有這欄位時預設當作開啟
  const t = prepState.panelTarget;
  el.innerHTML = `
    <div class="prep-info-panel">
      <div class="prep-info-head" id="prepInfoToggle">
        <span>${t ? '說明：'+t.title : '說明'}</span>
        <span>${open ? '收合 ▲' : '展開 ▼'}</span>
      </div>
      ${open ? `<div class="prep-info-body">
        ${t ? `<div class="d">${t.desc}</div><div class="prep-info-actions" id="prepInfoActions"></div>` : `<div class="d">點擊上方卡片查看說明與操作（賣出／強化）。</div>`}
      </div>` : ''}
    </div>
  `;
  document.getElementById('prepInfoToggle').onclick = ()=>{
    state.prepPanelOpen = !open;
    saveGame();
    renderPrepInfoPanel();
  };
  if(open && t){
    const actionsEl = document.getElementById('prepInfoActions');
    t.actions.forEach(a=>{
      const btn = document.createElement('button');
      btn.className = 'btn small';
      btn.textContent = a.label;
      if(a.disabled) btn.disabled = true; else btn.onclick = a.onClick;
      actionsEl.appendChild(btn);
    });
  }
}

function renderPrepBody(c){

        e.stopPropagation();

        toast('已卸除，收進倉庫');
        saveGame(); renderPrep();
      };
    });
    // 已裝備格：點卡片（非✕按鈕）開浮動說明視窗，強化按鈕在裡面
    body.querySelectorAll('[data-equipped-slot]').forEach(div=>{
      div.onclick = ()=>{
        const s = div.dataset.equippedSlot;
        const iid = c.equipment[s];
        const eqData = equipDefOf(iid);
        const inst = equipInstOf(iid);
        if(!eqData) return;
        const maxed = inst && inst.level >= EQUIP_UPGRADE_CAP;
        const nextCost = inst ? equipUpgradeCost(inst.level+1) : 0;
        openPrepPanel({
          title: eqData.name,
          desc: equipSummaryText(eqData) + (inst && inst.level>1 ? `（強化中，各數值再+${(inst.level-1)*EQUIP_LEVEL_STAT_BONUS_PER_LEVEL}）` : ''),
          actions: [{
            label: maxed ? '已滿級' : `強化 (${nextCost}金)`,
            disabled: maxed || state.gold<nextCost,
            onClick: ()=>{
              if(!inst || inst.level>=EQUIP_UPGRADE_CAP) return;
              const cost = equipUpgradeCost(inst.level+1);
              if(state.gold<cost){ toast('金幣不足'); return; }
              state.gold -= cost;
              inst.level++;
              toast('已強化至 Lv.'+inst.level);
              saveGame(); renderPrep();
            }
          }]
        });
      };
    });
    // 【v0.25】改回「每份實例各自一張卡」（不論重複與否），不再合併成一張key卡：
    // - unowned／owned都各自算一份、各自一張卡，預設每個key只有1份庫存所以通常長得跟以前一樣，
    //   只有用EQUIP_STOCK_OVERRIDE設定多份庫存時才會看到同一個裝備出現好幾張「購買」卡

          title: d.name,

              toast('已強化至 Lv.'+inst.level);

    // 【v0.25】改回「每份實例各自一張卡」，賣出拿掉，強化owned卡也能直接點卡片使用。
    // 技能key清單改成「SKILL_SHOP_KEYS ∪ 遊戲裡實際存在的技能key」聯集，而不是只認SKILL_SHOP_KEYS：
    // 因為像梅恩的起始技能「聖光」(holy_light)不在商店清單裡（角色專屬技能，商店不賣），

      const instsOfKey = skillInstList.filter(([iid,inst])=> inst.key===key && inst.status!=='equipped');

        div.innerHTML = `<div class="k">格 ${i+1}</div><div class="v">尚未上架</div>`;

      const owned = status==='owned';

          e.stopPropagation();
          if(known){ toast('此角色已經會這個技能了'); return; }

      div.onclick = ()=>{
        const actions = [];
        if(owned){

  if(prepState.tab === 'item'){

    // v0.26大改版：atk/def/armor → patk/pdef/pres，新增元素(eatk/edef/eres)/神秘(matk/mdef/mres)，
    // 頁面拆成兩頁（跟equip/item分頁共用.prep-tab視覺，但這裡是「換一組8格」不是「翻頁」，狀態存在prepState.statPage）。

    const pdefBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'pdef'), 0);// + trainingBonus(c,'def');

    const mdefBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'mdef'), 0);
    const mresBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'mres'), 0);
    const hpBonus = trainingBonus(c,'hp');
    // 【修正舊bug】原本這裡只加了trainingBonus，漏了equipBonus(c,'res')，屬性頁顯示的TP上限一直少算裝備加成，這次順便補上
    const spBonus = trainingBonus(c,'sp') + equipBonus(c,'res');

    const expNeed = c.level < 30 ? LEVEL_GROWTH_TABLE[c.level+1] : null;
    const lvMaxed = c.level >= 30;

    // 可鍛鍊的屬性卡（HP/TP/PATK/PDEF），沿用既有鍛鍊機制
    function trainSlot(key, label, tagColor, curValue){
      const trained = c.training[key];
      const maxed = trained >= ATTR_TRAIN_CAP;
      const cost = attrTrainCost(trained);
      return `<div class="slot">
        <div class="slot-tagdot" style="background:${tagColor}"></div>

        <div class="v">${curValue}</div>

        <button class="btn small" data-train="${key}" style="margin-top:4px;width:100%;" ${maxed || state.sphere<cost ? 'disabled':''}>${maxed?'已封頂':'鍛鍊 +1'}</button>
      </div>`;
    }
    // 純顯示屬性卡（元素/神秘系、sanity、強韌/反應/意志），目前沒有鍛鍊系統，之後要加再比照trainSlot擴充
    function dispSlot(label, tagColor, curValue, note){
      return `<div class="slot">
        <div class="slot-tagdot" style="background:${tagColor}"></div>
        <div class="k">${label}</div>
        <div class="v">${curValue}</div>
        <div class="slot-effect">${note||''}</div>
      </div>`;
    }

    const page1Html = `<div class="slotgrid">
        ${trainSlot('hp','HP生命','var(--hp)', c.maxHp+hpBonus)}
        ${trainSlot('atk','PATK物理攻擊','var(--attr-atk)', c.patk+patkBonus)}
        ${trainSlot('def','PDEF物理防禦','var(--attr-def)', c.pdef+pdefBonus)}
        ${dispSlot('PRES物理減免','var(--attr-def)', c.pres+presBonus, '傷害≤此值無法穿透')}

        ${dispSlot('MDEF神秘防禦','var(--rarity-purple)', c.mdef+mdefBonus)}
        ${dispSlot('MRES神秘減免','var(--rarity-purple)', c.mres+mresBonus, '傷害≤此值無法穿透')}

        ${dispSlot('TOU強韌','var(--text-dim)', c.toughness, '之後使用')}
        ${dispSlot('REF反應','var(--text-dim)', c.reflex, '之後使用')}
        ${dispSlot('WIL意志','var(--text-dim)', c.will, '之後使用')}
      </div>`;

    body.innerHTML = `

<div class="slotgrid" style="margin-bottom:8px;">
        <div class="slot">
          <div class="slot-tagdot" style="background:var(--attr-lv)"></div>
          <div class="k">LV等級</div>
          <div class="v">Lv.${c.level}</div>
          <div class="slot-effect">經驗 ${state.expPool}${expNeed?`/${expNeed}`:''}</div>
          <button class="btn small" id="levelUpBtn" style="margin-top:4px;width:100%;" ${lvMaxed || !expNeed || state.expPool<expNeed ? 'disabled':''}>${lvMaxed?'已封頂':'升級'}</button>
        </div>
      </div>

<div class="prep-tabs" id="statPageTabs" style="margin-bottom:8px;"></div>
<div id="statPageBody">${prepState.statPage===2 ? page2Html : page1Html}</div>

      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">里程碑（16格，每2級解鎖1個，其餘先佔位）</div>
      <div class="slotgrid" id="milestoneGrid"></div>
      <div class="prep-pagination" id="milestoneGridPager"></div>
    `;
    const levelUpBtn = document.getElementById('levelUpBtn');

      state.expPool -= LEVEL_GROWTH_TABLE[c.level+1];
      c.level++;
      toast(c.name+' 升到 Lv.'+c.level);
      saveGame(); renderPrep();
    };
    // 屬性頁1/頁2 切換，沿用行動/道具分頁同一套.prep-tab樣式
    const statTabsWrap = document.getElementById('statPageTabs');
    [[1,'屬性I（生命/物理/元素）'], [2,'屬性II（神秘/其他）']].forEach(([pg,label])=>{
      const tabBtn = document.createElement('button');
      tabBtn.textContent = label;
      tabBtn.className = 'prep-tab' + (prepState.statPage===pg ? ' active' : '');
      tabBtn.onclick = ()=>{
        if(prepState.statPage !== pg){ prepState.statPage = pg; renderPrepBody(c); }
      };
      statTabsWrap.appendChild(tabBtn);
    });
    body.querySelectorAll('[data-train]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.train;
        const trained = c.training[key];
        if(trained >= ATTR_TRAIN_CAP) return;
        const cost = attrTrainCost(trained);
        if(state.sphere < cost){ toast('天賦天球不足'); return; }
        state.sphere -= cost;
        c.training[key]++;
        toast(c.name+' 的 '+key.toUpperCase()+' 鍛鍊 +1');
        saveGame(); renderPrep();
      };
    });

    // milestone 16格：目前效果全部不生效（佔位），純顯示解鎖狀態，不可點擊互動
    const msSlots = getMilestoneSlots(c.id);
    const pgM = paginate(msSlots, prepState.page.milestone);
    prepState.page.milestone = pgM.page;
    renderPager('milestoneGridPager', 'milestone', pgM.page, pgM.totalPages);
    const msGrid = document.getElementById('milestoneGrid');
    pgM.pageItems.forEach((ms, i)=>{
      const div = document.createElement('div');
      if(!ms){
        div.className = 'slot empty';
        div.innerHTML = `<div class="k">未定</div><div class="v">－</div>`;
      } else {
        const unlocked = c.level >= ms.level;
        div.className = 'slot' + (unlocked ? '' : ' empty');
        div.innerHTML = `<div class="k">Lv.${ms.level}</div>
          <div class="v">${ms.name}</div>
          <div class="slot-effect">${unlocked ? ms.desc : '尚未解鎖'}</div>`;
      }
      msGrid.appendChild(div);
    });
  }
}

/* ============================================================
   通用商店格狀渲染
   entries: [[key, itemData], ...]
   onBuy(key, itemData)：點擊購買時執行
   ownedCheckFn(key)：可選，若回傳true，該格會顯示soldOutLabel且不可購買
     （原本語意是「已擁有」，現在庫存交給個體實例的unowned數量決定，
     所以這裡的意思改成「沒有庫存可買了」，文字用soldOutLabel控制）
   totalSlots：格子總數（含尚未上架的空格），預設等於entries數量
   soldOutLabel：售完時按鈕文字，預設'已擁有'（相容舊呼叫），新的呼叫可傳'已售完'
============================================================ */
function renderShopGrid(containerId, entries, onBuy, ownedCheckFn, totalSlots, extraLookup, currency, soldOutLabel){
  const grid = document.getElementById(containerId);
  if(!grid) return;
  currency = currency || 'gold'; // 'gold' 或 'crystal'，決定這個商店格用哪種貨幣顯示/扣款
  const currencyLabel = currency === 'crystal' ? '水晶' : '金';
  const currencyShortage = currency === 'crystal' ? '水晶不足' : '金幣不足';
  soldOutLabel = soldOutLabel || '已擁有';
  const slotCount = totalSlots || entries.length;
  for(let i=0;i<slotCount;i++){
    if(i >= entries.length){
      const div = document.createElement('div');
      div.className = 'slot empty';
      div.innerHTML = `<div class="k">格 ${i+1}</div><div class="v">尚未上架</div>`;
      grid.appendChild(div);
      continue;
    }
    const [key, it] = entries[i];
    const owned = ownedCheckFn ? ownedCheckFn(key) : false;
    const div = document.createElement('div');
    div.className = 'slot';
    div.innerHTML = `${it.tagColor ? `<div class="slot-tagdot" style="background:${it.tagColor}"></div>` : ''}<div class="k">${it.cost} ${currencyLabel}</div><div class="v">${it.name}</div>${it.desc ? `<div class="slot-effect">${it.desc}</div>` : ''}`;
    const btn = document.createElement('button');
    btn.className = 'btn small';
    btn.style.marginTop = '4px';
    btn.style.width = '100%';
    if(owned){ btn.textContent = soldOutLabel; btn.disabled = true; }
    else if(state[currency] < it.cost){ btn.textContent = currencyShortage; btn.disabled = true; }
    else { btn.textContent = '購買'; btn.onclick = ()=> onBuy(key, it); }
    div.appendChild(btn);
    grid.appendChild(div);
  }
}

/* ============================================================
   【v0.48新增】戰場地圖資料與規則（地形／高度／尋路／驗證／效果層）
   ────────────────────────────────────────────────────────────
   這一整段是「戰場長什麼樣、怎麼走」的唯一資料來源，3D畫面(B3D)與戰鬥規則共用同一份，
   不會出現「畫面上看得到、規則上卻不能走」的落差。

   ■ 地形「保險方案」(已定案)：每一格只有【一個高度】＋【一種地形】(單層高度場)。
     不做多層樓、屋頂、洞穴頂、橋下橋上；室內房間做成沒有屋頂的格子；多樓層＝另一張地圖用樓梯連接。
     這樣「這格能不能站／怎麼走」永遠只有一個答案，是避免卡死類bug最重要的一條。

   ■ 地圖資料格式（每場戰鬥一份，見下方 BATTLE_MAPS）：
     terrain：文字矩陣，每個字元＝一格地形，字元定義見 TERRAIN_DB
     height ：文字矩陣，每個字元＝該格高度「級數」(0~9)，實際高度＝級數×HEIGHT_UNIT
     allySpawns / enemySpawns：開戰站位 [[x,y],…]，依上場/生成順序對應
     floorItems：場上可拾取物品 [{x,y,item}]（取代舊版隨機灑物品）
     effects：開場就存在的效果層（目前只有 fire）[{x,y,type:'fire',turns:3}]
     events：【預留】劇情／場地事件欄位，目前只存不執行，之後接劇本事件用
     格數是「每場戰鬥自己決定」：欄數＝terrain第一列字數、列數＝terrain列數，兩個矩陣必須一樣大。

   ■ 想新增／修改地圖：只要改 BATTLE_MAPS 裡的文字矩陣。載入時 validateMapDef() 會自動檢查
     （出生點可站、彼此連得到、沒有被圍死的孤島、物品位置合法…），不合格的地圖會拒絕開戰並在console寫明原因。
============================================================ */
/* ---------- 規則設定區（想調整規則只改這裡；每一項後面都有說明） ---------- */

const HEIGHT_DIFF_FREE_MAX = 1;     // 相鄰兩格高度差 ≤ 此值：不額外耗移動力
const HEIGHT_DIFF_EXTRA_AT = 2;     // 高度差 ＝ 此值：爬上/跳下要多耗移動力

const HEIGHT_DIFF_BLOCK_AT = 3;     // 高度差 ≥ 此值：不可通行（懸崖）

/* ---------- 地形表（字元 → 規則）。新增地形：加一行，再到B3D的TERRAIN_STYLE補顏色 ---------- */
const TERRAIN_DB = {
  '.': { key:'grass',  name:'草地', cost:1,        passable:true },
  'f': { key:'forest', name:'森林', cost:2,        passable:true },
  'm': { key:'mud',    name:'泥沼', cost:2,        passable:true },

  'w': { key:'water',  name:'水域', cost:Infinity, passable:false },
