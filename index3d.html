   - STUN_SKIP_WAIT_MS：輪到暈眩/恐懼的單位時，停留多久才跳過（倒地的單位不等待，直接跳過）
   - SKIP_LOG_DOWNED：倒地單位輪到時要不要在戰報顯示「已倒下，跳過」
   - TURN_CUE_BY_SIDE：行動前提示音，依陣營查表。之後新增第三、第四陣營，在這裡各加一行
     （例如 third:'turnThird'，再到SYNTH_SFX加合成音或SFX_FILES填檔案路徑）；沒列到的陣營用TURN_CUE_FALLBACK
============================================================ */
const ACTION_MENU_DELAY_MS = 500;
const STUN_SKIP_WAIT_MS = 900;
const SKIP_LOG_DOWNED = true;
const TURN_CUE_BY_SIDE = { ally:'turnAlly', enemy:'turnEnemy' };
const TURN_CUE_FALLBACK = 'turnEnemy';
function playTurnCue(actor){
  if(!actor) return;
  playCue(TURN_CUE_BY_SIDE[actor.side] || TURN_CUE_FALLBACK);
}
/* 延遲後才彈出行動面板（換人、或同一人做完動作還有剩餘名額時共用）。
   token：如果延遲期間又發生別的事（換人/戰鬥結束…），舊的排程自動作廢 */
function openActionPanelSoon(){
  const b = battle; if(!b) return;
  b.actionPanelOpen = false;
  syncActionModal();
  b.panelToken = (b.panelToken || 0) + 1;
  const token = b.panelToken;
  setTimeout(()=>{
    if(battle !== b || b.finished || b.introPlaying || b.outroPlaying || b.turnWaiting) return;
    if(b.panelToken !== token) return;
    const a = currentActor();
    if(a && a.side === 'ally' && a.hp > 0){ b.actionPanelOpen = true; syncActionModal(); }
  }, ACTION_MENU_DELAY_MS);
}
/* 換到下一位行動者（已由advanceOneSlot()把指標推進過了）：
   - 倒地的單位：戰報顯示訊息、不等待，直接跳過
   - 暈眩/恐懼的單位：戰報顯示訊息，停留STUN_SKIP_WAIT_MS再跳過（讓玩家看到是誰被控制住）
   - 能行動的單位：播放行動前提示音，我方延遲後彈出行動面板，敵方進入AI流程 */
function continueTurnChain(){
  if(!battle || battle.finished) return;
  let next = currentActor();
  startActorTurn(next); // 換人了，重置三旗標名額(暈眩/束縛/恐懼會在這裡被鎖住對應名額)
  let guard = 0;
  while(next && guard < 80){
    if(next.hp <= 0){
      if(SKIP_LOG_DOWNED) logMsg(`<b>${next.name}</b> 已倒下，跳過。`);
      advanceOneSlot();
      if(checkBattleEnd()) return;
      next = currentActor();
      startActorTurn(next);
      guard++;
      continue;
    }
    const sdef = getForcedSkipCC(next);
    if(sdef){
      logMsg(`<b>${next.name}</b> 因為${sdef.name}，這回合無法行動。`);
      battle.actionPanelOpen = false;
      battle.turnWaiting = true;
      renderOrderRow(); renderGrid(); renderSidePanel(); renderPortraits(); renderLog(false);
      syncActionModal();
      const b = battle;
      setTimeout(()=>{
        if(battle !== b || b.finished) return;
        b.turnWaiting = false;
        advanceOneSlot();
        if(checkBattleEnd()) return;
        continueTurnChain();
      }, STUN_SKIP_WAIT_MS);
      return;
    }
    break;
  }
  const allyTurn = !!(next && next.side === 'ally' && next.hp > 0 && !isAiControlled(next));
  if(allyTurn) battle.actionPanelOpen = false; // 先收著，延遲後才彈出
  renderOrderRow(); renderGrid(); renderSidePanel(); renderPortraits(); renderLog(false);
  if(next && next.hp > 0) playTurnCue(next);
  if(allyTurn) openActionPanelSoon(); else syncActionModal();
  maybeRunEnemyTurn();
}

/* ============================================================
   待命動畫（戰場網格上的角色小圖）
   ────────────────────────────────────────────────────────────
   【運作方式】每個角色有幾組待命動畫（sets），每組若干張（frames）。
   待命時依序播一組（每張停IDLE_ANIM_FRAME_MS），播完停在最後一張，停IDLE_HOLD_MS範圍內的隨機秒數，
   再換下一組，最後一組播完回到第一組，一直輪流下去。
   圖片檔名規則：  IDLE_ANIM_DIR + 組名 + 兩位數張號 + IDLE_ANIM_EXT
   例如達倫：assets/portraits/daren_idleA00.png ~ daren_idleA03.png、daren_idleB00.png ~ daren_idleB03.png

   【怎麼編輯】全部改下面 IDLE_ANIMS 這張表：
   - 改檔名：改 sets 裡的組名（不含張號和副檔名），例如 sets:['daren_idleA','daren_idleB']
   - 改張數：改 frames（張號從00開始，frames:4 代表00~03）
   - 增加動畫組：在 sets 陣列多寫一個組名，會自動輪流（想只用一組就只寫一個）
   - 新增人物：加一行，key＝我方角色的id（daren/sete/guran/charlotte），敵人則用它的portraitKey，
     例如  goblin:{ sets:['goblin_idleA'], frames:4 }
   - 關掉某人物的待命動畫：把那一行刪掉或註解掉，就會退回原本的靜態小圖（CHIP_MAP）
   - 圖片檔不存在也沒關係：找不到任何一張就自動退回靜態小圖，不會壞掉（所以其他人可以先寫好，圖到了再放進資料夾）
   【整體調整】速度＝IDLE_ANIM_FRAME_MS；停留時間範圍＝IDLE_HOLD_MS（毫秒，[最短,最長]）；資料夾／副檔名＝IDLE_ANIM_DIR/EXT
============================================================ */
const IDLE_ANIM_DIR = 'assets/portraits/';
const IDLE_ANIM_EXT = '.png';
const IDLE_ANIM_FRAME_MS = 200;
const IDLE_HOLD_MS = [20000, 30000];
const IDLE_TICK_MS = 100;
const IDLE_ANIMS = {
  daren:     { sets:['daren_idleA','daren_idleB'],         frames:4 },
  // 以下先補位（圖還沒有→自動退回靜態小圖），圖到了放進資料夾就生效：
  sete:      { sets:['sete_idleA','sete_idleB'],           frames:4 },
  guran:     { sets:['guran_idleA','guran_idleB'],         frames:4 },
  charlotte: { sets:['charlotte_idleA','charlotte_idleB'], frames:4 },
};
let __idleState = {};   // 每個單位各自的播放進度（用單位id當key）
const __idleBad = {};   // 載入失敗（找不到圖）的人物key，之後就不再嘗試
const __idlePreloaded = {};
function idleFramePath(setName, f){ return IDLE_ANIM_DIR + setName + String(f).padStart(2,'0') + IDLE_ANIM_EXT; }
function idleRandHold(){ return IDLE_HOLD_MS[0] + Math.random() * (IDLE_HOLD_MS[1] - IDLE_HOLD_MS[0]); }
function idleReset(){ __idleState = {}; }
function idleMarkBad(u){ __idleBad[u.portraitKey || u.id] = true; }
function idlePreload(key, cfg){
  if(__idlePreloaded[key]) return;
  __idlePreloaded[key] = true;
  cfg.sets.forEach(set=>{
    for(let f=0; f<cfg.frames; f++){
      const im = new Image();
      im.onerror = ()=>{ __idleBad[key] = true; }; // 任何一張找不到就整個人物退回靜態圖
      im.src = idleFramePath(set, f);
    }
  });
}
/* 回傳這個單位「現在這一刻」該顯示的待命動畫圖路徑；沒設定/失敗就回傳null（呼叫端會用靜態圖） */
function idleFrameSrc(u){
  const key = u.portraitKey || u.id;
  const cfg = IDLE_ANIMS[key];
  if(!cfg || __idleBad[key]) return null;
  idlePreload(key, cfg);
  if(u.hp <= 0) return idleFramePath(cfg.sets[0], cfg.frames - 1); // 倒下：停在第一組最後一張
  const now = performance.now();
  let st = __idleState[u.id];
  if(!st) st = __idleState[u.id] = { set:0, t0:now, hold:idleRandHold() };
  const playMs = cfg.frames * IDLE_ANIM_FRAME_MS;
  if(now - st.t0 >= playMs + st.hold){ st.set = (st.set + 1) % cfg.sets.length; st.t0 = now; st.hold = idleRandHold(); }
  const el = now - st.t0;
  const f = el < playMs ? Math.floor(el / IDLE_ANIM_FRAME_MS) : cfg.frames - 1;
  return idleFramePath(cfg.sets[st.set], f);
}
/* v0.48：舊的DOM版idleTick()（定時換<img>）與applyMoveSlide()（DOM平移滑動）已移除——
   待命動畫現在由B3D每幀呼叫stageSpriteSrc()→idleFrameSrc()取得當下這一張；
   移動動畫改成沿路徑一格一格走（參數見STAGE3D.moveSecPerTile/hopHeight/moveAnim）。 */

/* ============================================================
   INIT
============================================================ */
async function init(){
  const loaded = await loadGame();
  if(!loaded){ state = freshState(); saveGame(); }
  // 個體實例模型（iid+status）上線：舊存檔的 equipment/skills/items 存的是key字串，
  // 跟新格式不相容，且專案已定案不寫遷移腳本（見設計文件），偵測到舊格式就直接重開新局
  if(!state.equipInstances || !state.skillInstances || !state.itemInstances){
    toast('資料格式已更新，重新開始新的存檔');
    state = freshState(); saveGame();
  }
  // 相容舊存檔：補上這批更新新增的欄位，避免舊存檔缺欄位而報錯
  if(!state.flags) state.flags = {};
  if(state.maxChapterReached == null) state.maxChapterReached = 0;
  if(state.crystal == null) state.crystal = 3200; // 相容舊存檔：技能水晶貨幣，補上初始值
  if(state.sphere == null) state.sphere = 5000;
  if(state.expPool == null) state.expPool = 5000;
  const freshRef = freshParty(); // 拿新角色的預設unlockChapter/active，補進舊存檔的角色資料
  state.party.forEach(p=>{
    const ref = freshRef.find(f=>f.id===p.id);
    if(p.unlockChapter == null) p.unlockChapter = ref ? ref.unlockChapter : 0;
    if(p.active == null) p.active = ref ? ref.active : true;
    if(p.level == null) p.level = 1;
    if(!p.training) p.training = { hp:0, sp:0, atk:0, def:0 };
  });
  validateAllMaps(); // v0.48：載入時檢查所有戰場地圖，不合格的寫進console，且該場戰鬥拒絕開戰
  renderNav();
  switchView('chapters');
  initVersionTag();
  initUnitInspectorModal();
  initBattleOverlayModals();
}
init();

/* ============================================================
   版本紀錄彈窗（隱藏版本號觸發）
============================================================ */
/* ============================================================
   UNIT INSPECTOR（v0.33新增，測試用）
   顯示戰場上所有單位的即時數值(effectiveStat後的結果，含被動/buff疊加)、技能、被動，
   被動額外標「生效中/未生效」方便debug條件判斷對不對。開著的時候renderGrid()每次都會
   連帶重繪這裡，讓面板跟著戰鬥進度即時更新，不用自己手動重開視窗
============================================================ */
function toggleUnitInspector(){
  const modal = document.getElementById('unitInspectorModal');
  if(!modal) return;
  const opening = !modal.classList.contains('show');
  if(battle) battle.inspectorFocusUnit = null; // 右上角icon開的一律是「全部單位」清單，跟單點chip的聚焦狀態分開
  playSound(opening ? UI_SFX.panelOpen : UI_SFX.panelClose);
  modal.classList.toggle('show');
  if(opening) renderUnitInspector();
}
// v0.39新增：點戰場上的單位chip觸發，只看那一個單位的「生物檢視」卡片(跟右上角icon的全部清單共用同一個modal)
function openUnitInspectorFor(u){
  if(!battle) return;
  battle.inspectorFocusUnit = u;
  const modal = document.getElementById('unitInspectorModal');
  if(!modal) return;
  if(!modal.classList.contains('show')) playSound(UI_SFX.panelOpen); // 已經開著、只是切換聚焦單位就不重播開啟音
  modal.classList.add('show');
  renderUnitInspector();
}
// v0.39新增：battle.inspectorFocusUnit有值時只顯示那一個單位(「生物檢視」，點單位chip開的)，
// 沒值時維持原本「全部單位」清單(右上角icon開的，測試用)。兩者共用同一個modal跟同一套卡片排版，
// 差別只在要跑迴圈的units陣列是1筆還是全部，卡片內容(HP/屬性/技能/被動/狀態)完全共用不用另外寫一份。
function renderUnitInspector(){
  const modal = document.getElementById('unitInspectorModal');
  const body = document.getElementById('unitInspectorModalBody');
  const titleEl = document.getElementById('unitInspectorModalTitle');
  if(!modal || !body || !modal.classList.contains('show') || !battle) return;
  const focus = battle.inspectorFocusUnit;
  const units = focus ? [focus] : battle.allies.concat(battle.enemies);
  if(titleEl) titleEl.textContent = focus ? `生物檢視：${focus.name}` : '狀態（測試用）';
  body.innerHTML = units.map(u=>{
    // v0.43修正：9個屬性逐項全名→ 3組「物/元/神」各寫「攻擊/防禦/格擋」的5/5/5縮寫，敵人沒設定的系統本來就是0，直接顯示0即可不用另外判斷
    const statLine = STAT_GROUPS.map(g => `${g.label} ${g.keys.map(k=>effectiveStat(u,k)).join('/')}`).join('　');
    // v0.43新增：TP/SP(技能資源)比照側邊欄HP那行的做法，跟在HP後面顯示，resName==='-'代表這個單位沒有設定資源，直接省略不寫
    const hpLine = `HP ${u.hp}/${u.maxHp}${u.resName!=='-'?` · ${u.resName} ${u.res}/${u.resMax}`:''}`;
    const skillNames = (u.skills||[]).map(k => (SKILL_DB[k]&&SKILL_DB[k].name) || k).join('、') || '（無）';
    const passiveIds = getUnitPassiveIds(u);
    const passiveLines = passiveIds.length ? passiveIds.map(pid=>{
      const pdef = PASSIVE_DB[pid];
      if(!pdef) return `${pid}（找不到資料）`;
      const active = evaluatePassiveCondition(u, pdef.condition);
      return `${pdef.name}（${active ? '生效中' : '未生效'}）`;
    }).join('、') : '（無）';
    const statusLines = (u.statuses||[]).length ? u.statuses.map(s=>{
      const sdef = STATUS_DB[s.key];
      const name = (sdef && sdef.name) || s.key;
      const kind = s.value >= 0 ? 'buff' : 'debuff';
      const remain = s.duration ? `剩${s.duration.remaining}回合` : '';
      return `${name}(${kind}${s.value>=0?'+':''}${s.value}・${remain})`;
    }).join('、') : '（無）';
    return `<div style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border-dim,#3a3a3a);">
      <div style="font-size:13px;font-weight:600;color:var(--gold-bright);">${u.name}（${u.side==='ally'?'我方':'敵方'}）${u.hp<=0?' — 已倒下':''}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${hpLine}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${statLine}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">技能：${skillNames}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">被動：${passiveLines}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">狀態：${statusLines}</div>
    </div>`;
  }).join('');
}

/* v0.35新增：行動面板(actionModal)／戰報(logModal) 這兩個新的overlay，
   關閉方式(右上✕、點背景)跟changelogModal/unitInspectorModal共用同一套modal-overlay慣例。
   actionModal額外要把battle.actionPanelOpen同步設回false，不然手動關閉後旗標仍是true，
   下次renderGrid()還是會誤判成「面板開著、網格鎖定」。
   v0.40修正：這裡改成呼叫syncActionModal()而不是自己手動toggle class，
   確保跟icon手動開關(toggleActionPanel)走同一條路、同樣會補renderGrid()解鎖網格 */
function initBattleOverlayModals(){
  const actionModal = document.getElementById('actionModal');
  const closeAction = ()=>{ if(battle) battle.actionPanelOpen = false; syncActionModal(); };
  document.getElementById('actionModalClose').onclick = closeAction;
  actionModal.onclick = (e)=>{ if(e.target === actionModal) closeAction(); };

  const logModal = document.getElementById('logModal');
  const closeLog = ()=>{
    if(logModal.classList.contains('show')) playSound(UI_SFX.panelClose); // 已經是關的就不重播
    logModal.classList.remove('show');
  };
  document.getElementById('logModalClose').onclick = closeLog;
  logModal.onclick = (e)=>{ if(e.target === logModal) closeLog(); };
}
function initUnitInspectorModal(){
  const modal = document.getElementById('unitInspectorModal');
  const closeModal = ()=>{
    if(modal.classList.contains('show')) playSound(UI_SFX.panelClose);
    modal.classList.remove('show'); if(battle) battle.inspectorFocusUnit = null;
  };
  document.getElementById('unitInspectorModalClose').onclick = closeModal;
  modal.onclick = (e)=>{ if(e.target === modal) closeModal(); };
}
function initVersionTag(){
  // v0.47：changelog彈窗已移除，版本號只是純顯示（不可點擊）
  const tag = document.getElementById('versionTag');
  if(tag) tag.textContent = GAME_VERSION;
}

/* ============================================================
   【v0.48】自動測試入口（只有網址帶 ?test 才會開放，一般遊玩不受影響）
   window.__SRPG.runAuto('goblin_patrol',{roundCap:60}) → Promise，我方也由AI操控，跑到分出勝負/膠著為止。
============================================================ */
if(/[?&]test(=|&|$)/.test(location.search)){
  window.__SRPG = {
    get battle(){ return battle; }, get state(){ return state; }, B3D, validateAllMaps, BATTLE_MAPS, BATTLES, ENEMY_TEMPLATES, TERRAIN_DB, getBattleMap, validateMapDef, parseMapDef,
    runAuto(key, o){ return new Promise(res=>{ const ok = startBattle(key, null, Object.assign({}, o, { test:true, auto:true, onEnd:res })); if(!ok) res({ result:'error', key }); }); },
  };
}

})();
