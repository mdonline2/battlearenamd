/* ---- 連鎖閃電:電最近的敵人後,持續跳向「上一個被電到的目標」附近最近的下一個未命中目標 ---- */
function buildChainBoltPoints(x1, y1, x2, y2) {
  const pts = [[x1, y1]];
  const segs = 5;
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    pts.push([x1 + (x2 - x1) * t + (Math.random() - 0.5) * 18, y1 + (y2 - y1) * t + (Math.random() - 0.5) * 18]);
  }
  pts.push([x2, y2]);
  return pts;
}
function triggerChainLightning() {
  const cfg = WEAPON_CONFIG.chain;
  const px = player.x + player.w/2, py = player.y + player.h/2;
  const dmg = getChainDamage();
  const maxChain = getChainTotalCount();

  let current = findNearestEnemyOrBoss(px, py);
  if (!current) return;
  const startD = Math.hypot(current.target.x + current.target.w/2 - px, current.target.y + current.target.h/2 - py);
  if (startD > cfg.radius) return;

  const hitSet = new Set();
  let fromX = px, fromY = py;
  for (let i = 0; i < maxChain && current; i++) {
    const t = current.target;
    const tx = t.x + t.w/2, ty = t.y + t.h/2;
    t.hp -= dmg;
    t.hitFlash = 8;
    playSfxById(current.isBoss ? 's052' : 's051');
    spawnFxEffect('chain', fromX, fromY, { points: buildChainBoltPoints(fromX, fromY, tx, ty) });
    spawnHitParticles(tx, ty, EFFECT_CONFIG.chain.boltColor);
    spawnDamageNumber(t.x + t.w/2, t.y, dmg, current.isBoss);
    trySpeak(t, 'hurt', current.isBoss);
    hitSet.add(t);
    fromX = tx; fromY = ty;

    let next = null, bestD = Infinity;
    enemies.forEach(e => {
      if (hitSet.has(e)) return;
      const d = Math.hypot(e.x + e.w/2 - fromX, e.y + e.h/2 - fromY);
      if (d <= cfg.chainRadius && d < bestD) { bestD = d; next = { target: e, isBoss: false }; }
    });
    if (boss && !hitSet.has(boss)) {
      const d = Math.hypot(boss.x + boss.w/2 - fromX, boss.y + boss.h/2 - fromY);
      if (d <= cfg.chainRadius && d < bestD) { next = { target: boss, isBoss: true }; }
    }
    current = next;
  }
}

/* ---- 彈射球:朝最近敵人射出,命中後依AABB重疊軸反射(入射角=反射角),彈射次數用完後最後一擊消失 ---- */

  projectiles.push({
    x: px - cfg.width/2, y: py - cfg.height/2,
    vx: Math.cos(ang) * cfg.speed, vy: Math.sin(ang) * cfg.speed,
    w: cfg.width, h: cfg.height, damage: dmg,

}

/* =========================================================
   Enemies
   ========================================================= */
// 依目前地圖型態算出一個生成座標(捲動地圖在攝影機範圍外一小段距離;固定地圖在畫面左右外側)
function pickSpawnPoint() {
  let x, y;
  if (isScrollMap()) {
    const worldW = currentMap.worldW, worldH = currentMap.worldH;
    if (Math.random() < 0.5) {
      const side = Math.random() < 0.5 ? -1 : 1;
      x = side === -1 ? camera.x - 30 : camera.x + W + 30;
      y = camera.y + 60 + Math.random() * (H - 120);
    } else {
      const side = Math.random() < 0.5 ? -1 : 1;
      x = camera.x + 60 + Math.random() * (W - 120);
      y = side === -1 ? camera.y - 30 : camera.y + H + 30;
    }
    x = clamp(x, -30, worldW + 30);
    y = clamp(y, -30, worldH + 30);
  } else {
    const side = Math.random() < 0.5 ? -1 : 1;
    x = side === -1 ? -30 : W + 30;
    y = 100 + Math.random() * 300;
  }
  return { x, y };
}
// 生成當下讀取全域強度等級並定格為spawnLevel,套用HP/速度/判定框放大倍率;記錄殲滅圖鑑遭遇
function spawnEnemyOfType(typeKey) {
  const base = ENEMY_BASE_STATS[typeKey];
  const level = getEnemyPowerLevel();
  const scale = enemyLevelScale(level);
  const { x, y } = pickSpawnPoint();
  const e = {
    x, y,
    w: base.w * scale.sizeMult, h: base.h * scale.sizeMult,
    hp: Math.round(base.hp * scale.hpMult), maxHp: Math.round(base.hp * scale.hpMult),
    speed: (base.speedMin + Math.random() * (base.speedMax - base.speedMin)) * scale.speedMult,
    dmgMult: scale.dmgMult,
    touchCooldown: 0,
    hitFlash: 0,
    type: typeKey,
    spawnLevel: level,
    spoken: false,
  };
  if (typeKey === 'ranged') e.shootTimer = Math.floor(Math.random() * base.shootInterval);
  enemies.push(e);
  bestiaryRecordEncounter(typeKey);
  return e;
}
function spawnGrunt() { return spawnEnemyOfType('grunt'); }
function spawnRusher() { return spawnEnemyOfType('rusher'); }
function spawnRanged() { return spawnEnemyOfType('ranged'); }
function spawnSplitter() { return spawnEnemyOfType('splitter'); }
// splitter死亡時原地生成2隻rusher,固定給基礎等級(spawnLevel=0),避免後期splitter一死就雪球式失控
function splitOnDeath(deadEnemy) {
  for (let i = 0; i < 2; i++) {
    const base = ENEMY_BASE_STATS.rusher;
    const scale = enemyLevelScale(0);
    const angle = Math.PI * i + Math.random() * 0.6;
    enemies.push({
      x: deadEnemy.x + Math.cos(angle) * 10, y: deadEnemy.y + Math.sin(angle) * 10,
      w: base.w * scale.sizeMult, h: base.h * scale.sizeMult,
      hp: Math.round(base.hp * scale.hpMult), maxHp: Math.round(base.hp * scale.hpMult),
      speed: (base.speedMin + Math.random() * (base.speedMax - base.speedMin)) * scale.speedMult,
      dmgMult: scale.dmgMult,
      touchCooldown: 0, hitFlash: 0,
      type: 'rusher', spawnLevel: 0, spoken: false,
    });
  }
  bestiaryRecordEncounter('rusher');
}
// 出怪節奏:場上(不含boss)數量 < ACTIVE_ENEMY_CAP 時持續補新的,不再等前一波全滅
const SPAWN_WEIGHT_POOL = [
  { type: 'grunt', weight: 55 },
  { type: 'rusher', weight: 20 },
  { type: 'ranged', weight: 12 },
  { type: 'splitter', weight: 13 },
];
function pickSpawnType() {
  const total = SPAWN_WEIGHT_POOL.reduce((s, w) => s + w.weight, 0);
  let r = Math.random() * total;
  for (const w of SPAWN_WEIGHT_POOL) { if ((r -= w.weight) <= 0) return w.type; }
  return 'grunt';
}
function trySpawnEnemies() {
  if (enemies.length >= ACTIVE_ENEMY_CAP) return;
  enemySpawnTimer--;
  if (enemySpawnTimer <= 0) {
    spawnEnemyOfType(pickSpawnType());
    enemySpawnTimer = ENEMY_SPAWN_INTERVAL;
  }
}
function startBoss() {
  bossActive = true;
  document.getElementById('bossBox').style.display = 'block';
  const bossX = isScrollMap() ? camera.x + W/2 - 30 : W/2 - 30;
  const bossY = isScrollMap() ? camera.y + 80 : 80;
  boss = {
    x: bossX, y: bossY, w: 60, h: 60,
    hp: 260, maxHp: 260,
    speed: 1.6,
    phase: 'chase',
    phaseTimer: 0,
    telegraph: null,
    slamHitbox: null,
    hitFlash: 0,
    spoken: false,
    type: 'boss',
    spawnLevel: getEnemyPowerLevel(),
  };
  bestiaryRecordEncounter('boss');
  showCenterMsg('BOSS 出現！', 1800);
}
function showCenterMsg(text, duration) {
  const el = document.getElementById('centerMsg');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(showCenterMsg._t);
  showCenterMsg._t = setTimeout(() => { el.style.display = 'none'; }, duration);
}

function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 6; i++) {
    particles.push({ x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 20, color });

}

/* =========================================================
   武器特效系統(fxEffects):跟傷害邏輯完全分離,純粹負責畫面呈現
   type: 'thunder' | 'melee' | 'explosion',每種類型有自己的畫法(見 drawFxEffects)
   視覺參數統一讀 EFFECT_CONFIG,不要在這裡寫死顏色/數字
   ========================================================= */
function spawnFxEffect(type, x, y, extra) {
  const cfg = EFFECT_CONFIG[type];
  const eff = Object.assign({ type, x, y, life: cfg.duration, maxLife: cfg.duration }, extra || {});
  fxEffects.push(eff);
}

// 產生一條從天而降到 (tx,ty) 的閃電折線,回傳座標陣列供繪製使用
function buildThunderBoltPoints(tx, ty) {
  const pts = [[tx, ty - 220]];
  let y = ty - 220;
  while (y < ty - 12) {
    y += 16 + Math.random() * 10;
    pts.push([tx + (Math.random() - 0.5) * 26, Math.min(y, ty)]);
  }
  pts.push([tx, ty]);
  return pts;
}

function updateFxEffects() {
  fxEffects.forEach(e => { e.life--; });
  fxEffects = fxEffects.filter(e => e.life > 0);
}

// 傷害數字浮字:往上飄+淡出,Boss傷害用大字+橘色,一般敵人用白字;x座標微幅隨機避免多筆完全重疊
function spawnDamageNumber(x, y, amount, isBoss) {
  damageNumbers.push({
    x: x + (Math.random() - 0.5) * 10,
    y,
    vy: -0.8,
    life: 36, maxLife: 36,
    amount: Math.floor(amount),
    isBoss: !!isBoss,
  });
}

/* =========================================================
   Update
   ========================================================= */
let frameCount = 0;

function update() {
  frameCount++;

  if (keys['z_down']) { autoModeOn = !autoModeOn; updateAutoModeIndicator(); keys['z_down'] = false; }

  if (gameState === 'transition') { updateBattleTransition(); return; }
  if (gameState === 'gameover' || gameState === 'victory') {
    if (keys['c']) backToMenu();
    return;
  }
  if (gameState === 'reward') { updateRewardFx(); return; } // 獎勵特效(紙花/煙火/滑入/拉霸)在暫停中仍要推進,所以獨立於下面的playing判斷之外
  if (gameState !== 'playing') return;

  if (keys['escape_down']) { keys['escape_down'] = false; backToMenu(); return; } // 除錯用快捷鍵:直接跳回準備室,不結算本局資源

  elapsedFrames++;
  document.getElementById('waveInfo').textContent = formatElapsedTime(elapsedFrames);
  wave = 1 + getEnemyPowerLevel(); // wave不再依賴「全滅前一波」遞增,改跟全域強度等級同步,只用於EXP計算(getKillExp)與boss觸發門檻
  trySpawnEnemies(); // 出怪節奏:場上數量<上限就持續補新的,不等前一波全滅

  Object.keys(player.buffs).forEach(k => {
    player.buffs[k].timeLeft--;
    if (player.buffs[k].timeLeft <= 0) delete player.buffs[k];
  });
  Object.keys(player.weaponBuffs).forEach(k => {
    player.weaponBuffs[k].timeLeft--;
    if (player.weaponBuffs[k].timeLeft <= 0) delete player.weaponBuffs[k];
  });

  if (keys['1_down']) { useItem(0); keys['1_down'] = false; }
  if (keys['2_down']) { useItem(1); keys['2_down'] = false; }
  if (keys['3_down']) { useItem(2); keys['3_down'] = false; }

  let dx = 0, dy = 0, touchMoving = false;
  if (Math.abs(touchDirX) > 0.001 || Math.abs(touchDirY) > 0.001) {
    dx = touchDirX; dy = touchDirY; touchMoving = true;
    if (dx < -0.1) player.facing = -1;
    if (dx > 0.1) player.facing = 1;
  } else {
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) { dx -= 1; player.facing = -1; }
    if (keys['d'] || keys['arrowright']) { dx += 1; player.facing = 1; }
  }
  const rawLen = Math.hypot(dx, dy);
  const len = rawLen || 1;
  const spd = (player.dashing > 0 ? player.baseSpeed * 3 : player.baseSpeed) * getMoveSpeedMultiplier();
  const moveScale = touchMoving ? Math.min(1, rawLen) : 1; // 搖桿可以半推減速(類比控制),鍵盤維持原本全速
  moveWithCollision(player, (dx/len)*spd*moveScale, (dy/len)*spd*moveScale, obstacles);
  if (isScrollMap()) {
    player.x = clamp(player.x, 10, currentMap.worldW - player.w - 10);
    player.y = clamp(player.y, 10, currentMap.worldH - player.h - 10);
  } else {
    player.x = clamp(player.x, 10, W - player.w - 10);
    player.y = clamp(player.y, 10, H - player.h - 10);
  }
  updateCamera();

  if (player.dashCooldown > 0) player.dashCooldown--;
  if (player.dashing > 0) { player.dashing--; player.invuln = Math.max(player.invuln, 2); }
  if ((keys['k'] || touchDashHeld) && player.dashCooldown === 0 && player.dashing === 0) {
    player.dashing = 8; player.dashCooldown = 45; player.invuln = 10;
  }

  // 近戰攻擊 —— 已裝備制式軍刀時全自動觸發(不需按鍵),沿用現有面向判定
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.attacking > 0) player.attacking--;
  if (player.equippedWeapons.includes('melee') && player.attackCooldown === 0 && player.attacking === 0) {
    player.attacking = player.baseAttackDur;
    player.attackCooldown = getAttackCooldownFrames();
    player.hitThisSwing = new Set();
    spawnFxEffect('melee', player.x + player.w/2, player.y + player.h/2, { facing: player.facing, range: getMeleeTotalRange() });
  }
  if (player.invuln > 0) player.invuln--;

  if (player.attacking > 0) {
    const hb = playerAttackHitbox();
    const dmg = getMeleeDamage();
    enemies.forEach((e, i) => {
      if (!player.hitThisSwing.has(i) && rectsOverlap(hb, e)) {
        e.hp -= dmg;
        e.hitFlash = 8;
        playSfxById('s051');
        player.hitThisSwing.add(i);
        spawnHitParticles(e.x + e.w/2, e.y + e.h/2, '#ffd93d');
        spawnDamageNumber(e.x + e.w/2, e.y, dmg, false);
        screenShake = 4;
        trySpeak(e, 'hurt', false);
      }
    });
    if (boss && rectsOverlap(hb, boss) && !player.hitThisSwing.has('boss')) {
      boss.hp -= dmg;
      boss.hitFlash = 8;
      playSfxById('s052');
      player.hitThisSwing.add('boss');
      spawnHitParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#ffd93d');
      spawnDamageNumber(boss.x + boss.w/2, boss.y, dmg, true);
      screenShake = 6;
      trySpeak(boss, 'hurt', true);
    }
  }

  // 聚能雷射 —— 已裝備時全自動觸發(不需按 L),沿用現有雙向面向判定
  if (player.laserCooldown > 0) player.laserCooldown--;
  if (player.equippedWeapons.includes('laser') && player.laserCooldown === 0) {
    fireLaserPair('skill');
    player.laserCooldown = Math.round(WEAPON_CONFIG.laser.cooldown * player.levelCooldownMult * getWeaponLevelMult('laser').cdMult);
  }

  // 環域衝擊 —— 已裝備時視為永久生效,跟撿到道具的臨時效果(auraActive)分開計時
  if (player.equippedWeapons.includes('aura')) {
    player.auraCooldown--;
    if (player.auraCooldown <= 0) {
      player.auraCooldown = Math.round(WEAPON_CONFIG.aura.interval * player.levelCooldownMult * getWeaponLevelMult('aura').cdMult);
      triggerAuraPulse();
    }
  }

  // 尾隨炸藥 —— 已裝備時每隔固定冷卻在身後放置一顆,延遲後原地引爆
  if (player.equippedWeapons.includes('dynamite')) {
    if (player.dynamiteCooldown > 0) player.dynamiteCooldown--;
    if (player.dynamiteCooldown <= 0) {
      dropDynamite();
      player.dynamiteCooldown = Math.round(WEAPON_CONFIG.dynamite.cooldown * player.levelCooldownMult * getWeaponLevelMult('dynamite').cdMult);
    }
  }

  // 迴力鏢 —— 已裝備時每隔冷卻朝面向丟出一枚,飛行中會轉向,命中或超時就消失
  if (player.equippedWeapons.includes('boomerang')) {
    if (player.boomerangCooldown > 0) player.boomerangCooldown--;
    if (player.boomerangCooldown <= 0) {
      throwBoomerang();
      player.boomerangCooldown = Math.round(WEAPON_CONFIG.boomerang.cooldown * player.levelCooldownMult * getWeaponLevelMult('boomerang').cdMult);
    }
  }

  // 閃電雷雲 —— 已裝備時每隔冷卻,在周遭半徑內隨機挑一個敵人直接劈中(無彈道、無延遲)
  if (player.equippedWeapons.includes('thunder')) {
    player.thunderCooldown--;
    if (player.thunderCooldown <= 0) {
      player.thunderCooldown = Math.round(WEAPON_CONFIG.thunder.interval * player.levelCooldownMult * getWeaponLevelMult('thunder').cdMult);
      triggerThunderStrike();
    }
  }

  // ===== 以下5把為特效測試武器,觸發邏輯比照現有武器(冷卻歸零就發動+重算冷卻) =====
  if (player.equippedWeapons.includes('homing')) {
    if (player.homingCooldown > 0) player.homingCooldown--;
    if (player.homingCooldown <= 0) {
      fireHomingProjectile();
      player.homingCooldown = Math.round(WEAPON_CONFIG.homing.cooldown * player.levelCooldownMult * getWeaponLevelMult('homing').cdMult);
    }
  }
  if (player.equippedWeapons.includes('pierce')) {
    if (player.pierceCooldown > 0) player.pierceCooldown--;
    if (player.pierceCooldown <= 0) {
      firePierceBeam();
      player.pierceCooldown = Math.round(WEAPON_CONFIG.pierce.cooldown * player.levelCooldownMult * getWeaponLevelMult('pierce').cdMult);
    }
  }
  if (player.equippedWeapons.includes('poison')) {
    if (player.poisonCooldown > 0) player.poisonCooldown--;
    if (player.poisonCooldown <= 0) {
      dropPoisonZone();
      player.poisonCooldown = Math.round(WEAPON_CONFIG.poison.cooldown * player.levelCooldownMult * getWeaponLevelMult('poison').cdMult);
    }
  }
  if (player.equippedWeapons.includes('chain')) {
    player.chainCooldown--;
    if (player.chainCooldown <= 0) {
      player.chainCooldown = Math.round(WEAPON_CONFIG.chain.interval * player.levelCooldownMult * getWeaponLevelMult('chain').cdMult);
      triggerChainLightning();
    }
  }
  if (player.equippedWeapons.includes('bounce')) {
    if (player.bounceCooldown > 0) player.bounceCooldown--;
    if (player.bounceCooldown <= 0) {
      fireBounceBall();
      player.bounceCooldown = Math.round(WEAPON_CONFIG.bounce.cooldown * player.levelCooldownMult * getWeaponLevelMult('bounce').cdMult);
    }
  }
  updatePoisonZones();


  // 自動攻擊道具(未裝備聚能雷射時的臨時代打效果)
  if (player.autoAttack) {
    player.autoAttack.timeLeft--;
    player.autoAttack.timer++;
    if (player.autoAttack.timer >= getAutoItemInterval()) {
      player.autoAttack.timer = 0;
      fireLaserPair('auto');
    }
    if (player.autoAttack.timeLeft <= 0) player.autoAttack = null;
  }

  // 圓形光環道具(未裝備環域衝擊時的臨時代打效果)
  if (player.auraActive) {
    player.auraActive.timeLeft--;
    player.auraActive.timer++;
    if (player.auraActive.timer >= WEAPON_CONFIG.aura.interval) {
      player.auraActive.timer = 0;
      triggerAuraPulse();
    }
    if (player.auraActive.timeLeft <= 0) player.auraActive = null;
  }

  updateProjectiles();
  updateBombs();
  updateBoomerangs();
  updateOrbs();

  auraPulses.forEach(p => { p.r += (p.maxR - 4) / 20; p.life--; });
  auraPulses = auraPulses.filter(p => p.life > 0);
  updateFxEffects();

  // 道具拾取
  groundItems = groundItems.filter(it => {
    if (rectsOverlap(player, it)) { pickupItem(it); return false; }
    return true;
  });

  // 寶箱拾取(除錯室測試用):撞到直接開,不進道具欄
  chests = chests.filter(c => {
    if (rectsOverlap(player, c)) { openChest(c); return false; }
    return true;
  });

  // 敵人 AI
  enemies.forEach(e => {
    if (!e.spoken) { trySpeak(e, 'spot', false); e.spoken = true; }
    if (e.hitFlash > 0) e.hitFlash--;
    if (e.touchCooldown > 0) e.touchCooldown--;
    const behavior = (ENEMY_TYPE_META[e.type] || ENEMY_TYPE_META.grunt).behavior;

    if (behavior === 'keep_distance_shoot') {
      // ranged:進入射程就定點站樁發射彈道,不主動後退;超出射程才繼續靠近(單純站樁版本,先上線看手感)
      const base = ENEMY_BASE_STATS.ranged;
      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > base.shootRange) {
        const ang = Math.atan2(dy, dx);
        moveWithCollision(e, Math.cos(ang) * e.speed, Math.sin(ang) * e.speed, obstacles);
      }
      e.shootTimer--;
      if (e.shootTimer <= 0 && dist <= base.shootRange * 1.4) {
        const ang = Math.atan2(dy, dx);
        enemyProjectiles.push({
          x: e.x + e.w / 2, y: e.y + e.h / 2,
          vx: Math.cos(ang) * base.projectileSpeed, vy: Math.sin(ang) * base.projectileSpeed,
          w: 8, h: 8, damage: base.projectileDamage * e.dmgMult, life: 180,
        });
        e.shootTimer = base.shootInterval;
        trySpeak(e, 'attack', false);
      }
    } else {
      // direct_chase(grunt/rusher/splitter共用):直線衝向玩家,純數值變體
      const ang = Math.atan2(player.y - e.y, player.x - e.x);
      moveWithCollision(e, Math.cos(ang) * e.speed, Math.sin(ang) * e.speed, obstacles);
    }

    if (rectsOverlap(e, player) && e.touchCooldown === 0 && player.invuln === 0) {
      if (!DEBUG_INVINCIBLE) player.hp -= applyResist(8 * e.dmgMult, player.resist.slash); // 雜兵碰撞傷害算劈砍屬性,隨強度等級縮放;除錯室無敵開啟時跳過扣血但特效音效照常
      e.touchCooldown = 40;
      screenShake = 6;
      spawnHitParticles(player.x + player.w/2, player.y + player.h/2, '#ff4d4d');
      trySpeak(e, 'attack', false);
      updatePortrait();
    }
    if (Math.random() < DIALOGUE_CONFIG.idleChatChance) trySpeak(e, 'idle', false);
  });

  // ranged敵人彈道更新:命中玩家扣血、超出存續時間銷毀
  enemyProjectiles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  enemyProjectiles = enemyProjectiles.filter(p => {
    if (p.life <= 0) return false;
    if (player.invuln === 0 && rectsOverlap(p, player)) {
      if (!DEBUG_INVINCIBLE) player.hp -= applyResist(p.damage, player.resist.pierce || player.resist.slash);
      player.invuln = 20;
      screenShake = 4;
      spawnHitParticles(player.x + player.w/2, player.y + player.h/2, '#60a5fa');
      updatePortrait();
      return false;
    }
    return true;
  });

  enemies = enemies.filter(e => {
    if (e.hp <= 0) {
      spawnHitParticles(e.x + e.w/2, e.y + e.h/2, '#ff8c42');
      trySpeak(e, 'death', false);
      if (Math.random() < ITEM_DROP_CHANCE) spawnGroundItem(e.x, e.y);
      spawnRunOrbs(e.x + e.w/2, e.y + e.h/2, false);
      bestiaryRecordKill(e.type);
      if ((ENEMY_TYPE_META[e.type] || {}).behavior === 'split_on_death') splitOnDeath(e);
      return false;
    }
    return true;
  });

  // Boss觸發:改依全域強度等級門檻,不再需要等場上雜兵全滅;boss出現時雜兵補怪照常繼續,不暫停
  if (!bossActive && !boss && getEnemyPowerLevel() >= nextBossLevel) {
    startBoss();
  }

  if (boss) {
    if (!boss.spoken) { trySpeak(boss, 'spot', true); boss.spoken = true; }
    if (boss.hitFlash > 0) boss.hitFlash--;
    boss.phaseTimer++;

    if (boss.phase === 'chase') {
      const ang = Math.atan2(player.y + player.h/2 - (boss.y+boss.h/2), player.x + player.w/2 - (boss.x+boss.w/2));
      boss.x += Math.cos(ang) * boss.speed;
      boss.y += Math.sin(ang) * boss.speed;
      if (boss.phaseTimer > 90) {
        boss.phase = 'telegraph';
        boss.phaseTimer = 0;
        boss.telegraph = { x: player.x - 20, y: player.y - 20, w: 64, h: 64 };
      }
      if (rectsOverlap(boss, player) && player.invuln === 0) {
        if (!DEBUG_INVINCIBLE) player.hp -= 6; // 追擊碰撞傷害,目前不算屬性傷害;除錯室無敵開啟時跳過扣血
        player.invuln = 30;
        screenShake = 6;
        trySpeak(boss, 'attack', true);
        updatePortrait();
      }
    } else if (boss.phase === 'telegraph') {
      if (boss.phaseTimer > 45) {
        boss.phase = 'slam';
        boss.phaseTimer = 0;
        boss.slamHitbox = { ...boss.telegraph };
        screenShake = 10;
        trySpeak(boss, 'attack', true);
      }
    } else if (boss.phase === 'slam') {
      if (boss.phaseTimer === 1 && player.invuln === 0 && rectsOverlap(boss.slamHitbox, player)) {
        if (!DEBUG_INVINCIBLE) player.hp -= applyResist(22, player.resist.slash); // Boss重擊算劈砍屬性;除錯室無敵開啟時跳過扣血
        player.invuln = 40;
        screenShake = 14;
        spawnHitParticles(player.x + player.w/2, player.y + player.h/2, '#ff4d4d');
        updatePortrait();
      }
      if (boss.phaseTimer > 20) {
        boss.phase = 'chase'; boss.phaseTimer = 0; boss.slamHitbox = null;
      }
    }

    if (boss.hp <= 0 && gameState === 'playing') {
      trySpeak(boss, 'death', true);
      bestiaryRecordKill('boss');
      grantBossRewards();
      if (DEBUG_ENDLESS) {
        // 除錯室無限模式:不結算勝利,清空Boss+重置波數,讓一般雜兵刷新迴圈重新循環測試耐久
        boss = null;
        bossActive = false;
        nextBossLevel = getEnemyPowerLevel() + 3; // 下一次boss觸發門檻往後推3級(約90秒),避免立刻無縫重觸發
        document.getElementById('bossBox').style.display = 'none';
        showCenterMsg('⚠ 無限模式:Boss已重置,繼續測試中', 1200);
      } else {
        gameState = 'victory';
        commitRunCurrency();
        showCenterMsg('勝利！Boss 已擊敗 —— 本局獲得 💰' + player.runGold + ' · 💎' + player.runCrystal + ' —— 按 C 回選單', 999999);
      }
    }
  }

  if (player.hp <= 0 && player.alive) {
    player.alive = false;
    gameState = 'gameover';
    commitRunCurrency();
    updatePortrait();
    showCenterMsg('你死了 —— 本局獲得 💰' + player.runGold + ' · 💎' + player.runCrystal + ' —— 按 C 回選單', 999999);
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
  damageNumbers.forEach(d => { d.y += d.vy; d.life--; });
  damageNumbers = damageNumbers.filter(d => d.life > 0);
  bubbles.forEach(b => b.life--);
  bubbles = bubbles.filter(b => b.life > 0);

  if (screenShake > 0) screenShake--;

  document.getElementById('playerFill').style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
  if (boss) document.getElementById('bossFill').style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';

  // 頂端EXP條:寬度=目前等級進度百分比,顏色隨百分比從淺水藍逐漸變濃(升級瞬間exp歸零,顏色自然跟著變淺,不用額外reset邏輯)
  const expPct = Math.max(0, Math.min(1, player.exp / expToNext(player.level)));
  document.getElementById('expBarFill').style.width = (expPct * 100) + '%';
  document.getElementById('expBarFill').style.background = expBarColor(expPct);
  document.getElementById('expLvText').textContent = 'Lv.' + player.level;
  document.getElementById('expFracText').textContent = player.exp + ' / ' + expToNext(player.level);
  document.getElementById('expRunCurrencyText').textContent = '💰' + player.runGold + ' 💎' + player.runCrystal;

  updateWeaponAndBuffIcons();

  for (let i = 0; i < 3; i++) {
    const slotEl = document.getElementById('slot' + i);
    const item = player.inventory[i];
    if (item) {
      const info = ITEM_INFO[item.type];
      slotEl.style.borderColor = info.color;
      slotEl.children[1].textContent = info.label;
    } else {
      slotEl.style.borderColor = '#555';
      slotEl.children[1].textContent = '-';
    }
  }
}

/* =========================================================
   Draw
   ========================================================= */
function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function wrapText(text, cx, y, maxWidth, lineHeight) {
  const chars = text.split('');
  let line = '', lines = [];
  chars.forEach(c => {
    if (ctx.measureText(line + c).width > maxWidth) { lines.push(line); line = c; }
    else line += c;
  });
  lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lineHeight));
}

// 安全繪製圖片:載入失敗或尚未完成時改畫色塊佔位,不會中斷畫面
function safeDrawImage(img, x, y, w, h, fallbackColor) {
  if (img && img.complete && img.naturalWidth > 0) {
    try {
      ctx.drawImage(img, x, y, w, h);
      return;
    } catch (err) {
      // 載入失敗時繼續往下畫佔位色塊
    }
  }
  drawPixelRect(x, y, w, h, fallbackColor || '#333');
}

function drawLobbyTabBar() {
  LOBBY_TAB_BUTTONS.forEach(b => {
    const active = b.key === lobbyTab;
    ctx.fillStyle = active ? 'rgba(74,222,128,0.2)' : 'rgba(255,255,255,0.05)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = active ? '#4ade80' : '#444';
    ctx.lineWidth = 1;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = active ? '#fff' : '#999';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2 + 4);
  });
  ctx.textAlign = 'left';
}

/* =========================================================
   共用Icon圖片系統 —— 武器庫 / 除錯室 / 檔案室 三個畫面共用同一套載入+繪製邏輯
   圖片規格慣例(美術之後補圖檔時請照這個規格做,檔名對上就會自動顯示,不用改任何程式碼):
     - 正方形PNG,建議原始尺寸 128x128px(ICON_IMAGE_SIZE),透明背景
     - 武器庫: images/weapon_{key}.png    key = WEAPON_KEYS 的值,例如 images/weapon_melee.png
     - 除錯室: images/debug_{id}.png     id  = DEBUG_TOGGLES 的 id,例如 images/debug_invincible.png
     - 檔案室: images/archive_{id}.png   id  = ARCHIVE_DOCS 的 id,例如 images/archive_sgt_mai.png
   圖檔目前都還沒放進 images/ 資料夾,三個畫面都會自動fallback成純色方塊(不會出現破圖圖示),
   純粹是先把讀取/繪製的框架建好,之後美術資源到位後直接把對應檔名的PNG丟進 images/ 就會自動換成真圖。
   ========================================================= */
const ICON_IMAGE_SIZE = 128; // 三個畫面共用的icon原始圖片建議尺寸(正方形,單位px),各畫面顯示時再各自縮放成格子大小
const iconImageCache = {}; // path -> { img: Image, loaded: bool, failed: bool },同一張圖只會建立一次Image物件

// 依路徑取得(或建立)一張icon圖片的載入狀態,呼叫端不用管圖片到底載入完成了沒,直接交給 drawIconOrFallback 處理
function getIconImage(path) {
  if (!iconImageCache[path]) {
    const entry = { img: new Image(), loaded: false, failed: false };
    entry.img.onload = () => { entry.loaded = true; };
    entry.img.onerror = () => { entry.failed = true; }; // 圖檔還沒放進去時會走這裡,不會噴錯也不會出現破圖圖示
    entry.img.src = path;
    iconImageCache[path] = entry;
  }
  return iconImageCache[path];
}

// 在畫布上畫一個icon:圖片已經載入成功就畫圖片(依w/h縮放,不裁切),否則畫fallbackColor純色方塊頂替
function drawIconOrFallback(path, x, y, w, h, fallbackColor) {
  const entry = getIconImage(path);
  if (entry.loaded && !entry.failed) {
    ctx.drawImage(entry.img, x, y, w, h);
  } else {
    drawPixelRect(x, y, w, h, fallbackColor);
  }
}

// Debug用:敵人頭上等級數字/顏色小球,兩者獨立開關,預設開,正式版理論上都會關閉
function drawEnemyLevelDebugMarks(e, hpBarX, hpBarY) {
  if (!DEBUG_SHOW_LEVEL_BADGE && !DEBUG_SHOW_LEVEL_DOT) return;
  const level = e.spawnLevel || 0;
  const color = enemyLevelColor(level);
  if (DEBUG_SHOW_LEVEL_DOT) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(e.x + e.w + 6, hpBarY - 2, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  if (DEBUG_SHOW_LEVEL_BADGE) {
    ctx.fillStyle = color;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(String(level), e.x + e.w / 2, hpBarY - 6);
    ctx.textAlign = 'left';
  }
}

// 武器圖示色塊(尚無美術圖前的佔位色)與簡易數值說明
const WEAPON_ICON_COLOR = { melee: '#e5e7eb', laser: '#7cf9ff', aura: '#38bdf8', dynamite: '#f97316', boomerang: '#facc15', thunder: '#c4b5fd', homing: '#fb7185', pierce: '#5eead4', poison: '#84cc16', chain: '#a78bfa', bounce: '#fbbf24' };
function weaponStatLine(key) {
  const cfg = WEAPON_CONFIG[key];
  const cd = cfg.cooldown !== undefined ? cfg.cooldown : cfg.interval;
  const baseTxt = cfg.baseDamage > 0 ? (' · 保底+' + cfg.baseDamage) : '';
  return '傷害x' + cfg.damageMultiplier + baseTxt + (cd !== undefined ? ' · 冷卻' + cd + '幀' : '');
}

// 秒數版數值行(武器庫底部說明欄專用):跟 weaponStatLine 內容一樣,只是冷卻/間隔換算成秒數顯示,60幀=1秒
function weaponStatLineSeconds(key) {
  const cfg = WEAPON_CONFIG[key];
  const cd = cfg.cooldown !== undefined ? cfg.cooldown : cfg.interval;
  const baseTxt = cfg.baseDamage > 0 ? (' · 傷害+' + cfg.baseDamage) : '';
  const cdTxt = cd !== undefined ? (' · 冷卻 ' + (cd / 60).toFixed(1) + 's') : '';
  return '傷害倍率 x' + cfg.damageMultiplier + baseTxt + cdTxt;
}
// 武器專屬特色標籤(給獎勵畫面「新武器」候選用,通用傷害/冷卻行之外再補一段這把武器獨有的屬性)
function weaponSpecialTag(key) {
  const cfg = WEAPON_CONFIG[key];
  if (key === 'melee') return '範圍' + cfg.range + 'px';
  if (key === 'aura') return '範圍半徑' + cfg.radius + 'px';
  if (key === 'dynamite') return '爆炸範圍' + cfg.radius + 'px';
  if (key === 'thunder') return '判定半徑' + cfg.radius + 'px';
  if (key === 'homing') return '自動追蹤';
  if (key === 'pierce') return '穿透不限次數';
  if (key === 'poison') return '持續' + (cfg.duration / 60).toFixed(1) + 's · 範圍' + cfg.radius + 'px';
  if (key === 'chain') return '連鎖' + getChainTotalCount() + '隻';
  if (key === 'bounce') return '彈射' + getBounceTotalCount() + '次';
  return '';
}

    const pad = Math.max(3, b.w * 0.14);
    drawIconOrFallback('images/debug_' + t.id + '.png', b.x + pad, b.y + pad, b.w - pad * 2, b.h - pad * 2 - 12, on ? '#555' : groupColor);

    const lines = String(t.label).split('\n');
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    lines.forEach((line, i) => {
      ctx.fillText(line, b.x + b.w/2, b.y + b.h - 6 - (lines.length - 1 - i) * 10);
    });

    if (on) {
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('✕', b.x + b.w - 3, b.y + 12);
      ctx.textAlign = 'center';
    }
  });

  drawDebugInfoPanel();
  ctx.textAlign = 'left';
}

// 除錯室底部固定說明欄:未選項目時顯示提示文字,選了項目後顯示「名稱/目前狀態/說明」三行
function drawDebugInfoPanel() {
  const panelTop = H - DEBUG_INFO_PANEL_HEIGHT;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, panelTop, W, DEBUG_INFO_PANEL_HEIGHT);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, panelTop, W, DEBUG_INFO_PANEL_HEIGHT);

  ctx.textAlign = 'center';
  const t = DEBUG_TOGGLES.find(x => x.id === debugInfoId);
  if (!t) {
    ctx.fillStyle = '#777';
    ctx.font = '12px monospace';
    ctx.fillText('點擊圖示查看說明', W / 2, panelTop + DEBUG_INFO_PANEL_HEIGHT / 2 + 4);
    return;
  }

  const on = isDebugToggleOn(t);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px monospace';
  ctx.fillText(String(t.label).replace('\n', ''), W / 2, panelTop + 24);

  ctx.fillStyle = on ? '#f87171' : '#4ade80';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(on ? '目前狀態:測試效果生效中' : '目前狀態:正常運作', W / 2, panelTop + 44);

  ctx.fillStyle = '#aaa';
  ctx.font = '10px monospace';
  const desc = DEBUG_TOGGLE_DESC[t.id] || '（尚無說明）';
  wrapCanvasText(desc, W - 80).forEach((line, i) => {
    ctx.fillText(line, W / 2, panelTop + 64 + i * 14);
  });
}

function drawGame() {
  ctx.save();
  if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);

  const scrolling = isScrollMap();
  ctx.save();
  if (scrolling) ctx.translate(-camera.x, -camera.y);

  ctx.fillStyle = '#16213e';
  if (scrolling) {
    ctx.fillRect(camera.x - 20, camera.y - 20, W + 40, H + 40);
  } else {
    ctx.fillRect(0, 0, W, H);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  const gStartX = scrolling ? Math.floor((camera.x-20)/40)*40 : 0;
  const gEndX = scrolling ? camera.x + W + 20 : W;
  const gStartY = scrolling ? Math.floor((camera.y-20)/40)*40 : 0;
  const gEndY = scrolling ? camera.y + H + 20 : H;
  for (let gx = gStartX; gx < gEndX; gx += 40) { ctx.beginPath(); ctx.moveTo(gx,gStartY); ctx.lineTo(gx,gEndY); ctx.stroke(); }
  for (let gy = gStartY; gy < gEndY; gy += 40) { ctx.beginPath(); ctx.moveTo(gStartX,gy); ctx.lineTo(gEndX,gy); ctx.stroke(); }

  if (scrolling) {
    // 世界邊界(讓玩家清楚看到大地圖的邊緣)
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, currentMap.worldW, currentMap.worldH);
    ctx.lineWidth = 1;
  }

  obstacles.forEach(o => {
    drawPixelRect(o.x, o.y, o.w, o.h, '#3a3a4a');
    drawPixelRect(o.x, o.y, o.w, 4, '#55556a');
    ctx.strokeStyle = '#222'; ctx.strokeRect(o.x, o.y, o.w, o.h);
  });

  groundItems.forEach(it => {
    const info = ITEM_INFO[it.type];
    drawPixelRect(it.x, it.y, it.w, it.h, info.color);
    ctx.strokeStyle = '#000'; ctx.strokeRect(it.x, it.y, it.w, it.h);
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(info.label, it.x + it.w/2, it.y - 4);
    ctx.textAlign = 'left';
  });

  // 寶箱(除錯室測試用):木箱色底+金色外框+問號,方便肉眼跟一般道具/敵人區分
  chests.forEach(c => {
    drawPixelRect(c.x, c.y, c.w, c.h, '#92400e');
    ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.strokeRect(c.x, c.y, c.w, c.h);
    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('?', c.x + c.w/2, c.y + c.h/2 + 4);
    ctx.textAlign = 'left';
  });

  if (boss && boss.phase === 'telegraph') {
    const t = boss.telegraph;
    ctx.fillStyle = 'rgba(255,60,60,' + (0.2 + 0.15*Math.sin(boss.phaseTimer*0.4)) + ')';
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.strokeStyle = '#ff3333'; ctx.strokeRect(t.x, t.y, t.w, t.h);
  }
  if (boss && boss.phase === 'slam' && boss.slamHitbox) {
    drawPixelRect(boss.slamHitbox.x, boss.slamHitbox.y, boss.slamHitbox.w, boss.slamHitbox.h, 'rgba(255,80,80,0.5)');
  }

  enemies.forEach(e => {
    const fallback = e.hitFlash > 0 ? '#ffffff' : (ENEMY_FALLBACK_COLOR[e.type] || '#c94d4d');
    drawIconOrFallback(getEnemySkinPath(e.type), e.x, e.y, e.w, e.h, fallback);
    if (e.hitFlash <= 0) {
      // 色塊佔位模式下畫兩個眼睛意思一下,之後補上正式skin圖就會被蓋掉,不影響
      drawPixelRect(e.x+4, e.y+6, 4, 4, '#000');
      drawPixelRect(e.x+e.w-8, e.y+6, 4, 4, '#000');
    }
    drawPixelRect(e.x, e.y-8, e.w, 4, '#000');
    drawPixelRect(e.x, e.y-8, e.w * Math.max(0, e.hp/e.maxHp), 4, '#ff6b6b');
    drawEnemyLevelDebugMarks(e, e.x, e.y - 8);
  });

  // ranged敵人彈道
  enemyProjectiles.forEach(p => {
    drawPixelRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h, '#60a5fa');
    drawPixelRect(p.x - 1, p.y - 1, 2, 2, '#fff');
  });

  if (boss) {
    const fallback = boss.hitFlash > 0 ? '#ffffff' : '#8b2fc9';
    drawIconOrFallback(getEnemySkinPath('boss'), boss.x, boss.y, boss.w, boss.h, fallback);
    if (boss.hitFlash <= 0) {
      drawPixelRect(boss.x+10, boss.y+14, 8, 8, '#000');
      drawPixelRect(boss.x+boss.w-18, boss.y+14, 8, 8, '#000');
    }
    drawEnemyLevelDebugMarks(boss, boss.x, boss.y - 8);
  }

  projectiles.forEach(p => {
    const color = p.source === 'auto' ? '#c084fc' : '#7cf9ff';
    drawPixelRect(p.x, p.y, p.w, p.h, color);
    drawPixelRect(p.x, p.y + p.h/2 - 1, p.w, 2, '#fff');
  });

  // 尾隨炸藥(引爆前 1 秒開始閃爍提示)
  // 地面毒圈(持續性範圍,半透明底色+邊框+浮動氣泡粒子)
  poisonZones.forEach(z => {
    const pCfg = EFFECT_CONFIG.poison;
    ctx.fillStyle = pCfg.fillColor;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = pCfg.ringColor; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.stroke();
    if (Math.random() < 0.3) {
      const ang = Math.random() * Math.PI * 2;
      const r = Math.random() * z.radius;
      particles.push({ x: z.x + Math.cos(ang) * r, y: z.y + Math.sin(ang) * r, vx: 0, vy: -0.6, life: 18, color: pCfg.bubbleColor });
    }
  });

  bombs.forEach(b => {
    const nearBoom = b.timer < 60 && Math.floor(b.timer / 6) % 2 === 0;
    drawPixelRect(b.x, b.y, b.w, b.h, nearBoom ? '#ff3b3b' : '#7c3f22');
    drawPixelRect(b.x + 4, b.y + 2, b.w - 8, 3, '#fbbf24');
  });

  // 迴力鏢
  boomerangs.forEach(b => {
    drawPixelRect(b.x, b.y, b.w, b.h, '#facc15');
    drawPixelRect(b.x + b.w/2 - 2, b.y + b.h/2 - 2, 4, 4, '#78350f');
  });

  // 經驗/資源掉落球(吸附式)
  orbs.forEach(o => {
    const c = RESOURCE_META[o.type].color;
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(o.x + o.w/2, o.y + o.h/2, o.w/2, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // 圓形擴散特效(目前只剩環域衝擊的光環用這組,炸藥爆炸已改用 fxEffects)
  auraPulses.forEach(p => {
    ctx.globalAlpha = clamp(p.life/20, 0, 1);
    ctx.strokeStyle = p.color || '#38bdf8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  drawFxEffects();

  const playerColor = player.invuln > 0 ? (Math.floor(player.invuln/3)%2===0 ? '#ffffff' : '#4ade80') : '#4ade80';
  drawPixelRect(player.x, player.y, player.w, player.h, playerColor);
  drawPixelRect(player.x + (player.facing===1?player.w-8:4), player.y+8, 4, 4, '#043');

  // 腳底小血條(跟畫布外那條主HP條分開,方便戰鬥中不用移開視線就能看到血量)
  {
    const barW = player.w, barH = 3, barY = player.y + player.h + 3;
    const pct = clamp(player.hp / player.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(player.x, barY, barW, barH);
    ctx.fillStyle = pct > 0.3 ? '#f472b6' : '#f87171';
    ctx.fillRect(player.x, barY, barW * pct, barH);
  }

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = clamp(p.life/20, 0, 1);
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.globalAlpha = 1;
  });

  damageNumbers.forEach(d => {
    ctx.textAlign = 'center';
    ctx.globalAlpha = clamp(d.life / d.maxLife, 0, 1);
    ctx.font = d.isBoss ? 'bold 16px monospace' : 'bold 12px monospace';
    ctx.fillStyle = d.isBoss ? '#fb923c' : '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 3;
    ctx.strokeText(String(d.amount), d.x, d.y);
    ctx.fillText(String(d.amount), d.x, d.y);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  });

  bubbles.forEach(b => {
    const ent = b.entity;
    const bx = ent.x + ent.w/2, by = ent.y - 16;
    ctx.font = '11px monospace';
    const textW = ctx.measureText(b.text).width;
    const padX = 6, padY = 4;
    const boxW = textW + padX*2, boxH = 16;
    const alpha = clamp(b.life / 20, 0, 1);
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = '#fff';
    ctx.fillRect(bx - boxW/2, by - boxH, boxW, boxH);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(bx - boxW/2, by - boxH, boxW, boxH);
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.fillText(b.text, bx, by - padY);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  });

  ctx.restore(); // 結束攝影機平移

  if (gameState === 'reward') drawRewardScreen(); // 疊在戰鬥畫面上方,螢幕空間座標,不受攝影機平移影響
  if (gameState === 'gameover' || gameState === 'victory') drawReturnToMenuButton(); // 手機沒有C鍵,一定要有可以點的按鈕

  ctx.restore(); // 結束screenShake平移
}

// 統一繪製 fxEffects 陣列裡的武器特效,依 type 分開畫法,顏色/線寬一律讀 EFFECT_CONFIG
function drawFxEffects() {
  fxEffects.forEach(e => {
    const t = (e.maxLife - e.life) / e.maxLife; // 0(剛出現)→1(即將消失)
    const alpha = clamp(e.life / e.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    if (e.type === 'thunder') {
      const cfg = EFFECT_CONFIG.thunder;
      ctx.beginPath();
      e.points.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]); });
      ctx.lineWidth = 6; ctx.strokeStyle = cfg.boltColor; ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = cfg.coreColor; ctx.stroke();
    } else if (e.type === 'melee') {
      const cfg = EFFECT_CONFIG.melee;
      const baseR = 30 * ((e.range || WEAPON_CONFIG.melee.range) / WEAPON_CONFIG.melee.range);
      const dir = e.facing || 1;
      const startAngle = dir === 1 ? -Math.PI * 0.35 : Math.PI * 0.65;
      const endAngle = dir === 1 ? Math.PI * 0.35 : Math.PI * 1.35;
      cfg.arcLayers.forEach(([rMult, w]) => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, baseR * rMult, startAngle, endAngle);
        ctx.lineWidth = w; ctx.strokeStyle = cfg.arcColor; ctx.stroke();
      });
    } else if (e.type === 'explosion') {
      const cfg = EFFECT_CONFIG.explosion;
      const r = (e.maxR || 50) * t;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = cfg.ringColor; ctx.stroke();
      ctx.globalAlpha = alpha * 0.6;
      ctx.beginPath(); ctx.arc(e.x, e.y, r * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = cfg.coreColor; ctx.fill();
    } else if (e.type === 'homing') {
      const cfg = EFFECT_CONFIG.homing;
      ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = cfg.trailColor; ctx.fill();
    } else if (e.type === 'pierce') {
      const cfg = EFFECT_CONFIG.pierce;
      const dir = e.facing || 1;
      ctx.beginPath(); ctx.arc(e.x, e.y, 14 * (1 - t) + 4, 0, Math.PI * 2);
      ctx.fillStyle = cfg.flashColor; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(e.x, e.y - 4); ctx.lineTo(e.x + dir * 26, e.y); ctx.lineTo(e.x, e.y + 4);
      ctx.strokeStyle = cfg.beamColor; ctx.lineWidth = 3; ctx.stroke();
    } else if (e.type === 'chain') {
      const cfg = EFFECT_CONFIG.chain;
      ctx.beginPath();
      e.points.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]); });
      ctx.lineWidth = 5; ctx.strokeStyle = cfg.boltColor; ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = cfg.coreColor; ctx.stroke();
    } else if (e.type === 'bounce') {
      const cfg = EFFECT_CONFIG.bounce;
      ctx.beginPath(); ctx.arc(e.x, e.y, 10 * (1 - t) + 3, 0, Math.PI * 2);
      ctx.strokeStyle = cfg.flashColor; ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.restore();
  });
}

function draw() {
  if (gameState === 'menu') { drawMenu(); return; }
  // 轉場收合階段(switched前)戰場資料還沒初始化,不能呼叫drawGame(),只畫黑底+遮罩
  if (gameState === 'transition' && battleTransition && !battleTransition.switched) {
    drawTransitionStandalone();
    return;
  }
  drawGame();
  if (gameState === 'transition') drawTransitionOverlay(); // 展開階段:疊在剛畫好的戰場畫面最上面
}

/* =========================================================
   Menu keyboard nav
   ========================================================= */
function handleMenuKeys() {
  if (gameState !== 'menu') return;

  if (lobbyTab === 'prep') {
    const confirmPressed = keys['enter_down'] || keys['r_down']; // Enter 跟 R 都能當確認鍵
    const backPressed = keys['backspace_down'] || keys['c_down']; // Backspace 跟 C 都能返回中樞

    if (prepScreen === 'hub') {
      if (confirmPressed) confirmStart();
      if (keys['q_down']) hubPageTurn(-1);
      if (keys['e_down']) hubPageTurn(1);
    } else {
      if (backPressed) prepScreen = 'hub';

      if (prepScreen === 'debug') {
        if (keys['arrowleft_down']) selectedDebugIndex = (selectedDebugIndex + DEBUG_TOGGLES.length - 1) % DEBUG_TOGGLES.length;
        if (keys['arrowright_down']) selectedDebugIndex = (selectedDebugIndex + 1) % DEBUG_TOGGLES.length;
        if (keys['arrowup_down']) selectedDebugIndex = (selectedDebugIndex - DEBUG_GRID_COLS + DEBUG_TOGGLES.length) % DEBUG_TOGGLES.length;
        if (keys['arrowdown_down']) selectedDebugIndex = (selectedDebugIndex + DEBUG_GRID_COLS) % DEBUG_TOGGLES.length;
        if (confirmPressed) { toggleDebugItem(DEBUG_TOGGLES[selectedDebugIndex]); debugInfoId = DEBUG_TOGGLES[selectedDebugIndex].id; }
      } else if (prepScreen === 'char') {
        if (keys['arrowup_down']) selectedCharIndex = (selectedCharIndex + CHAR_KEYS.length - 1) % CHAR_KEYS.length;
        if (keys['arrowdown_down']) selectedCharIndex = (selectedCharIndex + 1) % CHAR_KEYS.length;
        if (keys['q_down']) charPageTurn(-1);
        if (keys['e_down']) charPageTurn(1);
        if (confirmPressed) prepScreen = 'hub'; // 選好了,確認後直接回中樞
      } else if (prepScreen === 'map') {
        if (keys['arrowleft_down']) selectedMapIndex = (selectedMapIndex + MAP_KEYS.length - 1) % MAP_KEYS.length;
        if (keys['arrowright_down']) selectedMapIndex = (selectedMapIndex + 1) % MAP_KEYS.length;
        if (keys['q_down']) mapPageTurn(-1);
        if (keys['e_down']) mapPageTurn(1);
        if (confirmPressed) prepScreen = 'hub';
      } else if (prepScreen === 'weapon') {
        if (keys['arrowleft_down']) moveWeaponCursor(-1, 0);
        if (keys['arrowright_down']) moveWeaponCursor(1, 0);
        if (keys['arrowup_down']) moveWeaponCursor(0, -1);
        if (keys['arrowdown_down']) moveWeaponCursor(0, 1);
        if (confirmPressed) {
          const key = WEAPON_KEYS[selectedWeaponIndex];
          if (key) { toggleWeaponEquip(key); weaponInfoKey = key; } // 游標在尚未擁有的格子時 key 是 undefined,不會有事發生
        }
      } else if (prepScreen === 'archive') {
        if (keys['q_down']) archivePageTurn(-1);
        if (keys['e_down']) archivePageTurn(1);
      }
      // settings 目前是空骨架,沒有可操作內容
    }

    ['arrowup_down','arrowdown_down','arrowleft_down','arrowright_down','q_down','e_down','enter_down','r_down','backspace_down','c_down']
      .forEach(k => { keys[k] = false; });
  } else if (lobbyTab === 'sound') {
    // Q/E:音效分類切換
    if (keys['q_down']) { selectedSoundCategoryIndex = (selectedSoundCategoryIndex + SOUND_CATEGORIES.length - 1) % SOUND_CATEGORIES.length; selectedSoundIndex = 0; keys['q_down'] = false; }
    if (keys['e_down']) { selectedSoundCategoryIndex = (selectedSoundCategoryIndex + 1) % SOUND_CATEGORIES.length; selectedSoundIndex = 0; keys['e_down'] = false; }
    // PageUp/PageDown:同分類內翻頁
    if (keys['pageup_down']) { soundPageTurn(-1); keys['pageup_down'] = false; }
    if (keys['pagedown_down']) { soundPageTurn(1); keys['pagedown_down'] = false; }
    // Enter:播放目前選中的音效
    if (keys['enter_down']) {
      const list = getCurrentCategorySounds();
      if (list[selectedSoundIndex]) synthPlay(list[selectedSoundIndex].opts);
      keys['enter_down'] = false;
    }
  } else if (lobbyTab === 'devlog') {
    // PageUp/PageDown:開發日誌整頁翻頁
    if (keys['pageup_down']) { devlogPageTurn(-1); keys['pageup_down'] = false; }
    if (keys['pagedown_down']) { devlogPageTurn(1); keys['pagedown_down'] = false; }
  }
}

/* =========================================================
   Preload portrait images(含載入失敗防呆標記)
   ========================================================= */
const PORTRAIT_IMAGES = {};
CHAR_KEYS.forEach(k => {
  PORTRAIT_IMAGES[k] = {};
  Object.keys(CHARACTERS[k].portraits).forEach(state => {
    const img = new Image();
    img.onerror = () => { img.dataset.failed = 'true'; };
    img.src = CHARACTERS[k].portraits[state];
    PORTRAIT_IMAGES[k][state] = img;
  });
});
document.getElementById('portraitImg').src = CHARACTERS[CHAR_KEYS[0]].portraits.normal;
document.getElementById('portraitImg').dataset.currentKey = 'normal';

function loop() {
  handleMenuKeys();
  handleRewardKeys();
  update();
  draw();
  updateTouchControlsVisibility();
  ['1_down','2_down','3_down','arrowleft_down','arrowright_down','arrowup_down','arrowdown_down','enter_down','r_down','backspace_down','c_down','z_down','q_down','e_down','pageup_down','pagedown_down'].forEach(k => keys[k] = false);
  requestAnimationFrame(loop);
}

document.getElementById('waveInfo').style.display = 'none';
loop();
</script>
