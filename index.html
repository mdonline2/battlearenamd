<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>0.07prokectDW(戰棋版・第一階段)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-night:#10121B; --panel:#181B27; --panel-2:#1F2333; --border:#2C3145;
  --gold:#C9A227; --gold-bright:#E4C34F; --text:#E7E4DA; --text-dim:#9A9CAE;
  --hp:#c14b4b; --hp-low:#e2604a; --ally:#3E8E82; --enemy:#C2542E;
  /* 裝備部位標籤色（色票先暫定，之後想改直接換這幾個hex即可）*/
  --eq-head:#8a95a5; --eq-chest:#b8763f; --eq-hands:#a8895f;
  --eq-waist:#7c9b6f; --eq-feet:#6f8a7c; --eq-acc:#a67cc4;
  /* 屬性八宮格色票（暫定，之後想改直接換這幾個hex即可）*/
  --attr-lv:#C9A227; --attr-sp:#6f8fc4; --attr-atk:#c47a4f; --attr-def:#6fae95;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;background:var(--ink-night);color:var(--text);
  font-family:'Inter',-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  /*
    display: flex; flex-direction: column; align-items: center;
    padding: 16px;
    這邊影響畫面縮放
    */
}

  h1 { font-size: 16px; color: var(--text-dim); margin: 4px 0 12px; font-weight: normal; }
  .note { font-size: 12px; color: var(--text-dim); max-width: 640px; text-align: center; margin-bottom: 12px; line-height: 1.8; }
  .note b { color: var(--gold-bright); }

  .stage {
    position: relative;
    width: 640px; height: 360px;
    background: var(--panel); /* 主檔案戰鬥背景是 .battle-bg 疊圖+filter，這裡demo還沒接背景圖，先用單色面板色 */
    overflow: hidden;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .bg-label {
    position: absolute; top: 8px; left: 10px; z-index: 1;
    font-size: 11px; color: var(--text-dim);
  }


.serif{font-family:'Spectral',Georgia,serif;}
.slot{ position:relative; }
/* ============================================================
   🔧 裝備部位顏色標記（小圓點）位置/大小怎麼調
   - 這個小圓點是靠 .slot 設定 position:relative 當定位基準，
     .slot-tagdot 用 position:absolute 相對於.slot的右上角定位
   - 想移動位置：改下面 top / right 這兩個數字（單位px，數字越大離邊角越遠）
   - 想改大小：改 width / height（兩個要一起改，保持正圓形）
   - 想改顏色：不要改這裡，去最上面 :root{} 裡改 --eq-head/--eq-chest/
     --eq-hands/--eq-waist/--eq-feet/--eq-acc 這幾個hex色碼即可
============================================================ */
.slot-tagdot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; }
/* ============================================================
   🔧 卡片左側顏色條（比照原本屬性卡.attrcard的做法，統一套到所有.slot卡片上）
   - 條的顏色吃每張卡自己inline style設定的 --accent 變數（跟.slot-tagdot共用同一個顏色值即可）
   - 沒有設定--accent的卡片（目前是道具卡，ITEM_DB還沒有分類/顏色資料）會fallback顯示--border，
     視覺上等於沒有特別標色，之後道具補上分類欄位後再接上即可
   - 想改粗細：改width（目前3px，跟舊.attrcard一樣）；想改要不要圓角：改border-radius
============================================================ */
.slot::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:10px 0 0 10px; background:var(--accent, var(--border)); }
.app{

  max-width:1200px;margin:0 auto;padding:16px 14px 60px;

}
button{font-family:inherit;cursor:pointer;border:none;}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;}
.btn:hover{border-color:#454b66;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--gold);color:#20180a;border-color:var(--gold);}
.btn.primary:hover{background:var(--gold-bright);}
.btn.small{padding:5px 9px;font-size:11px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;}

/* NAV */
.nav{display:flex;gap:8px;margin-bottom:16px;}
.navbtn{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.navbtn.active{color:var(--gold-bright);border-color:var(--gold);}
.navbtn:disabled{opacity:.35;cursor:not-allowed;}

/* CHAPTER SCREEN */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.chcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:left;}
.chcard.locked{opacity:.4;}
.chcard .num{font-size:10px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;}
.chcard .ttl{font-family:'Spectral',serif;font-size:15px;margin:4px 0 6px;}
.chcard .desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;}

/* CHAPTER PAGINATION */
.ch-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.ch-pager .ch-pager-title-wrap{flex:1;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:8px;}
.ch-pager .ch-pager-title{font-family:'Spectral',serif;font-size:18px;margin:0;}
.ch-pager .ch-pager-count{font-size:11px;color:var(--text-dim);letter-spacing:.05em;white-space:nowrap;}
.ch-pager-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;}
.ch-pager-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-bright);}
.ch-pager-btn:disabled{opacity:.3;cursor:not-allowed;}

/* PREP SCREEN */
.party-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.party-tab{flex:1 1 120px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px;text-align:center;font-size:12.5px;font-weight:600;}
.party-tab.active{border-color:var(--gold);color:var(--gold-bright);background:var(--panel-2);}
.prep-tabs{display:flex;gap:6px;margin-bottom:14px;}
.prep-tab{flex:1;background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;color:var(--text-dim);font-weight:600;}
.prep-tab.active{background:var(--panel-2);color:var(--gold-bright);border-color:var(--gold);}
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.slot{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center;font-size:11.5px;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.slot .k{font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.slot .v{font-weight:600;}
.slot.empty{color:var(--text-dim);border-style:dashed;}
.slot-effect{font-size:10px;color:var(--gold-bright);line-height:1.4;margin-top:2px;}
.stat-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-row .k{color:var(--text-dim);}
.stat-row .v{font-weight:600;font-family:'Spectral',serif;}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.shop-item:last-child{border-bottom:none;}
.shop-item .d{color:var(--text-dim);font-size:10.5px;}

/* BATTLE SCREEN */
.battle-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px;}
.battle-top-zone{position:relative;overflow:hidden;}
.battle-layout{display:flex;gap:8px;align-items:stretch;}
.portrait-box{
  width:100px; flex:0 0 100px;
  border:2px dashed var(--border); border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel-2);
}
.portrait-placeholder{
  font-size:10.5px; color:var(--text-dim); text-align:center; line-height:1.6; padding:8px;
}
@media (max-width:760px){
  .portrait-box{ width:64px; flex:0 0 64px; }
  .portrait-placeholder{ font-size:9px; }
}
.battle-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5);}
.battle-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;gap:10px;flex-wrap:wrap;}
.turn-order{background:rgba(15,17,21,.72);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
.turn-order .lbl{font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.turn-order .row{display:flex;gap:5px;}
.tu{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;border:1px solid var(--border);background:var(--panel);flex:0 0 auto;position:relative;}
.tu.ally{color:var(--ally);}
.tu.enemy{color:var(--enemy);}
.tu.current{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bright) inset;}
.tu.dead{opacity:.3;}
.battle-actions-top{background:rgba(15,17,21,.72);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;}

.grid-wrap{position:relative;z-index:2;padding:0 10px 10px;}
.grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(4,44px);gap:3px;}
.cell{background:rgba(20,22,32,.55);border:1px solid rgba(255,255,255,.06);border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;cursor:default;}
.loot-star{position:absolute;top:1px;right:2px;font-size:9px;color:var(--gold-bright);pointer-events:none;text-shadow:0 0 3px rgba(0,0,0,.8);}
.cell.selectable{background:rgba(201,162,39,.28);cursor:pointer;}
.cell.aoe{background:rgba(194,84,46,.4);}
/* 【斜紋雙色demo】預覽用，目前沒有任何指令實際套用這個class，純粹展示效果，
   實際套色靠JS內聯style動態設定（見下方stripeCellBackground()），這裡只是把它視覺化的容器。
   要拿掉這個demo時，把下面的.cell.stripe-preview規則跟stripeCellBackground()/applyStripePreviewDemo()一起刪掉即可。 */
.cell.stripe-preview{cursor:pointer;}
.unit-chip{width:34px;height:34px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;cursor:pointer;position:relative;}
.unit-chip.ally{background:var(--ally);color:#0d1a17;}
.unit-chip.enemy{background:var(--enemy);color:#2a0f06;}
.unit-chip.current{box-shadow:0 0 0 2px var(--gold-bright);}
.unit-chip.down{opacity:.35;}
.unit-chip.target-red{box-shadow:0 0 0 3px #ff5b45;}
/* 施放預覽：紅底＝「點下去會生效/命中」的統一語意，同時用在棋盤unit-chip跟laser方向面板按鈕上 */
.btn.target-red{background:var(--enemy);color:#fff;border-color:var(--enemy);}
.btn.target-red:hover{background:#d8663e;}
/* laser 8方向面板：3x3排列，中間格放取消鍵 */
/* laser 8方向面板（.dir-panel）已於v0.15改回點格子版，不再需要，此CSS規則已移除 */
.unit-hp{position:absolute;bottom:-6px;left:2px;right:2px;height:3px;background:#000;border-radius:2px;overflow:hidden;}
.unit-hp > div{height:100%;background:var(--hp-low);}
.bubble{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1a1a;font-size:10px;padding:4px 7px;border-radius:6px;white-space:nowrap;max-width:160px;white-space:normal;width:max-content;max-width:150px;text-align:center;line-height:1.3;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.bubble:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff;}

.side-panel{position:relative;z-index:2;background:rgba(15,17,21,.85);border-top:1px solid var(--border);padding:12px;}
.actor-info{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.actor-info .name{font-weight:600;font-size:14px;}
.actor-info .hp{font-size:11.5px;color:var(--text-dim);}
.actionbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.skillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.skillgrid button{font-size:11px;padding:8px 4px;}
.skillgrid button.locked{color:var(--text-dim);border-style:dashed;}

.msglog{position:relative;z-index:2;background:#0D0F17;border-top:1px solid var(--border);padding:8px 12px;font-size:12px;line-height:1.7;color:#C9C6BA;max-height:150px;overflow-y:auto;}
.msglog .row{padding:1px 0;}
.msglog .row b{color:var(--text);}
.logbar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border);}
.logbar span{font-size:11px;color:var(--text-dim);}

.result-banner{position:relative;z-index:3;background:var(--gold);color:#20180a;text-align:center;padding:14px;font-weight:700;font-size:15px;}

/* 戰鬥結算浮動列：疊加在戰場畫面下方，不清空/遮擋整個戰場，讓玩家可以先看清楚戰場最終狀態再按返回 */
.battle-result-overlay{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:linear-gradient(180deg, transparent, var(--ink-night) 35%);
  padding:26px 16px 18px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  animation:resultFadeUp .3s ease;
}
.battle-result-overlay .result-banner{
  border-radius:10px; max-width:480px; width:100%;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
}
@keyframes resultFadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--gold);color:var(--gold-bright);padding:10px 18px;border-radius:10px;font-size:12.5px;opacity:0;transition:all .25s ease;z-index:60;pointer-events:none;font-weight:600;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.fullscreen-fx{
  position:fixed; inset:0; background:#000; z-index:200;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .25s ease;
}
.fullscreen-fx.show{ opacity:1; }
.fullscreen-fx.fx-fadeout{ opacity:0; }
.fullscreen-fx img{ max-width:100%; max-height:100%; }
.fx-placeholder{ color:#fff; text-align:center; font-family:'Spectral',serif; font-size:22px; line-height:1.7; padding:20px; }
.fx-placeholder .fx-sub{ font-size:12px; color:#888; display:block; margin-top:10px; font-family:'Inter'; }
footer.foot{text-align:center;margin-top:20px;font-size:11px;color:var(--text-dim);}
.version-tag{cursor:pointer;text-decoration:underline dotted;color:var(--text-dim);}
.version-tag:hover{color:var(--gold-bright);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-box .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-box .modal-close{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);width:26px;height:26px;font-size:14px;line-height:1;cursor:pointer;}
@media (max-width:760px){
  .grid{grid-template-rows:repeat(4,30px);}
  .unit-chip{width:24px;height:24px;font-size:8px;}
}
</style>
</head>
<body>
<div class="app">

  <div class="nav" id="navBar"></div>

  <div id="viewChapters"></div>
  <div id="viewPrep" style="display:none;"></div>
  <div id="viewCodex" style="display:none;"></div>
  <div id="viewBattle" style="display:none;"></div>

  <footer class="foot">第一階段核心版本 · 進度自動存於此瀏覽器。行動順序=速度10+隨機1~20；戰場為12×4格位系統。 <span class="version-tag" id="versionTag"></span></footer>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="changelogModal"><div class="modal-box">
  <div class="modal-head"><h2 class="serif" style="margin:0;font-size:16px;">版本紀錄</h2><button class="modal-close" id="changelogModalClose">✕</button></div>
  <div id="changelogModalBody"></div>
</div></div>
<audio id="bgm" loop></audio>

<script>
(function(){
"use strict";

/* ============================================================
   STATIC DATA
============================================================ */
// ARCS：大章節（篇章/卷）分類。目前只有一卷，之後新增卷數時，
// 在這裡加一筆，並把 CHAPTERS 對應的章節 arcId 指過來即可。
const ARCS = [
  {id:'arc1', name:'第一卷：邊境風雲'},
  {id:'arc2', name:'第二卷：未知傳說'},  // 測試用，用來確認分頁翻到下一卷時標題會自動切換
];

const CHAPTERS = [
  {id:0, arcId:'arc1', name:'序章：意外來客', desc:'哥布林巡邏隊擋在城鎮的邊界。學會戰鬥的基礎。', unlocked:true, battle:'goblin_patrol'},
  {id:1, arcId:'arc1', name:'第一章（測試用）', desc:'測試用章節，目前沿用序章的戰鬥內容，之後可自行替換。', unlocked:true, battle:'goblin_patrol'},
  {id:2, arcId:'arc1', name:'第二章（測試用）', desc:'測試用章節，目前沿用序章的戰鬥內容，之後可自行替換。', unlocked:true, battle:'goblin_patrol', recruitHint:'完成後加入吟遊詩人、祭司'},
  {id:3, arcId:'arc1', name:'第三章（測試用）', desc:'測試用章節，目前沿用序章的戰鬥內容，之後可自行替換。', unlocked:true, battle:'goblin_patrol', recruitHint:'測試'},
  {id:4, arcId:'arc1', name:'第四章（測試用）', desc:'測試用章節，目前沿用序章的戰鬥內容，之後可自行替換。', unlocked:true, battle:'goblin_patrol'},
];

// 每頁顯示的章節數量上限，避免手機上一次顯示太多章節卡片
const CHAPTERS_PER_PAGE = 4;
for(let i=5;i<=7;i++) CHAPTERS.push({id:i, arcId:'arc1', name:'第'+i+'章', desc:'尚未開放內容。', unlocked:false});
for(let i=8;i<=20;i++) CHAPTERS.push({id:i, arcId:'arc2', name:'第'+i+'章', desc:'尚未開放內容。', unlocked:false});

/* ============================================================
   版本紀錄（Changelog）
   想新增紀錄：複製一筆物件、改版本號/日期/內容即可，新的寫在陣列最前面
============================================================ */
const CHANGELOG = [
  { version:'v0.21', date:'2026/09/08', notes:[
    '.slot卡片左側加上顏色條（比照舊版.attrcard的左側色條做法，用.slot::before + --accent變數實作），跟右上角小圓點是同一個顏色值，兩者並存不衝突',
    '裝備卡、屬性卡（等級/HP/SP/ATK/DEF四張）：直接沿用原本標圓點用的顏色，色條/圓點同色',
    '技能卡新增 skillTypeColor()，依SKILL_DB既有的type欄位（attack/heal/buff）給色（借用--enemy/--ally/--eq-acc既有語意色），技能商店卡也一併套用',
    '道具卡刻意先不標色：ITEM_DB目前沒有分類/type欄位可用，等之後補上分類資料再接色條，目前fallback顯示--border（等同無標色）',
  ]},
  { version:'v0.20 (game_dev4005分支)', date:'2026/09/05', notes:[

/* 依技能資料自動組出一句效果摘要文字（例如「劈砍 18・冷卻3回合・消耗10」），
   不用每個技能手動寫desc，資料改了摘要就自動跟著變 */
function skillSummaryText(d){
  let parts = [];
  if(d.type === 'attack') parts.push(`${d.dmgType} ${d.power}`);
  else if(d.type === 'heal') parts.push(`治療 ${d.power}`);
  else parts.push('功能性技能');
  if(d.cd) parts.push(`冷卻${d.cd}回合`);
  if(d.cost && d.cost.res) parts.push(`消耗${d.cost.res}`);
  return parts.join(' · ');
}

/* 依裝備資料自動組出屬性摘要文字（例如「+5 鎧甲值, +1 防禦」），
   跟 skillSummaryText 同一套邏輯：不用手動寫lore，資料改了摘要就自動跟著變。
   EQUIP_DB / TREASURY_DB 裡原本手寫的 lore 欄位保留下來當作「故事敘述」，
   之後做 codex 圖鑑時可以直接拿 .lore 顯示，但一般裝備欄/商店/倉庫一律改用這個函式。
   想新增可以顯示的屬性種類，直接在 STAT_LABELS 裡加一行即可。 */
const STAT_LABELS = { atk:'攻擊', def:'防禦', spd:'速度', armor:'鎧甲值', res:'資源上限' };
function equipSummaryText(d){
  const parts = Object.keys(STAT_LABELS)
    .filter(k => d[k])
    .map(k => `+${d[k]} ${STAT_LABELS[k]}`);
  return parts.length ? parts.join(', ') : '（無屬性加成）';
}

/* 依道具資料自動組出效果摘要文字（例如「恢復30點HP」），
   跟 skillSummaryText / equipSummaryText 同一套邏輯：不用手動寫lore。
   想讓道具支援新效果（例如解除異常、增益等），直接在這裡加一個 if 判斷即可。 */
function itemSummaryText(d){
  let parts = [];
  if(d.heal) parts.push(`恢復${d.heal}點HP`);
  return parts.length ? parts.join(', ') : '（無效果）';
}

/* ============================================================
   【range 系統改版：shape enum 換成 reach + shape 兩參數，見 range_sim.html 模擬器與 dev4_design_todo.md 第十二節】
   - reach（number）：切比雪夫距離上限，決定「這個技能可以把錨點放在哪」
     reach:0 代表唯一合法錨點就是施放者自己，UI上會直接自動觸發，不用玩家再點一次
   - shape（number | 'all' | 'laser'）：以錨點為中心展開的命中範圍
     N（正整數）= N×N方塊，N=1即單體技能，N為偶數時往右下多蓋一格
     'all'      = 不看reach，直接套用在 targetSide 篩選出的「全部」單位身上（原本的 ally_all）
     'laser'    = 沿方向直線打到底（尚未實作，UI互動方式待設計，見 dev4_design_todo.md 第十節「尚待解決」；
                  目前 SKILL_DB 沒有技能使用這個值，資料格式先預留）
   - 錨點合法性規則：shape===1（單體）時，錨點必須落在有合法目標（matchesSide通過）的格子上才算數，
     所以由 onUnitClick 直接點單位判定；shape>1（AOE）允許空放，範圍內有沒有目標交給執行時的 matchesSide 判定，
     所以由 onCellClick 點格子判定，錨點只受 reach 限制、不要求該格有人
   - targetSide：不變，純粹決定套用在哪個陣營，相對於施放者自身陣營計算，敵我雙方共用同一套判斷：
     'enemy' = 施放者的敵對陣營　'ally' = 施放者的同陣營　'all' = 不分敵我　'self' = 僅施放者自己
   - reach 數值目前為暫定值（尤其 REACH_UNLIMITED 用來保留舊版「不限位置」行為，例如重擊/火球原本就能點全場任意格），
     之後平衡測試時可能會依角色設計調整（例如重擊改成真正的近戰限定射程），不影響本次架構
============================================================ */
const REACH_UNLIMITED = 99; // 全場任一格都在範圍內（12x4棋盤最大切比雪夫距離遠小於這個值），僅為保留舊版「不限位置」行為的權宜值

/* ============================================================
   【施放確認階段】不是每個技能單獨設定的欄位，而是由 shape 自動決定要走幾段確認流程，
   目前存在的3種：

   階段A（0次確認，按下即發動）：目前沒有任何技能在用。
     v0.13以前 self（reach:0）跟 shape:'all' 是這樣（選取後自動觸發），
     v0.14拿掉了，因為容易手滑誤觸、也沒有反悔機會。架構上還是可以做，
     只要在renderSidePanel()技能按鈕的onclick裡跳過「只選取」那段、直接showFullscreenFX+executeSkill即可，
     但目前刻意不用，全部技能都至少要求1次確認。

   階段B（1次確認，選取後立即預覽紅底，點紅底即發動）：shape===1（單體/自身）、shape==='all'（全體）、shape==='laser'。
     這幾種的共通點是「選了技能的當下，候選目標就已經是確定的」，不需要額外的「選範圍」步驟，
     紅底在點技能的那一刻就會立即顯示（不用等玩家做任何動作）。
     - shape===1：紅底顯示在 singleTargetCandidates() 篩出的unit-chip上（可能是敵人/隊友/自己）。
       如果選取後棋盤上完全沒有紅底，通常代表「目前沒有合法目標在範圍內」（例如相鄰系技能reach:1，
       但沒有敵人真的站在自己旁邊），這是正常情況、不是bug——移動靠近目標後重新選取技能，紅底就會出現。
     - shape==='all'：紅底顯示在所有matchesSide()篩出的unit-chip上，另外整場棋盤標黃（純視覺提示「這是全場技能」）。
     - shape==='laser'：紅底/黃底顯示在8條方向線的沿途格子上（見computeSkillHighlights），
       因為reach通常很大（例如聖光reach:12），幾乎每次選取都會立刻看到紅底，這是reach數值造成的差異，
       不是shape===1跟shape==='laser'的確認邏輯不同——兩者都是「選取當下就預覽，點一次confirm」。

   階段C（2次確認，先選範圍/方向再對範圍內容確認發動）：shape>1的AOE技能（例如fireball）。
     第一次確認＝選定/改選錨點（點黃底候選格，棋盤即時預覽該錨點展開的N×N紅底範圍）；
     第二次確認＝點紅底範圍內任一格才真正發動。改點別的黃底格會直接重新預覽新錨點，不用先取消。
     這是唯一需要「先看範圍長怎樣、才決定要不要打」的類型，因為AOE的錨點是連續空間、不像laser只有8個離散方向可選。

   之後如果想讓某個技能刻意套用不同階段（例如想讓某個技能維持階段A秒發），
   目前沒有專屬欄位可以直接標記，要靠shape間接決定——真的有需要時再討論是否要加一個獨立的confirmStage欄位覆寫這個預設對應規則。
============================================================ */

   （哪些要鎖，待逐一設計時決定——見設計文件待辦清單第4項）
============================================================ */
function canUse(itemOrSkill, charId){
  if(!itemOrSkill || !itemOrSkill.charReq) return true; // 無欄位 = 通用
  const req = Array.isArray(itemOrSkill.charReq) ? itemOrSkill.charReq : [itemOrSkill.charReq];
  return req.includes(charId);
}

const LEVEL_GROWTH_TABLE = (()=>{
  // 暫定公式：先快後慢，Lv.20封頂。之後想要精確數值表，直接把這行改成寫死陣列即可

  return table;
})();

/* ============================================================
   個體實例模型（設計文件第二節／第十六節定案，Stage 2 實作）
   - state.equipInstances / skillInstances / itemInstances：
     { [iid]: {key, level, status} }，status: 'unowned' | 'owned' | 'equipped'
   - c.equipment[slot] / c.skills[i] / c.items[i] 現在存的是 iid，不是key字串
   - 商店庫存＝篩選 status==='unowned' 的實例；倉庫＝status==='owned'；
     角色身上＝status==='equipped'
   - 起始角色配裝（makeChar給的原始key字串）與商店庫存是分開各自建立的
     實例，不互相共用同一份（起始配裝不會佔用商店的庫存數量）
   - 目前每個key先各建1個「unowned」商店庫存（暫定數量，見設計文件
     待辦清單第1項，之後要改成逐項設計的正式數量，直接改 seedInstances()
     裡的迴圈次數即可）
============================================================ */
function makeIid(st, prefix){ st.iidCounter = (st.iidCounter||0) + 1; return prefix+'_'+st.iidCounter; }

function seedInstances(st){
  // 起始角色配裝：把 makeChar 給的原始key字串轉成「已裝備」的個體實例
  st.party.forEach(c=>{
    c.skills = c.skills.map(key=>{
      if(!key) return null;
      const iid = makeIid(st,'sk');
      st.skillInstances[iid] = { key, level:1, status:'equipped' };
      return iid;
    });
    c.items = c.items.map(key=>{
      if(!key) return null;
      const iid = makeIid(st,'it');
      st.itemInstances[iid] = { key, level:1, status:'equipped' };
      return iid;
    });
    // c.equipment 起始全部是null，不用轉換
  });
  // 商店庫存：裝備(含寶物庫)/技能/道具，每個key先給1個unowned實例
  Object.keys(EQUIP_DB).forEach(key=>{
    const iid = makeIid(st,'eq'); st.equipInstances[iid] = { key, level:1, status:'unowned' };
  });
  Object.keys(TREASURY_DB).forEach(key=>{
    const iid = makeIid(st,'eq'); st.equipInstances[iid] = { key, level:1, status:'unowned' };
  });
  SKILL_SHOP_KEYS.forEach(key=>{
    const iid = makeIid(st,'sk'); st.skillInstances[iid] = { key, level:1, status:'unowned' };
  });
  Object.keys(ITEM_DB).forEach(key=>{
    const iid = makeIid(st,'it'); st.itemInstances[iid] = { key, level:1, status:'unowned' };
  });
}

const EQUIP_UPGRADE_CAP = 5;

function equipUpgradeCost(nextLevel){ return 20 * nextLevel; } // 金幣，暫定

const EQUIP_LEVEL_STAT_BONUS_PER_LEVEL = 1; // 裝備每級各數值欄位+1，暫定
const SKILL_LEVEL_POWER_BONUS_PER_LEVEL = 3; // 技能每級power/heal+3，暫定
function skillLevelBonus(actor, key){
  const lvl = (actor.skillLevels && actor.skillLevels[key]) || 1;
  return (lvl - 1) * SKILL_LEVEL_POWER_BONUS_PER_LEVEL;
}

function equipInstOf(iid){ return iid ? state.equipInstances[iid] : null; }

/* 裝備某個數值欄位「含強化等級加成」後的實際數值。沒有這個欄位就回傳0（方便直接加總）。 */
function equipEffectiveStat(iid, statKey){
  const inst = equipInstOf(iid);
  const def = equipDefOf(iid);
  if(!inst || !def || !def[statKey]) return 0;
  return def[statKey] + (inst.level - 1) * EQUIP_LEVEL_STAT_BONUS_PER_LEVEL;
}

/* ============================================================
   NAV
   【分頁開關】想暫時關閉某個大分頁，把對應值改成 false 就好，
   不用刪程式碼、不用找位置，存檔重整後該分頁按鈕會直接消失。
============================================================ */
const TAB_ENABLED = {
  chapters: true,
  prep: true,
  codex: true,
};
const NAV_TABS = [
  {key:'chapters', label:'章節'},
  {key:'prep', label:'準備'},
  {key:'codex', label:'回顧'},
];
function renderNav(){
  const bar = document.getElementById('navBar');
  bar.innerHTML = '';
  NAV_TABS.filter(t=>TAB_ENABLED[t.key]).forEach(t=>{
    const b = document.createElement('button');
    b.className = 'navbtn';
    b.dataset.view = t.key;
    b.textContent = t.label;
    b.onclick = ()=>{ if(!b.disabled) switchView(t.key); };
    bar.appendChild(b);
  });
}
function switchView(v){
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('viewChapters').style.display = v==='chapters' ? '' : 'none';
  document.getElementById('viewPrep').style.display = v==='prep' ? '' : 'none';
  document.getElementById('viewCodex').style.display = v==='codex' ? '' : 'none';
  document.getElementById('viewBattle').style.display = v==='battle' ? '' : 'none';
  if(v==='chapters') renderChapters();
  if(v==='prep') renderPrep();
  if(v==='codex') renderCodex();
  if(v==='codex') renderCodex();
}
function setNavLocked(locked){
  document.querySelectorAll('.navbtn').forEach(b=>{
    if(b.dataset.view === 'battle') return;
    b.disabled = locked;
    b.title = locked ? '戰鬥尚未結束，請先脫逃或完成戰鬥' : '';
  });
}

/* ============================================================
   CHAPTER VIEW
============================================================ */
// 記住玩家目前瀏覽到第幾頁（0-indexed），重新進入章節畫面時維持在原本的頁面
let chapterPageIndex = 0;

function renderChapters(){
  const el = document.getElementById('viewChapters');
  const totalPages = Math.max(1, Math.ceil(CHAPTERS.length / CHAPTERS_PER_PAGE));
  // 邊界保護：避免資料變動後頁碼超出範圍
  if(chapterPageIndex >= totalPages) chapterPageIndex = totalPages - 1;
  if(chapterPageIndex < 0) chapterPageIndex = 0;

  const pageStart = chapterPageIndex * CHAPTERS_PER_PAGE;
  const pageChapters = CHAPTERS.slice(pageStart, pageStart + CHAPTERS_PER_PAGE);

  // 目前這頁章節所屬的Arc（用第一筆章節的arcId去查對應大章節名稱，
  // 供標題顯示用；同一頁理論上章節都屬於同一卷）
  const arc = ARCS.find(a => a.id === (pageChapters[0] && pageChapters[0].arcId));
  const arcName = arc ? arc.name : '故事 · 章節選擇';

  el.innerHTML = `<div class="card">
    <div class="ch-pager">
      <button class="ch-pager-btn" id="chPrevBtn" ${chapterPageIndex<=0 ? 'disabled' : ''}>‹</button>
      <div class="ch-pager-title-wrap">
        <h2 class="ch-pager-title">${arcName}</h2>
        <span class="ch-pager-count">${chapterPageIndex+1} / ${totalPages}</span>
      </div>
      <button class="ch-pager-btn" id="chNextBtn" ${chapterPageIndex>=totalPages-1 ? 'disabled' : ''}>›</button>
    </div>
    <div class="chgrid" id="chGrid"></div>
  </div>`;

  const grid = document.getElementById('chGrid');
  pageChapters.forEach(ch=>{
    const div = document.createElement('div');
    div.className = 'chcard' + (ch.unlocked ? '' : ' locked');
    div.innerHTML = `<div class="num">Chapter ${ch.id}</div><div class="ttl serif">${ch.name}</div><div class="desc">${ch.desc}</div>
      ${ch.recruitHint ? `<div style="font-size:11px;color:var(--gold-bright);margin-top:6px;">★ ${ch.recruitHint}</div>` : ''}
      ${ch.unlocked ? '<button class="btn primary" style="margin-top:10px;width:100%;">出發</button>' : ''}`;
    if(ch.unlocked){
      div.querySelector('button').onclick = ()=> startBattle(ch.battle, ch.id);
    }
    grid.appendChild(div);
  });

  const prevBtn = document.getElementById('chPrevBtn');
  const nextBtn = document.getElementById('chNextBtn');
  if(prevBtn) prevBtn.onclick = ()=>{ chapterPageIndex--; renderChapters(); };
  if(nextBtn) nextBtn.onclick = ()=>{ chapterPageIndex++; renderChapters(); };
}

/* ============================================================
   CODEX VIEW（回顧）
============================================================ */
let codexState = { tab:'history' };

function renderCodex(){
  const el = document.getElementById('viewCodex');
  el.innerHTML = `<div class="card">
    <h2 class="serif" style="margin-top:0;">回顧 · 圖鑑</h2>
    <div class="prep-tabs" id="codexTabs"></div>
    <div id="codexBody"></div>
  </div>`;
  const tabsEl = document.getElementById('codexTabs');
  CODEX_CATEGORIES.forEach(cat=>{
    const b = document.createElement('button');
    b.className = 'prep-tab' + (codexState.tab===cat.key ? ' active' : '');
    b.textContent = cat.label;
    b.onclick = ()=>{ codexState.tab = cat.key; renderCodex(); };
    tabsEl.appendChild(b);
  });

  const body = document.getElementById('codexBody');
  const entries = CODEX_ENTRIES.filter(e=>e.category===codexState.tab);
  if(entries.length===0){
    body.innerHTML = `<div style="font-size:12.5px;color:var(--text-dim);padding:10px 0;">這個分類目前還沒有內容。</div>`;
    return;
  }
  body.innerHTML = entries.map(e=>{
    const unlocked = !e.unlockFlag || hasFlag(e.unlockFlag);
    if(!unlocked){
      return `<div class="card" style="margin-top:10px;opacity:.5;">
        <div style="font-weight:600;font-size:13.5px;margin-bottom:4px;">？？？</div>
        <div style="font-size:11.5px;color:var(--text-dim);">尚未解鎖 · 完成特定事件後解鎖</div>
      </div>`;
    }
    return `<div class="card" style="margin-top:10px;">
      ${e.image ? `<img src="${e.image}" style="width:100%;border-radius:8px;margin-bottom:8px;display:block;">` : ''}
      <div style="font-weight:600;font-size:13.5px;margin-bottom:4px;">${e.name}</div>
      <div style="font-size:12.5px;color:var(--text-dim);line-height:1.7;">${e.desc}</div>
    </div>`;
  }).join('');
}
let prepState = { selectedId:null, tab:'equip' };

function unlockedCharacters(){
  return state.party.filter(p => p.unlockChapter <= (state.maxChapterReached||0));
}

function renderPrep(){
  const el = document.getElementById('viewPrep');
  const unlocked = unlockedCharacters();
  if(!prepState.selectedId || !unlocked.find(p=>p.id===prepState.selectedId)){
    prepState.selectedId = unlocked[0] ? unlocked[0].id : null;
  }
  const c = state.party.find(p=>p.id===prepState.selectedId);

  const lockedCount = state.party.length - unlocked.length;

  el.innerHTML = `
    <div class="party-tabs" id="partyTabs"></div>
    ${lockedCount>0 ? `<div style="font-size:11px;color:var(--text-dim);margin:-6px 0 12px;">還有 ${lockedCount} 位角色尚未加入隊伍。</div>` : ''}
    ${c ? `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="portrait-box" style="width:56px;flex:0 0 56px;height:56px;">${prepPortraitHtml(c)}</div>
          <h2 class="serif" style="margin:0;">${c.name} <span style="font-size:12px;color:var(--text-dim);">· ${c.role}</span></h2>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;">
          <div class="stat-row" style="border:none;padding:0;"><span class="k">金幣</span>&nbsp;<span class="v">${state.gold}</span></div>
          <div class="stat-row" style="border:none;padding:0;"><span class="k">水晶</span>&nbsp;<span class="v">${state.crystal}</span></div>
          <div class="stat-row" style="border:none;padding:0;"><span class="k">經驗</span>&nbsp;<span class="v">${state.expPool}</span></div>
          <div class="stat-row" style="border:none;padding:0;"><span class="k">天賦天球</span>&nbsp;<span class="v">${state.sphere}</span></div>
        </div>
      </div>
      <div class="prep-tabs" id="prepTabs">
        <button class="prep-tab ${prepState.tab==='equip'?'active':''}" data-tab="equip">裝備</button>
        <button class="prep-tab ${prepState.tab==='skill'?'active':''}" data-tab="skill">技能</button>
        <button class="prep-tab ${prepState.tab==='item'?'active':''}" data-tab="item">道具</button>
        <button class="prep-tab ${prepState.tab==='stat'?'active':''}" data-tab="stat">屬性</button>
      </div>
      <div id="prepBody"></div>
    </div>` : `<div class="card"><div style="font-size:12.5px;color:var(--text-dim);">目前沒有可管理的角色。</div></div>`}
  `;

  /* ============================================================
     【上場/替補 星星切換 教學】
     每個角色分頁按鈕旁邊會有一顆星星（★=上場中／☆=替補中）。
     點星星本身：切換該角色上場/替補（不影響你正在編輯誰）。
     點角色名字文字：切換「目前正在編輯的角色」（裝備/技能/道具畫面）。
     兩個動作分開處理，互不影響。
     上場上限固定4人、至少要保留1人上場（最後一人星星會鎖住不能點）。
  ============================================================ */
  const tabsEl = document.getElementById('partyTabs');
  const activeCount = unlocked.filter(p=>p.active).length;
  unlocked.forEach(p=>{
    const wrap = document.createElement('div');
    wrap.className = 'party-tab' + (p.id===prepState.selectedId?' active':'');
    wrap.style.display = 'flex';
    wrap.style.alignItems = 'center';
    wrap.style.gap = '4px';
    wrap.style.justifyContent = 'center';

    const star = document.createElement('span');
    star.textContent = p.active ? '★' : '☆';
    star.title = p.active ? '上場中（點擊移至替補）' : '替補中（點擊上場）';
    star.style.color = p.active ? 'var(--gold-bright)' : 'var(--text-dim)';
    star.style.cursor = 'pointer';
    const lockedStar = (p.active && activeCount<=1) || (!p.active && activeCount>=4);
    if(lockedStar){ star.style.opacity = '.35'; star.style.cursor='not-allowed'; }
    star.onclick = (e)=>{
      e.stopPropagation();
      if(lockedStar) return;
      p.active = !p.active;
      saveGame(); renderPrep();
    };

    const nameSpan = document.createElement('span');
    nameSpan.textContent = p.name;
    nameSpan.onclick = ()=>{ prepState.selectedId = p.id; renderPrep(); };

    wrap.appendChild(star);
    wrap.appendChild(nameSpan);
    tabsEl.appendChild(wrap);
  });

  if(!c){ return; }

  document.querySelectorAll('.prep-tab').forEach(b=>{
    b.onclick = ()=>{ prepState.tab = b.dataset.tab; renderPrep(); };
  });
  renderPrepBody(c);
}

function renderPrepBody(c){
  const body = document.getElementById('prepBody');

  if(prepState.tab === 'equip'){
    const slots = ['head','chest','hands','waist','feet','acc1','acc2','acc3'];
    const labels = {head:'頭部',chest:'胸部',hands:'手部',waist:'腰部',feet:'腳部',acc1:'飾品1',acc2:'飾品2',acc3:'飾品3'};
    body.innerHTML = `

<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">裝備欄位（8格）</div>

<div class="slotgrid">` + slots.map(s=>{
      const iid = c.equipment[s];
      const eqData = equipDefOf(iid);
      const inst = equipInstOf(iid);
      const maxed = inst && inst.level >= EQUIP_UPGRADE_CAP;
      const nextCost = inst ? equipUpgradeCost(inst.level+1) : 0;
      const eqAccent = eqTagColor(s.startsWith('acc')?'acc':s);
      return `<div class="slot ${eqData?'':'empty'}" style="--accent:${eqAccent}">
        <div class="slot-tagdot" style="background:${eqAccent}"></div>
        <div class="k">${labels[s]}${inst ? ` · Lv.${inst.level}` : ''}</div>
        <div class="v">${eqData ? eqData.name : '（空）'}</div>
        ${eqData ? `<div class="slot-effect">${equipSummaryText(eqData)}${inst && inst.level>1 ? `（強化中，各數值再+${(inst.level-1)*EQUIP_LEVEL_STAT_BONUS_PER_LEVEL}）` : ''}</div>` : ''}
        ${iid ? `<button class="btn small" data-upgrade-equip="${s}" style="margin-top:4px;width:100%;" ${maxed || state.gold<nextCost ? 'disabled':''}>${maxed ? '已滿級' : `強化 (${nextCost}金)`}</button>` : ''}
        ${iid ? `<button class="btn small" data-unequip="${s}" style="margin-top:4px;width:100%;">卸除</button>` : ''}
      </div>`;
    }).join('') + `</div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">裝備商店（${Object.keys(EQUIP_DB).length}/13）</div>
      <div class="slotgrid" id="equipShopGrid"></div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">共用裝備倉庫（${Object.values(state.equipInstances).filter(i=>i.status==='owned').length}件）· 卸下的裝備不分角色，任何人都能重新裝上，也可以直接賣出</div>
      <div id="equipWarehouseList"></div>`;
    body.querySelectorAll('[data-unequip]').forEach(btn=>{
      btn.onclick = ()=>{
        const slot = btn.dataset.unequip;
        const iid = c.equipment[slot];
        const inst = equipInstOf(iid);
        if(inst) inst.status = 'owned';
        c.equipment[slot] = null;
        toast('已卸除，收進倉庫');
        saveGame(); renderPrep();
      };
    });
    body.querySelectorAll('[data-upgrade-equip]').forEach(btn=>{
      btn.onclick = ()=>{
        const slot = btn.dataset.upgradeEquip;
        const inst = equipInstOf(c.equipment[slot]);
        if(!inst || inst.level >= EQUIP_UPGRADE_CAP) return;
        const cost = equipUpgradeCost(inst.level+1);
        if(state.gold < cost){ toast('金幣不足'); return; }
        state.gold -= cost;
        inst.level++;
        toast('已強化至 Lv.'+inst.level);
        saveGame(); renderPrep();
      };
    });
    const equipStockByKey = {};
    Object.values(state.equipInstances).forEach(inst=>{ if(inst.status==='unowned') equipStockByKey[inst.key] = (equipStockByKey[inst.key]||0)+1; });
    const equipEntries = Object.entries(EQUIP_DB).map(([k,d])=> [k, Object.assign({}, d, {desc: equipSummaryText(d), tagColor: eqTagColor(d.slot)})]);
    renderShopGrid('equipShopGrid', equipEntries, (key,it)=>{
      if(state.gold < it.cost) return;
      const iidToBuy = Object.keys(state.equipInstances).find(iid=> state.equipInstances[iid].key===key && state.equipInstances[iid].status==='unowned');
      if(!iidToBuy){ toast('已售完'); return; }
      state.gold -= it.cost;
      const slot = it.slot === 'acc' ? (['acc1','acc2','acc3'].find(s=>!c.equipment[s]) || 'acc1') : it.slot;
      if(c.equipment[slot]){
        const oldInst = equipInstOf(c.equipment[slot]);
        if(oldInst) oldInst.status = 'owned'; // 該部位原本裝備的東西，改存進倉庫而不是直接消失
      }
      state.equipInstances[iidToBuy].status = 'equipped';
      c.equipment[slot] = iidToBuy;
      toast('已裝備 '+it.name);
      saveGame(); renderPrep();
    }, (key)=> !equipStockByKey[key], null, null, 'gold', '已售完');
    renderEquipWarehouseList(c);
  }

  if(prepState.tab === 'skill'){
    body.innerHTML = `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">技能欄位（8格）</div>
      <div class="slotgrid">` + c.skills.map((sk,i)=>{
        const d = skillDefOf(sk);
        const inst = skillInstOf(sk);
        const maxed = inst && inst.level >= SKILL_UPGRADE_CAP;
        const nextCost = inst ? skillUpgradeCost(inst.level+1) : 0;
        return `<div class="slot ${d?'':'empty'}" style="${d?`--accent:${skillTypeColor(d.type)}`:''}">
          <div class="k">格 ${i+1}${inst ? ` · Lv.${inst.level}` : ''}</div>
          <div class="v">${d?d.name:'空位'}</div>
          ${d ? `<div class="slot-effect">${skillSummaryText(d)}${inst && inst.level>1 ? `（強化中，power/heal再+${(inst.level-1)*SKILL_LEVEL_POWER_BONUS_PER_LEVEL}）` : ''}</div>` : ''}
          ${sk ? `<button class="btn small" data-upgrade-skill="${i}" style="margin-top:4px;width:100%;" ${maxed || state.crystal<nextCost ? 'disabled':''}>${maxed ? '已滿級' : `強化 (${nextCost}水晶)`}</button>` : ''}
          ${d ? `<button class="btn small" data-unequip-skill="${i}" style="margin-top:4px;width:100%;">卸除</button>` : ''}
        </div>`;
      }).join('') + `</div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">技能商店（${SKILL_SHOP_KEYS.length}/9）</div>
      <div class="slotgrid" id="skillShopGrid"></div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">技能書倉庫（${Object.values(state.skillInstances).filter(i=>i.status==='owned').length}本）· owner限制已拿掉（設計文件第五節定案），任何角色都能裝上倉庫裡的技能書，除非該技能設了charReq限定</div>
      <div id="skillWarehouseList"></div>`;
    body.querySelectorAll('[data-unequip-skill]').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = parseInt(btn.dataset.unequipSkill);
        const iid = c.skills[idx];
        const inst = skillInstOf(iid);
        if(inst) inst.status = 'owned';
        c.skills[idx] = null;
        toast('已卸除，收進技能書倉庫');
        saveGame(); renderPrep();
      };
    });
    body.querySelectorAll('[data-upgrade-skill]').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = parseInt(btn.dataset.upgradeSkill);
        const inst = skillInstOf(c.skills[idx]);
        if(!inst || inst.level >= SKILL_UPGRADE_CAP) return;
        const cost = skillUpgradeCost(inst.level+1);
        if(state.crystal < cost){ toast('水晶不足'); return; }
        state.crystal -= cost;
        inst.level++;
        toast('已強化至 Lv.'+inst.level);
        saveGame(); renderPrep();
      };
    });
    const skillStockByKey = {};
    Object.values(state.skillInstances).forEach(inst=>{ if(inst.status==='unowned') skillStockByKey[inst.key] = (skillStockByKey[inst.key]||0)+1; });
    const alreadyKnownKeys = new Set(c.skills.filter(Boolean).map(iid=> skillInstOf(iid) && skillInstOf(iid).key).filter(Boolean));
    const skillEntries = SKILL_SHOP_KEYS.map(k=>{ const d=SKILL_DB[k]; return [k, Object.assign({}, d, {cost:SKILL_SHOP_COST[k], desc:skillSummaryText(d), tagColor:skillTypeColor(d.type)})]; });
    renderShopGrid('skillShopGrid', skillEntries, (key,it)=>{
      if(!canUse(SKILL_DB[key], c.id)){ toast('此角色無法學習這個技能'); return; }
      const emptyIdx = c.skills.findIndex(x=>!x);
      if(emptyIdx<0){ toast('技能欄位已滿，無法學習新技能'); return; }
      if(state.crystal < it.cost) return;
      const iidToBuy = Object.keys(state.skillInstances).find(iid=> state.skillInstances[iid].key===key && state.skillInstances[iid].status==='unowned');
      if(!iidToBuy){ toast('已售完'); return; }
      state.crystal -= it.cost;
      state.skillInstances[iidToBuy].status = 'equipped';
      c.skills[emptyIdx] = iidToBuy;
      toast('已學會 '+it.name);
      saveGame(); renderPrep();
    }, (key)=> alreadyKnownKeys.has(key) || !skillStockByKey[key], null, null, 'crystal', '已擁有/已售完');
    renderSkillWarehouseList(c);
  }

  if(prepState.tab === 'item'){
    body.innerHTML = `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">道具欄位（8格）</div>
    <div class="slotgrid">` + c.items.map((it,i)=>{
      const d = itemDefOf(it);
      return `<div class="slot ${d?'':'empty'}">
        <div class="k">格 ${i+1}</div>
        <div class="v">${d?d.name:'空位'}</div>
        ${d ? `<div class="slot-effect">${itemSummaryText(d)}</div>` : ''}
        ${d ? `<button class="btn small" data-unequip-item="${i}" style="margin-top:4px;width:100%;">卸除</button>` : ''}
      </div>`;
    }).join('') + `</div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">道具商店（${Object.keys(ITEM_DB).length}/16，其餘格位保留給之後新增的道具）</div>
      <div class="slotgrid" id="itemShopGrid"></div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">共用道具倉庫（${Object.values(state.itemInstances).filter(i=>i.status==='owned').length}件）· 卸下的道具不分角色，任何人都能重新拿取，也可以直接賣出</div>
      <div id="itemWarehouseList"></div>`;
    body.querySelectorAll('[data-unequip-item]').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = parseInt(btn.dataset.unequipItem);
        const iid = c.items[idx];
        const inst = itemInstOf(iid);
        if(inst) inst.status = 'owned';
        c.items[idx] = null;
        toast('已卸除，收進道具倉庫');
        saveGame(); renderPrep();
      };
    });
    const itemStockByKey = {};
    Object.values(state.itemInstances).forEach(inst=>{ if(inst.status==='unowned') itemStockByKey[inst.key] = (itemStockByKey[inst.key]||0)+1; });
    const itemEntries = Object.entries(ITEM_DB).map(([k,d])=> [k, Object.assign({}, d, {desc: itemSummaryText(d)})]);
    renderShopGrid('itemShopGrid', itemEntries, (key,it)=>{
      const emptyIdx = c.items.findIndex(x=>!x);
      if(emptyIdx<0){ toast('道具欄已滿'); return; }
      if(state.gold < it.cost) return;
      const iidToBuy = Object.keys(state.itemInstances).find(iid=> state.itemInstances[iid].key===key && state.itemInstances[iid].status==='unowned');
      if(!iidToBuy){ toast('已售完'); return; }
      state.gold -= it.cost;
      state.itemInstances[iidToBuy].status = 'equipped';
      c.items[emptyIdx] = iidToBuy;
      toast('已購買 '+it.name);
      saveGame(); renderPrep();
    }, (key)=> !itemStockByKey[key], 16, null, 'gold', '已售完');
    renderItemWarehouseList(c);
  }

  if(prepState.tab === 'stat'){
    const armorBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'armor'), 0);
    const defBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'def'), 0) + trainingBonus(c,'def');
    const atkBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'atk'), 0) + trainingBonus(c,'atk');
    const spdBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'spd'), 0);
    const hpBonus = trainingBonus(c,'hp');
    const spBonus = trainingBonus(c,'sp');

    const expNeed = c.level < 20 ? LEVEL_GROWTH_TABLE[c.level+1] : null;
    const lvMaxed = c.level >= 20;

    // 統一用跟裝備/技能/道具同一套 .slot/.slotgrid 元件，卡片外觀/大小完全一致，
    // 只是內容換成屬性鍛鍊用的數值/按鈕（比照equip tab「等級+強化按鈕」那套排法）
    function trainSlot(key, label, tagColor, curValue){
      const trained = c.training[key];
      const maxed = trained >= ATTR_TRAIN_CAP;
      const cost = attrTrainCost(trained);
      return `<div class="slot" style="--accent:${tagColor}">
        <div class="slot-tagdot" style="background:${tagColor}"></div>
        <div class="k">${label}${trained>0?` · +${trained}`:''}</div>
        <div class="v">${curValue}</div>
        <div class="slot-effect">${maxed ? '已達上限' : `花費 ${cost} 天賦天球`}</div>
        <button class="btn small" data-train="${key}" style="margin-top:4px;width:100%;" ${maxed || state.sphere<cost ? 'disabled':''}>${maxed?'已封頂':'鍛鍊 +1'}</button>
      </div>`;
    }

    body.innerHTML = `

<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">屬性欄位（8格）</div>

<div class="slotgrid">
        <div class="slot" style="--accent:var(--attr-lv)">
          <div class="slot-tagdot" style="background:var(--attr-lv)"></div>
          <div class="k">LV等級</div>
          <div class="v">Lv.${c.level}</div>
          <div class="slot-effect">經驗 ${state.expPool}${expNeed?`/${expNeed}`:''}</div>
          <button class="btn small" id="levelUpBtn" style="margin-top:4px;width:100%;" ${lvMaxed || !expNeed || state.expPool<expNeed ? 'disabled':''}>${lvMaxed?'已封頂':'升級'}</button>
        </div>
        ${trainSlot('hp','HP生命','var(--hp)', c.maxHp+hpBonus)}
        ${trainSlot('sp',c.resName,'var(--attr-sp)', c.resMax+spBonus)}
        <div class="slot empty"><div class="k">暫定</div><div class="v">未來屬性</div></div>
        ${trainSlot('atk','ATK攻擊','var(--attr-atk)', c.atk+atkBonus)}
        ${trainSlot('def','DEF防禦','var(--attr-def)', c.def+defBonus)}
        <div class="slot empty"><div class="k">暫定</div><div class="v">未來屬性</div></div>
        <div class="slot empty"><div class="k">暫定</div><div class="v">未來屬性</div></div>
      </div>
      <div class="stat-row"><span class="k">速度</span><span class="v">${c.spd + spdBonus}</span></div>
      <div class="stat-row"><span class="k">鎧甲值</span><span class="v">${c.armor + armorBonus}</span></div>

      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">寶物庫（${Object.keys(TREASURY_DB).length}/8，稀有特殊物品，其餘格位待未來擴充）</div>
      <div class="slotgrid" id="treasuryGrid"></div>
    `;
    const levelUpBtn = document.getElementById('levelUpBtn');
    if(levelUpBtn) levelUpBtn.onclick = ()=>{
      if(c.level >= 20 || state.expPool < LEVEL_GROWTH_TABLE[c.level+1]) return;
      state.expPool -= LEVEL_GROWTH_TABLE[c.level+1];
      c.level++;
      toast(c.name+' 升到 Lv.'+c.level);
      saveGame(); renderPrep();
    };
    body.querySelectorAll('[data-train]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.train;
        const trained = c.training[key];
        if(trained >= ATTR_TRAIN_CAP) return;
        const cost = attrTrainCost(trained);
        if(state.sphere < cost){ toast('天賦天球不足'); return; }
        state.sphere -= cost;
        c.training[key]++;
        toast(c.name+' 的 '+key.toUpperCase()+' 鍛鍊 +1');
        saveGame(); renderPrep();
      };
    });
    const treasuryStockByKey = {};
    Object.values(state.equipInstances).forEach(inst=>{ if(inst.status==='unowned' && TREASURY_DB[inst.key]) treasuryStockByKey[inst.key] = (treasuryStockByKey[inst.key]||0)+1; });
    const treasuryEntries = Object.entries(TREASURY_DB).map(([k,d])=> [k, Object.assign({}, d, {desc: equipSummaryText(d)})]);
    renderShopGrid('treasuryGrid', treasuryEntries, (key,it)=>{
      if(state.gold < it.cost) return;
      const iidToBuy = Object.keys(state.equipInstances).find(iid=> state.equipInstances[iid].key===key && state.equipInstances[iid].status==='unowned');
      if(!iidToBuy){ toast('已售完'); return; }
      state.gold -= it.cost;
      const slot = ['acc1','acc2','acc3'].find(s=>!c.equipment[s]) || 'acc1';
      if(c.equipment[slot]){
        const oldInst = equipInstOf(c.equipment[slot]);
        if(oldInst) oldInst.status = 'owned'; // 原本飾品格滿時，舊飾品改存進倉庫而不是直接消失
      }
      state.equipInstances[iidToBuy].status = 'equipped';
      c.equipment[slot] = iidToBuy;
      toast('已裝備 '+it.name);
      saveGame(); renderPrep();
    }, (key)=> !treasuryStockByKey[key], 8, null, 'gold', '已售完');
  }
}

/* ============================================================
   通用商店格狀渲染
   entries: [[key, itemData], ...]
   onBuy(key, itemData)：點擊購買時執行
   ownedCheckFn(key)：可選，若回傳true，該格會顯示soldOutLabel且不可購買
     （原本語意是「已擁有」，現在庫存交給個體實例的unowned數量決定，
     所以這裡的意思改成「沒有庫存可買了」，文字用soldOutLabel控制）
   totalSlots：格子總數（含尚未上架的空格），預設等於entries數量
   soldOutLabel：售完時按鈕文字，預設'已擁有'（相容舊呼叫），新的呼叫可傳'已售完'
============================================================ */
function renderShopGrid(containerId, entries, onBuy, ownedCheckFn, totalSlots, extraLookup, currency, soldOutLabel){
  const grid = document.getElementById(containerId);
  if(!grid) return;
  currency = currency || 'gold'; // 'gold' 或 'crystal'，決定這個商店格用哪種貨幣顯示/扣款
  const currencyLabel = currency === 'crystal' ? '水晶' : '金';
  const currencyShortage = currency === 'crystal' ? '水晶不足' : '金幣不足';
  soldOutLabel = soldOutLabel || '已擁有';
  const slotCount = totalSlots || entries.length;
  for(let i=0;i<slotCount;i++){
    if(i >= entries.length){
      const div = document.createElement('div');
      div.className = 'slot empty';
      div.innerHTML = `<div class="k">格 ${i+1}</div><div class="v">尚未上架</div>`;
      grid.appendChild(div);
      continue;
    }
    const [key, it] = entries[i];
    const owned = ownedCheckFn ? ownedCheckFn(key) : false;
    const div = document.createElement('div');
    div.className = 'slot';
    if(it.tagColor) div.style.setProperty('--accent', it.tagColor); // 左側色條跟右上角圓點吃同一個顏色值
    div.innerHTML = `${it.tagColor ? `<div class="slot-tagdot" style="background:${it.tagColor}"></div>` : ''}<div class="k">${it.cost} ${currencyLabel}</div><div class="v">${it.name}</div>${it.desc ? `<div class="slot-effect">${it.desc}</div>` : ''}`;
    const btn = document.createElement('button');
    btn.className = 'btn small';
    btn.style.marginTop = '4px';
    btn.style.width = '100%';
    if(owned){ btn.textContent = soldOutLabel; btn.disabled = true; }
    else if(state[currency] < it.cost){ btn.textContent = currencyShortage; btn.disabled = true; }
    else { btn.textContent = '購買'; btn.onclick = ()=> onBuy(key, it); }
    div.appendChild(btn);
    grid.appendChild(div);
  }
}

// 敵人id生成器：改用遞增計數器取代 Date.now()，避免同一毫秒內連續召喚同模板敵人時id碰撞
// 用法：呼叫 nextEnemyId('前綴') 即可拿到保證不重複的id，例如 nextEnemyId('goblin') -> 'goblin_0', 'goblin_1'...
let __enemySpawnCounter = 0;
function nextEnemyId(prefix){ return prefix + '_' + (__enemySpawnCounter++); }

// 顯示名稱用的字母編號計數器（跟 nextEnemyId 的id計數器分開，只負責「哥布林A/B/C...」這種顯示用命名）
let __goblinNameCounter = 0;

const ENEMY_TEMPLATES = {
  // 原本 goblinA / goblinB 是各自寫死一份幾乎相同的資料，只差name字串，
  // 現在合併成單一模板，每次呼叫自動產生遞增字母（哥布林A、哥布林B...），
  // 不管戰場上要出現幾隻，都只需要維護這一份資料
  goblin: ()=> ({ id:nextEnemyId('goblin'), portraitKey:'goblin', name:'哥布林'+String.fromCharCode(65+(__goblinNameCounter++ % 26)), side:'enemy', hp:20,maxHp:20, atk:6, def:1, spd:10, armor:0, resName:'-', res:0, resMax:0, skills:['goblin_hit'], alive:true }),
  goblinShaman: ()=> ({ id:nextEnemyId('goblinShaman'), portraitKey:'goblin', name:'哥布林薩滿', side:'enemy', hp:16,maxHp:16, atk:4, def:1, spd:10, armor:0, resName:'-', res:0, resMax:0, skills:['goblin_hit','goblin_heal'], alive:true }),
};

const BATTLES = {
  goblin_patrol: {
    name:'哥布林巡邏隊', isBoss:false, bg:'bg002.png',
    // enemies 改成函式：每次 startBattle() 呼叫這個函式時才真正執行 ENEMY_TEMPLATES 生成新的敵人實例，
    // 不是網頁載入時就固定好——這樣重複挑戰同一場戰鬥時，每次的敵人id才會是全新的，
    // 不會沿用上一次挑戰時的舊id（之前的寫法是陣列在BATTLES物件建立當下就執行完畢，導致重複開戰id永遠一樣）
    enemies: ()=> [ ENEMY_TEMPLATES.goblin(), ENEMY_TEMPLATES.goblin(), ENEMY_TEMPLATES.goblinShaman(), ENEMY_TEMPLATES.goblinShaman() ],
    unlockFlag:'defeated_goblin_patrol',
  }
};

/* ============================================================
   BATTLE STATE
============================================================ */
let battle = null;

// 行動順序規則開關：
//   true  = 每回合都重新擲速度排序（原本的行為，速度快的人不保證每回合都排前面，因為有隨機值）
//   false = 只有第1回合擲一次排序，之後每回合都照第1回合定下的順序走（速度快的人永遠排在同一位置）
// 想切換時只要改這一行的 true/false 即可，其餘程式碼不用動。
const REROLL_ORDER_EACH_ROUND = false;

function startBattle(battleKey, chapterId){
  if(state.party.filter(p=>p.active).length === 0){
    toast('請先在準備畫面選擇至少1名角色上場');
    return;
  }
  const def = BATTLES[battleKey];
  __goblinNameCounter = 0; // 每次開戰重置顯示名稱計數器，讓哥布林命名固定從A開始，不會累計到上次挑戰的字母
  const allies = state.party.filter(p=>p.active).map(p=>({
    id:p.id, name:p.name, side:'ally', ref:p,
    hp:p.hp, maxHp:p.maxHp + trainingBonus(p,'hp'),
    atk:p.atk + equipBonus(p,'atk') + trainingBonus(p,'atk'), def:p.def + equipBonus(p,'def') + trainingBonus(p,'def'),
    spd:p.spd + equipBonus(p,'spd'), armor:p.armor + equipBonus(p,'armor'),
    resName:p.resName, res:p.resMax + trainingBonus(p,'sp'), resMax:p.resMax + trainingBonus(p,'sp'),
    skills:p.skills.filter(Boolean).map(iid=>{ const inst = skillInstOf(iid); return inst ? inst.key : null; }).filter(Boolean),
    skillLevels: (()=>{ // 每個技能key目前的強化等級，供executeSkill算加成用
      const m = {};
      p.skills.filter(Boolean).forEach(iid=>{ const inst = skillInstOf(iid); if(inst) m[inst.key] = inst.level; });
      return m;
    })(),
    items:p.items.filter(Boolean).map(iid=>{ const inst = itemInstOf(iid); return inst ? inst.key : null; }).filter(Boolean),
    alive:true, x:-1,y:-1, cooldowns:{},
  }));
  const enemies = def.enemies().map(e=> Object.assign({}, e, {x:-1,y:-1, cooldowns:{}, items:[]}));

  // place on grid: allies col 0-1, enemies col 10-11
  allies.forEach((u,i)=>{ u.x = i%2; u.y = i<2?i:i-2; });
  // fix positions properly: 上場人數不固定4人，依實際上場名單排列，最多4排
  allies.forEach((u,i)=>{ u.x = 0; u.y = i; });
  enemies.forEach((u,i)=>{ u.x = 11; u.y = i; });

  battle = {
    def, allies, enemies,
    chapterId: chapterId != null ? chapterId : null,
    round: 1,
    order: [],
    orderIdx: 0,
    log: [],
    selected: { skill:null, mode:null }, // mode: 'move'|'skill'|'inspect'（普通攻擊已併入技能系統，不再有獨立的'attack'模式）
    finished:false,
    floorItems: {}, // 場上可拾取物品，key格式 "x,y" -> ITEM_DB的鍵名
  };
  seedFloorItems(); // 測試用：戰鬥開始時在空地上隨機灑幾樣可撿的物品
  rollOrder();
  startActorTurn(currentActor()); // 第一位行動者的三旗標名額初始化
  playBgm(def.isBoss ? 'Kawaii_Dimension_.mp3' : 'Just_Started.mp3');
  switchView('battle');
  setNavLocked(true);
  renderBattle();
}

function allUnits(){
  return battle.allies.concat(battle.enemies);
}
function aliveUnits(){
  return allUnits().filter(u=>u.hp>0 || u.downButAlive); // hp<=0 units stay but skip turn
}
function equipBonus(p, key){
  return Object.values(p.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid, key), 0);
}

function rollOrder(){
  const units = allUnits();
  units.forEach(u=>{ u._speedRoll = u.spd + 1 + Math.floor(Math.random()*20); });
  battle.order = units.slice().sort((a,b)=> b._speedRoll - a._speedRoll);
  battle.orderIdx = 0;
}

function currentActor(){
  return battle.order[battle.orderIdx];
}

function logMsg(html){
  battle.log.push(html);
  if(battle.log.length > 100) battle.log.shift();
}

function playBgm(file){
  const bgm = document.getElementById('bgm');
  if(bgm.getAttribute('data-cur') === file) return;
  bgm.src = file;
  bgm.setAttribute('data-cur', file);
  bgm.volume = 0.35;
  bgm.play().catch(()=>{});
}
