              if(!inst || inst.level>=SKILL_UPGRADE_CAP) return;
              const cost = skillUpgradeCost(inst.level+1);
              if(state.crystal < cost){ toast('水晶不足'); return; }
              state.crystal -= cost;
              inst.level++;
              toast('已強化至 Lv.'+inst.level);
              saveGame(); renderPrep();
            }
          }]
        });
      };
    });
    // 【v0.25】改回「每份實例各自一張卡」，賣出拿掉，強化owned卡也能直接點卡片使用。
    // 技能key清單改成「SKILL_SHOP_KEYS ∪ 遊戲裡實際存在的技能key」聯集，而不是只認SKILL_SHOP_KEYS：
    // 因為像梅恩的起始技能「聖光」(holy_light)不在商店清單裡（角色專屬技能，商店不賣），
    // 如果只認SKILL_SHOP_KEYS，卸下聖光後這本書會找不到地方顯示、憑空消失。改成聯集後，
    // 只要state.skillInstances裡實際存在這個key，不管有沒有在商店清單，卸下來都保證找得到卡片顯示。
    const skillInstList = Object.entries(state.skillInstances);
    const allSkillKeys = [...new Set([...SKILL_SHOP_KEYS, ...skillInstList.map(([iid,inst])=>inst.key)])];
    const alreadyKnownKeys = new Set(c.skills.filter(Boolean).map(iid=> skillInstOf(iid) && skillInstOf(iid).key).filter(Boolean));
    let skillCards = [];
    allSkillKeys.forEach(key=>{
      const d = SKILL_DB[key];
      if(!d) return; // 保險：資料表沒有這個key就跳過，不會畫出壞掉的卡
      const cost = SKILL_SHOP_COST[key] || 0; // 沒在商店賣的角色專屬技能沒有價格，但這類key也不會有unowned實例，購買分支用不到
      const instsOfKey = skillInstList.filter(([iid,inst])=> inst.key===key && inst.status!=='equipped');
      instsOfKey.forEach(([iid,inst])=> skillCards.push({key, d, cost, iid, status:inst.status, level:inst.level}));
    });
    const pgS = paginate(skillCards, prepState.page.skill);
    prepState.page.skill = pgS.page;
    renderPager('skillPager', 'skill', pgS.page, pgS.totalPages);
    const skillGrid2 = document.getElementById('skillShopGrid');
    for(let i=0;i<PREP_PAGE_SIZE;i++){
      if(i >= pgS.pageItems.length){
        const div = document.createElement('div');
        div.className = 'slot empty';
        div.innerHTML = `<div class="k">格 ${i+1}</div><div class="v">尚未上架</div>`;
        skillGrid2.appendChild(div);
        continue;
      }
      const {key, d, cost, iid, status, level} = pgS.pageItems[i];
      const owned = status==='owned';
      const known = alreadyKnownKeys.has(key);
      const div = document.createElement('div');
      div.className = 'slot' + (owned ? ' owned' : '');
      div.style.setProperty('--accent', skillTypeColor(d.type));
      div.innerHTML = `${owned ? `<div class="slot-status-badge">已持有</div>` : known ? `<div class="slot-status-badge">已學會</div>` : ''}
        <div class="k">${cost>0 ? cost+' 水晶' : ''}</div>
        <div class="v">${d.name}</div>
        ${owned ? `<div class="slot-level-badge">+${level-1}</div>` : ''}`;
      const btn = document.createElement('button');
      btn.className = 'btn small';
      btn.style.marginTop = '4px'; btn.style.width = '100%';
      const learnThis = ()=>{
        if(!canUse(d, c.id)){ toast('此角色無法學習這個技能'); return; }
        const emptyIdx = c.skills.findIndex(x=>!x);
        if(emptyIdx<0){ toast('技能欄位已滿，無法學習新技能'); return; }
        state.skillInstances[iid].status = 'equipped';
        c.skills[emptyIdx] = iid;
        toast('已學會 '+d.name);
        saveGame(); renderPrep();
      };
      if(owned){
        btn.textContent = '裝上';
        btn.disabled = known;
        btn.onclick = (e)=>{ e.stopPropagation(); learnThis(); };
      } else {
        btn.textContent = '購買';
        btn.disabled = known || state.crystal < cost;
        btn.onclick = (e)=>{
          e.stopPropagation();
          if(known){ toast('此角色已經會這個技能了'); return; }
          if(state.crystal < cost) return;
          state.crystal -= cost;
          learnThis();
        };
      }
      div.appendChild(btn);
      div.onclick = ()=>{
        const actions = [];
        if(owned){
          const inst = state.skillInstances[iid];
          const maxed = inst.level >= SKILL_UPGRADE_CAP;
          const nextCost = skillUpgradeCost(inst.level+1);
          actions.push({ label: maxed ? '已滿級' : `強化 (${nextCost}水晶)`, disabled: maxed || state.crystal<nextCost, onClick: ()=>{
            if(maxed) return;
            if(state.crystal<nextCost){ toast('水晶不足'); return; }
            state.crystal -= nextCost;
            inst.level++;
            toast('已強化至 Lv.'+inst.level);
            saveGame(); renderPrep();
          }});
        }
        openPrepPanel({ title: d.name + (owned?`（Lv.${level}）`:''), desc: skillSummaryText(d), actions });
      };
      skillGrid2.appendChild(div);
    }
    renderPrepInfoPanel();
  }

  if(prepState.tab === 'item'){
    body.innerHTML = `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">道具欄位（8格）</div>
    <div class="slotgrid">` + c.items.map((it,i)=>{
      const d = itemDefOf(it);
      return `<div class="slot ${d?'':'empty'}" ${d?`data-equipped-item="${i}"`:''} style="${d?`--accent:${skillTypeColor(d.type)}`:''}">
        ${d ? `<button class="slot-close-btn" data-unequip-item="${i}" title="卸除">✕</button>` : ''}
        ${d ? '' : `<div class="k">格 ${i+1}</div>`}
        <div class="v">${d?d.name:'空位'}</div>
        ${d ? `<div class="slot-effect">${truncateText(itemSummaryText(d))}</div>` : ''}
      </div>`;
    }).join('') + `</div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">道具商店 · 每一份道具都各自一張卡（含已持有），用盡的會自動回到這裡可重新購買</div>
      <div class="prep-pagination" id="itemPager"></div>
      <div class="slotgrid" id="itemShopGrid"></div>`;
    body.querySelectorAll('[data-unequip-item]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const idx = parseInt(btn.dataset.unequipItem);
        const iid = c.items[idx];
        const inst = itemInstOf(iid);
        if(inst) inst.status = 'owned';
        c.items[idx] = null;
        toast('已卸除，收進道具倉庫');
        saveGame(); renderPrep();
      };
    });
    body.querySelectorAll('[data-equipped-item]').forEach(div=>{
      div.onclick = ()=>{
        const idx = parseInt(div.dataset.equippedItem);
        const iid = c.items[idx];
        const d = itemDefOf(iid);
        if(!d) return;
        openPrepPanel({ title: d.name, desc: itemSummaryText(d), actions: [] }); // 道具沒有強化系統，僅顯示說明
      };
    });
    // 【v0.25】跟裝備/技能一樣改回「每份實例各自一張卡」，賣出拿掉。道具沒有等級/強化系統，
    // 所以owned卡點開的說明視窗不會有任何操作按鈕，純粹顯示說明文字
    const itemInstList = Object.entries(state.itemInstances);
    let itemCards = [];
    Object.keys(ITEM_DB).forEach(key=>{
      const d = ITEM_DB[key];
      const instsOfKey = itemInstList.filter(([iid,inst])=> inst.key===key && inst.status!=='equipped');
      instsOfKey.forEach(([iid,inst])=> itemCards.push({key, d, iid, status:inst.status}));
    });
    const pgI = paginate(itemCards, prepState.page.item);
    prepState.page.item = pgI.page;
    renderPager('itemPager', 'item', pgI.page, pgI.totalPages);
    const itemGrid2 = document.getElementById('itemShopGrid');
    for(let i=0;i<PREP_PAGE_SIZE;i++){
      if(i >= pgI.pageItems.length){
        const div = document.createElement('div');
        div.className = 'slot empty';
        div.innerHTML = `<div class="k">格 ${i+1}</div><div class="v">尚未上架</div>`;
        itemGrid2.appendChild(div);
        continue;
      }
      const {d, iid, status} = pgI.pageItems[i];
      const owned = status==='owned';
      const div = document.createElement('div');
      div.className = 'slot' + (owned ? ' owned' : '');
      div.style.setProperty('--accent', skillTypeColor(d.type));
      div.innerHTML = `${owned ? `<div class="slot-status-badge">已持有</div>` : ''}
        <div class="k">${d.cost} 金</div>
        <div class="v">${d.name}</div>`;
      const btn = document.createElement('button');
      btn.className = 'btn small';
      btn.style.marginTop = '4px'; btn.style.width = '100%';
      const doTake = ()=>{
        const emptyIdx = c.items.findIndex(x=>!x);
        if(emptyIdx<0){ toast('道具欄已滿'); return; }
        state.itemInstances[iid].status = 'equipped';
        c.items[emptyIdx] = iid;
        toast('已取得 '+d.name);
        saveGame(); renderPrep();
      };
      if(owned){
        btn.textContent = '裝上';
        btn.onclick = (e)=>{ e.stopPropagation(); doTake(); };
      } else {
        btn.textContent = '購買';
        if(state.gold < d.cost) btn.disabled = true;
        btn.onclick = (e)=>{ e.stopPropagation(); if(state.gold < d.cost) return; state.gold -= d.cost; doTake(); };
      }
      div.appendChild(btn);
      div.onclick = ()=> openPrepPanel({ title: d.name, desc: itemSummaryText(d), actions: [] });
      itemGrid2.appendChild(div);
    }
    renderPrepInfoPanel();
  }

  if(prepState.tab === 'stat'){
    // v0.26大改版：atk/def/armor → patk/pdef/pres，新增元素(eatk/edef/eres)/神秘(matk/mdef/mres)，
    // 頁面拆成兩頁（跟equip/item分頁共用.prep-tab視覺，但這裡是「換一組8格」不是「翻頁」，狀態存在prepState.statPage）。
    // 寶物庫已移除，原本位置改放milestone(16格，2頁)。
    const pdefBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'pdef'), 0);// + trainingBonus(c,'def');
    const patkBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'patk'), 0);// + trainingBonus(c,'atk');
    const presBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'pres'), 0);
    const spdBonus  = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'spd'), 0);
    const eatkBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'eatk'), 0);
    const edefBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'edef'), 0);
    const eresBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'eres'), 0);
    const matkBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'matk'), 0);
    const mdefBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'mdef'), 0);
    const mresBonus = Object.values(c.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid,'mres'), 0);
    const hpBonus = trainingBonus(c,'hp');
    // 【修正舊bug】原本這裡只加了trainingBonus，漏了equipBonus(c,'res')，屬性頁顯示的TP上限一直少算裝備加成，這次順便補上
    const spBonus = trainingBonus(c,'sp') + equipBonus(c,'res');

    const expNeed = c.level < 30 ? LEVEL_GROWTH_TABLE[c.level+1] : null;
    const lvMaxed = c.level >= 30;

    // 可鍛鍊的屬性卡（HP/TP/PATK/PDEF），沿用既有鍛鍊機制
    function trainSlot(key, label, tagColor, curValue){
      const trained = c.training[key];
      const maxed = trained >= ATTR_TRAIN_CAP;
      const cost = attrTrainCost(trained);
      return `<div class="slot">
        <div class="slot-tagdot" style="background:${tagColor}"></div>
        <div class="k">${label}${trained>0?` · +${trained}`:''}</div>
        <div class="v">${curValue}</div>
        <div class="slot-effect">${maxed ? '已達上限' : `花費 ${cost} 天賦天球`}</div>
        <button class="btn small" data-train="${key}" style="margin-top:4px;width:100%;" ${maxed || state.sphere<cost ? 'disabled':''}>${maxed?'已封頂':'鍛鍊 +1'}</button>
      </div>`;
    }
    // 純顯示屬性卡（元素/神秘系、sanity、強韌/反應/意志），目前沒有鍛鍊系統，之後要加再比照trainSlot擴充
    function dispSlot(label, tagColor, curValue, note){
      return `<div class="slot">
        <div class="slot-tagdot" style="background:${tagColor}"></div>
        <div class="k">${label}</div>
        <div class="v">${curValue}</div>
        <div class="slot-effect">${note||''}</div>
      </div>`;
    }

    const page1Html = `<div class="slotgrid">
        ${trainSlot('hp','HP生命','var(--hp)', c.maxHp+hpBonus)}
        ${trainSlot('atk','PATK物理攻擊','var(--attr-atk)', c.patk+patkBonus)}
        ${trainSlot('def','PDEF物理防禦','var(--attr-def)', c.pdef+pdefBonus)}
        ${dispSlot('PRES物理減免','var(--attr-def)', c.pres+presBonus, '傷害≤此值無法穿透')}
        ${trainSlot('sp','MP('+c.resName+')','var(--attr-sp)', c.resMax+spBonus)}
        ${dispSlot('EATK元素攻擊','var(--rarity-blue)', c.eatk+eatkBonus)}
        ${dispSlot('EDEF元素防禦','var(--rarity-blue)', c.edef+edefBonus)}
        ${dispSlot('ERES元素減免','var(--rarity-blue)', c.eres+eresBonus, '傷害≤此值無法穿透')}
      </div>`;
    const page2Html = `<div class="slotgrid">
        ${dispSlot('SANITY精神值','var(--rarity-purple)', c.sanity+'/'+c.maxSanity, '佔位中，尚未接上機制')}
        ${dispSlot('MATK神秘攻擊','var(--rarity-purple)', c.matk+matkBonus)}
        ${dispSlot('MDEF神秘防禦','var(--rarity-purple)', c.mdef+mdefBonus)}
        ${dispSlot('MRES神秘減免','var(--rarity-purple)', c.mres+mresBonus, '傷害≤此值無法穿透')}
        ${dispSlot('SPD速度','var(--text-dim)', c.spd+spdBonus)}
        ${dispSlot('TOU強韌','var(--text-dim)', c.toughness, '之後使用')}
        ${dispSlot('REF反應','var(--text-dim)', c.reflex, '之後使用')}
        ${dispSlot('WIL意志','var(--text-dim)', c.will, '之後使用')}
      </div>`;

    body.innerHTML = `

<div class="slotgrid" style="margin-bottom:8px;">
        <div class="slot">
          <div class="slot-tagdot" style="background:var(--attr-lv)"></div>
          <div class="k">LV等級</div>
          <div class="v">Lv.${c.level}</div>
          <div class="slot-effect">經驗 ${state.expPool}${expNeed?`/${expNeed}`:''}</div>
          <button class="btn small" id="levelUpBtn" style="margin-top:4px;width:100%;" ${lvMaxed || !expNeed || state.expPool<expNeed ? 'disabled':''}>${lvMaxed?'已封頂':'升級'}</button>
        </div>
      </div>

<div class="prep-tabs" id="statPageTabs" style="margin-bottom:8px;"></div>
<div id="statPageBody">${prepState.statPage===2 ? page2Html : page1Html}</div>

      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">里程碑（16格，每2級解鎖1個，其餘先佔位）</div>
      <div class="slotgrid" id="milestoneGrid"></div>
      <div class="prep-pagination" id="milestoneGridPager"></div>
    `;
    const levelUpBtn = document.getElementById('levelUpBtn');
    if(levelUpBtn) levelUpBtn.onclick = ()=>{
      if(c.level >= 20 || state.expPool < LEVEL_GROWTH_TABLE[c.level+1]) return;
      state.expPool -= LEVEL_GROWTH_TABLE[c.level+1];
      c.level++;
      toast(c.name+' 升到 Lv.'+c.level);
      saveGame(); renderPrep();
    };
    // 屬性頁1/頁2 切換，沿用行動/道具分頁同一套.prep-tab樣式
    const statTabsWrap = document.getElementById('statPageTabs');
    [[1,'屬性I（生命/物理/元素）'], [2,'屬性II（神秘/其他）']].forEach(([pg,label])=>{
      const tabBtn = document.createElement('button');
      tabBtn.textContent = label;
      tabBtn.className = 'prep-tab' + (prepState.statPage===pg ? ' active' : '');
      tabBtn.onclick = ()=>{
        if(prepState.statPage !== pg){ prepState.statPage = pg; renderPrepBody(c); }
      };
      statTabsWrap.appendChild(tabBtn);
    });
    body.querySelectorAll('[data-train]').forEach(btn=>{
      btn.onclick = ()=>{
        const key = btn.dataset.train;
        const trained = c.training[key];
        if(trained >= ATTR_TRAIN_CAP) return;
        const cost = attrTrainCost(trained);
        if(state.sphere < cost){ toast('天賦天球不足'); return; }
        state.sphere -= cost;
        c.training[key]++;
        toast(c.name+' 的 '+key.toUpperCase()+' 鍛鍊 +1');
        saveGame(); renderPrep();
      };
    });

    // milestone 16格：目前效果全部不生效（佔位），純顯示解鎖狀態，不可點擊互動
    const msSlots = getMilestoneSlots(c.id);
    const pgM = paginate(msSlots, prepState.page.milestone);
    prepState.page.milestone = pgM.page;
    renderPager('milestoneGridPager', 'milestone', pgM.page, pgM.totalPages);
    const msGrid = document.getElementById('milestoneGrid');
    pgM.pageItems.forEach((ms, i)=>{
      const div = document.createElement('div');
      if(!ms){
        div.className = 'slot empty';
        div.innerHTML = `<div class="k">未定</div><div class="v">－</div>`;
      } else {
        const unlocked = c.level >= ms.level;
        div.className = 'slot' + (unlocked ? '' : ' empty');
        div.innerHTML = `<div class="k">Lv.${ms.level}</div>
          <div class="v">${ms.name}</div>
          <div class="slot-effect">${unlocked ? ms.desc : '尚未解鎖'}</div>`;
      }
      msGrid.appendChild(div);
    });
  }
}

/* ============================================================
   通用商店格狀渲染
   entries: [[key, itemData], ...]
   onBuy(key, itemData)：點擊購買時執行
   ownedCheckFn(key)：可選，若回傳true，該格會顯示soldOutLabel且不可購買
     （原本語意是「已擁有」，現在庫存交給個體實例的unowned數量決定，
     所以這裡的意思改成「沒有庫存可買了」，文字用soldOutLabel控制）
   totalSlots：格子總數（含尚未上架的空格），預設等於entries數量
   soldOutLabel：售完時按鈕文字，預設'已擁有'（相容舊呼叫），新的呼叫可傳'已售完'
============================================================ */
function renderShopGrid(containerId, entries, onBuy, ownedCheckFn, totalSlots, extraLookup, currency, soldOutLabel){
  const grid = document.getElementById(containerId);
  if(!grid) return;
  currency = currency || 'gold'; // 'gold' 或 'crystal'，決定這個商店格用哪種貨幣顯示/扣款
  const currencyLabel = currency === 'crystal' ? '水晶' : '金';
  const currencyShortage = currency === 'crystal' ? '水晶不足' : '金幣不足';
  soldOutLabel = soldOutLabel || '已擁有';
  const slotCount = totalSlots || entries.length;
  for(let i=0;i<slotCount;i++){
    if(i >= entries.length){
      const div = document.createElement('div');
      div.className = 'slot empty';
      div.innerHTML = `<div class="k">格 ${i+1}</div><div class="v">尚未上架</div>`;
      grid.appendChild(div);
      continue;
    }
    const [key, it] = entries[i];
    const owned = ownedCheckFn ? ownedCheckFn(key) : false;
    const div = document.createElement('div');
    div.className = 'slot';
    div.innerHTML = `${it.tagColor ? `<div class="slot-tagdot" style="background:${it.tagColor}"></div>` : ''}<div class="k">${it.cost} ${currencyLabel}</div><div class="v">${it.name}</div>${it.desc ? `<div class="slot-effect">${it.desc}</div>` : ''}`;
    const btn = document.createElement('button');
    btn.className = 'btn small';
    btn.style.marginTop = '4px';
    btn.style.width = '100%';
    if(owned){ btn.textContent = soldOutLabel; btn.disabled = true; }
    else if(state[currency] < it.cost){ btn.textContent = currencyShortage; btn.disabled = true; }
    else { btn.textContent = '購買'; btn.onclick = ()=> onBuy(key, it); }
    div.appendChild(btn);
    grid.appendChild(div);
  }
}

let battle = null;

// 行動順序規則開關：
//   true  = 每回合都重新擲速度排序（原本的行為，速度快的人不保證每回合都排前面，因為有隨機值）
//   false = 只有第1回合擲一次排序，之後每回合都照第1回合定下的順序走（速度快的人永遠排在同一位置）
// 想切換時只要改這一行的 true/false 即可，其餘程式碼不用動。
const REROLL_ORDER_EACH_ROUND = false;

function startBattle(battleKey, chapterId, encounterContext){
  if(state.party.filter(p=>p.active).length === 0){
    toast('請先在準備畫面選擇至少1名角色上場');
    return;
  }
  const def = BATTLES[battleKey];
  __goblinNameCounter = 0; // 每次開戰重置顯示名稱計數器，讓哥布林命名固定從A開始，不會累計到上次挑戰的字母
  __byakheeNameCounter = 0; // 拜亞基同理重置
  const allies = state.party.filter(p=>p.active).map(p=>({
    id:p.id, name:p.name, side:'ally', ref:p,
    hp:p.hp, maxHp:p.maxHp + trainingBonus(p,'hp'),
    // v0.26：atk/def/armor → patk/pdef/pres，另外三系新欄位一併烘焙（目前多數是0，之後裝備/角色天生值出現再自然吃到）
    patk:p.patk + equipBonus(p,'patk') + trainingBonus(p,'atk'), pdef:p.pdef + equipBonus(p,'pdef') + trainingBonus(p,'def'),
    pres:p.pres + equipBonus(p,'pres'),
    eatk:p.eatk + equipBonus(p,'eatk'), edef:p.edef + equipBonus(p,'edef'), eres:p.eres + equipBonus(p,'eres'),
    matk:p.matk + equipBonus(p,'matk'), mdef:p.mdef + equipBonus(p,'mdef'), mres:p.mres + equipBonus(p,'mres'),
    spd:p.spd + equipBonus(p,'spd'),
    sanity:p.sanity, maxSanity:p.maxSanity, toughness:p.toughness, reflex:p.reflex, will:p.will,
    resName:p.resName, res:p.resMax + trainingBonus(p,'sp') + equipBonus(p,'res'), resMax:p.resMax + trainingBonus(p,'sp') + equipBonus(p,'res'),
    skills:p.skills.filter(Boolean).map(iid=>{ const inst = skillInstOf(iid); return inst ? inst.key : null; }).filter(Boolean),
    skillLevels: (()=>{ // 每個技能key目前的強化等級，供executeSkill算加成用
      const m = {};
      p.skills.filter(Boolean).forEach(iid=>{ const inst = skillInstOf(iid); if(inst) m[inst.key] = inst.level; });
      return m;
    })(),
    items:p.items.filter(Boolean).map(iid=>{ const inst = itemInstOf(iid); return inst ? inst.key : null; }).filter(Boolean),
    alive:true, x:-1,y:-1, cooldowns:{}, statuses:[],
  }));
  const enemies = def.enemies().map(e=> Object.assign({}, e, {x:-1,y:-1, cooldowns:{}, items:[], statuses:[]}));

  // v0.35：12x12戰場的固定開戰站位（MOMO指定），我方4格2x2群聚在左側，敵方對稱鏡射在右側。
  // 目前是「依上場/生成順序」對應下面陣列的順序，不是按角色/敵人種類指定哪個一定站哪格——
  // 我方固定4人剛好對上4格沒問題；但敵方數量不固定（哥布林戰2~3隻、訓練人偶1隻、毀滅者4隻…），
  // 數量不足4就只用前N格、超過4的狀況目前沒有對應站位，先照這個簡單規則做，MOMO之後想指定
  // 誰站哪格、或敵人超過4隻要怎麼排，直接改下面兩個陣列即可。
  const DEFAULT_ALLY_SPAWNS = [[2,3],[3,4],[2,4],[3,3]];
  const DEFAULT_ENEMY_SPAWNS = [[8,3],[9,4],[8,4],[9,3]];
  const ALLY_SPAWNS = encounterContext?.allySpawns || DEFAULT_ALLY_SPAWNS;
  const ENEMY_SPAWNS = encounterContext?.enemySpawns || DEFAULT_ENEMY_SPAWNS;
  allies.forEach((u,i)=>{ const p = ALLY_SPAWNS[i] || ALLY_SPAWNS[ALLY_SPAWNS.length-1]; u.x = p[0]; u.y = p[1]; });
  enemies.forEach((u,i)=>{ const p = ENEMY_SPAWNS[i] || ENEMY_SPAWNS[ENEMY_SPAWNS.length-1]; u.x = p[0]; u.y = p[1]; });

  battle = {
    def, allies, enemies,
    chapterId: chapterId != null ? chapterId : null,
    mapData: encounterContext?.mapId ? ADVENTURE_MAPS[encounterContext.mapId] : null,
    adventureContext: encounterContext ? { mapId:encounterContext.mapId, returnView:encounterContext.returnView || 'adventure' } : null,
    round: 1,
    order: [],
    orderIdx: 0,
    log: [],
    selected: { skill:null, mode:null }, // mode: 'move'|'skill'|'inspect'（普通攻擊已併入技能系統，不再有獨立的'attack'模式）
    sidePanelTab: 'action', // 'action'|'item'：v0.21新增，側邊欄「技能8格／道具8格」分頁狀態，固定的移動/檢查/脫逃/結束回合4格不受此影響
    finished:false,
    floorItems: {}, // 場上可拾取物品，key格式 "x,y" -> ITEM_DB的鍵名
    inspectorFocusUnit: null, // v0.39新增：狀態面板目前聚焦在哪個單位；null=顯示全部(icon開的那種)，有值=只顯示這一個(點單位chip開的)
  };
  seedFloorItems(); // 測試用：戰鬥開始時在空地上隨機灑幾樣可撿的物品
  rollOrder();
  startActorTurn(currentActor()); // 第一位行動者的三旗標名額初始化
  // v0.28：不再只靠isBoss二分，改吃每場戰鬥自己的bgm欄位，沒設定就用預設值
  playBgm(def.bgm || 'assets/bgms/bgm006.mp3');
  switchView('battle');
  setNavLocked(true);
  renderBattle();
}

function allUnits(){
  return battle.allies.concat(battle.enemies);
}
function aliveUnits(){
  return allUnits().filter(u=>u.hp>0 || u.downButAlive); // hp<=0 units stay but skip turn
}
function equipBonus(p, key){
  return Object.values(p.equipment).reduce((a,iid)=> a + equipEffectiveStat(iid, key), 0);
}

function rollOrder(){
  const units = allUnits();
  units.forEach(u=>{ u._speedRoll = u.spd + 1 + Math.floor(Math.random()*20); });
  battle.order = units.slice().sort((a,b)=> b._speedRoll - a._speedRoll);
  battle.orderIdx = 0;
}

function currentActor(){
  return battle.order[battle.orderIdx];
}

function logMsg(html){
  battle.log.push(html);
  if(battle.log.length > 100) battle.log.shift();
}

function playBgm(file){
  const bgm = document.getElementById('bgm');
  if(bgm.getAttribute('data-cur') === file) return;
  bgm.src = file;
  bgm.setAttribute('data-cur', file);
  bgm.volume = 0.35;
  bgm.play().catch(()=>{});
}

/* v0.22：prepPortraitHtml()（準備畫面名稱旁頭像）已移除——名稱旁頭像拿掉，
   xxx_normal這組PORTRAIT_MAP資料先保留，之後有別的用途要用再接回來，不影響其他功能 */
function renderPortraits(){
  const actor = currentActor();
  if(!actor) return;
  const allyBox = document.getElementById('portraitAlly');
  const enemyBox = document.getElementById('portraitEnemy');
  if(!allyBox || !enemyBox) return;

  function portraitHtml(unit, defaultLabel){
    if(!unit) return `<div class="portrait-placeholder">${defaultLabel}<br>（尚未設定圖片）</div>`;
    const skillKey = (battle.selected.mode === 'skill' && battle.selected.skillKey) ? battle.selected.skillKey : 'default';
    // 優先用 portraitKey（固定不變，敵人專用），沒有的話才退回用 id（我方角色固定，敵人id每次戰鬥會變動不可靠）
    const baseKey = unit.portraitKey || unit.id;
    const mapKey = baseKey + '_' + skillKey;
    const imgFile = PORTRAIT_MAP[mapKey] || PORTRAIT_MAP[baseKey + '_default'];
    if(imgFile){
      return `<img src="${imgFile}" style="width:100%;border-radius:8px;">`;
    }
    return `<div class="portrait-placeholder">${unit.name}<br><span style="opacity:.6;">(${mapKey})</span><br>尚未設定圖片</div>`;
  }

  const currentAlly = actor.side === 'ally' ? actor : null;
  const currentEnemy = actor.side === 'enemy' ? actor : null;
  allyBox.innerHTML = portraitHtml(currentAlly, '我方立繪');
  enemyBox.innerHTML = portraitHtml(currentEnemy, '敵方立繪');
}

function renderOrderRow(){
  // v0.35修正：回合數卡在第一回合不變的bug——「第X回合」文字原本只在renderBattle()首次建立畫面時寫死一次，
  // 之後battle.round雖然在advanceOneSlot()有正確遞增，但沒有任何地方重新寫回這段文字，畫面就再也不會更新。
  // renderOrderRow()是每次換人/回合推進都會呼叫的函式，改在這裡同步更新，確保顯示跟實際回合數一致。
  const roundLabel = document.getElementById('roundLabel');
  if(roundLabel) roundLabel.textContent = `第 ${battle.round} 回合 · 行動順序`;
  const row = document.getElementById('orderRow');
  row.innerHTML = '';
