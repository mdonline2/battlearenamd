<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>像素動作戰鬥 v5</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #1a1a2e;
    font-family: 'Courier New', monospace; color: #eee;
  }
  #gameOuter {
    position: relative;
    margin: 20px auto;
    width: 800px; height: 500px; /* 初始值,實際會被 updateGameScale() 依螢幕寬度覆寫 */
  }
  #gameContainer {
    position: absolute; left: 0; top: 0;
    width: 800px; height: 500px;
    transform-origin: top left;
    border: 4px solid #444;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #16213e;
    cursor: pointer;
    touch-action: none;
  }
  /* ---- 手機觸控:虛擬搖桿(左半邊觸控)+ 衝刺鍵(右下角) ----
     只有 gameState==='playing' 且偵測到觸控裝置時才會顯示,見 updateTouchControlsVisibility()
     注意:這一整塊刻意放在 #gameOuter 底下、#gameContainer 外面(不受縮放transform影響),
     這樣觸控座標運算全程都是「真實螢幕像素」,不用另外處理縮放換算 */
  /* z-index 5:刻意低於所有可點擊UI按鈕層(見 #topLeftControls 等 z-index:40),
     原則:畫面上任何按鈕的觸控優先權都要高於「移動」,搖桿只吃按鈕以外的區域 */
  #touchControls { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 5; display: none; }
  /* 搖桿觸控範圍改為全螢幕(戰鬥中除了UI按鈕之外,螢幕任何地方按下都能移動);
     除了暫停(reward等非playing狀態)之外都可以按到——這點已經靠 touchControls 只在 gameState==='playing' 時才顯示達成,不用額外處理 */
  #joystickZone { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: auto; }
  #joystickBase {
    position: absolute; width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
    transform: translate(-50%, -50%); display: none; pointer-events: none;
  }
  #joystickStick {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    background: rgba(244,114,182,0.85); border: 2px solid #ec4899;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
  }
  #dashBtn {
    position: absolute; right: 24px; bottom: 24px; width: 66px; height: 66px;
    border-radius: 50%; background: rgba(74,222,128,0.25); border: 2px solid rgba(74,222,128,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #d4f5dd; pointer-events: auto;
  }
  #dashBtn.active { background: rgba(74,222,128,0.55); transform: scale(0.92); }
  #exitBtn {
    position: absolute; right: 104px; bottom: 31px; width: 52px; height: 52px;
    border-radius: 50%; background: rgba(248,113,113,0.25); border: 2px solid rgba(248,113,113,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fecaca; pointer-events: auto; user-select: none;
  }
  #exitBtn.active { background: rgba(248,113,113,0.55); transform: scale(0.92); }
  #bossBox {
    position: absolute; top: 82px; right: 10px; /* 讓位給頂端 #expInfoBox */
    pointer-events: none;
  }
  #playerHpBox {
    position: absolute; top: 10px; left: -200px;
    pointer-events: none;
  }
  .barBox { background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; }
  .barLabel { font-size: 12px; margin-bottom: 2px; }
  .barBg { width: 180px; height: 14px; background: #333; border: 2px solid #000; }
  .barFill { height: 100%; }
  #playerFill { background: linear-gradient(#f472b6, #ec4899); width: 100%; }
  #bossFill { background: linear-gradient(#f87171, #ef4444); width: 100%; }
  #centerMsg {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
    font-size: 26px; text-shadow: 2px 2px #000; text-align: center;
    pointer-events: none; display: none;
  }
  #hint {
    text-align: center; color: #999; font-size: 12px; margin-top: 8px;
  }
  #waveInfo {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 4px; font-size: 14px;
    pointer-events: none;
  }
  /* ---- 頂端EXP進度條:貼齊畫布最上緣、橫跨100%寬度,寬度會跟著#gameContainer整體縮放 ---- */
  #expBarBox {
    position: absolute; top: 0; left: 0; width: 100%; height: 8px;
    background: rgba(0,0,0,0.55);
    pointer-events: none; overflow: hidden;
  }
  #expBarFill { height: 100%; width: 0%; background: #7dd3fc; }
  #expBarTicks {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; pointer-events: none;
  }
  .expTick { flex: 1; border-right: 1px solid rgba(255,255,255,0.18); }
  .expTick:last-child { border-right: none; }
  /* 右上角:等級(大字)+ exp分數 + 本場暫時持有金幣/水晶 */
  #expInfoBox {
    position: absolute; top: 12px; right: 10px;
    background: rgba(0,0,0,0.55); border: 1px solid #666; border-radius: 4px;
    padding: 4px 10px; text-align: right; pointer-events: none; line-height: 1.35;
  }
  #expInfoBox .lvNum { font-size: 18px; font-weight: bold; color: #8be9fd; }
  #expInfoBox .expFrac { font-size: 11px; color: #ccc; }
  #expInfoBox .runCurrency { font-size: 11px; color: #ffd93d; margin-top: 2px; }
  /* 左上角:已裝備武器icon(最多3格,無文字)+ 右側臨時代打武器icon,底下小字顯示剩餘秒數 */
  #weaponIconBox {
    position: absolute; top: 14px; left: 10px;
    display: flex; align-items: flex-start; pointer-events: none;
  }
  #equippedIconRow, #tempIconRow { display: flex; gap: 4px; }
  #tempIconRow { margin-left: 8px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.25); }
  .weaponIcon {
    width: 40px; height: 40px; border-radius: 6px; border: 2px solid #999;
    background: rgba(0,0,0,0.5); position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .weaponIcon img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; image-rendering: pixelated; }
  .weaponIcon .iconTimer {
    position: absolute; bottom: -14px; left: 0; width: 100%; text-align: center;
    font-size: 10px; color: #ddd; text-shadow: 1px 1px #000;
  }
  .weaponIcon .iconLvBadge {
    position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 2px;
    border-radius: 8px; background: #1f2937; border: 1px solid #fbbf24;
    color: #fbbf24; font-size: 9px; font-weight: bold; line-height: 14px; text-align: center;
  }
  /* 輔助(Aux)icon列:跟buff列同排版,永久生效不倒數,顯示目前等級;放在buff列下方避免重疊 */
  #auxIconRow {
    position: absolute; top: 114px; left: 10px;
    display: flex; gap: 4px; pointer-events: none;
  }
  .auxIcon {
    width: 32px; height: 32px; border-radius: 6px; border: 2px solid #4ade80;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: bold; position: relative;
  }
  .auxIcon .iconLvBadge {
    position: absolute; bottom: -13px; left: 0; width: 100%; text-align: center;
    font-size: 9px; color: #ccc; text-shadow: 1px 1px #000;
  }
  /* 下面一排:目前buff效果,底下小字顯示剩餘秒數(暫時用色塊+文字標籤代替icon圖檔) */
  #buffIconRow {
    position: absolute; top: 76px; left: 10px;
    display: flex; gap: 4px; pointer-events: none;
  }
  .buffIcon {
    width: 32px; height: 32px; border-radius: 6px; border: 2px solid #38bdf8;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; position: relative;
  }
  .buffIcon .iconTimer {
    position: absolute; bottom: -13px; left: 0; width: 100%; text-align: center;
    font-size: 9px; color: #ccc; text-shadow: 1px 1px #000;
  }
  #invBox {
    position: absolute; bottom: 10px; right: 10px;
    display: flex; gap: 8px; pointer-events: none;
  }
  .invSlot {
    width: 56px; height: 56px; background: rgba(0,0,0,0.55);
    border: 2px solid #555; border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .invSlotKey { font-size: 10px; color: #999; }

  #portraitBox {
    position: absolute; bottom: 10px; left: -210px;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
  }
  #portraitImg {
    width: 64px; height: 64px;
    border: 3px solid #4ade80;
    border-radius: 8px;
    background: #0d1424;
    image-rendering: pixelated;
    transition: border-color 0.2s;
  }
  #portraitNameBox {
    margin-top: 4px;
    background: rgba(0,0,0,0.6);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    text-align: center;
  }
  #portraitCharName { font-weight: bold; }
  #portraitCharRole { color: #aaa; font-size: 9px; }

  #topLeftControls {
    position: absolute; top: 70px; left: -200px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 40; /* 高於 #touchControls(z-index:5),按鈕觸控優先於搖桿移動 */
  }
  #musicToggle {
    background: rgba(0,0,0,0.55); border: 1px solid #666; border-radius: 4px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; user-select: none;
  }
  #musicToggle:hover { background: rgba(0,0,0,0.8); }
  #autoModeIndicator {
    background: rgba(0,0,0,0.55); border: 1px solid #666; border-radius: 4px;
    padding: 5px 10px; font-size: 12px; user-select: none;
    pointer-events: none;
  }
  #equippedWeaponsBox {
    background: rgba(0,0,0,0.55); border: 1px solid #666; border-radius: 4px;
    padding: 5px 10px; font-size: 11px; user-select: none;
    pointer-events: none; line-height: 1.5;
  }
  #equippedWeaponsBox .weaponLine { white-space: nowrap; }
</style>
</head>
<body>

<div id="gameOuter">
<div id="gameContainer">
  <canvas id="game" width="800" height="500"></canvas> 
  <div id="topLeftControls">
    <div id="musicToggle">🔇 音樂：關</div>
    <div id="autoModeIndicator">Z 自動拾取/使用：開</div>
    <div id="equippedWeaponsBox"></div>
  </div>
  <div id="weaponIconBox">
    <div id="equippedIconRow"></div>
    <div id="tempIconRow"></div>
  </div>
  <div id="buffIconRow"></div>
  <div id="auxIconRow"></div>
  <div id="expBarBox">
    <div class="barFill" id="expBarFill"></div>
    <div id="expBarTicks"></div>
  </div>
  <div id="expInfoBox">
    <div class="lvNum" id="expLvText">Lv.1</div>
    <div class="expFrac" id="expFracText">0 / 32</div>
    <div class="runCurrency" id="expRunCurrencyText">💰0 💎0</div>
  </div>
  <div class="barBox" id="playerHpBox">
    <div class="barLabel">玩家 HP</div>
    <div class="barBg"><div class="barFill" id="playerFill"></div></div>
  </div>
  <div class="barBox" id="bossBox" style="display:none;">
    <div class="barLabel" id="bossLabel">BOSS</div>
    <div class="barBg"><div class="barFill" id="bossFill"></div></div>
  </div>
  <div id="waveInfo">Wave 1</div>
  <div id="centerMsg"></div>
  <div id="portraitBox">
    <img id="portraitImg" src="" alt="character portrait">
    <div id="portraitNameBox">
      <div id="portraitCharName">可可</div>
      <div id="portraitCharRole">訓練生</div>
    </div>
  </div>
  <div id="invBox">
    <div class="invSlot" id="slot0"><div class="invSlotKey">1</div><div>-</div></div>
    <div class="invSlot" id="slot1"><div class="invSlotKey">2</div><div>-</div></div>
    <div class="invSlot" id="slot2"><div class="invSlotKey">3</div><div>-</div></div>
  </div>
  <audio id="bgm" loop>
    <source src="audio/bgm.mp3" type="audio/mpeg">
  </audio>
</div>
<!-- touchControls故意放在gameContainer外面(gameOuter底下),因為gameContainer會被CSS transform縮放,
     裡面的元素座標會變成「縮放後」的局部座標,跟touch事件回報的真實螢幕座標對不上,
     放在這裡才能讓搖桿/衝刺鍵的座標運算全程都是「真實螢幕像素」,不用另外做換算 -->
<div id="touchControls">
  <div id="joystickZone"></div>
  <div id="joystickBase"><div id="joystickStick"></div></div>
  <div id="dashBtn">衝刺<br>DASH</div>
  <div id="exitBtn">離開</div>
</div>
</div>
<div id="hint">WASD移動 · K衝刺 · 1/2/3用道具 · Z切換自動拾取/使用 · 已裝備武器全自動攻擊,不需按鍵 · 選單滑鼠點擊或方向鍵+Enter · 死亡/勝利按C回選單 · 戰鬥中ESC(手機用「離開」鍵)直接回準備室</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* =========================================================
   武器/技能數值設定 —— 想調整傷害、冷卻、範圍都改這裡即可
   damageMultiplier: 相對角色 stats.attackDmg 的倍率
   cooldown / baseInterval: 幀數(60幀 = 1秒)
   range / speed / width / height / radius: 像素單位
   ========================================================= */
const WEAPON_CONFIG = {
  melee: {
    damageMultiplier: 1.0,   // 近戰傷害倍率(直接等於角色攻擊力)
    baseDamage: 0,             // 保底傷害(不受角色數值/buff影響的固定加成),預設0先不影響現有平衡
    cooldown: 22,            // 近戰攻擊冷卻(幀數),會再被攻速buff縮短
    range: 340,                // 揮劍判定範圍(像素)
  },
  laser: {
    damageMultiplier: 0.75,  // 雷射傷害倍率(相對角色攻擊力)
    baseDamage: 0,             // 保底傷害,同上
    cooldown: 60,             // 雷射技能冷卻(幀數) = 1秒
    speed: 7,                 // 飛行速度(像素/幀)
    width: 22, height: 6,     // 判定框大小
  },
  autoItem: {
    damageMultiplier: 0.5,    // 自動攻擊道具傷害倍率(相對「雷射傷害」再打折)
    duration: 480,            // 持續時間(幀數) = 8秒
    baseInterval: 60,         // 基礎發射間隔(幀數) = 1秒,會被攻速buff縮短
    speed: 7,
    width: 22, height: 6,
  },
  aura: {
    damageMultiplier: 1.0,   // 圓形光環傷害倍率(等同近戰100%)
    baseDamage: 0,             // 保底傷害,同上
    duration: 900,            // 持續時間(幀數) = 15秒
    interval: 60,            // 每次觸發間隔(幀數) = 5秒
    radius: 50,                // 光環半徑(像素),以玩家為中心
  },
  weaponBuff: {
    multiplier: 1.5,          // 撿到「已裝備武器對應道具」時的強化倍率
  },
  dynamite: {
    damageMultiplier: 1.6,   // 尾隨炸藥傷害倍率(有延遲/可被閃開,倍率設較高)
    baseDamage: 0,             // 保底傷害,同上
    cooldown: 180,            // 丟出後重新計算冷卻(幀數) = 3秒,固定值不受攻速影響
    fuse: 180,                 // 落地後引爆延遲(幀數) = 3秒
    radius: 55,                // 爆炸範圍半徑(像素)
    dropOffset: 20,            // 落點與玩家中心的距離(像素),往面向的反方向掉落
  },
  boomerang: {
    damageMultiplier: 0.9,   // 迴力鏢傷害倍率
    baseDamage: 0,             // 保底傷害,同上
    cooldown: 70,             // 丟出間隔(幀數),之後可再調整
    speed: 6,                  // 飛行速度(像素/幀)
    turnRate: 0.045,           // 每幀轉向角度(弧度),數值越大彎得越急
    maxLife: 75,               // 最長飛行時間(幀數),超過就算沒命中也會消失
    w: 14, h: 14,              // 判定框大小
  },
  thunder: {
    damageMultiplier: 1.3,   // 閃電雷雲傷害倍率(只打1個目標,倍率比群體命中的aura高)
    baseDamage: 0,             // 保底傷害,同上
    interval: 120,             // 觸發間隔(幀數) = 2秒
    radius: 100,                // 周遭判定半徑(像素),以玩家為中心
    maxTargets: 1,             // 每次觸發最多命中幾個敵人(目前設計為隨機挑1個)
  },
  // ===== 以下5把為特效可行性測試用,數值全部先隨便填,重點是驗證命中模式+特效,不代表最終平衡 =====
  homing: {
    damageMultiplier: 0.8,
    baseDamage: 0,
    cooldown: 50,              // 發射間隔(幀數)
    speed: 4,                   // 飛行速度(像素/幀)
    turnRate: 0.15,             // 每幀最大轉向角度(弧度),數值越大轉得越急
    width: 10, height: 10,
  },
  pierce: {
    damageMultiplier: 0.6,    // 會打中一直線上所有敵人,單體倍率設較低
    baseDamage: 0,
    cooldown: 70,
    speed: 9,
    width: 34, height: 8,
    maxLife: 90,               // 最長飛行幀數,超過就消失(避免貫穿全圖一直飛)
  },
  poison: {
    damageMultiplier: 0.3,    // 持續傷害每次tick的倍率,設較低靠疊加次數拿傷害
    baseDamage: 0,
    cooldown: 200,             // 丟出間隔(幀數)
    radius: 50,                 // 毒圈範圍半徑(像素)
    duration: 180,              // 毒圈持續幀數 = 3秒
    tickInterval: 30,           // 每隔幾幀觸發一次傷害 = 0.5秒
    dropOffset: 20,             // 落點與玩家中心距離(像素),往面向的反方向丟(比照炸藥)
  },
  chain: {
    damageMultiplier: 0.9,
    baseDamage: 0,
    interval: 140,             // 觸發間隔(幀數)
    radius: 110,                // 第一段:以玩家為中心搜尋起始目標的半徑
    chainRadius: 90,            // 之後每段:以上一個被電到的目標為中心搜尋下一個目標的半徑
    chainCount: 2,              // 基礎連鎖數(含第一個目標),Lv3額外+1(見getChainTotalCount)
  },
  bounce: {
    damageMultiplier: 0.85,
    baseDamage: 0,
    cooldown: 65,
    speed: 5,
    width: 12, height: 12,
    bounces: 1,                 // 基礎彈射次數,Lv3額外+1(見getBounceTotalCount)
  },
};

// 武器特效視覺參數(跟 WEAPON_CONFIG 分開,只管「怎麼畫」不管「傷害多少」)
// 有半徑/範圍類的數值直接參照 WEAPON_CONFIG,調傷害數值時特效會自動跟著變,不用兩邊都改
// duration 單位是幀數(跟遊戲主迴圈一致,60幀=1秒)
const EFFECT_CONFIG = {
  thunder: {
    boltColor: '#93c5fd',    // 閃電外層粗線顏色
    coreColor: '#ffffff',     // 閃電內層細線顏色(核心亮部)
    duration: 14,              // 閃電殘留幾幀後消失
    sparkCount: 8,             // 落地火花數量
  },
  melee: {
    arcColor: '#facc15',     // 揮砍弧線顏色
    arcLayers: [ [1.0, 5], [0.85, 3], [0.7, 2] ], // [半徑倍率, 線寬] 由外到內疊出殘影感
    duration: 10,              // 揮砍殘影存活幀數,建議略短於 baseAttackDur
  },
  explosion: {
    coreColor: '#fde68a',    // 爆炸核心亮部顏色

/* =========================================================
   等級 / 經驗值系統(單局內,死亡或過關就重置)
   ========================================================= */
const LEVEL_CAP = 20;
function expToNext(level) {
  if (level >= LEVEL_CAP) return 150; // 封頂後每級固定150
  return Math.floor(20 + 10 * level + 2 * level * level);
}

// 頂端EXP條顏色:百分比越高顏色越濃(淺水藍 #7dd3fc → 濃水藍 #0369a1),升級瞬間exp歸零故顏色自動變回淺色
function expBarColor(pct) {
  const c1 = [125, 211, 252], c2 = [3, 105, 161];
  const r = Math.round(c1[0] + (c2[0] - c1[0]) * pct);
  const g = Math.round(c1[1] + (c2[1] - c1[1]) * pct);
  const b = Math.round(c1[2] + (c2[2] - c1[2]) * pct);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function rewardFormatGroupAvailable(weightsObj) {

}
// 依權重從物件({key: weight, ...})抽一個key,排除掉exclude清單中的key;全部被排除時回傳null
function pickWeightedKey(weightsObj, excludeSet) {
  const entries = Object.entries(weightsObj).filter(([k]) => !excludeSet.has(k));
  if (entries.length === 0) return null;
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [k, w] of entries) { r -= w; if (r <= 0) return k; }
  return entries[entries.length - 1][0];
}

// 幸運調整後的「N選1」實際權重(effect①,只影響choose分支,giveAll分支目前不受幸運影響,待補)
function getLuckAdjustedChooseWeights() {
  const luck = player.luck || 0;
  const base = REWARD_FORMAT_BASE_WEIGHTS;
  const maxShift = base.choose3 - LUCK_CHOOSE3_FLOOR;
  const shift = Math.min(luck * LUCK_SHIFT_PER_LEVEL, maxShift);
  const restBase = base.choose4 + base.choose5;
  return {
    choose3: base.choose3 - shift,
    choose4: base.choose4 + shift * (base.choose4 / restBase),
    choose5: base.choose5 + shift * (base.choose5 / restBase),
  };
}

// 決定這次獎勵事件的型式(選幾個 / 給幾個),回傳 {formatType:'choose'|'giveAll', count}
// 除錯室停用清單在這裡生效:單一子項目被關掉時在同一層重骰;整層(choose3/4/5或give1/2/3)被關光時強制改走另一層;
// 兩層都被關光時代表設定會導致完全無獎勵可出,防呆忽略停用設定並提示一下
function rollRewardFormat() {
  const chooseWeights = getLuckAdjustedChooseWeights(); // {choose3, choose4, choose5}
  const giveWeights = { give1: REWARD_FORMAT_BASE_WEIGHTS.give1, give2: REWARD_FORMAT_BASE_WEIGHTS.give2, give3: REWARD_FORMAT_BASE_WEIGHTS.give3 };
  const chooseOK = rewardFormatGroupAvailable(chooseWeights);
  const giveOK = rewardFormatGroupAvailable(giveWeights);

  let useChoose;
  if (chooseOK && giveOK) {
    useChoose = Math.random() < REWARD_OUTER_SPLIT.choose;
  } else if (chooseOK) {
    useChoose = true; // 全給型整層被關光,強制走選擇型
  } else if (giveOK) {
    useChoose = false; // 選擇型整層被關光,強制走全給型
  } else {
    // 兩層都被關光:防呆,忽略停用設定並提示
    showCenterMsg('⚠ 除錯室設定會導致無獎勵可出,已暫時忽略停用設定', 2000);
    useChoose = Math.random() < REWARD_OUTER_SPLIT.choose;
    const key = pickWeightedKey(useChoose ? chooseWeights : giveWeights, new Set());
    return finalizeRewardFormat(useChoose, key);
  }

  const weights = useChoose ? chooseWeights : giveWeights;
  const key = pickWeightedKey(weights, REWARD_DEBUG_DISABLED);
  return finalizeRewardFormat(useChoose, key);
}
// rollRewardFormat 的收尾:choose直接回傳選幾個;giveAll要處理give2/give3各自獨立的加倍機率
function finalizeRewardFormat(useChoose, key) {
  if (useChoose) {
    return { formatType: 'choose', count: parseInt(key.replace('choose', ''), 10) };
  }
  const baseCount = parseInt(key.replace('give', ''), 10);
  const upgradeTo = { give2: 4, give3: 5 }[key];
  const count = (upgradeTo && Math.random() < REWARD_GIVEALL_UPGRADE_CHANCE) ? upgradeTo : baseCount;
  return { formatType: 'giveAll', count };
}

// 建立候選池(攤平成item清單,每個item帶自己所屬類型的權重)
function buildRewardCandidatePool(formatType) {
  const pool = [];
  const owned = player.equippedWeapons;
  const battlefieldFull = owned.length >= 6; // 戰場6格戰鬥槽(額外拾取3格已拿掉,合成2格預備槽不算在這裡面)

  if (formatType === 'choose') {
    if (!battlefieldFull) {
      unlockedTier1WeaponKeys().forEach(key => {
        if (!owned.includes(key)) pool.push({ kind: 'newWeapon', key, weight: REWARD_CANDIDATE_BASE_WEIGHTS.newWeapon });
      });
    }
    owned.forEach(key => {
      if ((player.weaponLevel[key] || 1) < WEAPON_LEVEL_MAX) pool.push({ kind: 'upgradeWeapon', key, weight: REWARD_CANDIDATE_BASE_WEIGHTS.upgradeWeapon });
    });
    getReadySynthesisCandidates().forEach(c => pool.push({ ...c, weight: REWARD_CANDIDATE_BASE_WEIGHTS.synthesis }));
    Object.keys(AUX_CONFIG).forEach(key => {
      const lvl = key === 'luck' ? (player.luck || 0) : (player.auxLevel[key] || 0);
      if (lvl < AUX_CONFIG[key].maxLv) pool.push({ kind: 'aux', key, weight: REWARD_CANDIDATE_BASE_WEIGHTS.aux });
    });
  } else {
    // 加倍型:僅提供玩家「已經有的」武器跟輔助(見規劃文件第二節)
    owned.forEach(key => {
      if ((player.weaponLevel[key] || 1) < WEAPON_LEVEL_MAX) pool.push({ kind: 'upgradeWeapon', key, weight: REWARD_CANDIDATE_BASE_WEIGHTS.upgradeWeapon });
    });
    Object.keys(AUX_CONFIG).forEach(key => {
      const lvl = key === 'luck' ? (player.luck || 0) : (player.auxLevel[key] || 0);
      const owns = key === 'luck' ? player.luck > 0 : !!player.auxLevel[key];
      if (owns && lvl < AUX_CONFIG[key].maxLv) pool.push({ kind: 'aux', key, weight: REWARD_CANDIDATE_BASE_WEIGHTS.aux });
    });
  }
  return pool;
}

// 保險池:所有正常候選都拿不到時(例如武器輔助全滿)還是要能拿到東西,對照規劃文件5.4節已驗證的結論
function buildFallbackRewardPool() {
  return [
    { kind: 'fallbackGold', label: '金幣', amount: 50, weight: 1 },
    { kind: 'fallbackBuff', label: '限時強化', buffKey: 'atkpower', weight: 1 },
  ];
}

// 從候選池不重複抽出n個(依權重),池子不夠n個就有多少抽多少
function weightedPickDistinct(pool, n) {
  const copy = pool.slice();
  const picked = [];
  const take = Math.min(n, copy.length);
  for (let i = 0; i < take; i++) {
    const totalW = copy.reduce((s, c) => s + c.weight, 0);
    let r = Math.random() * totalW;
    let idx = 0;
    for (; idx < copy.length - 1; idx++) { r -= copy[idx].weight; if (r <= 0) break; }
    picked.push(copy[idx]);
    copy.splice(idx, 1);
  }
  return picked;
}

// 套用單一候選項目的實際效果
function applyRewardCandidate(c) {
  if (c.kind === 'newWeapon') {
    if (!player.equippedWeapons.includes(c.key)) player.equippedWeapons.push(c.key);
    player.weaponLevel[c.key] = player.weaponLevel[c.key] || 1;
    updateEquippedWeaponsBox();
  } else if (c.kind === 'upgradeWeapon') {
    const cur = player.weaponLevel[c.key] || 1;
    c._preApplyLevel = cur; // 修正:giveAll格式套用後,rewardCandidateTitle/Subtitle要顯示「套用前」的等級才對,不然畫面文字跟等級表查詢都會多算一級(套用後又+1),重的話等級表查詢越界整個crash
    if (cur < WEAPON_LEVEL_MAX) player.weaponLevel[c.key] = cur + 1;
    updateEquippedWeaponsBox();
  } else if (c.kind === 'aux') {
    if (c.key === 'luck') { player.luck = (player.luck || 0) + 1; }
    else { const cur = player.auxLevel[c.key] || 0; if (cur < AUX_CONFIG[c.key].maxLv) player.auxLevel[c.key] = cur + 1; }
  } else if (c.kind === 'synthesis') {
    // 骨架:合成資料結構(材料消耗/成品加入裝備)尚未定案,先不處理實際效果,只記錄TODO
  } else if (c.kind === 'fallbackGold') {
    player.runGold += (c.amount || 50);
  } else if (c.kind === 'fallbackBuff') {
    const cur = player.buffs[c.buffKey];
    player.buffs[c.buffKey] = { timeLeft: 300, stacks: (cur ? cur.stacks : 0) + 1 };
  }
}

/* =========================================================

    spinIntervalStart: 3,      // 轉動初期,每幾幀切換一次陪轉圖示(數字越小切越快)
    spinIntervalEnd: 10,       // 轉動尾聲,每幾幀切換一次陪轉圖示(數字越大=減速越明顯)
    spinPoolSize: 6,           // 陪轉圖示池大小(從所有武器裡隨機抽幾把來陪轉,只是視覺,不影響結果)

let rewardFxParticles = []; // 紙花/煙火共用的畫面空間粒子陣列(不受攝影機平移影響),只在drawRewardScreen特效階段畫

// 開始播放一次獎勵事件的進場特效,由startNextRewardEvent在建立currentReward後呼叫
function startRewardFx(cr) {
  cr.fxPhase = 'playing';
  cr.fxTimer = 0;
  rewardFxParticles.length = 0;
  if (cr.formatType === 'choose') {
    const cfg = REWARD_FX_CONFIG.choose;
    cr.fxSlide = cr.candidates.map((c, i) => ({ delay: i * cfg.slideDelayPerItem }));
    cr.fxTotalDuration = (cr.candidates.length - 1) * cfg.slideDelayPerItem + cfg.slideDuration + cfg.holdAfterLastLanding;
    cr._confettiTarget = cfg.confettiBaseCount + cfg.confettiPerExtraCandidate * (cr.candidates.length - 1);
    cr._confettiAcc = 0;
    playSfxById('s101'); // 多選型觸發音效,想換掉直接改這個id
  } else {
    const cfg = REWARD_FX_CONFIG.giveAll;
    cr.fxSpin = cr.candidates.map((c, i) => ({ delay: i * cfg.spinDelayPerItem, spinKeys: buildSpinPool() }));
    cr.fxTotalDuration = (cr.candidates.length - 1) * cfg.spinDelayPerItem + cfg.spinDuration + cfg.holdAfterLastLanding;
    cr._fireworksTarget = cfg.fireworkBaseCount + cfg.fireworkPerExtraCandidate * (cr.candidates.length - 1);
    cr._fireworksSpawned = 0;
    playSfxById('s102'); // 加倍/全給型觸發音效,想換掉直接改這個id
  }
}

// 老虎機陪轉用的隨機武器圖示池(純視覺,不影響最終結果)
function buildSpinPool() {
  const pool = [];
  for (let i = 0; i < REWARD_FX_CONFIG.giveAll.spinPoolSize; i++) {
    pool.push(WEAPON_KEYS[Math.floor(Math.random() * WEAPON_KEYS.length)]);
  }
  return pool;
}

function spawnConfettiParticle(cfg) {
  rewardFxParticles.push({
    kind: 'confetti',
    x: Math.random() * W,
    y: -10,
    vx: (Math.random() - 0.5) * 1.2,
    vy: cfg.confettiFallSpeedMin + Math.random() * (cfg.confettiFallSpeedMax - cfg.confettiFallSpeedMin),
    rot: Math.random() * Math.PI,
    color: cfg.confettiColors[Math.floor(Math.random() * cfg.confettiColors.length)],
    life: 90, maxLife: 90,
  });
}
function spawnFireworkBurst(cfg, extraParticles) {
  const cx = 100 + Math.random() * (W - 200);
  const cy = 60 + Math.random() * 160;
  const n = cfg.fireworkParticlesPerBurst + extraParticles;
  for (let i = 0; i < n; i++) {
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.3;
    const spd = 1.5 + Math.random() * 2.5;
    rewardFxParticles.push({
      kind: 'firework', x: cx, y: cy,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      gravity: 0.05,
      color: cfg.fireworkColors[Math.floor(Math.random() * cfg.fireworkColors.length)],
      life: 26, maxLife: 26,
    });
  }
  playSfxById('s039'); // 借用現有「雷電」音效當煙火爆裂聲,之後可換成專屬音效
}

// 每幀推進獎勵特效(粒子物理+階段判定),在gameState==='reward'時由update()呼叫,不受playing暫停影響
function updateRewardFx() {
  const cr = player.currentReward;
  if (!cr || cr.fxPhase !== 'playing') return;
  cr.fxTimer++;

  rewardFxParticles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += (p.gravity || 0); p.life--; });
  for (let i = rewardFxParticles.length - 1; i >= 0; i--) if (rewardFxParticles[i].life <= 0) rewardFxParticles.splice(i, 1);

  if (cr.formatType === 'choose') {
    const cfg = REWARD_FX_CONFIG.choose;
    cr._confettiAcc += cr._confettiTarget / cr.fxTotalDuration;
    while (cr._confettiAcc >= 1) { spawnConfettiParticle(cfg); cr._confettiAcc -= 1; }
  } else {
    const cfg = REWARD_FX_CONFIG.giveAll;
    const interval = Math.max(4, Math.floor(cr.fxTotalDuration / cr._fireworksTarget));
    if (cr.fxTimer % interval === 0 && cr._fireworksSpawned < cr._fireworksTarget) {
      spawnFireworkBurst(cfg, (cr.candidates.length - 1) * 2); // 候選越多,單發煙火也順便炸多一點粒子
      cr._fireworksSpawned++;
    }
  }

  if (cr.fxTimer >= cr.fxTotalDuration) cr.fxPhase = 'done';
}

// 從佇列取出下一筆事件,擲型式+候選內容,決定要不要跳出選擇畫面
function startNextRewardEvent() {
  if (player.rewardQueue.length === 0) {
    player.currentReward = null;
    if (gameState === 'reward') gameState = 'playing';
    return;
  }
  const event = player.rewardQueue.shift();
  const format = rollRewardFormat();
  let pool = buildRewardCandidatePool(format.formatType);
  let usedFallback = false;
  if (pool.length === 0) { pool = buildFallbackRewardPool(); usedFallback = true; }
  const picked = weightedPickDistinct(pool, format.count);
  player.currentReward = { source: event.source, formatType: format.formatType, candidates: picked, usedFallback };
  rewardCursor = 0;
  gameState = 'reward';
  screenShake = 0; // 修正:screenShake只在gameState==='playing'時遞減,進入獎勵畫面若有殘留值會卡住一直抖,這裡直接歸零
  if (format.formatType === 'giveAll') {
    picked.forEach(applyRewardCandidate);
  }
  startRewardFx(player.currentReward); // 進場特效(紙花滑入 或 煙火拉霸),播完前操作會被鎖定,見handleRewardKeys()
}

// 選擇型獎勵:玩家選中第index個候選
function resolveRewardChoice(index) {
  if (!player.currentReward || player.currentReward.formatType !== 'choose') return;
  const c = player.currentReward.candidates[index];
  if (!c) return;
  applyRewardCandidate(c);
  startNextRewardEvent();
}

/* =========================================================
   抵抗力減傷公式 —— 兩種方法都寫好,想切換就註解/取消註解對調
   ========================================================= */
function applyResist(damage, resistValue) {
  // 方法一:百分比減傷(目前啟用)—— 抵抗力10 = 減傷10%
  return Math.max(0, Math.floor(damage * (1 - resistValue / 100)));

  // 方法二:固定減傷(先關閉)—— 抵抗力10 = 直接扣掉10點傷害,最少保留1點
  // return Math.max(1, Math.floor(damage - resistValue));
}

/* =========================================================
   簡易音效庫 —— 用 Web Audio API 純程式碼合成,不需外部音檔
   之後想替換成真正錄音檔,只要把 SOUND_LIBRARY 裡對應項目的
   play() 改成 new Audio('audio/xxx.mp3').play() 之類的邏輯即可
   ========================================================= */
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

// 通用合成器:type決定波形/噪音類型,其餘參數控制音高、時長、包絡
// type: 'tone'(單一波形音) | 'sweep'(音高滑動,適合喊叫/雷射) | 'noise'(白噪音,適合爆炸/腳步) | 'click'(極短脈衝,適合拔刀/點擊)
function synthPlay(opts) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const dur = opts.duration || 0.2;
  const vol = opts.volume != null ? opts.volume : 0.3;
  const gainNode = ctx.createGain();
  gainNode.connect(ctx.destination);
  gainNode.gain.setValueAtTime(0.0001, now);
  gainNode.gain.exponentialRampToValueAtTime(vol, now + Math.min(0.02, dur*0.2));
  gainNode.gain.exponentialRampToValueAtTime(0.0001, now + dur);

  if (opts.type === 'noise') {
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = opts.filterType || 'lowpass';
    filter.frequency.value = opts.filterFreq || 1200;
    src.connect(filter).connect(gainNode);
    src.start(now); src.stop(now + dur);
  } else {
    const osc = ctx.createOscillator();
    osc.type = opts.wave || 'sine';
    const f1 = opts.freq || 440;
    const f2 = opts.freq2 != null ? opts.freq2 : f1;
    osc.frequency.setValueAtTime(f1, now);
    if (opts.type === 'sweep' || f2 !== f1) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), now + dur);
    }
    osc.connect(gainNode);
    osc.start(now); osc.stop(now + dur);
  }
}

// 依音效庫id查表播放(戰鬥中觸發用,例如受擊/拾取音效),找不到就靜默略過
function playSfxById(id) {
  const s = SOUND_LIBRARY.find(x => x.id === id);
  if (s) synthPlay(s.opts);
}

const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' ','1','2','3','enter','r','l','z','q','e','pageup','pagedown','backspace','c','escape'].includes(k)) e.preventDefault();
  if (!keys[k]) keys[k+'_down'] = true;
  keys[k] = true;
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* =========================================================
   手機觸控控制:左半邊虛擬搖桿(移動)+ 右下角衝刺鍵
   只有偵測到觸控裝置時才顯示,且只在 gameState==='playing' 時生效
   (選單/升級選擇畫面等其他狀態靠原本的 tap=click 就能操作,不需要搖桿蓋住畫面)
   ========================================================= */
/* =========================================================
   讓固定 800x500 的遊戲畫面依螢幕寬度等比縮小,避免手機上被裁掉看不到
   只縮小 #gameContainer 本身(canvas+HUD),#gameOuter 的寬高跟著同步縮小,
   這樣頁面不會留下一大塊「視覺上縮小了但版面還占著原本大小」的空白區域。
   HUD裡有些元素(HP條/立繪/左上角面板)用負數座標延伸到 gameContainer 外面,
   縮小後這部分可能還是會超出 gameOuter 範圍,所以 body 保留可以捲動/平移
   (沒有加 overflow:hidden 或 touch-action:none),當作最後的保險。
   ========================================================= */
const gameOuterEl = document.getElementById('gameOuter');
const gameContainerEl = document.getElementById('gameContainer');
function updateGameScale() {
  const marginW = 8, marginH = 40;
  const scaleW = (window.innerWidth - marginW) / 800;
  const scaleH = (window.innerHeight - marginH) / 500;
  const scale = Math.max(0.32, Math.min(1, scaleW, scaleH));
  gameContainerEl.style.transform = 'scale(' + scale + ')';
  gameOuterEl.style.width = (800 * scale) + 'px';
  gameOuterEl.style.height = (500 * scale) + 'px';
}
window.addEventListener('resize', updateGameScale);
window.addEventListener('orientationchange', updateGameScale);
updateGameScale();

const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const touchControlsEl = document.getElementById('touchControls');
const joystickZoneEl = document.getElementById('joystickZone');
const joystickBaseEl = document.getElementById('joystickBase');
const joystickStickEl = document.getElementById('joystickStick');
const dashBtnEl = document.getElementById('dashBtn');
const exitBtnEl = document.getElementById('exitBtn');

let touchDirX = 0, touchDirY = 0;   // 搖桿目前方向(-1~1的類比值),不是搖桿時保持0
let touchDashHeld = false;          // 衝刺鍵是否正被按著(跟鍵盤K鍵的「持續按著」語意一致)
let joystickTouchId = null;
let joystickOriginX = 0, joystickOriginY = 0;
const JOYSTICK_MAX_DIST = 40;

function updateTouchControlsVisibility() {
  if (!isTouchDevice) return; // 非觸控裝置完全不顯示,PC不受影響
  touchControlsEl.style.display = (gameState === 'playing') ? 'block' : 'none';
}

if (isTouchDevice) {
  joystickZoneEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (joystickTouchId !== null) return;
    const t = e.changedTouches[0];
    joystickTouchId = t.identifier;
    joystickOriginX = t.clientX; joystickOriginY = t.clientY;
    joystickBaseEl.style.left = joystickOriginX + 'px';
    joystickBaseEl.style.top = joystickOriginY + 'px';
    joystickBaseEl.style.display = 'block';
    joystickStickEl.style.transform = 'translate(-50%, -50%)';
  });
  joystickZoneEl.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== joystickTouchId) continue;
      const dx = t.clientX - joystickOriginX, dy = t.clientY - joystickOriginY;
      const dist = Math.min(Math.hypot(dx, dy), JOYSTICK_MAX_DIST);
      const angle = Math.atan2(dy, dx);
      const sx = Math.cos(angle) * dist, sy = Math.sin(angle) * dist;
      joystickStickEl.style.transform = `translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px))`;
      const norm = dist / JOYSTICK_MAX_DIST;
      touchDirX = dist > 4 ? Math.cos(angle) * norm : 0;
      touchDirY = dist > 4 ? Math.sin(angle) * norm : 0;
    }
  });
  function endJoystick(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== joystickTouchId) continue;
      joystickTouchId = null;
      touchDirX = 0; touchDirY = 0;
      joystickBaseEl.style.display = 'none';
    }
  }

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  // 大廳分頁按鈕(準備室/音效庫/圖片庫/測試用)永遠優先判定,只要在menu狀態下都可點擊切換
  if (gameState === 'menu') {
    LOBBY_TAB_BUTTONS.forEach(b => {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) lobbyTab = b.key;
    });
  }

  if (gameState === 'menu' && lobbyTab === 'prep') {
    const inBox = (b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;

    if (prepScreen === 'hub') {
      PREP_HUB_BUTTONS.forEach(b => {
        if (b.key === 'blank' || !inBox(b)) return;
        prepScreen = b.key;
        if (b.key === 'weapon') weaponInfoKey = null; // 每次重新進入武器庫,底部說明欄重置成「點擊武器查看說明」
        if (b.key === 'debug') debugInfoId = null; // 每次重新進入除錯室,底部說明欄重置
      });
      if (inBox(HUB_PREV_BTN)) hubPageTurn(-1);
      if (inBox(HUB_NEXT_BTN)) hubPageTurn(1);
      if (inBox(START_BTN)) confirmStart();
    } else if (prepScreen === 'debug') {
      DEBUG_BUTTONS.forEach(b => {
        if (!inBox(b)) return;
        selectedDebugIndex = b.idx;
        toggleDebugItem(b.toggle);
        debugInfoId = b.toggle.id;
      });
      if (inBox(PREP_BACK_BTN)) prepScreen = 'hub';
    } else if (prepScreen === 'char') {
      CHAR_BUTTONS.forEach(b => {
        if (!inBox(b)) return;
        const cd = CHARACTERS[b.key];
        if (cd.locked && !unlockedChars.includes(b.key)) tryPurchaseChar(b.key);
        else selectedCharIndex = b.idx;
      });
      if (inBox(CHAR_PREV_BTN)) charPageTurn(-1);
      if (inBox(CHAR_NEXT_BTN)) charPageTurn(1);
      if (inBox(PREP_BACK_BTN)) prepScreen = 'hub';
    } else if (prepScreen === 'map') {
      MAP_BUTTONS.forEach(b => { if (inBox(b)) selectedMapIndex = b.idx; });
      if (inBox(MAP_PREV_BTN)) mapPageTurn(-1);
      if (inBox(MAP_NEXT_BTN)) mapPageTurn(1);
      if (inBox(PREP_BACK_BTN)) prepScreen = 'hub';
    } else if (prepScreen === 'weapon') {
      WEAPON_BUTTONS.forEach(b => {
        if (!b.blank && inBox(b)) { selectedWeaponIndex = b.idx; toggleWeaponEquip(b.key); weaponInfoKey = b.key; }
      });
      if (inBox(PREP_BACK_BTN)) prepScreen = 'hub';
    } else if (prepScreen === 'archive') {
      ARCHIVE_BUTTONS.forEach(b => { if (inBox(b)) tryUnlockArchive(ARCHIVE_DOCS[b.idx].id); });
      if (inBox(PREP_BACK_BTN)) prepScreen = 'hub';
    } else if (prepScreen === 'bestiary') {
      if (inBox(PREP_BACK_BTN)) prepScreen = 'hub';
    } else if (prepScreen === 'settings') {
      if (inBox(PREP_BACK_BTN)) prepScreen = 'hub';
    }
  }

  if (gameState === 'reward' && player.currentReward && player.currentReward.fxPhase !== 'playing') {
    const inBox = (b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
    // 點列表只切換底部說明欄預覽(兩種格式都一樣),真正確認要點下面的確認鈕或按Enter/R
    // 2.3:特效播放期間(fxPhase==='playing')整段跳過,滑鼠/觸控點擊一律無效,避免還沒看清楚獎勵就誤按跳過
    REWARD_BUTTONS.forEach(b => { if (inBox(b)) rewardCursor = b.idx; });
    if (inBox(REWARD_CONFIRM_BTN)) {
      if (player.currentReward.formatType === 'giveAll') startNextRewardEvent();
      else resolveRewardChoice(rewardCursor);
    }
  }

  if (gameState === 'gameover' || gameState === 'victory') {
    const inBox = (b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
    if (inBox(RETURN_BTN)) backToMenu();
  }

  if (gameState === 'menu' && lobbyTab === 'sound') {
    const inBox = (b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
    SOUND_CATEGORY_BUTTONS.forEach(b => { if (inBox(b)) { selectedSoundCategoryIndex = b.idx; selectedSoundIndex = 0; } });
    SOUND_BUTTONS.forEach(b => { if (inBox(b)) { selectedSoundIndex = b.idx; synthPlay(b.sound.opts); } });
    if (inBox(SOUND_PREV_BTN)) soundPageTurn(-1);
    if (inBox(SOUND_NEXT_BTN)) soundPageTurn(1);
  }

  if (gameState === 'menu' && lobbyTab === 'devlog') {
    const inBox = (b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
    // 只有點在「列頭」(收合時的那一行高度 rowH)才會觸發展開/收合,
    // 避免點展開內容裡的文字時不小心又把它收合
    DEVLOG_ROW_BUTTONS.forEach(b => {
      const headerBox = { x: b.x, y: b.y, w: b.w, h: b.rowH };
      if (inBox(headerBox)) devlogExpandedId = (devlogExpandedId === b.entry.id) ? null : b.entry.id;
    });
    if (inBox(DEVLOG_PREV_BTN)) devlogPageTurn(-1);
    if (inBox(DEVLOG_NEXT_BTN)) devlogPageTurn(1);
  }
});

/* -----------------------------------------------------------
   如何把「最多裝備3把」改成其他數字(例如4或2):
   1. 下面這行的 `> 3` 改成 `> N`(N = 新的上限數量)
   2. 第3169行,中樞畫面「武器」格子顯示的狀態文字
      `selectedWeaponKeys.length + ' / 3 已裝備'`,把 3 改成 N
   3. drawWeaponScreen() 裡的徽章陣列 `['①','②','③']`
      (目前在 drawWeaponScreen 函式內),長度要跟 N 一致——
      減少上限就把陣列砍短,增加上限要記得補對應數量的符號(例如 '④''⑤')
   這三個地方目前寫死是因為裝備上限預期不會太常變動;如果之後常常要調整,
   可以考慮改成讀取一個共用常數(例如 WEAPON_EQUIP_CAP),这樣只要改一個地方就好。
   ----------------------------------------------------------- */
function toggleWeaponEquip(key) {
  const idx = selectedWeaponKeys.indexOf(key);
  if (idx !== -1) {
    selectedWeaponKeys.splice(idx, 1);
  } else {
    selectedWeaponKeys.push(key);
    if (selectedWeaponKeys.length > 3) selectedWeaponKeys.shift(); // FIFO上限,改法見上方註解
  }
  updateEquippedWeaponsBox();
}

/* =========================================================
   Helpers
   ========================================================= */
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function moveWithCollision(entity, vx, vy, obstacles) {
  let testRect = { x: entity.x + vx, y: entity.y, w: entity.w, h: entity.h };
  if (!obstacles.some(o => rectsOverlap(testRect, o))) entity.x += vx;
  testRect = { x: entity.x, y: entity.y + vy, w: entity.w, h: entity.h };
  if (!obstacles.some(o => rectsOverlap(testRect, o))) entity.y += vy;
}

function circleRectOverlap(cx, cy, r, rect) {
  const closestX = clamp(cx, rect.x, rect.x + rect.w);
  const closestY = clamp(cy, rect.y, rect.y + rect.h);
  const dx = cx - closestX, dy = cy - closestY;
  return dx*dx + dy*dy <= r*r;
}

/* =========================================================
   跨局永久存檔(金幣/水晶/邪念/聖念、檔案室解鎖、角色解鎖)
   ========================================================= */
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 存檔失敗就算了,不影響遊戲進行 */ }
}

// 測試期間新檔案預設值:金幣/水晶1500、邪念/聖念500,方便測試購買解鎖功能;正式上線前需改回全0
let currencyTotals = loadJSON('vsCurrency', { gold: 1500, crystal: 1500, evil: 500, sacred: 500 });
let unlockedArchives = loadJSON('vsUnlockedArchives', []);      // 已解鎖的檔案室文件 id 陣列
let unlockedChars = loadJSON('vsUnlockedChars', ['char001']);   // 已解鎖的角色 key 陣列,預設只有初始角色

function saveCurrency() { saveJSON('vsCurrency', currencyTotals); }
function saveUnlockedArchives() { saveJSON('vsUnlockedArchives', unlockedArchives); }
function saveUnlockedChars() { saveJSON('vsUnlockedChars', unlockedChars); }

// 花金幣解鎖鎖定角色;金幣不夠就不做事(畫面上會提示還缺多少)
function tryPurchaseChar(key) {
  const cd = CHARACTERS[key];
  if (!cd.locked || unlockedChars.includes(key)) return;
  if (currencyTotals.gold >= cd.price) {
    currencyTotals.gold -= cd.price;
    unlockedChars.push(key);
    saveCurrency();
    saveUnlockedChars();
  }
}

// 花水晶解鎖檔案室文件;水晶不夠就不做事(畫面上會提示還缺多少)
function tryUnlockArchive(id) {
  if (unlockedArchives.includes(id)) return;
  const doc = ARCHIVE_DOCS.find(d => d.id === id);
  if (!doc) return;
  if (currencyTotals.crystal >= doc.cost) {
    currencyTotals.crystal -= doc.cost;
    unlockedArchives.push(id);
    saveCurrency();
    saveUnlockedArchives();
  }
}

// 局內累積的資源在死亡/過關那一刻才寫回存檔,避免頻繁寫硬碟
function commitRunCurrency() {
  currencyTotals.gold += player.runGold;
  currencyTotals.crystal += player.runCrystal;
  currencyTotals.evil += player.runEvil;
  currencyTotals.sacred += player.runSacred;
  saveCurrency();
}

// 簡易文字換行:依 maxWidth 把一段文字拆成多行陣列(canvas 沒有內建自動換行)
function wrapCanvasText(text, maxWidth) {
  const chars = String(text).split('');
  const lines = [];
  let line = '';
  chars.forEach(ch => {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line.length > 0) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines;
}

/* =========================================================
   準備室→戰場 出戰轉場(特效系統規劃_v1.md 第1節)
   兩種轉場方案(A:遮罩擴散 / C:淡入淡出+音效)由除錯室開關決定要不要播、
   要播哪一種;真正切換到戰場(呼叫initGame)發生在轉場播到一半(全黑/全遮)的瞬間,
   讓玩家看不到切換的破綻。想調整轉場長度,只改 TRANSITION_CONFIG 這兩個數字即可。
   ========================================================= */
const TRANSITION_CONFIG = {
  iris: { totalDuration: 40 }, // 遮罩擴散轉場總幀數,前半收合、後半展開,60fps下40幀≈0.67秒
  fade: { totalDuration: 46 }, // 淡入淡出轉場總幀數
};
let battleTransition = null; // 目前進行中的出戰轉場狀態,null代表沒有在轉場中

// 準備室按下出戰時呼叫這個(取代直接呼叫initGame),依除錯室開關決定轉場方案
function startBattleTransition(mapKey, charKey) {
  let type = null;
  if (DEBUG_TRANSITION_IRIS && DEBUG_TRANSITION_FADE) type = Math.random() < 0.5 ? 'iris' : 'fade';
  else if (DEBUG_TRANSITION_IRIS) type = 'iris';
  else if (DEBUG_TRANSITION_FADE) type = 'fade';

  if (!type) { initGame(mapKey, charKey); return; } // 兩個開關都關:無轉場,直接開打(方便測試時跳過演出)

  battleTransition = { type, timer: 0, total: TRANSITION_CONFIG[type].totalDuration, mapKey, charKey, switched: false };
  gameState = 'transition';
  if (type === 'fade') playSfxById('s045'); // 借用「開門聲」當淡入淡出轉場音效,之後要換成專屬音效只要改這個id
}

// 轉場進行到一半時,switched會被標記,並在該幀真正呼叫initGame切換戰場資料
function updateBattleTransition() {
  if (!battleTransition) { gameState = 'playing'; return; }
  const t = battleTransition;
  t.timer++;
  const half = Math.floor(t.total / 2);
  if (!t.switched && t.timer >= half) {
    initGame(t.mapKey, t.charKey); // 這行內部結尾會把gameState設成'playing',下面立刻蓋回來,讓轉場後半段(展開/淡出)能繼續播完
    gameState = 'transition';
    t.switched = true;
  }
  if (t.timer >= t.total) {
    gameState = 'playing';
    battleTransition = null;
  }
}

// 算出目前轉場進度:switched之前是「收合中」(phase:closing),之後是「展開中」(phase:opening),p皆為0~1
function computeTransitionProgress() {
  if (!battleTransition) return null;
  const t = battleTransition;
  const half = Math.floor(t.total / 2);
  if (!t.switched) return { phase: 'closing', p: clamp(t.timer / half, 0, 1) };
  const openDur = Math.max(1, t.total - half);
  return { phase: 'opening', p: clamp((t.timer - half) / openDur, 0, 1) };
}

// 收合階段(switched前)戰場資料還沒初始化,不能畫drawGame(),先鋪一層黑底再疊轉場遮罩
function drawTransitionStandalone() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  drawTransitionOverlay();
}

// 展開階段(switched後)疊在drawGame()畫完的戰場畫面最上面
function drawTransitionOverlay() {
  const info = computeTransitionProgress();
  if (!info) return;
  if (battleTransition.type === 'iris') {
    const maxR = Math.hypot(W / 2, H / 2);
    const r = info.phase === 'closing' ? maxR * (1 - info.p) : maxR * info.p;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(W / 2, H / 2, Math.max(0, r), 0, Math.PI * 2, true);
    ctx.closePath();
    ctx.fillStyle = '#000';
    ctx.fill('evenodd'); // 用evenodd規則挖空圓形範圍,只有圓外會被黑色填滿
    ctx.restore();
  } else if (battleTransition.type === 'fade') {
    const alpha = info.phase === 'closing' ? info.p : (1 - info.p);
    ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function updatePortrait(force) {
  if (!currentChar || !player) return;
  const pct = player.hp / player.maxHp;
  let key = 'normal';
  if (pct < 0.2) key = 'critical';
  else if (pct < 0.6) key = 'hurt';
  const img = document.getElementById('portraitImg');
  if (img.dataset.currentKey !== key || force) {
    img.src = currentChar.portraits[key];
    img.dataset.currentKey = key;
    img.style.borderColor = key === 'critical' ? '#ef4444' : (key === 'hurt' ? '#f59e0b' : '#4ade80');
  }
}

/* =========================================================
   Dialogue bubbles
   ========================================================= */
function trySpeak(entity, type, isBoss) {
  const now = frameCount;
  entity._lastEvent = entity._lastEvent || 0;
  entity._lastIdle = entity._lastIdle || 0;
  const activeCount = bubbles.filter(b => b.life > 0).length;
  if (activeCount >= DIALOGUE_CONFIG.maxOnScreen) return;

  const isIdle = type === 'idle';
  if (isIdle) {
    if (now - entity._lastIdle < DIALOGUE_CONFIG.idleCooldown) return;
    entity._lastIdle = now;
  } else {
    if (now - entity._lastEvent < DIALOGUE_CONFIG.eventCooldown) return;
    entity._lastEvent = now;
  }
  const pool = isBoss ? BOSS_LINES[type] : GRUNT_LINES[type];
  if (!pool) return;
  bubbles.push({ entity, text: pick(pool), life: DIALOGUE_CONFIG.bubbleDuration });
}

// 道具實際生效邏輯(手動使用道具欄 / 自動拾取模式 共用)
function applyItemEffect(type) {
  if (type === 'heal') {
    player.hp = Math.min(player.maxHp, player.hp + 30);
    updatePortrait();
  } else if (type === 'auto') {
    if (player.equippedWeapons.includes('laser')) {
      // 已裝備聚能雷射:不再是代打道具,改成對本體武器的持續傷害強化;已生效中則延長秒數而不重複疊加倍率
      const buff = player.weaponBuffs.laser;
      if (buff) buff.timeLeft += WEAPON_CONFIG.autoItem.duration;
      else player.weaponBuffs.laser = { timeLeft: WEAPON_CONFIG.autoItem.duration, mult: WEAPON_CONFIG.weaponBuff.multiplier };
    } else {
      player.autoAttack = { timeLeft: WEAPON_CONFIG.autoItem.duration, timer: 0 };
    }
  } else if (type === 'aura') {
    if (player.equippedWeapons.includes('aura')) {
      // 已裝備環域衝擊:同樣改成強化本體傷害,延長規則同上
      const buff = player.weaponBuffs.aura;
      if (buff) buff.timeLeft += WEAPON_CONFIG.aura.duration;
      else player.weaponBuffs.aura = { timeLeft: WEAPON_CONFIG.aura.duration, mult: WEAPON_CONFIG.weaponBuff.multiplier };
    } else {
      player.auraActive = { timeLeft: WEAPON_CONFIG.aura.duration, timer: 0 };
    }
  } else {
    const buff = player.buffs[type] || { stacks: 0, timeLeft: 0 };
    buff.stacks = Math.min(BUFF_MAX_STACK, buff.stacks + 1);
    buff.timeLeft = 540;
    player.buffs[type] = buff;
  }
  spawnHitParticles(player.x + player.w / 2, player.y + player.h / 2, ITEM_INFO[type].color);
}

function pickupItem(item) {
  if (autoModeOn) {
    // 合併開關開啟:撿到直接生效,不進道具欄(自然也不會有滿格問題)
    applyItemEffect(item.type);
    return;
  }
  let slotIdx = player.inventory.findIndex(s => s === null);
  if (slotIdx === -1) {
    player.inventory.shift();
    player.inventory.push(null);
    slotIdx = 2;
  }
  player.inventory[slotIdx] = { type: item.type };
  spawnHitParticles(item.x + 8, item.y + 8, ITEM_INFO[item.type].color);
}

function useItem(slotIdx) {
  const item = player.inventory[slotIdx];
  if (!item) return;
  applyItemEffect(item.type);
  player.inventory[slotIdx] = null;
}

function getMoveSpeedMultiplier() {
  const b = player.buffs['movespeed'];
  const auxLvl = player.auxLevel.moveSpeed || 0; // 輔助「疾風」永久疊加(骨架,數值待補)
  return (b ? 1 + 0.2 * b.stacks : 1) * player.levelSpeedMult * (1 + auxLvl * AUX_CONFIG.moveSpeed.effectPerLv);
}
function getAttackSpeedReduction() {
  const b = player.buffs['atkspeed'];
  return b ? 1 - 0.18 * b.stacks : 1;
}
function getAuxCooldownMult() {
  const auxLvl = player.auxLevel.cooldown || 0; // 輔助「靈巧」永久疊加(骨架,數值待補)
  return Math.max(0.5, 1 - auxLvl * AUX_CONFIG.cooldown.effectPerLv);
}
function getAttackCooldownFrames() {
  return Math.max(6, Math.round(WEAPON_CONFIG.melee.cooldown * getAttackSpeedReduction() * player.levelCooldownMult * getWeaponLevelMult('melee').cdMult * getAuxCooldownMult()));
}
function getAutoItemInterval() {
  return Math.max(15, Math.round(WEAPON_CONFIG.autoItem.baseInterval * getAttackSpeedReduction()));
}
function getDamageMultiplier() {
  const b = player.buffs['atkpower'];
  return (b ? 1 + 0.5 * b.stacks : 1) * (1 + player.milestoneDmgMultBonus);
}
// 已裝備武器撿到「對應道具」時的持續強化倍率(未生效時回傳 1,不影響原本計算)
function getWeaponBuffMult(weaponKey) {
  const b = player.weaponBuffs[weaponKey];
  return b ? b.mult : 1;
}
// 武器等級加成(Lv1初始~Lv5滿級,見 WEAPON_LEVEL_TABLE);沒紀錄等級的武器一律當Lv1
function getWeaponLevelMult(weaponKey) {
  const lvl = player.weaponLevel[weaponKey] || 1;
  // 防呆:等級表只有WEAPON_LEVEL_MAX格,萬一lvl意外超出範圍(理論上不會,但damage計算每幀都會呼叫這裡,寧可保守夾住也不要整個crash)
  return WEAPON_LEVEL_TABLE[Math.min(lvl, WEAPON_LEVEL_MAX) - 1];
}
// 某武器目前總保底傷害 = 武器本身設定 + 武器等級加成 + 角色里程碑固定加成
function getTotalBaseDamage(weaponKey) {
  return WEAPON_CONFIG[weaponKey].baseDamage + getWeaponLevelMult(weaponKey).baseBonus + player.milestoneBaseDamageBonus;
}

/* =========================================================
   傷害計算(統一無條件捨去小數)
   —— baseDamage 是武器「保底傷害」:固定值,完全不受角色 baseAttackDmg、
      攻擊力buff(getDamageMultiplier)影響,用來讓武器本身可以有一定強度,
      即使玩家完全沒加攻擊力也保證打得出這個傷害。之後想做「主要看武器強度、
      不太吃玩家數值」的武器,只要把對應的 baseDamage 調高、damageMultiplier
      調低甚至設0即可。
   ========================================================= */
function getMeleeDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.melee.damageMultiplier * getWeaponLevelMult('melee').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('melee');
}
function getLaserDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.laser.damageMultiplier * getWeaponLevelMult('laser').dmgMult * getDamageMultiplier() * getWeaponBuffMult('laser')) + getTotalBaseDamage('laser');
}
function getAutoItemDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.laser.damageMultiplier * WEAPON_CONFIG.autoItem.damageMultiplier * getDamageMultiplier()) + WEAPON_CONFIG.laser.baseDamage;
}
function getAuraDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.aura.damageMultiplier * getWeaponLevelMult('aura').dmgMult * getDamageMultiplier() * getWeaponBuffMult('aura')) + getTotalBaseDamage('aura');
}
function getThunderDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.thunder.damageMultiplier * getWeaponLevelMult('thunder').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('thunder');
}
function getDynamiteDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.dynamite.damageMultiplier * getWeaponLevelMult('dynamite').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('dynamite');
}
function getBoomerangDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.boomerang.damageMultiplier * getWeaponLevelMult('boomerang').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('boomerang');
}
function getHomingDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.homing.damageMultiplier * getWeaponLevelMult('homing').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('homing');
}
function getPierceDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.pierce.damageMultiplier * getWeaponLevelMult('pierce').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('pierce');
}
function getPoisonDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.poison.damageMultiplier * getWeaponLevelMult('poison').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('poison');
}
function getChainDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.chain.damageMultiplier * getWeaponLevelMult('chain').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('chain');
}
function getBounceDamage() {
  return Math.floor(player.baseAttackDmg * WEAPON_CONFIG.bounce.damageMultiplier * getWeaponLevelMult('bounce').dmgMult * getDamageMultiplier()) + getTotalBaseDamage('bounce');
}

// ===== 武器專屬升級效果(Lv3解鎖),跟通用的 WEAPON_LEVEL_TABLE 疊加,不衝突 =====
// 彈射球 Lv3:基礎彈射次數+1
function getBounceTotalCount() {
  return WEAPON_CONFIG.bounce.bounces + ((player.weaponLevel.bounce || 1) >= 3 ? 1 : 0);
}
// 連鎖閃電 Lv3:基礎連鎖數+1
function getChainTotalCount() {

}
// 軍刀 Lv3:揮砍判定範圍 +16px
function getMeleeTotalRange() {

}

/* =========================================================
   資源掉落(經驗/金幣/水晶/邪念/聖念)—— 角色/地圖 dropMult 在這裡生效
   ========================================================= */
function getDropMult(type) {
  const c = (currentChar && currentChar.dropMult && currentChar.dropMult[type]) || 1;
  const m = (currentMap && currentMap.dropMult && currentMap.dropMult[type]) || 1;
  return c * m;
}
function getExpForKill(isBoss) {
  return isBoss ? Math.floor(150 + 20 * wave) : Math.floor(4 + 0.5 * wave);
}
function spawnRunOrbs(x, y, isBoss) {
  if (!DROP_DEBUG_DISABLED.has('exp')) {
    const expAmt = Math.floor(getExpForKill(isBoss) * getDropMult('exp'));
    if (expAmt > 0) orbs.push({ x, y, w: 10, h: 10, type: 'exp', amount: expAmt });
  }

  ['gold', 'crystal', 'evil', 'sacred'].forEach(type => {
    if (DROP_DEBUG_DISABLED.has(type)) return;
    const cfg = DROP_CONFIG[type];
    const mult = getDropMult(type);
    const guaranteed = isBoss && type === 'crystal'; // 目前只有水晶有「Boss保底」規則
    if (guaranteed || Math.random() < cfg.chance * mult) {
      const base = cfg.min + Math.floor(Math.random() * (cfg.max - cfg.min + 1));
      const amt = Math.round(base * mult);
      const finalAmt = guaranteed ? Math.max(1, amt) : amt;
      if (finalAmt > 0) orbs.push({ x, y, w: 10, h: 10, type, amount: finalAmt });
    }
  });
}
// Boss擊殺獎勵直接發放(不用等玩家走過去撿,因為打完Boss遊戲馬上結束)
function grantBossRewards() {
  if (!DROP_DEBUG_DISABLED.has('exp')) gainExp(Math.floor(getExpForKill(true) * getDropMult('exp')));
  ['gold', 'crystal', 'evil', 'sacred'].forEach(type => {
    if (DROP_DEBUG_DISABLED.has(type)) return;
    const cfg = DROP_CONFIG[type];
    const mult = getDropMult(type);
    const guaranteed = type === 'crystal'; // Boss保底規則目前只套用在水晶
    if (guaranteed || Math.random() < cfg.chance * mult) {
      const base = cfg.min + Math.floor(Math.random() * (cfg.max - cfg.min + 1));
      const amt = Math.max(guaranteed ? 1 : 0, Math.round(base * mult));
      if (amt > 0) player['run' + type[0].toUpperCase() + type.slice(1)] += amt;
    }
  });
}
function updateOrbs() {
  const magnetRadius = 90, magnetSpeed = 7;
  const px = player.x + player.w / 2, py = player.y + player.h / 2;
  orbs.forEach(o => {
    const ox = o.x + o.w / 2, oy = o.y + o.h / 2;
    const dx = px - ox, dy = py - oy;
    const dist = Math.hypot(dx, dy);
    if (dist < magnetRadius && dist > 0.01) {
      o.x += (dx / dist) * magnetSpeed;
      o.y += (dy / dist) * magnetSpeed;
    }
  });
  orbs = orbs.filter(o => {
    if (rectsOverlap(player, o)) { collectOrb(o); return false; }
    return true;
  });
}
function collectOrb(o) {
  if (o.type === 'exp') { gainExp(o.amount); playSfxById('s053'); }
  else if (o.type === 'gold') { player.runGold += o.amount; playSfxById('s054'); }
  else if (o.type === 'crystal') { player.runCrystal += o.amount; playSfxById('s055'); }
  else if (o.type === 'evil') player.runEvil += o.amount;
  else if (o.type === 'sacred') player.runSacred += o.amount;
  spawnHitParticles(o.x + o.w / 2, o.y + o.h / 2, RESOURCE_META[o.type].color);
}

/* =========================================================
   角色升級(單局內)
   ========================================================= */
function gainExp(amount) {
  if (gameState !== 'playing' && gameState !== 'reward') return;
  player.exp += amount;
  while (player.level < 999 && player.exp >= expToNext(player.level)) {
    player.exp -= expToNext(player.level);
    player.level++;
    applyLevelUpEffects(player.level);
    pushRewardEvent('levelup');
  }
}
function applyLevelUpEffects(level) {
  player.baseAttackDmg += 1;
  player.maxHp += 5;
  player.hp = player.maxHp; // 升級補滿血
  if (level % 3 === 0) player.levelCooldownMult *= 0.97;
  if (level % 5 === 0) player.levelSpeedMult *= 1.02;

  if (level === 5) player.milestoneBaseDamageBonus += 2;
  if (level === 10) {
    player.hp = player.maxHp;
    Object.keys(player.resist).forEach(k => { player.resist[k] += 5; });
  }
  if (level === 15) player.milestoneBaseDamageBonus += 3;
  if (level === 20) player.milestoneDmgMultBonus += 0.2;
}
// 候選項目要顯示的圖示顏色/標題文字(依kind分流)
function rewardCandidateIconColor(c) {
  if (c.kind === 'newWeapon' || c.kind === 'upgradeWeapon' || c.kind === 'synthesis') return WEAPON_ICON_COLOR[c.key] || '#999';
  if (c.kind === 'aux') return AUX_ICON_COLOR[c.key] || '#999';
  if (c.kind === 'fallbackGold') return '#facc15';
  if (c.kind === 'fallbackBuff') return '#f87171';
  return '#999';
}
function rewardCandidateTitle(c) {
  if (c.kind === 'newWeapon' || c.kind === 'synthesis') return (WEAPON_DISPLAY[c.key] || c.key).split(' ')[0] + ' Lv0→Lv1';
  if (c.kind === 'upgradeWeapon') {
    // giveAll格式在畫面顯示前就已經套用過了(player.weaponLevel已是新值),要用套用前存的_preApplyLevel才不會多算一級;
    // choose格式還沒套用,_preApplyLevel是undefined,直接讀目前等級即可
    const lvl = c._preApplyLevel != null ? c._preApplyLevel : (player.weaponLevel[c.key] || 1);
    return (WEAPON_DISPLAY[c.key] || c.key).split(' ')[0] + ' Lv' + lvl + '→Lv' + (lvl + 1);
  }
  if (c.kind === 'aux') {
    const lvl = c.key === 'luck' ? (player.luck || 0) : (player.auxLevel[c.key] || 0);
    return AUX_CONFIG[c.key].label.split(' ')[0] + ' Lv' + lvl + '→Lv' + (lvl + 1);
  }
  if (c.kind === 'fallbackGold') return c.label;
  if (c.kind === 'fallbackBuff') return c.label;
  return c.key || '?';
}
function rewardCandidateSubtitle(c) {
  if (c.kind === 'newWeapon') {
    const base = weaponStatLineSeconds(c.key);
    const tag = weaponSpecialTag(c.key);
    return tag ? base + ' · ' + tag : base;
  }
  if (c.kind === 'upgradeWeapon') {
    const lvl = c._preApplyLevel != null ? c._preApplyLevel : (player.weaponLevel[c.key] || 1); // 同上,避免giveAll套用後多算一級
    const next = lvl + 1;
    const nxt = WEAPON_LEVEL_TABLE[Math.min(next, WEAPON_LEVEL_MAX) - 1]; // 防呆:next理論上不會超過WEAPON_LEVEL_MAX,夾住避免萬一查表越界crash
    let line = '傷害×' + nxt.dmgMult + ' 傷害+' + nxt.baseBonus + ' 冷卻×' + nxt.cdMult;
    if (next === 3) {
      if (c.key === 'bounce') line += ' ・解鎖:彈射+1';
      if (c.key === 'chain') line += ' ・解鎖:連鎖+1';
      if (c.key === 'melee') line += ' ・解鎖:範圍+16px';
    }
    return line;
  }
  if (c.kind === 'synthesis') return '合成';
  if (c.kind === 'aux') {
    const cfg = AUX_CONFIG[c.key];
    const effectText = c.key === 'luck' ? '+' + cfg.effectPerLv + ' 幸運值' : '+' + Math.round(cfg.effectPerLv * 100) + '%';
    return '每級' + effectText;
  }
  if (c.kind === 'fallbackGold') return '+' + (c.amount || 50);
  if (c.kind === 'fallbackBuff') return '限時強化';
  return '';
}

// 垂直並排(原本是橫向排,候選一多就會太窄看不清楚),每列一個候選:左邊icon+右邊標題/副標,詳細說明另外收在底部固定面板
// 獎勵畫面內容寬度:候選清單跟底部確認鈕共用這一個邊界值,想調寬窄只要改這裡
// 數字是「左右各留多少留白」,越大內容越窄;目前抓140(候選列寬度=800-140*2=520px)
const REWARD_CONTENT_MARGIN_X = 140;
const REWARD_LAYOUT = { rowH: 50, gap: 6, marginX: REWARD_CONTENT_MARGIN_X, listTop: 96 };
const REWARD_INFO_PANEL_HEIGHT = 110;
function layoutRewardButtons() {

// 候選項目的詳細說明(給底部固定面板用,比照武器庫 WEAPON_FLAVOR_TEXT 那套風格)
function rewardCandidateFlavor(c) {
  if (c.kind === 'newWeapon' || c.kind === 'upgradeWeapon' || c.kind === 'synthesis') {
    return WEAPON_FLAVOR_TEXT[c.key] || '（尚無說明）';
  }
  if (c.kind === 'aux') {
    if (c.key === 'moveSpeed') return '每級提升移動速度,跑位閃避更靈活。';
    if (c.key === 'cooldown') return '每級縮短所有武器冷卻時間,攻擊更頻繁。';

  if (c.kind === 'fallbackBuff') return '候選格式已滿或無適用內容時的保底獎勵,獲得一個限時強化效果。';

// 獎勵特效播放中(fxPhase==='playing')的畫面:紙花/煙火粒子 + 進場動畫(滑入或拉霸),
// 不畫標準的候選清單/確認鈕,避免資訊過載,也讓玩家清楚知道現在還不能操作
function drawRewardFx(cr) {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 20px monospace';
  ctx.fillText(REWARD_SOURCE_LABEL[cr.source] || '獲得獎勵！', W / 2, 40);

  rewardFxParticles.forEach(p => {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    if (p.kind === 'confetti') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot || 0);
      ctx.fillRect(-3, -2, 6, 4);
      ctx.restore();
    } else {
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
  });

  if (cr.formatType === 'choose') drawChooseFxRows(cr);
  else drawGiveAllFxRows(cr);

  ctx.textAlign = 'left';
}
// 2.a 多選:候選項目依序(有時間差)從畫面上方垂直滑入定位,想改成同時滑入把slideDelayPerItem設0即可
function drawChooseFxRows(cr) {
  cr.candidates.forEach((c, i) => {
    const slot = cr.fxSlide[i];
    const localT = clamp((cr.fxTimer - slot.delay) / REWARD_FX_CONFIG.choose.slideDuration, 0, 1);
    if (localT <= 0) return; // 還沒輪到這個候選開始滑入
    const ease = 1 - Math.pow(1 - localT, 3); // ease-out,滑到後段會明顯減速,比等速線性更有份量感
    const btn = REWARD_BUTTONS[i];
    const startY = -btn.h - 10;
    const curY = startY + (btn.y - startY) * ease;
    ctx.globalAlpha = clamp(localT * 1.5, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(btn.x, curY, btn.w, btn.h);
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2;
    ctx.strokeRect(btn.x, curY, btn.w, btn.h);
    const iconSize = btn.h - 12;
    drawPixelRect(btn.x + 6, curY + 6, iconSize, iconSize, rewardCandidateIconColor(c));
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(rewardCandidateTitle(c), btn.x + iconSize + 18, curY + 24);
    ctx.globalAlpha = 1;
  });
}
// 2.b 加倍/全給:每個候選各是一條「老虎機轉軸」,快速輪播陪轉圖示、依減速曲線變慢,最後停在真正結果上
function drawGiveAllFxRows(cr) {
  const cfg = REWARD_FX_CONFIG.giveAll;
  cr.candidates.forEach((c, i) => {
    const slot = cr.fxSpin[i];
    const elapsed = cr.fxTimer - slot.delay;
    if (elapsed < 0) return; // 還沒輪到這個轉軸開始轉
    const btn = REWARD_BUTTONS[i];
    const iconSize = btn.h - 12;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

    const localT = clamp(elapsed / cfg.spinDuration, 0, 1);
    ctx.textAlign = 'left';
    if (localT >= 1) {
      // 停格:顯示真正結果
      drawPixelRect(btn.x + 6, btn.y + 6, iconSize, iconSize, rewardCandidateIconColor(c));
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px monospace';
      ctx.fillText(rewardCandidateTitle(c), btn.x + iconSize + 18, btn.y + 24);
    } else {
      // 轉動中:切換間隔隨localT從spinIntervalStart線性(以平方曲線)增加到spinIntervalEnd,做出「越轉越慢」的減速感
      const interval = cfg.spinIntervalStart + (cfg.spinIntervalEnd - cfg.spinIntervalStart) * (localT * localT);
      const spinIdx = Math.floor(elapsed / Math.max(1, Math.round(interval))) % slot.spinKeys.length;
      const spinKey = slot.spinKeys[spinIdx];
      drawPixelRect(btn.x + 6, btn.y + 6, iconSize, iconSize, WEAPON_ICON_COLOR[spinKey] || '#999');
      ctx.fillStyle = '#999';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('？？？', btn.x + iconSize + 18, btn.y + 24);
    }
  });
}

// 點列表或按↑↓只是切換這裡顯示哪個候選的說明,實際「獲得且關閉」一律要按這條確認鈕(或鍵盤Enter/R)

function handleRewardKeys() {
  if (gameState !== 'reward') return;
  const cr = player.currentReward;
  if (!cr) return;
  if (cr.fxPhase === 'playing') return; // 2.3:特效播放期間鎖定操作,避免還沒看清楚獎勵就誤按跳過
  layoutRewardButtons();
  const n = REWARD_BUTTONS.length;
  if (n === 0) return;

  // 兩種格式操作邏輯統一:↑↓只切換底部說明欄預覽,Enter/R才是「確認獲得且關閉」,不會自動關閉
  if (keys['arrowup_down']) rewardCursor = (rewardCursor - 1 + n) % n;
  if (keys['arrowdown_down']) rewardCursor = (rewardCursor + 1) % n;
  if (keys['enter_down'] || keys['r_down']) {
    if (cr.formatType === 'giveAll') startNextRewardEvent();
    else resolveRewardChoice(rewardCursor);
  }
  ['arrowup_down','arrowdown_down','enter_down','r_down'].forEach(k => { keys[k] = false; });
}
// 加倍型的自動倒數(已移除;現在跟選擇型一樣需要按確認鍵/點確認按鈕才會關閉,不會自動消失)

/* =========================================================
   Player melee attack hitbox (clipped by obstacles)
   ========================================================= */
function playerAttackHitbox() {
  const range = getMeleeTotalRange();
  let hb = player.facing === 1
    ? { x: player.x + player.w, y: player.y - 4, w: range, h: player.h + 8 }
    : { x: player.x - range, y: player.y - 4, w: range, h: player.h + 8 };

  obstacles.forEach(o => {
    if (o.y < hb.y + hb.h && o.y + o.h > hb.y) {
      if (player.facing === 1) {
        if (o.x >= player.x + player.w && o.x < hb.x + hb.w) {
          hb.w = Math.min(hb.w, Math.max(0, o.x - hb.x));
        }
      } else {
        if (o.x + o.w <= player.x && o.x + o.w > hb.x) {
          const newLeft = o.x + o.w;
          hb.w = Math.max(0, hb.x + hb.w - newLeft);
          hb.x = newLeft;
        }
      }
    }
  });
  return hb;
}

/* =========================================================
   Laser / Auto-item projectiles
   ========================================================= */
function fireLaserPair(source) {
  const cfg = source === 'skill' ? WEAPON_CONFIG.laser : WEAPON_CONFIG.autoItem;
  const dmg = source === 'skill' ? getLaserDamage() : getAutoItemDamage();
  const dirs = [player.facing, -player.facing];
  dirs.forEach(dir => {
    projectiles.push({
      x: player.x + player.w/2 - cfg.width/2,
      y: player.y + player.h/2 - cfg.height/2,
      vx: dir * cfg.speed,
      vy: 0,
      w: cfg.width, h: cfg.height,
      damage: dmg,
      source,
    });
  });
}

function updateProjectiles() {
  const homingCfg = WEAPON_CONFIG.homing;
  projectiles.forEach(p => {
    if (p.homing) {
      const found = findNearestEnemyOrBoss(p.x + p.w/2, p.y + p.h/2);
      if (found) {
        const t = found.target;
        const desiredAng = Math.atan2(t.y + t.h/2 - (p.y + p.h/2), t.x + t.w/2 - (p.x + p.w/2));
        const curAng = Math.atan2(p.vy, p.vx);
        let diff = desiredAng - curAng;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = clamp(diff, -homingCfg.turnRate, homingCfg.turnRate);
        const newAng = curAng + turn;
        const spd = Math.hypot(p.vx, p.vy);
        p.vx = Math.cos(newAng) * spd;
        p.vy = Math.sin(newAng) * spd;
      }
      spawnFxEffect('homing', p.x + p.w/2, p.y + p.h/2, {});
    }
    if (p.bounceGrace > 0) p.bounceGrace--;
    p.x += p.vx; p.y += p.vy;
  });
  projectiles = projectiles.filter(p => {
    if (isScrollMap()) {
      if (p.x < camera.x - 30 || p.x > camera.x + W + 30) return false;
    } else {
      if (p.x < -30 || p.x > W + 30) return false;
    }
    if (obstacles.some(o => rectsOverlap(p, o))) {
      spawnHitParticles(p.x + p.w/2, p.y + p.h/2, '#7cf9ff');
      return false;
    }

    // 貫穿:同一目標只扣一次血,命中後不消失,靠存活幀數/飛出畫面/撞障礙物結束
    if (p.pierce) {
      enemies.forEach(e => {
        if (!p.hitSet.has(e) && rectsOverlap(p, e)) {
          e.hp -= p.damage; e.hitFlash = 8;
          playSfxById('s051');
          p.hitSet.add(e);
          spawnHitParticles(e.x + e.w/2, e.y + e.h/2, EFFECT_CONFIG.pierce.flashColor);
          spawnDamageNumber(e.x + e.w/2, e.y, p.damage, false);
          trySpeak(e, 'hurt', false);
        }
      });
      if (boss && !p.hitSet.has(boss) && rectsOverlap(p, boss)) {
        boss.hp -= p.damage; boss.hitFlash = 8;
        playSfxById('s052');
        p.hitSet.add(boss);
        spawnHitParticles(boss.x + boss.w/2, boss.y + boss.h/2, EFFECT_CONFIG.pierce.flashColor);
        spawnDamageNumber(boss.x + boss.w/2, boss.y, p.damage, true);
        trySpeak(boss, 'hurt', true);
      }
      p.life++;
      return p.life <= p.maxLife;
    }

    // 彈射球:命中後依重疊軸反射,彈射次數用完的那一擊結束
    if (p.bounceBall) {
      if (p.bounceGrace > 0) return true;
      let hitTarget = null, hitIsBoss = false;
      enemies.forEach(e => { if (!hitTarget && rectsOverlap(p, e)) hitTarget = e; });
      if (!hitTarget && boss && rectsOverlap(p, boss)) { hitTarget = boss; hitIsBoss = true; }
      if (!hitTarget) return true;
      hitTarget.hp -= p.damage; hitTarget.hitFlash = 8;
      playSfxById(hitIsBoss ? 's052' : 's051');
      spawnHitParticles(hitTarget.x + hitTarget.w/2, hitTarget.y + hitTarget.h/2, EFFECT_CONFIG.bounce.flashColor);
      spawnDamageNumber(hitTarget.x + hitTarget.w/2, hitTarget.y, p.damage, hitIsBoss);
      trySpeak(hitTarget, 'hurt', hitIsBoss);
      spawnFxEffect('bounce', p.x + p.w/2, p.y + p.h/2, {});
      if (p.bouncesLeft <= 0) return false;
      const pcx = p.x + p.w/2, pcy = p.y + p.h/2;
      const ecx = hitTarget.x + hitTarget.w/2, ecy = hitTarget.y + hitTarget.h/2;
      const overlapX = (p.w/2 + hitTarget.w/2) - Math.abs(pcx - ecx);
      const overlapY = (p.h/2 + hitTarget.h/2) - Math.abs(pcy - ecy);
      if (overlapX < overlapY) p.vx = -p.vx; else p.vy = -p.vy;
      p.bouncesLeft--;
      p.bounceGrace = 6;
      return true;
    }

    // 預設行為(雷射/自動道具/追蹤彈皆適用):命中一次就消失
    let hit = false;
    enemies.forEach(e => {
      if (!hit && rectsOverlap(p, e)) {
        e.hp -= p.damage;
        e.hitFlash = 8;
        playSfxById('s051');
        hit = true;
        spawnHitParticles(e.x + e.w/2, e.y + e.h/2, '#7cf9ff');
        spawnDamageNumber(e.x + e.w/2, e.y, p.damage, false);
        trySpeak(e, 'hurt', false);
        screenShake = Math.max(screenShake, 3);
      }
    });
    if (hit) return false;
    if (boss && rectsOverlap(p, boss)) {
      boss.hp -= p.damage;
      boss.hitFlash = 8;
      playSfxById('s052');
      spawnHitParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#7cf9ff');
      spawnDamageNumber(boss.x + boss.w/2, boss.y, p.damage, true);
      trySpeak(boss, 'hurt', true);
      screenShake = Math.max(screenShake, 4);
      return false;
    }
    return true;
  });
}

/* =========================================================
   圓形光環
   ========================================================= */
function triggerAuraPulse() {
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  const r = WEAPON_CONFIG.aura.radius;
  const dmg = getAuraDamage();

/* =========================================================
   閃電雷雲:自動觸發,在玩家周遭半徑內把所有敵人(含Boss)蒐集成候選名單,
   隨機挑 maxTargets 個直接造成傷害,沒有彈道也沒有延遲
   視覺效果:天降閃電折線(fxEffects,見 EFFECT_CONFIG.thunder)+ 落地火花
   ========================================================= */
function triggerThunderStrike() {
  const cx = player.x + player.w/2, cy = player.y + player.h/2;
  const r = WEAPON_CONFIG.thunder.radius;
  const dmg = getThunderDamage();
  const candidates = [];
  enemies.forEach(e => { if (circleRectOverlap(cx, cy, r, e)) candidates.push({ target: e, isBoss: false }); });
  if (boss && circleRectOverlap(cx, cy, r, boss)) candidates.push({ target: boss, isBoss: true });
  if (candidates.length === 0) return;

  // 隨機挑最多 maxTargets 個(目前設計為1個),重複洗牌後取前N個
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  candidates.slice(0, WEAPON_CONFIG.thunder.maxTargets).forEach(c => {
    const t = c.target;
    const tx = t.x + t.w/2, ty = t.y + t.h/2;
    t.hp -= dmg;
    t.hitFlash = 8;
    playSfxById(c.isBoss ? 's052' : 's051');
    spawnFxEffect('thunder', tx, ty, { points: buildThunderBoltPoints(tx, ty) });
    for (let i = 0; i < EFFECT_CONFIG.thunder.sparkCount; i++) {
      particles.push({ x: tx, y: ty, vx: (Math.random()-0.5)*3, vy: -Math.random()*2, life: 16, color: EFFECT_CONFIG.thunder.boltColor });
    }
    spawnDamageNumber(t.x + t.w/2, t.y, dmg, c.isBoss);
    trySpeak(t, 'hurt', c.isBoss);
  });
}

/* =========================================================
   迴力鏢:自動朝面向方向丟出,飛行中持續轉向形成弧線,
   命中一次或超過飛行時間/飛出畫面就消失
   ========================================================= */
function throwBoomerang() {
  const cfg = WEAPON_CONFIG.boomerang;
  boomerangs.push({
    x: player.x + player.w / 2 - cfg.w / 2,
    y: player.y + player.h / 2 - cfg.h / 2,
    w: cfg.w, h: cfg.h,
    angle: player.facing === 1 ? 0 : Math.PI,
    life: 0,
  });
}

function updateBoomerangs() {
  const cfg = WEAPON_CONFIG.boomerang;
  const dmg = getBoomerangDamage();
  boomerangs.forEach(b => {
    b.angle += cfg.turnRate;
    b.x += Math.cos(b.angle) * cfg.speed;
    b.y += Math.sin(b.angle) * cfg.speed;
    b.life++;
  });
  boomerangs = boomerangs.filter(b => {
    if (b.life >= cfg.maxLife) return false;
    if (isScrollMap()) {
      if (b.x < camera.x - 40 || b.x > camera.x + W + 40 || b.y < camera.y - 40 || b.y > camera.y + H + 40) return false;
    } else {
      if (b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) return false;
    }
    if (obstacles.some(o => rectsOverlap(b, o))) {
      spawnHitParticles(b.x + b.w/2, b.y + b.h/2, '#facc15');
      return false;
    }
    let hit = false;
    enemies.forEach(e => {
      if (!hit && rectsOverlap(b, e)) {
        e.hp -= dmg;
        e.hitFlash = 8;
        playSfxById('s051');
        hit = true;
        spawnHitParticles(e.x + e.w/2, e.y + e.h/2, '#facc15');
        spawnDamageNumber(e.x + e.w/2, e.y, dmg, false);
        trySpeak(e, 'hurt', false);
        screenShake = Math.max(screenShake, 3);
      }
    });
    if (hit) return false;
    if (boss && rectsOverlap(b, boss)) {
      boss.hp -= dmg;
      boss.hitFlash = 8;
      playSfxById('s052');
      spawnHitParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#facc15');
      spawnDamageNumber(boss.x + boss.w/2, boss.y, dmg, true);
      trySpeak(boss, 'hurt', true);
      screenShake = Math.max(screenShake, 4);
      return false;
    }
    return true;
  });
}

/* =========================================================
   以下5把是特效可行性測試武器,數值/命中規則都先簡化,重點驗證特效技法
   ========================================================= */

// 找出離指定座標最近的敵人或Boss,回傳 {target, isBoss} 或 null(場上沒東西時)
function findNearestEnemyOrBoss(x, y) {
  let best = null, bestD = Infinity;
  enemies.forEach(e => {
    const d = Math.hypot(e.x + e.w/2 - x, e.y + e.h/2 - y);
    if (d < bestD) { bestD = d; best = { target: e, isBoss: false }; }
  });
  if (boss) {
    const d = Math.hypot(boss.x + boss.w/2 - x, boss.y + boss.h/2 - y);
    if (d < bestD) { bestD = d; best = { target: boss, isBoss: true }; }
  }
  return best;
}

/* ---- 追蹤彈:朝最近敵人發射,飛行中持續小角度轉向修正,不容易射偏 ---- */
function fireHomingProjectile() {
  const cfg = WEAPON_CONFIG.homing;
  const dmg = getHomingDamage();
  const px = player.x + player.w/2, py = player.y + player.h/2;
  const found = findNearestEnemyOrBoss(px, py);
  const ang = found ? Math.atan2(found.target.y + found.target.h/2 - py, found.target.x + found.target.w/2 - px) : (player.facing === 1 ? 0 : Math.PI);
  projectiles.push({
    x: px - cfg.width/2, y: py - cfg.height/2,
    vx: Math.cos(ang) * cfg.speed, vy: Math.sin(ang) * cfg.speed,
    w: cfg.width, h: cfg.height, damage: dmg,
    weaponKey: 'homing', homing: true,
  });
}

/* ---- 穿透光刃:朝面向射出,一次貫穿一直線上所有敵人,靠存活幀數限制飛行距離 ---- */
function firePierceBeam() {
  const cfg = WEAPON_CONFIG.pierce;
  const dmg = getPierceDamage();
  const dir = player.facing;
  projectiles.push({
    x: player.x + player.w/2 - (dir === 1 ? 0 : cfg.width),
    y: player.y + player.h/2 - cfg.height/2,
    vx: dir * cfg.speed, vy: 0,
    w: cfg.width, h: cfg.height, damage: dmg,
    weaponKey: 'pierce', pierce: true, hitSet: new Set(), life: 0, maxLife: cfg.maxLife,
  });
  spawnFxEffect('pierce', player.x + player.w/2, player.y + player.h/2, { facing: dir });
}

/* ---- 地面毒圈:丟在腳邊反方向(比照炸藥落點規則),範圍內每隔一段時間對敵人造成一次傷害 ---- */
function dropPoisonZone() {
  const cfg = WEAPON_CONFIG.poison;
  const cx = player.x + player.w/2 - cfg.dropOffset * player.facing;
  const cy = player.y + player.h - 8;
  poisonZones.push({ x: cx, y: cy, radius: cfg.radius, life: cfg.duration, tickTimer: 0 });
}

function updatePoisonZones() {
  const cfg = WEAPON_CONFIG.poison;
  poisonZones.forEach(z => {
    z.life--;
    z.tickTimer--;
    if (z.tickTimer <= 0) {
      z.tickTimer = cfg.tickInterval;
      const dmg = getPoisonDamage();
      enemies.forEach(e => {
        if (circleRectOverlap(z.x, z.y, z.radius, e)) {
          e.hp -= dmg; e.hitFlash = 6;
          spawnHitParticles(e.x + e.w/2, e.y + e.h/2, EFFECT_CONFIG.poison.bubbleColor);
          spawnDamageNumber(e.x + e.w/2, e.y, dmg, false);
        }
      });

      }
    }
  });
