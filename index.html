/* ============================================================
   角色立繪
   之後想接圖片：在 PORTRAIT_MAP 裡依「基準key_技能key」對應圖片檔名，
   renderPortraits() 會依目前選取的技能自動切換要顯示的圖

   ⚠️ 我方角色（daren/sete/guran/shiyi）id是固定的，直接用id當基準key即可。
   ⚠️ 敵人的id每次戰鬥開始都會重新產生（用遞增計數器生成，避免同名敵人衝突），
      所以敵人不能直接用id對照立繪，必須額外指定 portraitKey（在
      ENEMY_TEMPLATES 裡設定，例如哥布林不管生成幾隻都給 portraitKey:'goblin'，
      這樣不管是哪一隻、第幾次戰鬥，都能穩定對到同一張 goblin_default.png）
============================================================ */
const PORTRAIT_MAP = {
  'daren_default': 'assets/portraits/daren_default.png',
  'sete_default': 'assets/portraits/sete_default.png',
  'guran_default': 'assets/portraits/guran_default.png',
  'shiyi_default': 'assets/portraits/shiyi_default.png',

  // 平常狀態立繪（準備畫面用，跟上面戰鬥用的_default是兩張不同圖）
  'daren_normal': 'assets/portraits/daren_normal.png',
  'sete_normal': 'assets/portraits/sete_normal.png',
  'guran_normal': 'assets/portraits/guran_normal.png',
  'shiyi_normal': 'assets/portraits/shiyi_normal.png',

  'goblin_default': 'assets/portraits/goblin_default.png',



  // 範例格式（目前皆未提供圖片檔，先留空）：
  // 'daren_guard': 'daren_guard.png',
  // 'guran_song_heal': 'guran_song_heal.png',
};
/* 準備畫面用的「平常狀態」立繪，跟下面 renderPortraits() 的戰鬥立繪是分開的函式，
   因為戰鬥立繪還要處理「依選取的技能切換圖片」那套邏輯，準備畫面不需要 */
function prepPortraitHtml(c){
  const imgFile = PORTRAIT_MAP[c.id + '_normal'];
  if(imgFile) return `<img src="${imgFile}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`;
  return `<div class="portrait-placeholder">${c.name}<br><span style="opacity:.6;">(${c.id}_normal)</span><br>尚未設定圖片</div>`;
}
function renderPortraits(){
  const actor = currentActor();
  if(!actor) return;
  const allyBox = document.getElementById('portraitAlly');
  const enemyBox = document.getElementById('portraitEnemy');
  if(!allyBox || !enemyBox) return;

  function portraitHtml(unit, defaultLabel){
    if(!unit) return `<div class="portrait-placeholder">${defaultLabel}<br>（尚未設定圖片）</div>`;
    const skillKey = (battle.selected.mode === 'skill' && battle.selected.skillKey) ? battle.selected.skillKey : 'default';
    // 優先用 portraitKey（固定不變，敵人專用），沒有的話才退回用 id（我方角色固定，敵人id每次戰鬥會變動不可靠）
    const baseKey = unit.portraitKey || unit.id;
    const mapKey = baseKey + '_' + skillKey;
    const imgFile = PORTRAIT_MAP[mapKey] || PORTRAIT_MAP[baseKey + '_default'];
    if(imgFile){
      return `<img src="${imgFile}" style="width:100%;border-radius:8px;">`;
    }
    return `<div class="portrait-placeholder">${unit.name}<br><span style="opacity:.6;">(${mapKey})</span><br>尚未設定圖片</div>`;
  }

  const currentAlly = actor.side === 'ally' ? actor : null;
  const currentEnemy = actor.side === 'enemy' ? actor : null;
  allyBox.innerHTML = portraitHtml(currentAlly, '我方立繪');
  enemyBox.innerHTML = portraitHtml(currentEnemy, '敵方立繪');
}

function renderOrderRow(){
  const row = document.getElementById('orderRow');
  row.innerHTML = '';
  battle.order.forEach((u,i)=>{
    const down = u.hp<=0;
    const div = document.createElement('div');
    div.className = 'tu ' + (u.side) + (i===battle.orderIdx?' current':'') + (down?' dead':'');
    div.textContent = u.name.slice(-1);
    div.title = u.name + (down?'（倒下）':'');
    row.appendChild(div);
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const cells = [];
  for(let y=0;y<4;y++){
    for(let x=0;x<12;x++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = x; cell.dataset.y = y;
      grid.appendChild(cell);
      cells.push(cell);
    }
  }
  const actor = currentActor();
  const sel = battle.selected;

  // highlight selectable（移動：黃底候選格）
  if(sel.mode === 'move'){
    computeValidCells().forEach(([x,y])=>{
      const c = cells[y*12+x];
      if(c) c.classList.add('selectable');
    });
  } else if(sel.mode === 'skill' && sel.skillDef){
    // 【施放預覽】規則見 dev4_design_todo.md 第十節收尾討論：
    // shape===1／self：不標格子，改在 unit-chip 上標紅（下方單位迴圈處理）
    // shape==='all'：全場標黃（純視覺表示「這是全場技能」），目標單位另外標紅
    // shape>1（AOE）：候選錨點格標黃；若已選定錨點（sel.anchor），該錨點展開的N×N範圍額外標紅（三點式流程的第二步預覽）
    // shape==='laser'：8個方向沿途格子分別標黃/紅（紅=這個方向線上有合法目標），點格子=選定方向直接發動，見 resolveLaserDirection()
    const { yellow, red } = computeSkillHighlights(actor, sel.skillDef, sel);
    yellow.forEach(([x,y])=>{
      const c = cells[y*12+x];
      if(c) c.classList.add('selectable');
    });
    red.forEach(([x,y])=>{
      const c = cells[y*12+x];
      if(c) c.classList.add('aoe');
    });
  }
  cells.forEach(c=>{
    c.onclick = ()=> onCellClick(parseInt(c.dataset.x), parseInt(c.dataset.y));
  });

  // 標示場上有可拾取物品的格子
  Object.keys(battle.floorItems || {}).forEach(key=>{
    const [lx, ly] = key.split(',').map(Number);
    const cell = cells[ly*12+lx];
    if(!cell) return;
    const star = document.createElement('div');
    star.className = 'loot-star';
    star.textContent = '★';
    star.title = '這裡有東西可以撿';
    cell.appendChild(star);
  });

  // 這次選取狀態下，哪些單位屬於「合法目標」要標紅底
  // - skill：shape===1的單體/自身、shape==='all'的全體、shape==='laser'的（8方向union）
  // - flee：僅自己（脫逃改成需要點自己的unit-chip confirm，避免誤觸）
  // - item：自己＋相鄰隊友（reach:1的targetSide:'ally'，自己距離自己是0一定會被singleTargetCandidates含進來，不用另外處理）
  let redTargetUnits = [];
  if(sel.mode === 'skill' && sel.skillDef){
    const d = sel.skillDef;
    if(d.shape === 1){
      redTargetUnits = singleTargetCandidates(actor, d);
    } else if(d.shape === 'all'){
      redTargetUnits = allUnits().filter(u=> matchesSide(u, actor, d.targetSide));
    } else if(d.shape === 'laser'){
      const s = new Set();
      LASER_DIRECTIONS.forEach(dir=>{
        laserTargets(actor, d, dir.dx, dir.dy).forEach(u=> s.add(u));
      });
      redTargetUnits = Array.from(s);
    }
  } else if(sel.mode === 'flee'){
    redTargetUnits = [actor];
  } else if(sel.mode === 'item'){
    redTargetUnits = singleTargetCandidates(actor, { targetSide:'ally', reach:1 });
  }

  // 【射程(黃)/生效(紅)統一】redTargetUnits是「真的會生效」的單位清單，
  // 不論來自哪個mode（技能/脫逃/道具），一律把他們站的那一格背景染紅（跟AOE/laser同一套視覺語言），
  // 不是只在unit-chip上加外框——外框（下面chip迴圈的target-red）保留當作疊加的加強提示，兩者並存。
  redTargetUnits.forEach(u=>{
    const c = cells[u.y*12+u.x];
    if(c) c.classList.add('aoe');
  });

  allUnits().forEach(u=>{
    if(u.x<0) return;
    const cell = cells[u.y*12+u.x];
    if(!cell) return;
    const chip = document.createElement('div');
    const isRedTarget = redTargetUnits.includes(u);
    chip.className = 'unit-chip ' + u.side + (u===currentActor()?' current':'') + (u.hp<=0?' down':'') + (isRedTarget?' target-red':'');
    chip.textContent = u.name.slice(-2);
    chip.title = u.name;
    const hpPct = clamp(u.hp/u.maxHp*100,0,100);
    chip.innerHTML = `<span>${u.name.slice(-2)}</span><div class="unit-hp"><div style="width:${hpPct}%;"></div></div>`;
    if(u._bubble){
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = u._bubble;
      chip.appendChild(b);
    }
    chip.onclick = (e)=>{ e.stopPropagation(); onUnitClick(u); };
    cell.appendChild(chip);
  });
}

function computeValidCells(){
  const actor = currentActor();
  const out = [];
  for(let y=0;y<4;y++) for(let x=0;x<12;x++){
    const dist = Math.abs(x-actor.x)+Math.abs(y-actor.y);
    if(dist>=1 && dist<=actor.movePts && !unitAt(x,y)) out.push([x,y]);
  }
  return out;
}

/* 【射程(黃)/生效(紅)統一】算出目前skill選取狀態下，棋盤格要標黃/標紅的清單。
   黃＝reach（打得到哪裡，純視覺，不代表點下去有反應）；紅＝實際生效的格子（redTargetUnits換算成座標後疊加，見renderGrid）。
   這裡的shape分支對應的就是SKILL_DB上方【施放確認階段】註解裡的階段B/C，可以對照著看。
   shape>1（AOE）：候選錨點黃、已選錨點的N×N範圍紅（階段C，第一次確認＝選錨點）
   shape==='all'：全場黃（reach概念上就是整個棋盤）（階段B）
   shape==='laser'：8個方向的沿途格子，該方向有合法目標就整條標紅，沒有就標黃（可以空放）（階段B）
   shape===1／self：reach範圍格子標黃，跟AOE共用同一顆anchorCellCandidates()；
     實際目標那一格的紅底不在這裡算，統一在renderGrid()的redTargetUnits→格子紅底那一步處理，避免重複邏輯（階段B）。 */
function computeSkillHighlights(actor, d, sel){
  const yellow = [];
  const red = [];
  if(!d) return { yellow, red };
  if(d.shape === 'all'){
    for(let y=0;y<4;y++) for(let x=0;x<12;x++) yellow.push([x,y]);
  } else if(d.shape === 'laser'){
    LASER_DIRECTIONS.forEach(dir=>{
      const area = laserArea(actor, dir.dx, dir.dy, d.reach);
      const hasTarget = laserTargets(actor, d, dir.dx, dir.dy).length > 0;
      area.forEach(([x,y])=> (hasTarget ? red : yellow).push([x,y]));
    });
  } else if(typeof d.shape === 'number' && d.shape > 1){
    anchorCellCandidates(actor, d).forEach(([x,y])=> yellow.push([x,y]));
    if(sel.anchor){
      squareArea(sel.anchor[0], sel.anchor[1], d.shape).forEach(([x,y])=> red.push([x,y]));
    }
  } else if(d.shape === 1){
    anchorCellCandidates(actor, d).forEach(([x,y])=> yellow.push([x,y]));
  }
  return { yellow, red };
}

/* ============================================================
   【斜紋雙色demo】純展示用，回應「用兩色斜紋取代兩個獨立顏色圖層」這個方案長怎樣。
   目前沒有任何指令（技能/脫逃/道具/移動...）實際套用這個效果，只是提供函式讓你自己測試預覽。
   用法（瀏覽器console或之後接到UI都可以）：
     applyStripePreviewDemo(document.querySelector('.cell'), '#5ec8d8', '#9b6bd1');
     // 例如脫逃如果之後真的要做「射程=水藍／範圍=紫」的雙色警示，可以這樣測試效果
   想拿掉整套demo：刪掉這兩個function，跟CSS裡的 .cell.stripe-preview 規則。
============================================================ */
function stripeCellBackground(colorA, colorB, stripeWidthPx = 8){
  return `repeating-linear-gradient(45deg, ${colorA} 0 ${stripeWidthPx}px, ${colorB} ${stripeWidthPx}px ${stripeWidthPx*2}px)`;
}
function applyStripePreviewDemo(cellEl, colorA, colorB, stripeWidthPx){
  if(!cellEl) return;
  cellEl.classList.add('stripe-preview');
  cellEl.style.background = stripeCellBackground(colorA, colorB, stripeWidthPx);
}

function unitAt(x,y){
  return allUnits().find(u=> u.x===x && u.y===y && u.hp>0 !== false ? (u.x===x&&u.y===y) : false) || allUnits().find(u=>u.x===x&&u.y===y);
}

/* ============================================================
   戰場拾取系統
   【怎麼調整測試用物品】
   seedFloorItems() 裡的 TEST_LOOT_POOL 是「可能出現的物品清單」，
   count 是這場戰鬥要灑幾個，改這兩個數字/清單內容就能調整測試量。
   之後想做「打敗敵人掉落」「戰鬥開始前預先擺放特定寶箱」，
   都可以直接對 battle.floorItems 這個物件寫入 "x,y":"物品key" 即可。
============================================================ */
const TEST_LOOT_POOL = ['potion','bandage','healing_herb','field_ration'];

function seedFloorItems(count){
  const n = count != null ? count : 4;
  let placed = 0;
  let attempts = 0;
  while(placed < n && attempts < 100){
    attempts++;
    const x = Math.floor(Math.random()*12);
    const y = Math.floor(Math.random()*4);
    const key = x+','+y;
    if(unitAt(x,y)) continue; // 站著人的格子不放東西
    if(battle.floorItems[key]) continue; // 已經有東西了
    battle.floorItems[key] = TEST_LOOT_POOL[Math.floor(Math.random()*TEST_LOOT_POOL.length)];
    placed++;
  }
}

function attemptLoot(actor, slotIndex){
  if(actor.interactUsed){ toast('本回合的互動名額已經用掉了'); return; }
  const key = actor.x+','+actor.y;
  const itemKey = battle.floorItems[key];
  if(!itemKey){
    toast('腳下沒有東西可以撿');
    return; // 沒有東西時不消耗互動名額，避免玩家無故浪費行動
  }
  const p = actor.ref;
  if(!p){ toast('這個單位無法拾取物品'); return; }
  // 跟商店共用同一個固定庫存池：從unowned實例裡找一個同key的來拿，不是憑空生成新的一份。
  // 商店賣光了，戰場也會跟著撿不到；反過來戰場先撿走，商店庫存也會變少。
  // （已知的小落差：地上視覺上還放著這個道具圖示，但庫存可能早被別處買走／撿光，
  //   玩家會看到「腳下有東西但拿不到」，之後若要處理可以在戰鬥開始佈置floorItems時
  //   就先檢查庫存，這次先不動battle floor佈置邏輯）
  const iidToTake = Object.keys(state.itemInstances).find(iid=> state.itemInstances[iid].key===itemKey && state.itemInstances[iid].status==='unowned');
  if(!iidToTake){
    toast('這件道具的庫存已經沒有了');
    return; // 沒庫存時同樣不消耗互動名額
  }
  state.itemInstances[iidToTake].status = 'equipped';
  p.items[slotIndex] = iidToTake;
  delete battle.floorItems[key];
  actor.interactUsed = true;
  logMsg(`<b>${actor.name}</b> 撿起了「${ITEM_DB[itemKey].name}」。`);
  renderGrid(); renderLog(false);
  afterAction(actor); // 拾取成功算用掉互動名額
}

/* ============================================================
   陣營／範圍共用判定（見 dev4_design_todo.md 第十二節，reach+shape 改版見 range_sim.html）
   matchesSide：純粹判斷某單位是否屬於施放者要找的陣營，相對於施放者自身陣營計算，
   敵方放技能、我方放技能都共用同一套邏輯，不寫死玩家視角。

   chebyshev：切比雪夫距離，reach 判定統一用這個（不是曼哈頓距離，跟移動的曼哈頓判定是兩回事）。
   squareArea：以錨點(cx,cy)為中心展開N×N範圍，N偶數時往右下多蓋一格，超出棋盤的格子自動濾掉。

   singleTargetCandidates：shape===1（單體技能）用，算出目前可以合法點選的目標「單位」清單，
   要求該格必須有合法目標（見上次設計討論定案），供 onUnitClick 驗證。
   anchorCellCandidates：shape>1（AOE技能）用，算出目前可以合法點選的「錨點格子」清單，
   純粹看reach，允許空放（該格有沒有目標交給執行時的matchesSide判定），供 computeValidCells 高亮與 onCellClick 驗證。
============================================================ */
function matchesSide(u, actor, targetSide){
  if(targetSide === 'enemy') return u.side !== actor.side;
  if(targetSide === 'ally')  return u.side === actor.side;
  if(targetSide === 'all')   return true;
  if(targetSide === 'self')  return u === actor;
  return false;
}

function chebyshev(ax, ay, bx, by){
  return Math.max(Math.abs(ax-bx), Math.abs(ay-by));
}

/* 【laser機制】8方向定義 + 沿方向直線命中判定，見 dev4_design_todo.md 第十節。
   dx/dy 用棋盤座標系（x往右、y往下），label 給方向面板UI顯示用。 */
const LASER_DIRECTIONS = [
  { key:'n',  label:'↑', dx:0,  dy:-1 },
  { key:'ne', label:'↗', dx:1,  dy:-1 },
  { key:'e',  label:'→', dx:1,  dy:0  },
  { key:'se', label:'↘', dx:1,  dy:1  },
  { key:'s',  label:'↓', dx:0,  dy:1  },
  { key:'sw', label:'↙', dx:-1, dy:1  },
  { key:'w',  label:'←', dx:-1, dy:0  },
  { key:'nw', label:'↖', dx:-1, dy:-1 },
];

/* 從施放者所在格為起點（不含自己站的格子），往指定方向延伸最多reach格，超出棋盤邊界就停。 */
function laserArea(actor, dx, dy, reach){
  const out = [];
  let x = actor.x, y = actor.y;
  for(let i=0;i<reach;i++){
    x += dx; y += dy;
    if(x<0 || x>=12 || y<0 || y>=4) break;
    out.push([x,y]);
  }
  return out;
}

/* 給定方向，算出這條laser線上實際會命中的單位（已套用targetSide判定）。 */
function laserTargets(actor, d, dx, dy){
  const area = laserArea(actor, dx, dy, d.reach);
  return allUnits().filter(u => matchesSide(u, actor, d.targetSide) && area.some(([ax,ay])=>ax===u.x && ay===u.y));
}

function squareArea(cx, cy, N){
  const start = -Math.floor((N-1)/2);
  const end = Math.ceil((N-1)/2);
  const out = [];
  for(let dy=start; dy<=end; dy++){
    for(let dx=start; dx<=end; dx++){
      const x = cx+dx, y = cy+dy;
      if(x>=0 && x<12 && y>=0 && y<4) out.push([x,y]);
    }
  }
  return out;
}

function singleTargetCandidates(actor, d){
  return allUnits().filter(u => matchesSide(u, actor, d.targetSide) && chebyshev(actor.x, actor.y, u.x, u.y) <= d.reach);
}

function anchorCellCandidates(actor, d){
  const out = [];
  for(let y=0;y<4;y++){
    for(let x=0;x<12;x++){
      if(chebyshev(actor.x, actor.y, x, y) <= d.reach) out.push([x,y]);
    }
  }
  return out;
}

/* 【laser點格子版】給一個座標，找出它屬於哪個方向的射線（8方向彼此不重疊，最多命中一個）。
   找不到（該格不在任何方向的射程內）回傳null。 */
function resolveLaserDirection(actor, d, x, y){
  for(const dir of LASER_DIRECTIONS){
    const area = laserArea(actor, dir.dx, dir.dy, d.reach);
    if(area.some(([ax,ay])=> ax===x && ay===y)) return dir;
  }
  return null;
}

function onCellClick(x,y){
  const actor = currentActor();
  const sel = battle.selected;
  if(sel.mode === 'move'){
    const valid = computeValidCells().some(([vx,vy])=>vx===x&&vy===y);
    if(!valid) return;
    const dist = Math.abs(x-actor.x)+Math.abs(y-actor.y);
    actor.x = x; actor.y = y;
    actor.movePts = Math.max(0, actor.movePts - dist);
    logMsg(`<b>${actor.name}</b> 移動了位置。`);
    afterAction(actor);
  } else if(sel.mode === 'skill' && sel.skillDef && typeof sel.skillDef.shape === 'number' && sel.skillDef.shape > 1){
    if(actor.skillUsed){ toast('本回合的技能名額已經用掉了'); return; }
    const d = sel.skillDef;
    // 【AOE三點式流程 第三步】已經選過錨點了，這次點擊落在該錨點展開的紅底範圍內 → 直接發動
    // （範圍內不論有沒有目標都算confirm，空放也允許，見dev4_design_todo.md第十節收尾討論）
    if(sel.anchor){
      const area = squareArea(sel.anchor[0], sel.anchor[1], d.shape);
      if(area.some(([ax,ay])=> ax===x && ay===y)){
        const targets = allUnits().filter(u=> matchesSide(u, actor, d.targetSide) && area.some(([ax,ay])=>ax===u.x && ay===u.y));
        showFullscreenFX(d, ()=> executeSkill(actor, sel.skillKey, d, targets));
        return;
      }
    }
    // 【AOE三點式流程 第二步】選定/改選錨點，只驗證是否在reach內，不要求該格有目標
    if(chebyshev(actor.x, actor.y, x, y) > d.reach){
      toast('這格超出技能射程了');
      return;
    }
    battle.selected = { ...sel, anchor:[x,y] };
    renderSidePanel(); renderGrid();
  } else if(sel.mode === 'skill' && sel.skillDef && sel.skillDef.shape === 'laser'){
    // 【laser點格子版】點任一格 → 反推屬於哪個方向 → 直接朝那個方向發動，命中該方向laserTargets算出的全部目標
    if(actor.skillUsed){ toast('本回合的技能名額已經用掉了'); return; }
    const d = sel.skillDef;
    const dir = resolveLaserDirection(actor, d, x, y);
    if(!dir){
      toast('這格不在雷射的施放方向上（需在8方向直線上）');
      return;
    }
    const targets = laserTargets(actor, d, dir.dx, dir.dy);
    showFullscreenFX(d, ()=> executeSkill(actor, sel.skillKey, d, targets));
  } else if(sel.mode === 'inspect'){
    if(actor.interactUsed){ toast('本回合的互動名額已經用掉了'); return; }
    doInspect(actor, x, y);
  }
}

function onUnitClick(target){
  const actor = currentActor();
  const sel = battle.selected;
  if(sel.mode === 'skill' && sel.skillDef){
    if(actor.skillUsed){ toast('本回合的技能名額已經用掉了'); return; }
    const d = sel.skillDef;
    // AOE技能：點在有單位的格子上，跟點空格是同一套三點式流程，直接轉給onCellClick用該單位座標處理
    // （chip.onclick 有 stopPropagation，原本點到單位的格子永遠不會走到onCellClick，這裡補上讓AOE也能點單位所在格）
    if(typeof d.shape === 'number' && d.shape > 1){
      onCellClick(target.x, target.y);
      return;
    }
    // laser：點單位跟點該單位所在的格子是同一件事，直接轉給onCellClick統一處理方向反推邏輯
    if(d.shape === 'laser'){
      onCellClick(target.x, target.y);
      return;
    }
    if(d.shape === 1){
      // reach:0 的自身技能（例如recall）本來就會通過singleTargetCandidates（距離自己是0），
      // 不用另外寫特例，點自己所在格的unit-chip即可，跟其他單體技能走同一套流程
      if(!singleTargetCandidates(actor, d).includes(target)){
        toast(d.reach<=1 ? '目標不在技能範圍內(需相鄰)' : '目標超出技能射程或不符合施放對象');
        return;
      }
      showFullscreenFX(d, ()=> executeSkill(actor, sel.skillKey, d, [target]));
      return;
    }
    if(d.shape === 'all'){
      // 全體技能：點任一個紅底目標都視為確認，效果套用在全部符合targetSide的單位上，不是只對被點到的那個生效
      if(!matchesSide(target, actor, d.targetSide)){
        toast('這不是這個技能的施放對象');
        return;
      }
      const targets = allUnits().filter(u=> matchesSide(u, actor, d.targetSide));
      showFullscreenFX(d, ()=> executeSkill(actor, sel.skillKey, d, targets));
      return;
    }
    return;
  }
  // 【脫逃confirm】點自己的unit-chip才真正觸發脫逃，避免手滑誤觸整隊逃跑
  if(sel.mode === 'flee'){
    if(target !== actor){
      toast('請點自己的頭像確認脫逃');
      return;
    }
    battle.selected = {mode:null};
    doFlee();
    renderSidePanel(); renderGrid(); renderPortraits();
    return;
  }
  // 【道具目標confirm】點自己或相鄰隊友的unit-chip，把道具用在被點到的那個人身上（不再永遠只能對自己用）
  if(sel.mode === 'item'){
    if(actor.interactUsed){ toast('本回合的互動名額已經用掉了'); return; }
    const candidates = singleTargetCandidates(actor, { targetSide:'ally', reach:1 });
    if(!candidates.includes(target)){
      toast('道具只能用在自己或相鄰的隊友身上');
      return;
    }
    const p = actor.ref;
    const d = sel.itemDef;
    target.hp = clamp(target.hp + d.heal, 0, target.maxHp);
    const usedInst = itemInstOf(p.items[sel.itemIndex]);
    if(usedInst) usedInst.status = 'unowned'; // 用掉＝回到商店庫存（同一個iid），不是永久消失，商店裡可以再買到同一件
    p.items[sel.itemIndex] = null;
    actor.interactUsed = true;
    logMsg(`<b>${actor.name}</b> 對 <b>${target.name}</b> 使用了「${d.name}」，恢復 ${d.heal} 點HP。`);
    battle.selected = {mode:null};
    renderGrid(); renderLog(false); renderSidePanel();
    afterAction(actor);
    return;
  }
}

/* ============================================================
   全螢幕技能演出（機制骨架，圖片尚未提供時顯示技能名稱佔位）
   每個技能可在 SKILL_DB 裡選填 fxDuration（毫秒，停留時間）跟
   fxFade（'fade'=淡出 / 'instant'=瞬間消失），沒填就用下面的預設值。
   之後想放真的圖片：在 SKILL_DB 該技能加一個 fxImage:'檔名.png' 即可。

   【技能音效】兩個獨立時機，各自選填，沒填就沒聲音、不會報錯：
   - soundCast：全螢幕演出「開始」時播放（例如揮劍聲、詠唱聲、蓄力音）
   - soundHit ：效果「結算當下」播放（例如命中聲、爆炸聲、治療光效聲）
   命名建議：{技能key}_cast.mp3、{技能key}_hit.mp3（例如 heavy_cast.mp3）
   音效跟背景音樂是疊加播放，不會讓BGM暫停或變小聲。
============================================================ */
const FX_DEFAULT_DURATION = 1200;
const FX_DEFAULT_FADE = 'fade';

function playSound(file, volume){
  if(!file) return;
  try{
    const a = new Audio(file);
    a.volume = volume != null ? volume : 0.6;
    a.play().catch(()=>{});
  }catch(e){ /* 音效檔案讀取失敗時安靜忽略，不影響遊戲進行 */ }
}

function showFullscreenFX(d, onComplete){
  const duration = d.fxDuration != null ? d.fxDuration : FX_DEFAULT_DURATION;
  const fade = d.fxFade || FX_DEFAULT_FADE;
  playSound(d.soundCast);
  const overlay = document.createElement('div');
  overlay.className = 'fullscreen-fx';
  overlay.innerHTML = d.fxImage
    ? `<img src="${d.fxImage}">`
    : `<div class="fx-placeholder">${d.name}<span class="fx-sub">（尚未設定全螢幕圖片・停留${duration}ms・${fade==='fade'?'淡出':'瞬間消失'}）</span></div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('show'));
  setTimeout(()=>{
    if(fade === 'fade'){
      overlay.classList.add('fx-fadeout');
      setTimeout(()=>{ overlay.remove(); onComplete(); }, 300);
    } else {
      overlay.remove();
      onComplete();
    }
  }, duration);
}

function gainRage(unit, dmgTaken){
  if(!unit.ref) return;
  if(unit.resName === '怒氣' && dmgTaken>0){
    unit.res = clamp(unit.res + dmgTaken, 0, unit.resMax);
  }
}

/* ============================================================
   統一技能執行函式（取代原本並存的 castSingle／castAoe／castAllAllies／doAttack 四段重複邏輯）
   「普通攻擊」已拿掉，全部輸出手段（含原本的普通攻擊，現在併入各角色的保底基礎技能，
   例如 slash／chronicle／arcane_bolt／lute_bash）都統一走這裡，見
   dev4_design_todo.md 第六節。

   targets 由呼叫端先透過 singleTargetCandidates() / anchorCellCandidates() / matchesSide() 依 reach+shape+targetSide 算好，
   這裡只負責：扣資源檢查 → 演出/音效 → 對每個目標套用效果 → 冷卻/名額 → log/收尾。
   這樣不管是單體(shape:1)還是範圍(shape:N/'all')，效果套用與傷害公式只有一份，
   不會有「改了一處公式忘記改另一處」的風險。

   傷害公式：power + 施放者ATK - 目標DEF + 隨機浮動，讓ATK對技能輸出也有意義
   （見第六節「技能傷害吃ATK：已定案」），公式細節之後可依平衡測試調整。
   buff類型技能（guard／song_buff）效果尚未實作（見已知bug：_atkBuff是死資料），
   正式生效要等 STATUS_DB + effectiveStat() 一併處理，此處先保留訊息/音效但不套用數值。
============================================================ */
function executeSkill(actor, key, d, targets){
  const cost = (d.cost && d.cost.res) || 0;
  if(actor.resName !== '-' && actor.res < cost){ toast(actor.resName+'不足'); return; }
  if(actor.resName !== '-') actor.res = clamp(actor.res - cost, 0, actor.resMax);

  bubble(actor, d.lines[Math.floor(Math.random()*d.lines.length)]);
  playSound(d.soundHit);

  if(targets.length === 0){
    toast('範圍內沒有目標，技能落空');
  }

  targets.forEach(t=>{
    if(d.type === 'attack'){
      const dmg = Math.max(1, d.power + skillLevelBonus(actor,key) + actor.atk - t.def + Math.floor(Math.random()*4));
      t.hp = clamp(t.hp - dmg, 0, t.maxHp);
      gainRage(t, dmg);
      logMsg(`<b>${actor.name}</b> 的「${d.name}」對 <b>${t.name}</b> 造成 ${dmg} 點${d.dmgType}傷害。${t.hp<=0?'<b>'+t.name+'</b> 倒下了。':''}`);
    } else if(d.type === 'heal'){
      const heal = d.power + skillLevelBonus(actor,key);
      t.hp = clamp(t.hp + heal, 0, t.maxHp);
      logMsg(`<b>${actor.name}</b> 的「${d.name}」為 <b>${t.name}</b> 恢復了 ${heal} 點HP。`);
    } else {
      // buff等尚未實作數值效果的技能類型，此處先不對target做任何改動
    }
  });

  actor.cooldowns[key] = d.cd;
  actor.skillUsed = true;
  renderGrid(); renderLog(false);
  afterAction(actor);
}

function bubble(unit, text){
  unit._bubble = text;
  setTimeout(()=>{ unit._bubble = null; if(battle) renderGrid(); }, 1800);
}

/* ============================================================
   SIDE PANEL (action bar for current actor)
============================================================ */
function renderSidePanel(){
  const panel = document.getElementById('sidePanel');
  const actor = currentActor();
  if(!actor){ panel.innerHTML=''; return; }

  if(actor.hp<=0){
    panel.innerHTML = `<div style="font-size:13px;color:var(--text-dim);">${actor.name} 已倒下，無法行動。</div>
      <div style="margin-top:8px;"><button class="btn primary" id="btnSkipDown">結束回合</button></div>`;
    document.getElementById('btnSkipDown').onclick = endActorTurn;
    return;
  }

  if(actor.side === 'enemy'){
    panel.innerHTML = `<div style="font-size:13px;color:var(--text-dim);">敵方行動中...</div>`;
    return;
  }

  const p = actor.ref;
  const movePts = actor.movePts != null ? actor.movePts : TURN_MOVE_POOL;
  panel.innerHTML = `
    <div class="actor-info">
      <div class="name">${actor.name}</div>
      <div class="hp">HP ${actor.hp}/${actor.maxHp}${actor.resName!=='-'?` · ${actor.resName} ${actor.res}/${actor.resMax}`:''}</div>
    </div>
    <div style="font-size:11px;color:var(--gold-bright);margin:4px 0 8px;">移動 ${movePts}/${TURN_MOVE_POOL} · 技能 ${actor.skillUsed?0:1}/1 · 互動 ${actor.interactUsed?0:1}/1</div>
    <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:6px;">行動</div>
    <div class="skillgrid" id="skillGrid"></div>
    <div id="itemArea"></div>
    <div style="margin-top:10px;"><button class="btn" id="btnEndTurn" style="width:100%;">結束回合</button></div>
  `;

  const skillGrid = document.getElementById('skillGrid');

  // 固定前3格：移動 / 檢查 / 脫逃
  // 普通攻擊已拿掉，攻擊功能併入下方技能清單裡的保底基礎技能（點技能即可，一樣佔技能名額）；檢查佔用互動名額，脫逃不佔任何名額
  // 脫逃改成需要confirm：點下去只是「選取」（進入flee模式，棋盤上會把自己標紅），
  // 要再點自己的unit-chip才會真正觸發doFlee()，避免手滑誤觸整隊逃跑（見onUnitClick的flee分支）
  const fixedSlots = [
    { key:'__move',    label:'移動', disabled: movePts<=0, onClick: ()=>{ battle.selected = {mode:'move'}; renderSidePanel(); renderGrid(); renderPortraits(); } },
    { key:'__inspect', label:'檢查', disabled: actor.interactUsed, onClick: ()=>{ battle.selected = {mode:'inspect'}; renderSidePanel(); renderGrid(); renderPortraits(); } },
    { key:'__flee',    label:'脫逃', disabled:false, onClick: ()=>{ battle.selected = {mode:'flee'}; renderSidePanel(); renderGrid(); renderPortraits(); } },
  ];
  fixedSlots.forEach(slot=>{
    const btn = document.createElement('button');
    btn.textContent = slot.label;
    const isSelected = battle.selected.mode === slot.key.replace('__','');
    // 【選取提示修正】原本只在選取時設 className='primary'，未選取時完全沒有class（等於用瀏覽器預設白底按鈕樣式，
    // 而且.primary缺少基礎.btn class，CSS的.btn.primary規則其實從未真正生效過）。
    // 改成固定套用 'btn small' 當底色，選取時額外疊加 'primary'（金黃底），未選取維持面板深色底（不是白底）。
    btn.className = 'btn small' + (isSelected ? ' primary' : '');
    if(slot.disabled){ btn.disabled = true; } else { btn.onclick = slot.onClick; }
    skillGrid.appendChild(btn);
  });

  for(let i=0;i<8;i++){
    const key = actor.skills[i];
    const btn = document.createElement('button');
    if(!key){
      btn.textContent = '未學習';
      btn.className = 'btn small locked';
      btn.disabled = true;
    } else {
      const d = SKILL_DB[key];
      const cdLeft = actor.cooldowns[key] || 0;
      const isSelected = battle.selected.mode === 'skill' && battle.selected.skillKey === key;
      btn.textContent = d.name + (cdLeft>0 ? ` (冷卻${cdLeft})` : '');
      btn.className = 'btn small' + (isSelected ? ' primary' : '');
      if(cdLeft>0 || actor.skillUsed) btn.disabled = true;
      // 【施放預覽流程統一入口】不論shape是什麼，點技能一律只做「選取」，
      // 不在這裡直接發動——self（reach:0）跟all已經拿掉自動觸發特例，
      // 改成跟其他技能一樣走renderGrid()的紅底/黃底高亮，由玩家點目標/格子/方向confirm才真正執行
      btn.onclick = ()=>{
        if(actor.skillUsed){ toast('本回合的技能名額已經用掉了'); return; }
        battle.selected = { mode:'skill', skillKey:key, skillDef:d };
        renderPortraits();
        renderSidePanel(); renderGrid();
      };
    }
    skillGrid.appendChild(btn);
  }

  const itemToggleWrap = document.createElement('div');
  itemToggleWrap.style.marginTop = '8px';
  const itemBtn = document.createElement('button');
  itemBtn.className = 'btn small';
  itemBtn.textContent = '開啟道具欄';
  itemBtn.onclick = ()=> renderItemArea(actor);
  itemToggleWrap.appendChild(itemBtn);
  panel.querySelector('#itemArea').before(itemToggleWrap);
  document.getElementById('btnEndTurn').onclick = endActorTurn;
  // 道具目標選取中（sel.mode==='item'）時，itemArea 預設是空的（要手動點「開啟道具欄」才會渲染），
  // 這裡自動補渲染一次，避免選了道具後整份側邊欄重繪、道具清單瞬間消失、選取狀態看起來像丟失了
  if(battle.selected.mode === 'item'){
    renderItemArea(actor);
  }
}

function renderItemArea(actor){
  const area = document.getElementById('itemArea');
  const p = actor.ref;
  if(!p){ area.innerHTML=''; return; }
  area.innerHTML = `<div style="font-size:11.5px;color:var(--text-dim);margin:8px 0 6px;">選擇要使用的道具（可對自己或相鄰隊友使用），或點空格拾取腳下的物品</div>
    <div class="skillgrid" id="itemGrid"></div>`;
  const grid = document.getElementById('itemGrid');
  p.items.forEach((it,i)=>{
    const btn = document.createElement('button');
    if(!it){
      // 拾取沒有「對象」的歧義（只能撿自己腳下的東西），維持原本點一下立即執行，不用另外走confirm流程
      btn.textContent = '空（點擊拾取）';
      btn.className = 'btn small';
      if(actor.interactUsed) btn.disabled = true;
      btn.onclick = ()=> attemptLoot(actor, i);
    }
    else {
      const d = itemDefOf(it);
      const isSelected = battle.selected.mode === 'item' && battle.selected.itemIndex === i;
      btn.textContent = d.name;
      btn.className = 'btn small' + (isSelected ? ' primary' : '');
      if(actor.interactUsed) btn.disabled = true;
      // 【道具需要指定目標】點道具只做「選取」，改成跟單體技能一樣的兩點式流程：
      // 選取後棋盤上自己＋相鄰隊友的unit-chip會標紅，玩家點紅底目標才真正使用（見onUnitClick的item分支）。
      // 再點一次同一顆道具鈕＝取消選取（跟脫逃同樣的toggle邏輯）。
      btn.onclick = ()=>{
        if(actor.interactUsed){ toast('本回合的互動名額已經用掉了'); return; }
        if(isSelected){
          battle.selected = {mode:null};
        } else {
          battle.selected = { mode:'item', itemIndex:i, itemDef:d };
        }
        renderPortraits(); renderSidePanel(); renderGrid();
      };
    }
    grid.appendChild(btn);
  });
}

/* ============================================================
   TURN FLOW（三旗標回合結構）
   每個單位每輪有三種獨立名額：
   - movePts：移動池，預設3步，每次移動依實際格數扣點，可分次移動
   - skillUsed：技能名額，1次，攻擊併入技能名額（攻擊也算用掉這1次）
   - interactUsed：互動名額，1次，檢查/拾取/使用道具都算這裡
   三個名額全部用完才會自動結束回合；名額沒用完也可以按「結束回合」提前放棄剩餘名額。
   TURN_MOVE_POOL 是移動池步數，想調整的話改這個數字就好。
============================================================ */
const TURN_MOVE_POOL = 3;

function startActorTurn(actor){
  if(!actor) return;
  actor.movePts = TURN_MOVE_POOL;
  actor.skillUsed = false;
  actor.interactUsed = false;
}

/* 玩家做完一個動作後呼叫：三個名額都耗盡才真正結束回合，
   沒耗盡的話就留在原地讓玩家繼續選下一個動作 */
function afterAction(actor){
  battle.selected = { mode:null };
  saveGame();
  if(checkBattleEnd()) return;
  if(actor.movePts<=0 && actor.skillUsed && actor.interactUsed){
    endActorTurn();
  } else {
    renderOrderRow(); renderGrid(); renderSidePanel(); renderPortraits(); renderLog(false);
  }
}

function endActorTurn(){
  battle.selected = { mode:null };
  battle.orderIdx += 1;
  if(battle.orderIdx >= battle.order.length){
    // tick cooldowns for all units at end of round
    allUnits().forEach(u=>{
      if(u.cooldowns) Object.keys(u.cooldowns).forEach(k=>{ if(u.cooldowns[k]>0) u.cooldowns[k]-=1; });
      if(u.resName !== '-' && u.resName !== '怒氣') u.res = clamp(u.res+1, 0, u.resMax);
    });
    battle.round += 1;
    if(REROLL_ORDER_EACH_ROUND){
      rollOrder(); // 重新擲速度排序
    } else {
      battle.orderIdx = 0; // 沿用第1回合的順序，只把指標歸零重新跑一輪
    }
  }
  saveGame();
  if(checkBattleEnd()) return;
  startActorTurn(currentActor()); // 換人了，重置三旗標名額
  renderOrderRow(); renderGrid(); renderSidePanel(); renderPortraits(); renderLog(false);
  maybeRunEnemyTurn();
}

function maybeRunEnemyTurn(){
  const actor = currentActor();
  if(!actor || battle.finished) return;
  if(actor.hp<=0){ setTimeout(endActorTurn, 400); return; }
  if(actor.side !== 'enemy') return;
  setTimeout(()=> runEnemyAI(actor), 700);
}

/* ============================================================
   敵人AI：分級參數表（見 dev4_design_todo.md 第十一節「AI分級系統」）

   同一套評分骨架（scoreTarget，見下方），不同敵人套用不同參數即可呈現
   「笨AI／普通AI／精英AI」，不用為每種聰明程度另寫一套判斷邏輯。

   四個參數的意義：
   - wHp   ：目標傷勢比例的加權（傷越重分數越高，越容易被優先鎖定/補刀）
   - wDef  ：目標防禦力低於3時的加分（脆皮角色更容易被鎖定）
   - wKill ：這次攻擊估算打得死目標時的加分（大幅提升，優先斬殺）
   - pTop  ：算完分數後，真正選到「最高分目標」的機率（%），
             剩下 (100-pTop)% 的機率會從其餘候選目標中隨機挑一個，
             這是刻意保留的不可預測性，避免玩家靠「墊高血量」等手法完全操控AI鎖定對象

   ▶ 這次三個等級的數值先設成完全一樣（等同 normal），只接架構、不分級。
     之後想讓某些敵人變笨或變精英，只需要「調整下面這三組數字」，
     不用改 scoreTarget() 或 decideEnemyAction() 裡的任何程式碼。

   ▶ 怎麼幫特定敵人指定等級：
     去 ENEMY_TEMPLATES 裡該敵人的物件，加一個 aiProfile 欄位，值填
     'dumb' / 'normal' / 'elite' 其中一個字串，例如：
       goblin: ()=> ({ ..., aiProfile:'dumb', ... })
     不填這個欄位的敵人，會自動 fallback 用 normal（見 getAiProfile()），
     所以現有的 goblin/goblinShaman 不用馬上補這個欄位也不會出錯。

   ▶ 之後想再加一個新等級（例如比elite更狠的 'boss'），
     只需要在下面這個物件裡多加一組 key，不用動其他程式碼。
============================================================ */
const AI_PROFILES = {
  dumb:   { wHp:50, wDef:20, wKill:100, pTop:80 }, // 目前與normal相同，僅接架構，之後調這幾個數字即可分級
  normal: { wHp:50, wDef:20, wKill:100, pTop:80 },
  elite:  { wHp:50, wDef:20, wKill:100, pTop:80 },
};

function getAiProfile(actor){
  return AI_PROFILES[actor.aiProfile] || AI_PROFILES.normal; // 查無此key（如打錯字）時安全fallback，不會讓遊戲崩潰
}

/* 傷勢比例超過此門檻（HP比例 <= 門檻）才「考慮」治療；門檻式設計見上次討論定案，
   跨過門檻後仍用機率決定要不要真的觸發，保留一點不可預測性，不是100%必治。
   想調整觸發時機：改 HEAL_HP_RATIO_THRESHOLD（門檻）；
   想調整觸發積極度：改 HEAL_TRIGGER_CHANCE（機率）。這兩個各自獨立，互不影響。 */
const HEAL_HP_RATIO_THRESHOLD = 0.5;
const HEAL_TRIGGER_CHANCE = 0.4;

/* 評分越高代表AI越想打這個目標，公式細節見第十一節，數值仍為暫定，之後依實戰調整。
   estDmg 用來估算「這次攻擊打不打得死」，不含隨機浮動，只取期望值方便判斷。 */
function scoreTarget(target, actor, d, profile){
  const estDmg = Math.max(1, d.power + actor.atk - target.def);
  const missingRatio = (target.maxHp - target.hp) / target.maxHp;
  let score = profile.wHp * missingRatio;
  if(target.def < 3) score += profile.wDef;
  if(estDmg >= target.hp) score += profile.wKill;
  return score;
}

/* 從候選目標裡挑一個：pTop%機率選分數最高者，剩下機率從其餘目標中隨機挑一個。
   只有1個候選時不用評分，直接回傳，省得白算。 */
function pickWeightedTarget(candidates, actor, d, profile){
  if(candidates.length === 0) return null;
  if(candidates.length === 1) return candidates[0];
  const scored = candidates.map(t=> ({ t, s: scoreTarget(t, actor, d, profile) }));
  scored.sort((a,b)=> b.s - a.s);
  if(Math.random()*100 < profile.pTop) return scored[0].t;
  const rest = scored.slice(1);
  return rest[Math.floor(Math.random()*rest.length)].t;
}

/* 技能是否「這回合可用」：冷卻是否已轉好、資源是否夠付，兩者皆過才算可用。
   跟 executeSkill() 內的資源檢查是分開的兩層防呆——這裡先篩掉不可用的技能，
   避免AI選了一個付不出資源的技能導致 executeSkill() 中途toast返回、卡住整個回合。 */
function canAffordSkill(actor, key, d){
  const cdLeft = (actor.cooldowns && actor.cooldowns[key]) || 0;
  if(cdLeft > 0) return false;
  const cost = (d.cost && d.cost.res) || 0;
  if(actor.resName !== '-' && actor.res < cost) return false;
  return true;
}

/* ============================================================
   敵人AI決策層（取代原本寫死 goblin_hit 的版本，見第十一節）

   核心改動：
   - 技能改讀 actor.skills 陣列動態查 SKILL_DB，不再寫死 goblin_hit
   - 目標範圍判定直接沿用 singleTargetCandidates()（跟玩家點技能時同一套函式），
     shape/targetSide/reach 三者共用同一份邏輯，敵人放「治療友軍」「自療」都不用另外寫特例
   - 治療觸發改成「門檻+機率」，不再是不看傷勢的固定 Math.random()<0.4
   - 攻擊目標改用 scoreTarget() 加權評分挑選，不再是相鄰敵人裡隨機挑一個
     （舊版 adjacentEnemies() 函式已一併移除，現在改用下方共用的 singleTargetCandidates()）

   本輪刻意不處理（避免範圍蔓延，見設計文件第十一節「這次刻意不做」）：
   - AOE技能（shape>1）AI施放邏輯：下方 usableSkills 篩選時直接排除，之後AOE系統穩定再補
   - 真正路徑搜尋：移動邏輯沿用舊版單軸試探，卡住就放棄本回合剩餘移動
   - 攻擊後再移動（重新站位）：本輪只支援「移動→攻擊」，不支援「攻擊→移動」，簡化收尾判斷
============================================================ */
function decideEnemyAction(actor){
  const profile = getAiProfile(actor);

  // 只挑「這回合可用」且「shape===1（單體）」的技能，AOE本輪不處理
  const usableSkills = (actor.skills || [])
    .map(key => ({ key, d: SKILL_DB[key] }))
    .filter(s => s.d && s.d.shape === 1 && canAffordSkill(actor, s.key, s.d));

  // 1. 治療判斷：門檻式——傷勢比例跨過門檻才考慮，考慮到了還要過一次機率才真的觸發
  const healSkills = usableSkills.filter(s => s.d.type === 'heal');
  let bestHeal = null; // 挑「最需要治療（HP比例最低）」的那個組合
  healSkills.forEach(s => {
    const wounded = singleTargetCandidates(actor, s.d).filter(u => u.hp > 0 && u.hp < u.maxHp);
    wounded.forEach(t => {
      const hpRatio = t.hp / t.maxHp;
      if(hpRatio <= HEAL_HP_RATIO_THRESHOLD && (!bestHeal || hpRatio < bestHeal.hpRatio)){
        bestHeal = { skill: s, target: t, hpRatio };
      }
    });
  });
  if(bestHeal && Math.random() < HEAL_TRIGGER_CHANCE){
    return { type:'skill', key: bestHeal.skill.key, d: bestHeal.skill.d, targets: [bestHeal.target] };
  }

  // 2. 攻擊判斷：多個可用攻擊技能時，先選第一個「射程內有目標」的技能（本輪敵人多半只有1個攻擊技能，
  //    之後技能變多時可以在這裡加「依威力/特效挑技能」的邏輯，這次不擴大範圍）
  const atkSkills = usableSkills.filter(s => s.d.type === 'attack');
  for(const s of atkSkills){
    const candidates = singleTargetCandidates(actor, s.d).filter(u => u.hp > 0);
    if(candidates.length > 0){
      const target = pickWeightedTarget(candidates, actor, s.d, profile);
      return { type:'skill', key: s.key, d: s.d, targets: [target] };
    }
  }

  // 3. 沒有技能可用/沒有目標在射程內 → 朝最近的敵對單位移動一步（沿用舊版單軸試探，無路徑搜尋）
  if(actor.movePts > 0){
    const opposing = allUnits().filter(u => matchesSide(u, actor, 'enemy') && u.hp > 0);
    if(opposing.length > 0){
      const nearest = opposing.slice().sort((a,b)=>
        (Math.abs(a.x-actor.x)+Math.abs(a.y-actor.y)) - (Math.abs(b.x-actor.x)+Math.abs(b.y-actor.y))
      )[0];
      return { type:'move', target: nearest };
    }
  }

  return { type:'pass' };
}

function runEnemyAI(actor){
  if(!battle || battle.finished) return;

  const decision = decideEnemyAction(actor);

  if(decision.type === 'skill'){
    executeSkill(actor, decision.key, decision.d, decision.targets); // 沿用玩家同一套執行層，log/音效/冷卻/資源全部自動處理
    if(battle.finished) return;
    endActorTurn(); // 本輪不支援「攻擊後再移動」，用完技能直接收尾（見上方說明）
    return;
  }

  if(decision.type === 'move'){
    const nearest = decision.target;
    const dx = nearest.x - actor.x, dy = nearest.y - actor.y;
    let nx = actor.x + Math.sign(dx), ny = actor.y;
    if(unitAt(nx,ny)) { nx = actor.x; ny = actor.y + Math.sign(dy); }
    if(!unitAt(nx,ny) && nx>=0 && nx<12 && ny>=0 && ny<4){
      actor.x = nx; actor.y = ny;
      actor.movePts = Math.max(0, actor.movePts - 1);
      logMsg(`<b>${actor.name}</b> 向前逼近。`);
      renderGrid();
      setTimeout(()=> runEnemyAI(actor), 500); // 移動後再決策一次，讓「移動到相鄰後接著攻擊」可以在同一回合內發生
    } else {
      // 卡住走不過去（無路徑搜尋，見第十一節技術債待辦），本回合放棄剩餘移動
      logMsg(`<b>${actor.name}</b> 被擋住了，暫時無法前進。`);
      renderGrid();
      endActorTurn();
    }
    return;
  }

  endActorTurn(); // type==='pass'：沒有目標、沒有技能可用、也無法移動
}

/* ============================================================
   FLEE / END
============================================================ */
function doInspect(actor, x, y){
  logMsg(`<b>${actor.name}</b> 檢查了那個位置，似乎沒有什麼異常。`);
  actor.interactUsed = true; // 檢查併入互動名額，跟拾取共用同一個名額
  renderLog(false);
  afterAction(actor);
}

function doFlee(){
  const stopChance = battle.def.fleeBlockChance || 0;
  if(Math.random() < stopChance){
    logMsg('逃脫失敗!敵人擋住了去路。');
    renderLog(false);
    return;
  }
  logMsg('全隊成功脫離了戰鬥。');
  battle.finished = true;
  saveGame();
  endBattleReturnToPrep('你們暫時撤退了。');
}

function checkBattleEnd(){
  if(!battle || battle.finished) return false;
  const alliesAlive = battle.allies.some(u=>u.hp>0);
  const enemiesAlive = battle.enemies.some(u=>u.hp>0);
  if(!enemiesAlive){
    battle.finished = true;
    const goldGain = 20 + Math.floor(Math.random()*15);
    state.gold += goldGain;
    battle.allies.forEach(u=>{ if(u.ref) u.ref.hp = u.hp; });
    if(battle.def.unlockFlag) setFlag(battle.def.unlockFlag);
    if(battle.chapterId != null){
      state.maxChapterReached = Math.max(state.maxChapterReached||0, battle.chapterId);
    }
    saveGame();
    endBattleReturnToPrep(`戰鬥勝利！獲得 ${goldGain} 金幣。`);
    return true;
  }
  if(!alliesAlive){
    battle.finished = true;
    battle.allies.forEach(u=>{ if(u.ref) u.ref.hp = Math.ceil(u.ref.maxHp*0.3); });
    saveGame();
    endBattleReturnToPrep('全隊倒下……幸好只是暫時的，隊伍已撤回休整。');
    return true;
  }
  return false;
}

function endBattleReturnToPrep(msg){
  setNavLocked(false);
  const bgm = document.getElementById('bgm');
  bgm.pause();
  const el = document.getElementById('viewBattle');
  // 不再清空整個戰場畫面（原本會把grid/立繪等全部替換掉），
  // 改成疊加一條浮動結算列在畫面下方，讓玩家先看清楚戰場最終狀態，自己決定何時按返回
  const overlay = document.createElement('div');
  overlay.className = 'battle-result-overlay';
  overlay.innerHTML = `<div class="result-banner">${msg}</div>
    <button class="btn primary" id="btnBackPrep">返回準備畫面</button>`;
  el.appendChild(overlay);
  document.getElementById('btnBackPrep').onclick = ()=> switchView('prep');
}

function toggleLog(){
  const full = document.getElementById('msglog').classList.toggle('expanded');
  renderLog(full);
  document.getElementById('btnLogToggle').textContent = full ? '收回紀錄' : '展開紀錄';
}
function renderLog(expanded){
  const box = document.getElementById('msglog');
  const list = expanded ? battle.log : battle.log.slice(-6);
  box.style.maxHeight = expanded ? '360px' : '150px';
  box.innerHTML = list.map(m=>`<div class="row">${m}</div>`).join('');
  box.scrollTop = box.scrollHeight;
  document.getElementById('logCount').textContent = `紀錄 ${battle.log.length}/100`;
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  const loaded = await loadGame();
  if(!loaded){ state = freshState(); saveGame(); }
  // 個體實例模型（iid+status）上線：舊存檔的 equipment/skills/items 存的是key字串，
  // 跟新格式不相容，且專案已定案不寫遷移腳本（見設計文件），偵測到舊格式就直接重開新局
  if(!state.equipInstances || !state.skillInstances || !state.itemInstances){
    toast('資料格式已更新，重新開始新的存檔');
    state = freshState(); saveGame();
  }
  // 相容舊存檔：補上這批更新新增的欄位，避免舊存檔缺欄位而報錯
  if(!state.flags) state.flags = {};
  if(state.maxChapterReached == null) state.maxChapterReached = 0;
  if(state.crystal == null) state.crystal = 3200; // 相容舊存檔：技能水晶貨幣，補上初始值
  if(state.sphere == null) state.sphere = 5000;
  if(state.expPool == null) state.expPool = 5000;
  const freshRef = freshParty(); // 拿新角色的預設unlockChapter/active，補進舊存檔的角色資料
  state.party.forEach(p=>{
    const ref = freshRef.find(f=>f.id===p.id);
    if(p.unlockChapter == null) p.unlockChapter = ref ? ref.unlockChapter : 0;
    if(p.active == null) p.active = ref ? ref.active : true;
    if(p.level == null) p.level = 1;
    if(!p.training) p.training = { hp:0, sp:0, atk:0, def:0 };
  });
  renderNav();
  switchView('chapters');
  initChangelogModal();
}
init();

/* ============================================================
   版本紀錄彈窗（隱藏版本號觸發）
============================================================ */
function initChangelogModal(){
  const latest = CHANGELOG[0];
  document.getElementById('versionTag').textContent = latest ? latest.version : '';
  const modal = document.getElementById('changelogModal');
  const body = document.getElementById('changelogModalBody');
  body.innerHTML = '';
  CHANGELOG.forEach(entry=>{
    const block = document.createElement('div');
    block.style.marginBottom = '14px';
    block.innerHTML = `<div style="font-size:12.5px;color:var(--gold-bright);font-weight:600;margin-bottom:4px;">${entry.version} <span style="color:var(--text-dim);font-weight:400;">· ${entry.date}</span></div>
      <ul style="margin:0;padding-left:18px;font-size:12px;color:var(--text-dim);line-height:1.8;">
        ${entry.notes.map(n=>`<li>${n}</li>`).join('')}
      </ul>`;
    body.appendChild(block);
  });
  const openModal = ()=> modal.classList.add('show');
  const closeModal = ()=> modal.classList.remove('show');
  document.getElementById('versionTag').onclick = openModal;
  document.getElementById('changelogModalClose').onclick = closeModal;
  modal.onclick = (e)=>{ if(e.target === modal) closeModal(); };
}

})();
