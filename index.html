}

function battleTerrainAt(x,y){if(!battle?.mapData)return null;const run=adventureRun(battle.mapData.id);return adventureTile(battle.mapData,x,y,run);}
function isBattleCellBlocked(x,y){if(!battle?.mapData)return false;return ['wall','forest','cover','door'].includes(battleTerrainAt(x,y));}
function battleHasCoverAt(x,y){if(!battle?.mapData)return false;const map=battle.mapData;for(const k of [...map.walls,...map.cover]){const [cx,cy]=k.split(',').map(Number);if(Math.abs(cx-x)+Math.abs(cy-y)===1)return true;}return false;}
function battleHasLineOfSight(x0,y0,x1,y1){if(!battle?.mapData)return true;let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy,x=x0,y=y0;while(!(x===x1&&y===y1)){const e2=2*err;if(e2>=dy){err+=dy;x+=sx;}if(e2<=dx){err+=dx;y+=sy;}if(x===x1&&y===y1)break;if(isBattleCellBlocked(x,y))return false;}return true;}
function battlePath(startX,startY,goalX,goalY,allowOccupiedGoal=false){const start=coordKey(startX,startY),goal=coordKey(goalX,goalY),q=[[startX,startY]],prev=new Map([[start,null]]);while(q.length){const [x,y]=q.shift();if(x===goalX&&y===goalY)break;for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=coordKey(nx,ny);if(nx<0||nx>=BOARD_COLS||ny<0||ny>=BOARD_ROWS||prev.has(k)||isBattleCellBlocked(nx,ny))continue;const occupant=unitAt(nx,ny);if(occupant&&!(allowOccupiedGoal&&k===goal))continue;prev.set(k,[x,y]);q.push([nx,ny]);}}if(!prev.has(goal))return null;const path=[];let k=goal;while(prev.get(k)){const [px,py]=prev.get(k);path.push({x:Number(k.split(',')[0]),y:Number(k.split(',')[1])});k=coordKey(px,py);}return path.reverse();}
function battlePathDistance(startX,startY,goalX,goalY){const path=battlePath(startX,startY,goalX,goalY);return path?path.length:Infinity;}
function battleNextStepToward(actor,target){let best=null,bestPath=null;for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){const gx=target.x+dx,gy=target.y+dy;if(gx<0||gx>=BOARD_COLS||gy<0||gy>=BOARD_ROWS||isBattleCellBlocked(gx,gy)||unitAt(gx,gy))continue;const path=battlePath(actor.x,actor.y,gx,gy);if(path&&(!bestPath||path.length<bestPath.length)){bestPath=path;best=path[0];}}return best;}

function renderGrid(){
  renderUnitInspector(); // v0.33：面板開著時才會真的重繪(函式內部已有guard)，讓數值跟著戰鬥進度即時更新
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const cells = [];
  for(let y=0;y<BOARD_ROWS;y++){
    for(let x=0;x<BOARD_COLS;x++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = x; cell.dataset.y = y;
      const terrain=battleTerrainAt(x,y);
      if(terrain){cell.classList.add('battle-map-'+terrain);cell.title=({wall:'石牆：阻擋移動與視線',forest:'樹木：阻擋移動與視線',cover:'石塊掩體：阻擋移動並提供鄰格掩護',road:'道路',grass:'草地',floor:'室內地板',door:'關閉的門：阻擋移動與視線'})[terrain]||terrain;cell.textContent=({wall:'▥',cover:'▧',forest:'♣',door:'▣'})[terrain]||'';}
      if(battle.mapData && battleHasCoverAt(x,y))cell.classList.add('battle-map-cover-adjacent');
      grid.appendChild(cell);
      cells.push(cell);
    }
  }
  const actor = currentActor();
  const sel = battle.selected;

  // highlight selectable（移動：黃底候選格）
  if(sel.mode === 'move'){
    computeValidCells().forEach(([x,y])=>{
      const c = cells[y*BOARD_COLS+x];
      if(c) c.classList.add('selectable');
    });
  } else if(sel.mode === 'skill' && sel.skillDef){
    // 【施放預覽】規則見 dev4_design_todo.md 第十節收尾討論：
    // shape===1／self：不標格子，改在 unit-chip 上標紅（下方單位迴圈處理）
    // shape==='all'：全場標黃（純視覺表示「這是全場技能」），目標單位另外標紅
    // shape>1（AOE）：候選錨點格標黃；若已選定錨點（sel.anchor），該錨點展開的N×N範圍額外標紅（三點式流程的第二步預覽）
    // shape==='laser'：8個方向沿途格子分別標黃/紅（紅=這個方向線上有合法目標），點格子=選定方向直接發動，見 resolveLaserDirection()
    const { yellow, red } = computeSkillHighlights(actor, sel.skillDef, sel);
    yellow.forEach(([x,y])=>{
      const c = cells[y*BOARD_COLS+x];
      if(c) c.classList.add('selectable');
    });
    red.forEach(([x,y])=>{
      const c = cells[y*BOARD_COLS+x];
      if(c) c.classList.add('aoe');
    });
  }
  cells.forEach(c=>{
    // v0.35：行動面板開著時網格鎖定，避免面板下方的格子被誤點
    c.onclick = battle.actionPanelOpen ? null : ()=> onCellClick(parseInt(c.dataset.x), parseInt(c.dataset.y));
  });

  // 標示場上有可拾取物品的格子
  Object.keys(battle.floorItems || {}).forEach(key=>{
    const [lx, ly] = key.split(',').map(Number);
    const cell = cells[ly*BOARD_COLS+lx];
    if(!cell) return;
    const star = document.createElement('div');
    star.className = 'loot-star';
    star.textContent = '★';
    star.title = '這裡有東西可以撿';
    cell.appendChild(star);
  });

  // 這次選取狀態下，哪些單位屬於「合法目標」要標紅底
  // - skill：shape===1的單體/自身、shape==='all'的全體、shape==='laser'的（8方向union）
  // - flee：僅自己（脫逃改成需要點自己的unit-chip confirm，避免誤觸）
  // - item：自己＋相鄰隊友（reach:1的targetSide:'ally'，自己距離自己是0一定會被singleTargetCandidates含進來，不用另外處理）
  let redTargetUnits = [];
  if(sel.mode === 'skill' && sel.skillDef){
    const d = sel.skillDef;
    if(d.shape === 1){
      redTargetUnits = singleTargetCandidates(actor, d);
    } else if(d.shape === 'all'){
      redTargetUnits = allUnits().filter(u=> matchesSide(u, actor, d.targetSide));
    } else if(d.shape === 'laser'){
      const s = new Set();
      LASER_DIRECTIONS.forEach(dir=>{
        laserTargets(actor, d, dir.dx, dir.dy).forEach(u=> s.add(u));
      });
      redTargetUnits = Array.from(s);
    }
  } else if(sel.mode === 'flee'){
    redTargetUnits = [actor];
  } else if(sel.mode === 'item'){
    redTargetUnits = singleTargetCandidates(actor, { targetSide:'ally', reach:1 });
  }

  // 【射程(黃)/生效(紅)統一】redTargetUnits是「真的會生效」的單位清單，
  // 不論來自哪個mode（技能/脫逃/道具），一律把他們站的那一格背景染紅（跟AOE/laser同一套視覺語言），
  // 不是只在unit-chip上加外框——外框（下面chip迴圈的target-red）保留當作疊加的加強提示，兩者並存。
  redTargetUnits.forEach(u=>{
    const c = cells[u.y*BOARD_COLS+u.x];
    if(c) c.classList.add('aoe');
  });

  allUnits().forEach(u=>{
    if(u.x<0) return;
    const cell = cells[u.y*BOARD_COLS+u.x];
    if(!cell) return;
    const chip = document.createElement('div');
    const isRedTarget = redTargetUnits.includes(u);
    // v0.35：CHIP_MAP有對應圖就用去背小圖疊在陣營色塊上，查無圖片則照舊顯示姓名縮寫文字（敵人目前都走這條路）
    const chipImg = CHIP_MAP[u.portraitKey || u.id];
    // v0.37新增：有圖的角色，腳下陣營色塊改用半透明版本(.has-img，見CSS的--ally-soft/--enemy-soft)，
    // 讓色塊變成「腳下一層淡淡的陣營色」而不是蓋住角色圖的實心方塊；沒圖的敵人維持原本全不透明色塊
    // （不然敵人會整個變透明、在戰場上會看不清楚）
    chip.className = 'unit-chip ' + u.side + (chipImg?' has-img':'') + (u===currentActor()?' current':'') + (u.hp<=0?' down':'') + (isRedTarget?' target-red':'');
    chip.title = u.name;
    const hpPct = clamp(u.hp/u.maxHp*100,0,100);
    // v0.28新增：狀態標記，有buff顯示▲(金)、有debuff顯示▼(紫紅)，兩者可能同時存在
    // v0.34新增：暈眩/束縛/恐懼/DOT額外顯示⊘(橘紅)，跟數值型buff/debuff分開判斷，三者可能同時並存
    const { hasBuff, hasDebuff, hasSpecial } = unitStatusFlags(u);
    const statusBadge = (hasBuff || hasDebuff || hasSpecial)
      ? `<div class="status-badge">${hasSpecial?'<span class="special-mark">⊘</span>':''}${hasBuff?'<span class="buff-mark">▲</span>':''}${hasDebuff?'<span class="debuff-mark">▼</span>':''}</div>`
      : '';
    const bodyHtml = chipImg ? `<img src="${chipImg}" alt="${u.name}">` : `<span>${u.name.slice(-2)}</span>`;
    // v0.37新增：受傷「黃色殘影」效果——u._hpBarPrev記錄上一次renderGrid()看到的血量，
    // 跟現在的u.hp比較，變少就代表這次受傷了：fill-back先停在「舊血量」的寬度、顏色是黃色，
    // fill-front疊在上面直接是「新血量」的實際寬度，兩層一疊，露出來的黃色範圍剛好就是「這次掉的血」，
    // 接下來用requestAnimationFrame把fill-back的寬度動畫式地縮到跟fill-front一樣寬(見下面)，
    // 黃色範圍就會逐漸消失，達成「先變黃、再縮減」的效果。順便在頭上冒出「-N」傷害數字淡出。
    const prevHpForBar = (u._hpBarPrev===undefined) ? u.hp : u._hpBarPrev;
    const prevPct = clamp(prevHpForBar/u.maxHp*100,0,100);
    const damaged = prevHpForBar > u.hp;
    const dmgAmount = damaged ? Math.round(prevHpForBar - u.hp) : 0;
    const dmgFloatHtml = damaged ? `<div class="dmg-float">-${dmgAmount}</div>` : '';
    const hpBarHtml = `<div class="unit-hp"><div class="fill fill-back" style="width:${damaged?prevPct:hpPct}%;"></div><div class="fill fill-front" style="width:${hpPct}%;"></div></div>`;
    chip.innerHTML = `${statusBadge}${dmgFloatHtml}${bodyHtml}${hpBarHtml}`;
    if(damaged){
      const backEl = chip.querySelector('.fill-back');
      // 雙重requestAnimationFrame：確保瀏覽器先畫出「舊寬度」那一幀，下一幀才改成「新寬度」觸發CSS transition，
      // 不然兩個動作黏在同一幀執行，畫面上會直接跳過去、看不到縮減過程
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ backEl.style.width = hpPct + '%'; }); });
    }
    u._hpBarPrev = u.hp;
    if(u._bubble){
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = u._bubble;
      chip.appendChild(b);
    }
    chip.onclick = battle.actionPanelOpen ? null : (e)=>{ e.stopPropagation(); onUnitClick(u); };
    cell.appendChild(chip);
  });
}

function computeValidCells(){
  const actor = currentActor();
  const out = [];
  for(let y=0;y<BOARD_ROWS;y++) for(let x=0;x<BOARD_COLS;x++){
    if(battle.mapData){
      const path=battlePath(actor.x,actor.y,x,y);
      if(path && path.length>=1 && path.length<=actor.movePts) out.push([x,y]);
      continue;
    }
    const dist = Math.abs(x-actor.x)+Math.abs(y-actor.y);
    if(dist>=1 && dist<=actor.movePts && !unitAt(x,y)) out.push([x,y]);
  }
  return out;
}

/* 【射程(黃)/生效(紅)統一】算出目前skill選取狀態下，棋盤格要標黃/標紅的清單。
   黃＝reach（打得到哪裡，純視覺，不代表點下去有反應）；紅＝實際生效的格子（redTargetUnits換算成座標後疊加，見renderGrid）。
   這裡的shape分支對應的就是SKILL_DB上方【施放確認階段】註解裡的階段B/C，可以對照著看。
   shape>1（AOE）：候選錨點黃、已選錨點的N×N範圍紅（階段C，第一次確認＝選錨點）
   shape==='all'：全場黃（reach概念上就是整個棋盤）（階段B）
   shape==='laser'：8個方向的沿途格子，該方向有合法目標就整條標紅，沒有就標黃（可以空放）（階段B）
   shape===1／self：reach範圍格子標黃，跟AOE共用同一顆anchorCellCandidates()；
     實際目標那一格的紅底不在這裡算，統一在renderGrid()的redTargetUnits→格子紅底那一步處理，避免重複邏輯（階段B）。 */
function computeSkillHighlights(actor, d, sel){
  const yellow = [];
  const red = [];
  if(!d) return { yellow, red };
  if(d.shape === 'all'){
    for(let y=0;y<BOARD_ROWS;y++) for(let x=0;x<BOARD_COLS;x++) yellow.push([x,y]);
  } else if(d.shape === 'laser'){
    LASER_DIRECTIONS.forEach(dir=>{
      const area = laserArea(actor, dir.dx, dir.dy, d.reach);
      const hasTarget = laserTargets(actor, d, dir.dx, dir.dy).length > 0;
      area.forEach(([x,y])=> (hasTarget ? red : yellow).push([x,y]));
    });
  } else if(typeof d.shape === 'number' && d.shape > 1){
    anchorCellCandidates(actor, d).forEach(([x,y])=> yellow.push([x,y]));
    if(sel.anchor){
      squareArea(sel.anchor[0], sel.anchor[1], d.shape).forEach(([x,y])=> red.push([x,y]));
    }
  } else if(d.shape === 1){
    anchorCellCandidates(actor, d).forEach(([x,y])=> yellow.push([x,y]));
  }
  return { yellow, red };
}

/* ============================================================
   【斜紋雙色demo】純展示用，回應「用兩色斜紋取代兩個獨立顏色圖層」這個方案長怎樣。
   目前沒有任何指令（技能/脫逃/道具/移動...）實際套用這個效果，只是提供函式讓你自己測試預覽。
   用法（瀏覽器console或之後接到UI都可以）：
     applyStripePreviewDemo(document.querySelector('.cell'), '#5ec8d8', '#9b6bd1');
     // 例如脫逃如果之後真的要做「射程=水藍／範圍=紫」的雙色警示，可以這樣測試效果
   想拿掉整套demo：刪掉這兩個function，跟CSS裡的 .cell.stripe-preview 規則。
============================================================ */
function stripeCellBackground(colorA, colorB, stripeWidthPx = 8){
  return `repeating-linear-gradient(45deg, ${colorA} 0 ${stripeWidthPx}px, ${colorB} ${stripeWidthPx}px ${stripeWidthPx*2}px)`;
}
function applyStripePreviewDemo(cellEl, colorA, colorB, stripeWidthPx){
  if(!cellEl) return;
  cellEl.classList.add('stripe-preview');
  cellEl.style.background = stripeCellBackground(colorA, colorB, stripeWidthPx);
}

function unitAt(x,y){
  return allUnits().find(u=> u.x===x && u.y===y && u.hp>0 !== false ? (u.x===x&&u.y===y) : false) || allUnits().find(u=>u.x===x&&u.y===y);
}

/* ============================================================
   戰場拾取系統
   【怎麼調整測試用物品】
   seedFloorItems() 裡的 TEST_LOOT_POOL 是「可能出現的物品清單」，
   count 是這場戰鬥要灑幾個，改這兩個數字/清單內容就能調整測試量。
   之後想做「打敗敵人掉落」「戰鬥開始前預先擺放特定寶箱」，
   都可以直接對 battle.floorItems 這個物件寫入 "x,y":"物品key" 即可。
============================================================ */
const TEST_LOOT_POOL = ['potion','bandage','healing_herb','field_ration'];

function seedFloorItems(count){
  const n = count != null ? count : 4;
  let placed = 0;
  let attempts = 0;
  while(placed < n && attempts < 100){
    attempts++;
    const x = Math.floor(Math.random()*12);
    const y = Math.floor(Math.random()*4);
    const key = x+','+y;
    if(isBattleCellBlocked(x,y)) continue; // 冒險地圖遭遇中，戰利品不生成在牆壁或掩體上
    if(unitAt(x,y)) continue; // 站著人的格子不放東西
    if(battle.floorItems[key]) continue; // 已經有東西了
    battle.floorItems[key] = TEST_LOOT_POOL[Math.floor(Math.random()*TEST_LOOT_POOL.length)];
    placed++;
  }
}

function attemptLoot(actor, slotIndex){
  if(actor.interactUsed){ toast('本回合的互動名額已經用掉了'); return; }
  const key = actor.x+','+actor.y;
  const itemKey = battle.floorItems[key];
  if(!itemKey){
    toast('腳下沒有東西可以撿');
    return; // 沒有東西時不消耗互動名額，避免玩家無故浪費行動
  }
  const p = actor.ref;
  if(!p){ toast('這個單位無法拾取物品'); return; }
  // 跟商店共用同一個固定庫存池：從unowned實例裡找一個同key的來拿，不是憑空生成新的一份。
  // 商店賣光了，戰場也會跟著撿不到；反過來戰場先撿走，商店庫存也會變少。
  // （已知的小落差：地上視覺上還放著這個道具圖示，但庫存可能早被別處買走／撿光，
  //   玩家會看到「腳下有東西但拿不到」，之後若要處理可以在戰鬥開始佈置floorItems時
  //   就先檢查庫存，這次先不動battle floor佈置邏輯）
  const iidToTake = Object.keys(state.itemInstances).find(iid=> state.itemInstances[iid].key===itemKey && state.itemInstances[iid].status==='unowned');
  if(!iidToTake){
    toast('這件道具的庫存已經沒有了');
    return; // 沒庫存時同樣不消耗互動名額
  }
  state.itemInstances[iidToTake].status = 'equipped';
  p.items[slotIndex] = iidToTake;
  delete battle.floorItems[key];
  actor.interactUsed = true;
  logMsg(`<b>${actor.name}</b> 撿起了「${ITEM_DB[itemKey].name}」。`);
  renderGrid(); renderLog(false);
  afterAction(actor); // 拾取成功算用掉互動名額
}

/* ============================================================
   陣營／範圍共用判定（見 dev4_design_todo.md 第十二節，reach+shape 改版見 range_sim.html）
   matchesSide：純粹判斷某單位是否屬於施放者要找的陣營，相對於施放者自身陣營計算，
   敵方放技能、我方放技能都共用同一套邏輯，不寫死玩家視角。

   chebyshev：切比雪夫距離，reach 判定統一用這個（不是曼哈頓距離，跟移動的曼哈頓判定是兩回事）。
   squareArea：以錨點(cx,cy)為中心展開N×N範圍，N偶數時往右下多蓋一格，超出棋盤的格子自動濾掉。

   singleTargetCandidates：shape===1（單體技能）用，算出目前可以合法點選的目標「單位」清單，
   要求該格必須有合法目標（見上次設計討論定案），供 onUnitClick 驗證。
   anchorCellCandidates：shape>1（AOE技能）用，算出目前可以合法點選的「錨點格子」清單，
   純粹看reach，允許空放（該格有沒有目標交給執行時的matchesSide判定），供 computeValidCells 高亮與 onCellClick 驗證。
============================================================ */
function matchesSide(u, actor, targetSide){
  if(targetSide === 'enemy') return u.side !== actor.side;
  if(targetSide === 'ally')  return u.side === actor.side;
  if(targetSide === 'all')   return true;
  if(targetSide === 'self')  return u === actor;
  return false;
}

function chebyshev(ax, ay, bx, by){
  return Math.max(Math.abs(ax-bx), Math.abs(ay-by));
}

/* 【laser機制】8方向定義 + 沿方向直線命中判定，見 dev4_design_todo.md 第十節。
   dx/dy 用棋盤座標系（x往右、y往下），label 給方向面板UI顯示用。 */
const LASER_DIRECTIONS = [
  { key:'n',  label:'↑', dx:0,  dy:-1 },
  { key:'ne', label:'↗', dx:1,  dy:-1 },
  { key:'e',  label:'→', dx:1,  dy:0  },
  { key:'se', label:'↘', dx:1,  dy:1  },
  { key:'s',  label:'↓', dx:0,  dy:1  },
  { key:'sw', label:'↙', dx:-1, dy:1  },
  { key:'w',  label:'←', dx:-1, dy:0  },
  { key:'nw', label:'↖', dx:-1, dy:-1 },
];

/* 從施放者所在格為起點（不含自己站的格子），往指定方向延伸最多reach格，超出棋盤邊界就停。 */
function laserArea(actor, dx, dy, reach){
  const out = [];
  let x = actor.x, y = actor.y;
  for(let i=0;i<reach;i++){
    x += dx; y += dy;
    if(x<0 || x>=BOARD_COLS || y<0 || y>=BOARD_ROWS) break;
    if(isBattleCellBlocked(x,y)) break;
    out.push([x,y]);
  }
  return out;
}

/* 給定方向，算出這條laser線上實際會命中的單位（已套用targetSide判定）。 */
function laserTargets(actor, d, dx, dy){
  const area = laserArea(actor, dx, dy, d.reach);
  return allUnits().filter(u => matchesSide(u, actor, d.targetSide) && area.some(([ax,ay])=>ax===u.x && ay===u.y));
}

function squareArea(cx, cy, N){
  const start = -Math.floor((N-1)/2);
  const end = Math.ceil((N-1)/2);
  const out = [];
  for(let dy=start; dy<=end; dy++){
    for(let dx=start; dx<=end; dx++){
      const x = cx+dx, y = cy+dy;
      if(x>=0 && x<BOARD_COLS && y>=0 && y<BOARD_ROWS) out.push([x,y]);
    }
  }
  return out;
}

function singleTargetCandidates(actor, d){
  return allUnits().filter(u => matchesSide(u, actor, d.targetSide) && chebyshev(actor.x, actor.y, u.x, u.y) <= d.reach && battleHasLineOfSight(actor.x,actor.y,u.x,u.y));
}

function anchorCellCandidates(actor, d){
  const out = [];
  for(let y=0;y<BOARD_ROWS;y++){
    for(let x=0;x<BOARD_COLS;x++){
      if(chebyshev(actor.x, actor.y, x, y) <= d.reach) out.push([x,y]);
    }
  }
  return out;
}

/* 【laser點格子版】給一個座標，找出它屬於哪個方向的射線（8方向彼此不重疊，最多命中一個）。
   找不到（該格不在任何方向的射程內）回傳null。 */
function resolveLaserDirection(actor, d, x, y){
  for(const dir of LASER_DIRECTIONS){
    const area = laserArea(actor, dir.dx, dir.dy, d.reach);
    if(area.some(([ax,ay])=> ax===x && ay===y)) return dir;
  }
  return null;
}

function onCellClick(x,y){
  const actor = currentActor();
  const sel = battle.selected;
  if(sel.mode === 'move'){
    const valid = computeValidCells().some(([vx,vy])=>vx===x&&vy===y);
    if(!valid) return;
    const path=battle.mapData?battlePath(actor.x,actor.y,x,y):null;
    const dist = battle.mapData?(path?path.length:Infinity):Math.abs(x-actor.x)+Math.abs(y-actor.y);
    if(!Number.isFinite(dist)) return;
    playSound(UI_SFX.select); // 移動確認音效
    actor.x = x; actor.y = y;
    actor.movePts = Math.max(0, actor.movePts - dist);
    logMsg(`<b>${actor.name}</b> 移動了位置。`);
    afterAction(actor);
  } else if(sel.mode === 'skill' && sel.skillDef && typeof sel.skillDef.shape === 'number' && sel.skillDef.shape > 1){
    if(actor.skillUsed){ toast('本回合的技能名額已經用掉了'); return; }
    const d = sel.skillDef;
    // 【AOE三點式流程 第三步】已經選過錨點了，這次點擊落在該錨點展開的紅底範圍內 → 直接發動
    // （範圍內不論有沒有目標都算confirm，空放也允許，見dev4_design_todo.md第十節收尾討論）
    if(sel.anchor){
      const area = squareArea(sel.anchor[0], sel.anchor[1], d.shape);
      if(area.some(([ax,ay])=> ax===x && ay===y)){
        const targets = allUnits().filter(u=> matchesSide(u, actor, d.targetSide) && area.some(([ax,ay])=>ax===u.x && ay===u.y));
        showFullscreenFX(d, ()=> executeSkill(actor, sel.skillKey, d, targets));
        return;
      }
    }
    // 【AOE三點式流程 第二步】選定/改選錨點，只驗證是否在reach內，不要求該格有目標
    if(chebyshev(actor.x, actor.y, x, y) > d.reach){
      toast('這格超出技能射程了');
      return;
    }
    battle.selected = { ...sel, anchor:[x,y] };
    renderSidePanel(); renderGrid();
  } else if(sel.mode === 'skill' && sel.skillDef && sel.skillDef.shape === 'laser'){
    // 【laser點格子版】點任一格 → 反推屬於哪個方向 → 直接朝那個方向發動，命中該方向laserTargets算出的全部目標
    if(actor.skillUsed){ toast('本回合的技能名額已經用掉了'); return; }
    const d = sel.skillDef;
    const dir = resolveLaserDirection(actor, d, x, y);
    if(!dir){
      toast('這格不在雷射的施放方向上（需在8方向直線上）');
      return;
    }
    const targets = laserTargets(actor, d, dir.dx, dir.dy);
    showFullscreenFX(d, ()=> executeSkill(actor, sel.skillKey, d, targets));
  } else if(sel.mode === 'inspect'){
    if(actor.interactUsed){ toast('本回合的互動名額已經用掉了'); return; }
    doInspect(actor, x, y);
  }
}

function onUnitClick(target){
  const actor = currentActor();
  const sel = battle.selected;
  if(sel.mode === 'skill' && sel.skillDef){
    if(actor.skillUsed){ toast('本回合的技能名額已經用掉了'); return; }
    const d = sel.skillDef;
    // AOE技能：點在有單位的格子上，跟點空格是同一套三點式流程，直接轉給onCellClick用該單位座標處理
    // （chip.onclick 有 stopPropagation，原本點到單位的格子永遠不會走到onCellClick，這裡補上讓AOE也能點單位所在格）
    if(typeof d.shape === 'number' && d.shape > 1){
      onCellClick(target.x, target.y);
      return;
    }
    // laser：點單位跟點該單位所在的格子是同一件事，直接轉給onCellClick統一處理方向反推邏輯
    if(d.shape === 'laser'){
      onCellClick(target.x, target.y);
      return;
    }
    if(d.shape === 1){
      // reach:0 的自身技能（例如holy_heal）本來就會通過singleTargetCandidates（距離自己是0），
      // 不用另外寫特例，點自己所在格的unit-chip即可，跟其他單體技能走同一套流程
      if(!singleTargetCandidates(actor, d).includes(target)){
        toast(d.reach<=1 ? '目標不在技能範圍內(需相鄰)' : '目標超出技能射程或不符合施放對象');
        return;
      }
      showFullscreenFX(d, ()=> executeSkill(actor, sel.skillKey, d, [target]));
      return;
    }
    if(d.shape === 'all'){
      // 全體技能：點任一個紅底目標都視為確認，效果套用在全部符合targetSide的單位上，不是只對被點到的那個生效
      if(!matchesSide(target, actor, d.targetSide)){
        toast('這不是這個技能的施放對象');
        return;
      }
      const targets = allUnits().filter(u=> matchesSide(u, actor, d.targetSide));
      showFullscreenFX(d, ()=> executeSkill(actor, sel.skillKey, d, targets));
      return;
    }
    return;
  }
  // 【脫逃confirm】點自己的unit-chip才真正觸發脫逃，避免手滑誤觸整隊逃跑
  if(sel.mode === 'flee'){
    if(target !== actor){
      toast('請點自己的頭像確認脫逃');
      return;
    }
    battle.selected = {mode:null};
    doFlee();
    renderSidePanel(); renderGrid(); renderPortraits();
    return;
  }
  // 【道具目標confirm】點自己或相鄰隊友的unit-chip，把道具用在被點到的那個人身上（不再永遠只能對自己用）
  if(sel.mode === 'item'){
    if(actor.interactUsed){ toast('本回合的互動名額已經用掉了'); return; }
    const candidates = singleTargetCandidates(actor, { targetSide:'ally', reach:1 });
    if(!candidates.includes(target)){
      toast('道具只能用在自己或相鄰的隊友身上');
      return;
    }
    const p = actor.ref;
    const d = sel.itemDef;
    target.hp = clamp(target.hp + d.heal, 0, target.maxHp);
    const usedInst = itemInstOf(p.items[sel.itemIndex]);
    if(usedInst) usedInst.status = 'unowned'; // 用掉＝回到商店庫存（同一個iid），不是永久消失，商店裡可以再買到同一件
    p.items[sel.itemIndex] = null;
    actor.interactUsed = true;
    logMsg(`<b>${actor.name}</b> 對 <b>${target.name}</b> 使用了「${d.name}」，恢復 ${d.heal} 點HP。`);
    battle.selected = {mode:null};
    renderGrid(); renderLog(false); renderSidePanel();
    afterAction(actor);
    return;
  }
  // v0.39新增：沒有任何進行中的目標選取(mode不是skill/flee/item，例如閒置狀態、或move/inspect模式底下
  // 點到的是unit-chip而不是空格)，點單位一律當成「生物檢視」，開單一單位的狀態卡片。
  // 不會跟上面的目標選取邏輯衝突，因為那些分支都已經在各自的if裡return掉了，會落到這裡代表都不成立。
  openUnitInspectorFor(target);
}

/* ============================================================
   全螢幕技能演出（機制骨架，圖片尚未提供時顯示技能名稱佔位）
   每個技能可在 SKILL_DB 裡選填 fxDuration（毫秒，停留時間）跟
   fxFade（'fade'=淡出 / 'instant'=瞬間消失），沒填就用下面的預設值。
   之後想放真的圖片：在 SKILL_DB 該技能加一個 fxImage:'檔名.png' 即可。

   【技能音效】兩個獨立時機，各自選填，沒填就沒聲音、不會報錯：
   - soundCast：全螢幕演出「開始」時播放（例如揮劍聲、詠唱聲、蓄力音）
   - soundHit ：效果「結算當下」播放（例如命中聲、爆炸聲、治療光效聲）
   命名建議：{技能key}_cast.mp3、{技能key}_hit.mp3（例如 heavy_cast.mp3）
   音效跟背景音樂是疊加播放，不會讓BGM暫停或變小聲。
============================================================ */
const FX_DEFAULT_DURATION = 1200;
const FX_DEFAULT_FADE = 'fade';

// v0.41新增：戰場常駐UI的音效路徑集中在這裡，playSound()查無檔案時本來就會靜默略過(不影響遊戲進行)，
// 所以就算MOMO還沒放音檔進去，這次的功能一樣能正常運作，之後把檔案放進 assets/sfx/ 對應檔名即可直接生效。
// 目前先用「開/關面板」共用一組聲音、「選定行動/道具/確認移動」共用另一組，
// 之後想幫某個特定動作分開換一種音效，也是在這裡加一個新key、改對應呼叫處即可。
const UI_SFX = {
  panelOpen:  'assets/sfx/ui_panel_open.mp3',
  panelClose: 'assets/sfx/ui_panel_close.mp3',
  select:     'assets/sfx/ui_select.mp3',
};

function playSound(file, volume){
  if(!file) return;
  try{
    const a = new Audio(file);
    a.volume = volume != null ? volume : 0.6;
    a.play().catch(()=>{});
  }catch(e){ /* 音效檔案讀取失敗時安靜忽略，不影響遊戲進行 */ }
}

function showFullscreenFX(d, onComplete){
  const duration = d.fxDuration != null ? d.fxDuration : FX_DEFAULT_DURATION;
  const fade = d.fxFade || FX_DEFAULT_FADE;
  playSound(d.soundCast);
  const overlay = document.createElement('div');
  overlay.className = 'fullscreen-fx';
  overlay.innerHTML = d.fxImage
    ? `<img src="${d.fxImage}">`
    : `<div class="fx-placeholder">${d.name}<span class="fx-sub">（尚未設定全螢幕圖片・停留${duration}ms・${fade==='fade'?'淡出':'瞬間消失'}）</span></div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('show'));
  setTimeout(()=>{
    if(fade === 'fade'){
      overlay.classList.add('fx-fadeout');
      setTimeout(()=>{ overlay.remove(); onComplete(); }, 300);
    } else {
      overlay.remove();
      onComplete();
    }
  }, duration);
}

function gainRage(unit, dmgTaken){
  if(!unit.ref) return;
  if(unit.resName === '怒氣' && dmgTaken>0){
    unit.res = clamp(unit.res + dmgTaken, 0, unit.resMax);
  }
}

/* ============================================================
   統一技能執行函式（取代原本並存的 castSingle／castAoe／castAllAllies／doAttack 四段重複邏輯）
   「普通攻擊」已拿掉，全部輸出手段（含原本的普通攻擊，現在併入各角色的保底基礎技能，
   例如 slash／smite／arcane_bolt／lute_bash）都統一走這裡，見
   dev4_design_todo.md 第六節。

   targets 由呼叫端先透過 singleTargetCandidates() / anchorCellCandidates() / matchesSide() 依 reach+shape+targetSide 算好，
   這裡只負責：扣資源檢查 → 演出/音效 → 對每個目標套用效果 → 冷卻/名額 → log/收尾。
   這樣不管是單體(shape:1)還是範圍(shape:N/'all')，效果套用與傷害公式只有一份，
   不會有「改了一處公式忘記改另一處」的風險。

   傷害公式：power + 施放者ATK - 目標DEF + 隨機浮動，讓ATK對技能輸出也有意義
   （見第六節「技能傷害吃ATK：已定案」），公式細節之後可依平衡測試調整。
   buff類型技能（guard／song_buff）效果尚未實作（見已知bug：_atkBuff是死資料），
   正式生效要等 STATUS_DB + effectiveStat() 一併處理，此處先保留訊息/音效但不套用數值。
============================================================ */
/* v0.34新增：把原本寫死在executeSkill攻擊分支裡的傷害計算抽成獨立函式，
   讓「純攻擊技能」跟下面新增的「分段技能(stages)」共用同一份公式，不會有兩處各寫一次、改一邊忘改另一邊的風險。
   override省略時(舊路徑呼叫)行為跟v0.33完全一致；override是某個stage的資料時，
   stage自己的dmgType/power(或fixed)蓋掉技能本身的設定。
   override.fixed：固定傷害，不經過ATK/DEF/門檻公式直接扣血──目前只有「對施放者自身」的傷害段落會用到，
   理由是自傷不應該被自己的防禦力吃掉(不然防禦越高等於自傷免疫，邏輯上怪怪的)，這點MOMO開工前先按這個假設做，
   之後如果想讓自傷也吃公式，把fixed拿掉、照常給power即可，不用動這個函式。 */
function dealDamage(actor, key, d, t, override){
  const dmgType = (override && override.dmgType != null) ? override.dmgType : d.dmgType;
  const power   = (override && override.power   != null) ? override.power   : d.power;
  const fixed   = override && override.fixed;
  const catInfo = DAMAGE_TYPE_DB[dmgType] || DAMAGE_TYPE_DB[0];
  if(fixed != null){
    const dmg = fixed;
    t.hp = clamp(t.hp - dmg, 0, t.maxHp);
    gainRage(t, dmg);
    logMsg(`<b>${actor.name}</b> 的「${d.name}」對 <b>${t.name}</b> 造成 ${dmg} 點${catInfo.name}傷害。${t.hp<=0?'<b>'+t.name+'</b> 倒下了。':''}`);
    return;
  }
  // v0.26：依dmgType的大類別(physical/element/mystic)選對應的atk/def/res三連，
  // 三連查不到時(理論上attack類型一定查得到)保底用physical，不會噴錯
  const triple = RESIST_STAT_BY_CATEGORY[catInfo.category] || RESIST_STAT_BY_CATEGORY.physical;
  let dmg = Math.max(1, power + skillLevelBonus(actor,key) + effectiveStat(actor, triple.atk) - effectiveStat(t, triple.def) + Math.floor(Math.random()*4));
  const coverReduced=!!battle.mapData&&battleHasCoverAt(t.x,t.y);
  if(coverReduced) dmg=Math.max(1,Math.floor(dmg*0.75));
  const resVal = effectiveStat(t, triple.res);
  if(dmg <= resVal){
    // 方案A：傷害門檻，閾值以下完全無法穿透（不是減傷，是直接歸零）
    logMsg(`<b>${actor.name}</b> 的「${d.name}」對 <b>${t.name}</b> 發動攻擊，<span class="log-block">傷害無法穿透！</span>`);
  } else {
    t.hp = clamp(t.hp - dmg, 0, t.maxHp);
    gainRage(t, dmg);
    logMsg(`<b>${actor.name}</b> 的「${d.name}」對 <b>${t.name}</b> 造成 ${dmg} 點${catInfo.name}傷害。${coverReduced?'（掩體減傷）':''}${t.hp<=0?'<b>'+t.name+'</b> 倒下了。':''}`);
  }
}

/* v0.34新增：套用一段status效果(先骰rollStatusSuccess再決定要不要真的applyStatus)，
   純攻擊+debuff/buff分支跟下面的stages分支共用，戰報訊息統一走這裡，不會兩邊各寫一次。 */
function applyStatusStage(actor, t, effect, effectValue, statusDuration, successValue, skillNameForLog){
  const sdef = STATUS_DB[effect];
  if(rollStatusSuccess({ effect, successValue }, t)){
    applyStatus(t, effect, effectValue, statusDuration);
    if(sdef && (sdef.category === 'cc' || sdef.category === 'dot')){
      // 控制/DOT類沒有「數值上升/下降」的概念，戰報用「陷入OO狀態」而不是buff/debuff那套上升/下降措辭
      logMsg(`<b>${t.name}</b> 陷入了${sdef.name}狀態！(${statusDuration}回合)`);
    } else {
      // v0.28：戰報直接寫出「XX能力上升/下降」，不再是含糊的「狀態」
      const stats = sdef ? (Array.isArray(sdef.stat) ? sdef.stat : [sdef.stat]) : [];
      const labels = stats.map(s=> STAT_LABELS[s] || s).join('/');
      const verb = (effectValue||0) >= 0 ? '上升了' : '下降了';
      const sign = (effectValue||0) >= 0 ? '+' : '';
      logMsg(`<b>${actor.name}</b> 的「${skillNameForLog}」讓 <b>${t.name}</b> 的${labels || '狀態'}${verb} ${sign}${effectValue}(${statusDuration}回合)。`);
    }
  } else {
    logMsg(`<b>${t.name}</b> 抵抗了${sdef ? sdef.name : effect}效果。`);
  }
}

// v0.38新增：技能放完後，畫面(傷害/HP條/戰報)先立刻更新，但「接下來要做什麼」
// (行動面板重新彈出、換下一位、敵方AI接著行動…都在afterAction()裡)延遲這裡設定的時間再進行，
// 讓玩家有時間看清楚剛剛發生了什麼。想調快/慢，直接改這個數字(單位ms，1000=1秒)即可，
// 玩家施放跟敵方AI施放都共用executeSkill()這個入口，所以兩邊都會套用到同一個延遲。
const SKILL_RESULT_DELAY_MS = 1000;

function executeSkill(actor, key, d, targets){
  const cost = (d.cost && d.cost.res) || 0;
  if(actor.resName !== '-' && actor.res < cost){ toast(actor.resName+'不足'); return; }
  if(actor.resName !== '-') actor.res = clamp(actor.res - cost, 0, actor.resMax);

  bubble(actor, d.lines[Math.floor(Math.random()*d.lines.length)]);
  playSound(d.soundHit);

  // v0.34：分段技能(stages)裡可能有target:'self'的段落，不吃targets清單，所以「範圍內沒有目標」的提示
  // 只在整個技能完全沒有stages、或stages裡確實有需要敵方/我方targets的段落時才提醒，避免「只打自己」的技能誤報落空
  const needsExternalTargets = !d.stages || d.stages.some(s=> s.target !== 'self');
  if(targets.length === 0 && needsExternalTargets){
    toast('範圍內沒有目標，技能落空');
  }

  // v0.28修正：這兩行原本寫在targets.forEach「之後」，會把超冷卻在迴圈裡剛重置的skillUsed=false蓋回true，
  // 導致「重置本回合技能名額」形同虛設——改成先在這裡設好，讓迴圈內的utility分支能在之後正確覆寫
  actor.cooldowns[key] = d.cd;
  actor.skillUsed = true;

  if(d.stages){
    // v0.34新增：分段技能——每段各自指定target('self'打施放者自己/'enemy'走技能算好的targets清單)跟type('damage'/'status')，
    // 用來支援「打自己+打對方+附加狀態」這種同一顆技能裡混合多種效果/多種對象的情境(例：重擊/光明神威/痛苦燃燒)
    d.stages.forEach(stage=>{
      const stageTargets = stage.target === 'self' ? [actor] : targets;
      stageTargets.forEach(t=>{
        if(stage.type === 'damage'){
          dealDamage(actor, key, d, t, stage);
        } else if(stage.type === 'status'){
          applyStatusStage(actor, t, stage.effect, stage.effectValue||0, stage.statusDuration, stage.successValue, d.name);
        }
      });
    });
    renderGrid(); renderLog(false);
    setTimeout(()=> afterAction(actor), SKILL_RESULT_DELAY_MS);
    return;
  }

  targets.forEach(t=>{
    if(d.type === 'attack'){
      dealDamage(actor, key, d, t);
    } else if(d.type === 'heal'){
      const heal = d.power + skillLevelBonus(actor,key);
      t.hp = clamp(t.hp + heal, 0, t.maxHp);
      logMsg(`<b>${actor.name}</b> 的「${d.name}」為 <b>${t.name}</b> 恢復了 ${heal} 點HP。`);
    } else if(d.type === 'buff' || d.type === 'debuff'){
      // v0.26：STATUS_DB正式上線，effect/effectValue/statusDuration由技能資料自己帶
      // v0.34：加上成功判定(rollStatusSuccess)，沒設resistStat的狀態一律回true，跟v0.33以前行為完全一樣
      applyStatusStage(actor, t, d.effect, d.effectValue, d.statusDuration, d.successValue, d.name);
    } else if(d.type === 'utility' && d.effect === 'resetCooldowns'){
      // v0.28追加：MOMO確認「額外一個技能使用次數」= 重置自己本回合的skillUsed旗標(不是新開充能系統)，
      // 冷卻+名額一起重置，才真的能在同一回合內再接著放一個技能
      Object.keys(t.cooldowns || {}).forEach(k=> t.cooldowns[k] = 0);
      t.skillUsed = false;
      logMsg(`<b>${actor.name}</b> 的「${d.name}」讓 <b>${t.name}</b> 的所有技能冷卻重置了，還能再行動一次。`);
    } else if(d.type === 'utility' && d.effect === 'standby'){
      // v0.33新增：純測試用，不造成任何效果，只留戰報紀錄確認這個單位真的輪到了
      logMsg(`<b>${actor.name}</b> 按兵不動，靜待下一步。`);
    }
  });

  renderGrid(); renderLog(false);
  setTimeout(()=> afterAction(actor), SKILL_RESULT_DELAY_MS);
}

function bubble(unit, text){
  unit._bubble = text;
  setTimeout(()=>{ unit._bubble = null; if(battle) renderGrid(); }, 1800);
}

/* ============================================================
   SIDE PANEL (action bar for current actor)
============================================================ */
function renderSidePanel(){
  const panel = document.getElementById('sidePanel');
  const actor = currentActor();
  if(!actor){ panel.innerHTML=''; return; }

  if(actor.hp<=0){
    panel.innerHTML = `<div style="font-size:13px;color:var(--text-dim);">${actor.name} 已倒下，無法行動。</div>
      <div style="margin-top:8px;"><button class="btn primary" id="btnSkipDown">結束回合</button></div>`;
    document.getElementById('btnSkipDown').onclick = endActorTurn;
    return;
  }

  if(actor.side === 'enemy'){
    panel.innerHTML = `<div style="font-size:13px;color:var(--text-dim);">敵方行動中...</div>`;
    return;
  }

  const p = actor.ref;
  const movePts = actor.movePts != null ? actor.movePts : TURN_MOVE_POOL;
  panel.innerHTML = `
    <div class="actor-info">
      <div class="name">${actor.name}</div>
      <div class="hp">HP ${actor.hp}/${actor.maxHp}${actor.resName!=='-'?` · ${actor.resName} ${actor.res}/${actor.resMax}`:''}</div>
    </div>
    <div style="font-size:11px;color:var(--gold-bright);margin:4px 0 8px;">移動 ${movePts}/${TURN_MOVE_POOL} · 技能 ${actor.skillUsed?0:1}/1 · 互動 ${actor.interactUsed?0:1}/1</div>
    <div class="skillgrid" id="fixedGrid"></div>
    <div class="prep-tabs" id="sidePanelTabs" style="margin-top:2px;"></div>
    <div id="tabContentArea"></div>
  `;

  const fixedGrid = document.getElementById('fixedGrid');

  // 【v0.21】固定4格：移動 / 檢查 / 脫逃 / 結束回合。
  // 結束回合原本是底部獨立滿版按鈕，這次併入此列（脫逃右方），
  // 湊滿4格剛好是skillgrid一整排（4欄），下方技能8格也剛好整齊排2排，不再有殘缺的最後一排。
  // 普通攻擊已拿掉，攻擊功能併入下方技能清單裡的保底基礎技能（點技能即可，一樣佔技能名額）；檢查佔用互動名額，脫逃不佔任何名額
  // 脫逃改成需要confirm：點下去只是「選取」（進入flee模式，棋盤上會把自己標紅），
  // 要再點自己的unit-chip才會真正觸發doFlee()，避免手滑誤觸整隊逃跑（見onUnitClick的flee分支）
  // 結束回合維持跟其他固定格相同的小按鈕樣式（MOMO確認不需要另外做視覺強調），直接呼叫endActorTurn()，不經過selected模式、無需confirm
  const fixedSlots = [
    { key:'__move',    label:'移動', disabled: movePts<=0, onClick: ()=>{ playSound(UI_SFX.select); battle.selected = {mode:'move'}; battle.actionPanelOpen = false; syncActionModal(); renderSidePanel(); renderGrid(); renderPortraits(); } },
    { key:'__inspect', label:'檢查', disabled: actor.interactUsed, onClick: ()=>{ playSound(UI_SFX.select); battle.selected = {mode:'inspect'}; battle.actionPanelOpen = false; syncActionModal(); renderSidePanel(); renderGrid(); renderPortraits(); } },
    { key:'__flee',    label:'脫逃', disabled:false, onClick: ()=>{ playSound(UI_SFX.select); battle.selected = {mode:'flee'}; battle.actionPanelOpen = false; syncActionModal(); renderSidePanel(); renderGrid(); renderPortraits(); } },
    { key:'__endturn', label:'結束回合', disabled:false, onClick: endActorTurn },
  ];
  fixedSlots.forEach(slot=>{
    const btn = document.createElement('button');
    btn.textContent = slot.label;
    const isSelected = battle.selected.mode === slot.key.replace('__','');
    // 【選取提示修正】原本只在選取時設 className='primary'，未選取時完全沒有class（等於用瀏覽器預設白底按鈕樣式，
    // 而且.primary缺少基礎.btn class，CSS的.btn.primary規則其實從未真正生效過）。
    // 改成固定套用 'btn small' 當底色，選取時額外疊加 'primary'（金黃底），未選取維持面板深色底（不是白底）。
    btn.className = 'btn small' + (isSelected ? ' primary' : '');
    if(slot.disabled){ btn.disabled = true; } else { btn.onclick = slot.onClick; }
    fixedGrid.appendChild(btn);
  });

  // 【v0.21】行動(技能8格)／道具(道具8格) 改為分頁互斥顯示，不再是「開啟道具欄」往下疊加撐高版面。
  // 固定4格（上方）不受此分頁影響，一律常駐顯示。
  // 切分頁時把battle.selected重置成閒置狀態（MOMO確認）：避免棋盤上留著看不到來源按鈕的紅/黃高亮，
  // 跟原本「點同一顆按鈕取消選取」是同一套邏輯，只是切分頁也算一種取消的觸發點。
  const tabsWrap = document.getElementById('sidePanelTabs');
  [['action','行動'], ['item','道具']].forEach(([tabKey,label])=>{
    const tabBtn = document.createElement('button');
    tabBtn.textContent = label;
    tabBtn.className = 'prep-tab' + (battle.sidePanelTab===tabKey ? ' active' : '');
    tabBtn.onclick = ()=>{
      if(battle.sidePanelTab !== tabKey){
        battle.sidePanelTab = tabKey;
        battle.selected = {mode:null};
      }
      renderSidePanel(); renderGrid(); renderPortraits();
    };
    tabsWrap.appendChild(tabBtn);
  });

  if(battle.sidePanelTab === 'item'){
    renderItemArea(actor);
  } else {
    renderSkillTabContent(actor);
  }
}

/* 【v0.21新增】「行動」分頁內容：純技能8格，從fixedSlots拆出來，方便跟道具分頁互斥切換 */
function renderSkillTabContent(actor){
  const area = document.getElementById('tabContentArea');
  area.innerHTML = `<div class="skillgrid" id="skillGrid"></div>`;
  const skillGrid = document.getElementById('skillGrid');
  for(let i=0;i<8;i++){
    const key = actor.skills[i];
    const btn = document.createElement('button');
    if(!key){
      btn.textContent = '未學習';
      btn.className = 'btn small locked';
      btn.disabled = true;
    } else {
      const d = SKILL_DB[key];
      const cdLeft = actor.cooldowns[key] || 0;
      const isSelected = battle.selected.mode === 'skill' && battle.selected.skillKey === key;
      btn.textContent = d.name + (cdLeft>0 ? ` (冷卻${cdLeft})` : '');
      btn.className = 'btn small' + (isSelected ? ' primary' : '');
      if(cdLeft>0 || actor.skillUsed) btn.disabled = true;
      // 【施放預覽流程統一入口】不論shape是什麼，點技能一律只做「選取」，
      // 不在這裡直接發動——self（reach:0）跟all已經拿掉自動觸發特例，
      // 改成跟其他技能一樣走renderGrid()的紅底/黃底高亮，由玩家點目標/格子/方向confirm才真正執行
      btn.onclick = ()=>{
        if(actor.skillUsed){ toast('本回合的技能名額已經用掉了'); return; }
        playSound(UI_SFX.select);
        battle.selected = { mode:'skill', skillKey:key, skillDef:d };
        battle.actionPanelOpen = false; syncActionModal(); // 選定技能→面板收合，網格解鎖進入選目標狀態
        renderPortraits();
        renderSidePanel(); renderGrid();
      };
    }
    skillGrid.appendChild(btn);
  }
}

/* 【v0.21調整】「道具」分頁內容：容器從舊的#itemArea改成共用的#tabContentArea，
   其餘邏輯（拾取/選取目標/toggle取消）完全不變 */
function renderItemArea(actor){
  const area = document.getElementById('tabContentArea');
  const p = actor.ref;
  if(!p){ area.innerHTML=''; return; }
  area.innerHTML = `<div style="font-size:11.5px;color:var(--text-dim);margin:8px 0 6px;">選擇要使用的道具（可對自己或相鄰隊友使用），或點空格拾取腳下的物品</div>
    <div class="skillgrid" id="itemGrid"></div>`;
  const grid = document.getElementById('itemGrid');
  p.items.forEach((it,i)=>{
    const btn = document.createElement('button');
    if(!it){
      // 拾取沒有「對象」的歧義（只能撿自己腳下的東西），維持原本點一下立即執行，不用另外走confirm流程
      btn.textContent = '空（點擊拾取）';
      btn.className = 'btn small';
      if(actor.interactUsed) btn.disabled = true;
      btn.onclick = ()=> attemptLoot(actor, i);
    }
    else {
      const d = itemDefOf(it);
      const isSelected = battle.selected.mode === 'item' && battle.selected.itemIndex === i;
      btn.textContent = d.name;
      btn.className = 'btn small' + (isSelected ? ' primary' : '');
      if(actor.interactUsed) btn.disabled = true;
      // 【道具需要指定目標】點道具只做「選取」，改成跟單體技能一樣的兩點式流程：
      // 選取後棋盤上自己＋相鄰隊友的unit-chip會標紅，玩家點紅底目標才真正使用（見onUnitClick的item分支）。
      // 再點一次同一顆道具鈕＝取消選取（跟脫逃同樣的toggle邏輯）。
      btn.onclick = ()=>{
        if(actor.interactUsed){ toast('本回合的互動名額已經用掉了'); return; }
        if(isSelected){
          battle.selected = {mode:null};
        } else {
          playSound(UI_SFX.select);
          battle.selected = { mode:'item', itemIndex:i, itemDef:d };
          battle.actionPanelOpen = false; syncActionModal(); // 選定道具→面板收合，網格解鎖進入選目標狀態
        }
        renderPortraits(); renderSidePanel(); renderGrid();
      };
    }
    grid.appendChild(btn);
  });
}

/* ============================================================
   TURN FLOW（三旗標回合結構）
   每個單位每輪有三種獨立名額：
   - movePts：移動池，預設3步，每次移動依實際格數扣點，可分次移動
   - skillUsed：技能名額，1次，攻擊併入技能名額（攻擊也算用掉這1次）
   - interactUsed：互動名額，1次，檢查/拾取/使用道具都算這裡
   三個名額全部用完才會自動結束回合；名額沒用完也可以按「結束回合」提前放棄剩餘名額。
   TURN_MOVE_POOL 是移動池步數，想調整的話改這個數字就好。
============================================================ */
const TURN_MOVE_POOL = 3;

function startActorTurn(actor){
  if(!actor) return;
  actor.movePts = TURN_MOVE_POOL;
  actor.skillUsed = false;
  actor.interactUsed = false;
  if(battle) battle.sidePanelTab = 'action'; // 換人行動時分頁重置回「行動」頁
  // v0.35新增：換人時同步行動面板的開關狀態——輪到我方且還活著就自動彈出，敵方回合/自己已倒下則不彈
  // （實際DOM同步靠呼叫端之後接著呼叫syncActionModal()，這裡只負責決定狀態該是true還是false）
  if(battle) battle.actionPanelOpen = (actor.side === 'ally' && actor.hp > 0);

  // v0.34新增：暈眩/束縛/恐懼，回合開始時檢查身上有沒有掛著這幾個狀態，直接鎖對應的行動名額。
  // 暈眩/恐懼鎖全部三個名額(整回合完全無法行動，真正的「跳過」由下面endActorTurn()的while迴圈負責推進)；
  // 恐懼原本設計是「先隨機移動一格再跳過」，這次先簡化成跟暈眩一樣直接跳過整回合——
  // 隨機移動需要額外一段「挑一個範圍內合法格子」的邏輯，之後想做再另外接，先求風險最小、能動就好。
  // 束縛只鎖movePts，skillUsed/interactUsed不動，玩家/AI仍可正常使用技能與道具。
  const ccStatus = (actor.statuses || []).find(s=>{
    const def = STATUS_DB[s.key];
    return def && def.category === 'cc';
  });
  if(ccStatus){
    const sdef = STATUS_DB[ccStatus.key];
    actor.movePts = 0;
    if(sdef.ccType === 'stun' || sdef.ccType === 'fear'){
      actor.skillUsed = true;
      actor.interactUsed = true;
    }
  }
}

/* v0.34新增：回傳actor身上「會讓整回合完全無法行動」的CC狀態定義(暈眩/恐懼)，沒有就回傳undefined。
   束縛不算在內──束縛只擋移動，仍然可以正常行動，不需要被endActorTurn()的迴圈強制跳過。 */
function getForcedSkipCC(actor){
  if(!actor) return undefined;
  const s = (actor.statuses || []).find(s=>{
    const def = STATUS_DB[s.key];
    return def && def.category === 'cc' && (def.ccType === 'stun' || def.ccType === 'fear');
  });
  return s ? STATUS_DB[s.key] : undefined;
}

/* 玩家做完一個動作後呼叫：三個名額都耗盡才真正結束回合，
   沒耗盡的話就留在原地讓玩家繼續選下一個動作 */
function afterAction(actor){
  battle.selected = { mode:null };
  saveGame();
  if(checkBattleEnd()) return;
  if(actor.movePts<=0 && actor.skillUsed && actor.interactUsed){
    endActorTurn();
  } else {
    // v0.35新增：同一位角色還有剩餘名額(移動/技能/道具沒用完)，自動重新彈出行動面板讓玩家選下一步
    battle.actionPanelOpen = true;
    renderOrderRow(); renderGrid(); renderSidePanel(); renderPortraits(); renderLog(false);
    syncActionModal();
  }
}

/* v0.34新增：把「換到下一個行動槽位(含輪完一輪時的回合結算：冷卻遞減/資源回復/狀態到期/DOT扣血)」
   抽成獨立函式，讓endActorTurn()底下要「連續跳過好幾個被暈眩/恐懼鎖住的人」時可以用while迴圈重複呼叫，
   不用遞迴呼叫endActorTurn()本身──遞迴會讓maybeRunEnemyTurn()在還沒真正輪到的中途也被觸發，
   有機率讓同一個敵人的AI被setTimeout排程兩次(角色行動兩次)，所以改用迴圈避開這個風險。 */
function advanceOneSlot(){
  battle.orderIdx += 1;
  if(battle.orderIdx >= battle.order.length){
    // tick cooldowns for all units at end of round
    allUnits().forEach(u=>{
      if(u.cooldowns) Object.keys(u.cooldowns).forEach(k=>{ if(u.cooldowns[k]>0) u.cooldowns[k]-=1; });
      if(u.resName !== '-' && u.resName !== '怒氣') u.res = clamp(u.res+1, 0, u.resMax);
      // v0.34新增：痛苦燃燒等DOT狀態，回合結束時扣血，跟下面狀態到期遞減同一個時機點一起處理
      (u.statuses || []).forEach(s=>{
        const def = STATUS_DB[s.key];
        if(def && def.category === 'dot' && u.hp > 0){
          const dmg = def.dotDamage || 0;
          u.hp = clamp(u.hp - dmg, 0, u.maxHp);
          logMsg(`<b>${u.name}</b> 因為${def.name}持續燒傷，損失了 ${dmg} 點HP。${u.hp<=0?'<b>'+u.name+'</b> 倒下了。':''}`);
        }
      });
      // v0.26：STATUS_DB固定回合buff/debuff，回合結束遞減，歸零就移除
      if(u.statuses && u.statuses.length){
        u.statuses.forEach(s=>{ if(s.duration && s.duration.type==='turns') s.duration.remaining -= 1; });
        u.statuses = u.statuses.filter(s=> !(s.duration && s.duration.type==='turns' && s.duration.remaining<=0));
      }
    });
    battle.round += 1;
    if(REROLL_ORDER_EACH_ROUND){
      rollOrder(); // 重新擲速度排序
    } else {
      battle.orderIdx = 0; // 沿用第1回合的順序，只把指標歸零重新跑一輪
    }
  }
  saveGame();
}

function endActorTurn(){
  battle.selected = { mode:null };
  advanceOneSlot();
  if(checkBattleEnd()) return;
  let next = currentActor();
  startActorTurn(next); // 換人了，重置三旗標名額(暈眩/束縛/恐懼會在這裡被鎖住對應名額)
  // v0.34新增：如果新換到的人被暈眩/恐懼鎖住整回合，直接continue往下推進到下一位，
  // 直到找到真正能行動的人或戰鬥已經結束為止；guard只是防呆，正常情況不會真的跑到50次
  let guard = 0;
  while(next && getForcedSkipCC(next) && guard < 50){
    const sdef = getForcedSkipCC(next);
    logMsg(`<b>${next.name}</b> 因為${sdef.name}，這回合無法行動。`);
    advanceOneSlot();
    if(checkBattleEnd()) return;
    next = currentActor();
    startActorTurn(next);
    guard++;
  }
  renderOrderRow(); renderGrid(); renderSidePanel(); renderPortraits(); renderLog(false);
  syncActionModal(); // v0.35新增：換人後同步行動面板開關(輪到我方就自動彈出，敵方/戰鬥結束則收合)
  maybeRunEnemyTurn();
}

function maybeRunEnemyTurn(){
  const actor = currentActor();
  if(!actor || battle.finished) return;
  if(actor.hp<=0){ setTimeout(endActorTurn, 400); return; }
  if(actor.side !== 'enemy') return;
  setTimeout(()=> runEnemyAI(actor), 700);
}

/* ============================================================
   敵人AI：分級參數表（見 dev4_design_todo.md 第十一節「AI分級系統」）

   同一套評分骨架（scoreTarget，見下方），不同敵人套用不同參數即可呈現
   「笨AI／普通AI／精英AI」，不用為每種聰明程度另寫一套判斷邏輯。

   四個參數的意義：
   - wHp   ：目標傷勢比例的加權（傷越重分數越高，越容易被優先鎖定/補刀）
   - wDef  ：目標防禦力低於3時的加分（脆皮角色更容易被鎖定）
   - wKill ：這次攻擊估算打得死目標時的加分（大幅提升，優先斬殺）
   - pTop  ：算完分數後，真正選到「最高分目標」的機率（%），
             剩下 (100-pTop)% 的機率會從其餘候選目標中隨機挑一個，
             這是刻意保留的不可預測性，避免玩家靠「墊高血量」等手法完全操控AI鎖定對象

   ▶ 這次三個等級的數值先設成完全一樣（等同 normal），只接架構、不分級。
     之後想讓某些敵人變笨或變精英，只需要「調整下面這三組數字」，
     不用改 scoreTarget() 或 decideEnemyAction() 裡的任何程式碼。

   ▶ 怎麼幫特定敵人指定等級：
     去 ENEMY_TEMPLATES 裡該敵人的物件，加一個 aiProfile 欄位，值填
     'dumb' / 'normal' / 'elite' 其中一個字串，例如：
       goblin: ()=> ({ ..., aiProfile:'dumb', ... })
     不填這個欄位的敵人，會自動 fallback 用 normal（見 getAiProfile()），
     所以現有的 goblin/goblinShaman 不用馬上補這個欄位也不會出錯。

   ▶ 之後想再加一個新等級（例如比elite更狠的 'boss'），
     只需要在下面這個物件裡多加一組 key，不用動其他程式碼。
============================================================ */
const AI_PROFILES = {
  dumb:   { wHp:50, wDef:20, wKill:100, pTop:80 }, // 目前與normal相同，僅接架構，之後調這幾個數字即可分級
  normal: { wHp:50, wDef:20, wKill:100, pTop:80 },
  elite:  { wHp:50, wDef:20, wKill:100, pTop:80 },
};

function getAiProfile(actor){
  return AI_PROFILES[actor.aiProfile] || AI_PROFILES.normal; // 查無此key（如打錯字）時安全fallback，不會讓遊戲崩潰
}

/* 傷勢比例超過此門檻（HP比例 <= 門檻）才「考慮」治療；門檻式設計見上次討論定案，
   跨過門檻後仍用機率決定要不要真的觸發，保留一點不可預測性，不是100%必治。
   想調整觸發時機：改 HEAL_HP_RATIO_THRESHOLD（門檻）；
   想調整觸發積極度：改 HEAL_TRIGGER_CHANCE（機率）。這兩個各自獨立，互不影響。 */
const HEAL_HP_RATIO_THRESHOLD = 0.5;
const HEAL_TRIGGER_CHANCE = 0.4;

/* 評分越高代表AI越想打這個目標，公式細節見第十一節，數值仍為暫定，之後依實戰調整。
   estDmg 用來估算「這次攻擊打不打得死」，不含隨機浮動，只取期望值方便判斷。 */
function scoreTarget(target, actor, d, profile){
  // v0.34修正：分段技能(d.stages)沒有頂層power，改用primaryDamageStage()抓第一個damage段估算，
  // 不然d.power是undefined，estDmg會變成NaN，AI評分整個壞掉
  const pd = primaryDamageStage(d);
  const catInfo = DAMAGE_TYPE_DB[pd.dmgType] || DAMAGE_TYPE_DB[0];
  const triple = RESIST_STAT_BY_CATEGORY[catInfo.category] || RESIST_STAT_BY_CATEGORY.physical;
  const estDmg = Math.max(1, pd.power + effectiveStat(actor, triple.atk) - effectiveStat(target, triple.def));
  const missingRatio = (target.maxHp - target.hp) / target.maxHp;
  let score = profile.wHp * missingRatio;
  if(effectiveStat(target, triple.def) < 3) score += profile.wDef;
  if(estDmg >= target.hp) score += profile.wKill;
  return score;
}

/* 從候選目標裡挑一個：pTop%機率選分數最高者，剩下機率從其餘目標中隨機挑一個。
   只有1個候選時不用評分，直接回傳，省得白算。 */
function pickWeightedTarget(candidates, actor, d, profile){
  if(candidates.length === 0) return null;
  if(candidates.length === 1) return candidates[0];
  const scored = candidates.map(t=> ({ t, s: scoreTarget(t, actor, d, profile) }));
  scored.sort((a,b)=> b.s - a.s);
  if(Math.random()*100 < profile.pTop) return scored[0].t;
  const rest = scored.slice(1);
  return rest[Math.floor(Math.random()*rest.length)].t;
}

/* 技能是否「這回合可用」：冷卻是否已轉好、資源是否夠付，兩者皆過才算可用。
   跟 executeSkill() 內的資源檢查是分開的兩層防呆——這裡先篩掉不可用的技能，
   避免AI選了一個付不出資源的技能導致 executeSkill() 中途toast返回、卡住整個回合。 */
function canAffordSkill(actor, key, d){
  const cdLeft = (actor.cooldowns && actor.cooldowns[key]) || 0;
  if(cdLeft > 0) return false;
  const cost = (d.cost && d.cost.res) || 0;
  if(actor.resName !== '-' && actor.res < cost) return false;
  return true;
}

/* ============================================================
   敵人AI決策層（取代原本寫死 goblin_hit 的版本，見第十一節）

   核心改動：
   - 技能改讀 actor.skills 陣列動態查 SKILL_DB，不再寫死 goblin_hit
   - 目標範圍判定直接沿用 singleTargetCandidates()（跟玩家點技能時同一套函式），
     shape/targetSide/reach 三者共用同一份邏輯，敵人放「治療友軍」「自療」都不用另外寫特例
   - 治療觸發改成「門檻+機率」，不再是不看傷勢的固定 Math.random()<0.4
   - 攻擊目標改用 scoreTarget() 加權評分挑選，不再是相鄰敵人裡隨機挑一個
     （舊版 adjacentEnemies() 函式已一併移除，現在改用下方共用的 singleTargetCandidates()）

   本輪刻意不處理（避免範圍蔓延，見設計文件第十一節「這次刻意不做」）：
   - AOE技能（shape>1）AI施放邏輯：下方 usableSkills 篩選時直接排除，之後AOE系統穩定再補
   - 真正路徑搜尋：移動邏輯沿用舊版單軸試探，卡住就放棄本回合剩餘移動
   - 攻擊後再移動（重新站位）：本輪只支援「移動→攻擊」，不支援「攻擊→移動」，簡化收尾判斷
============================================================ */
/* v0.28新增：泛用的AI目標計算，取代原本「只認shape===1」的限制。
   之前AI只挑shape===1的技能，AOE(shape為數字/'all'/'laser')完全排除在外——
   這次魔力人偶要用fireball(shape:3)+聖光(shape:'laser')，領隊人偶要用我方外掛/破敵外掛(shape:'all')，
   所以把「這個技能實際會打到誰」的計算獨立出來，四種shape都算得出來，跟玩家端算法(computeSkillHighlights)保持一致邏輯 */
function getAiSkillTargets(actor, d){
  if(d.shape === 'all'){
    return allUnits().filter(u => matchesSide(u, actor, d.targetSide) && u.hp > 0);
  }
  if(d.shape === 'laser'){
    // 8方向找第一個「打得到東西」的方向，不特別挑最優方向（之後有需要再加比較邏輯）
    for(const dir of LASER_DIRECTIONS){
      const hits = laserTargets(actor, d, dir.dx, dir.dy).filter(u => u.hp > 0);
      if(hits.length > 0) return hits;
    }
    return [];
  }
  if(typeof d.shape === 'number' && d.shape > 1){
    // 在reach範圍內找一個合法錨點，挑「命中數最多」的那個位置（跟玩家手動放的邏輯一致，只是自動選最優）
    let best = [];
    anchorCellCandidates(actor, d).forEach(([ax,ay]) => {
      const hits = squareArea(ax, ay, d.shape)
        .map(([x,y]) => unitAt(x,y))
        .filter(u => u && matchesSide(u, actor, d.targetSide) && u.hp > 0);
      if(hits.length > best.length) best = hits;
    });
    return best;
  }
  // shape === 1（單體/自身）
  return singleTargetCandidates(actor, d).filter(u => u.hp > 0);
}

function decideEnemyAction(actor){
  const profile = getAiProfile(actor);

  // v0.28新增：alwaysHeal標記(訓練人偶專用)——無視治療門檻/機率，血量沒滿就一定自我治療，
  // 滿血時直接pass(不會因為「沒有技能可用」而掉進移動判斷去追人，訓練人偶本來就該原地不動)
  if(actor.alwaysHeal){
    const healKey = (actor.skills || []).find(k => SKILL_DB[k] && SKILL_DB[k].type === 'heal');
    if(healKey && actor.hp < actor.maxHp){
      return { type:'skill', key: healKey, d: SKILL_DB[healKey], targets: [actor] };
    }
    return { type:'pass' };
  }

  // v0.32新增：forceHealCondition（毀滅者左手專用模式，非全域行為）——
  // 跟被動系統共用同一套condition schema(target:'self'|'linked')，重用evaluatePassiveCondition()判斷。
  // 條件成立時無視治療門檻/機率、直接對指定目標(condition.linkKey指到的單位)使用治療技能；
  // 條件不成立就放行，往下走到buff/debuff/attack分支——跟alwaysHeal不同，這裡不會在條件不成立時直接pass，
  // 因為左手「護甲沒破損時」的行為是攻擊，不是站著不動
  if(actor.forceHealCondition && evaluatePassiveCondition(actor, actor.forceHealCondition)){
    // v0.33修正：跟evaluatePassiveCondition同樣的理由，linkKey存的是id，即時查allUnits()解析，不能直接讀物件參照
    const targetId = actor[actor.forceHealCondition.linkKey];
    const target = targetId != null ? allUnits().find(u => u.id === targetId) : null;
    const healKey = (actor.skills || []).find(k => SKILL_DB[k] && SKILL_DB[k].type === 'heal');
    if(healKey && target){
      return { type:'skill', key: healKey, d: SKILL_DB[healKey], targets: [target] };
    }
  }

  // v0.28：不再限制shape===1，四種shape都交給getAiSkillTargets()處理
  const usableSkills = (actor.skills || [])
    .map(key => ({ key, d: SKILL_DB[key] }))
    .filter(s => s.d && canAffordSkill(actor, s.key, s.d));

  // 1. 治療判斷：門檻式——傷勢比例跨過門檻才考慮，考慮到了還要過一次機率才真的觸發
  //    v0.32備註：actor.forceHealCondition不為空時，整段跳過——治療決策已經交給前面的
  //    forceHealCondition分支決定（例如毀滅者左手：只認「護甲是否≤閾值」，不是這裡的HP比例門檻），
  //    兩套判斷同時存在會互相干擾（護甲沒破損但HP比例仍<50%時，這裡會用機率搶著治療，
  //    導致左手「沒破損就攻擊」的設計失效）
  const healSkills = actor.forceHealCondition ? [] : usableSkills.filter(s => s.d.type === 'heal');
  let bestHeal = null; // 挑「最需要治療（HP比例最低）」的那個組合
  healSkills.forEach(s => {
    const wounded = getAiSkillTargets(actor, s.d).filter(u => u.hp < u.maxHp);
    wounded.forEach(t => {
      const hpRatio = t.hp / t.maxHp;
      if(hpRatio <= HEAL_HP_RATIO_THRESHOLD && (!bestHeal || hpRatio < bestHeal.hpRatio)){
        bestHeal = { skill: s, target: t, hpRatio };
      }
    });
  });
  if(bestHeal && Math.random() < HEAL_TRIGGER_CHANCE){
    // shape:'all'的治療要對全體生效，不能只傳最需要的那一個(不然其他人不會被治療到)
    const targets = bestHeal.skill.d.shape === 'all' ? getAiSkillTargets(actor, bestHeal.skill.d) : [bestHeal.target];
    return { type:'skill', key: bestHeal.skill.key, d: bestHeal.skill.d, targets };
  }

  // 2. 工具技能判斷：v0.28新增，目前只有「超冷卻」——自己有技能還在冷卻中時才用，不然平白浪費一次行動
  const utilitySkills = usableSkills.filter(s => s.d.type === 'utility' && s.d.effect === 'resetCooldowns');
  if(utilitySkills.length > 0){
    const anyOnCooldown = Object.values(actor.cooldowns || {}).some(v => v > 0);
    if(anyOnCooldown){
      return { type:'skill', key: utilitySkills[0].key, d: utilitySkills[0].d, targets: [actor] };
    }
  }

  // 3. 減益/增益判斷：v0.28新增——之前debuff/buff這兩種type完全沒有分支處理，
  //    不管技能的reach開多大都不會被AI選中(這才是curse_verse一直不生效的根本原因，不是射程問題)。
  //    不用攻擊向的加權評分(scoreTarget是為了估傷害設計的，對debuff/buff沒有意義)，直接用getAiSkillTargets()算出的完整目標群即可
  const buffDebuffSkills = usableSkills.filter(s => s.d.type === 'debuff' || s.d.type === 'buff');
  for(const s of buffDebuffSkills){
    const targets = getAiSkillTargets(actor, s.d);
    if(targets.length === 0) continue;
    // v0.29新增：目標群裡只要還有人沒被這個效果覆蓋（或效果已到期），才值得施放；
    // 全部已生效中就跳過，改看下一個buff/debuff技能，不再無腦重複施放同一招
    // v0.34修正：分段技能沒有頂層effect，改用primaryStatusStage()抓代表性的那一段來判斷是否已生效中
    const needsCast = targets.some(t => !statusAlreadyActive(t, primaryStatusStage(s.d).effect));
    if(needsCast){
      return { type:'skill', key: s.key, d: s.d, targets };
    }
  }

  // 4. 攻擊判斷：shape===1沿用原本的加權評分挑最優目標；AOE(數字/laser)則直接用getAiSkillTargets()算出的最佳命中群
  const atkSkills = usableSkills.filter(s => s.d.type === 'attack');
  for(const s of atkSkills){
    if(s.d.shape === 1){
      const candidates = singleTargetCandidates(actor, s.d).filter(u => u.hp > 0);
      if(candidates.length > 0){
        const target = pickWeightedTarget(candidates, actor, s.d, profile);
        return { type:'skill', key: s.key, d: s.d, targets: [target] };
      }
    } else {
      const targets = getAiSkillTargets(actor, s.d);
      if(targets.length > 0){
        return { type:'skill', key: s.key, d: s.d, targets };
      }
    }
  }

  // 4.5 最後手段治療：v0.30新增。前面第1步的治療門檻/機率沒觸發，
  //    後面又沒有debuff/buff/attack可用時，與其讓AI什麼都不做直接pass，
  //    不如把治療技能當最後手段用一次——尤其對「無消耗/無冷卻」的治療技能來說，
  //    RNG沒中就整回合站著不動比用掉它還要浪費。只在真的沒有其他事可做時才會走到這裡，
  //    不會影響前面buff/debuff優先的既有行為（領隊人偶：ally_hack→enemy_hack→這裡才輪到治療）
  if(healSkills.length > 0){
    let fallbackHeal = null;
    healSkills.forEach(s => {
      const wounded = getAiSkillTargets(actor, s.d).filter(u => u.hp < u.maxHp);
      wounded.forEach(t => {
        const hpRatio = t.hp / t.maxHp;
        if(!fallbackHeal || hpRatio < fallbackHeal.hpRatio){
          fallbackHeal = { skill: s, target: t, hpRatio };
        }
      });
    });
    if(fallbackHeal){
      const targets = fallbackHeal.skill.d.shape === 'all' ? getAiSkillTargets(actor, fallbackHeal.skill.d) : [fallbackHeal.target];
      return { type:'skill', key: fallbackHeal.skill.key, d: fallbackHeal.skill.d, targets };
    }
  }

  // 4.8 待命：v0.33新增，純測試用。前面都沒有決定要做什麼時，如果身上掛著「待命」，
  //    用掉它（不造成任何效果，只在戰報留紀錄），藉此確認AI迴圈真的有輪到這個單位，
  //    不是因為卡在什麼地方而整個被跳過——core/armor這類沒有實際技能的部位可以掛這個
  const standbySkill = usableSkills.find(s => s.d.type === 'utility' && s.d.effect === 'standby');
  if(standbySkill){
    return { type:'skill', key: standbySkill.key, d: standbySkill.d, targets: [actor] };
  }

  // 5. 沒有技能可用/沒有目標在射程內 → 朝最近的敵對單位移動一步（沿用舊版單軸試探，無路徑搜尋）
  //    v0.28新增：stationary標記(訓練人偶/弓箭人偶/魔力人偶/領隊人偶)——完全不會走過來，沒目標在射程內就直接站著不動
  if(actor.movePts > 0 && !actor.stationary){
    const opposing = allUnits().filter(u => matchesSide(u, actor, 'enemy') && u.hp > 0);
    if(opposing.length > 0){
      const nearest = opposing.slice().sort((a,b)=>
        (Math.abs(a.x-actor.x)+Math.abs(a.y-actor.y)) - (Math.abs(b.x-actor.x)+Math.abs(b.y-actor.y))
      )[0];
      return { type:'move', target: nearest };
    }
  }

  return { type:'pass' };
}

function runEnemyAI(actor){
  if(!battle || battle.finished) return;

  const decision = decideEnemyAction(actor);

  if(decision.type === 'skill'){
    executeSkill(actor, decision.key, decision.d, decision.targets); // 沿用玩家同一套執行層，log/音效/冷卻/資源全部自動處理
    if(battle.finished) return;
    // v0.28追加：原本用完技能一律直接收尾；現在如果剛剛的技能重置了skillUsed(目前只有超冷卻會這樣做)，
    // 代表這回合還有名額，要再決策一次(比照下面「移動後再決策一次」的寫法)，不會無條件end turn
    if(!actor.skillUsed){
      renderGrid();
      setTimeout(()=> runEnemyAI(actor), 500);
    } else {
      endActorTurn();
    }
    return;
  }

  if(decision.type === 'move'){
    const nearest = decision.target;
    if(battle.mapData){
      const next=battleNextStepToward(actor,nearest);
      if(next && actor.movePts>0){actor.x=next.x;actor.y=next.y;actor.movePts=Math.max(0,actor.movePts-1);logMsg(`<b>${actor.name}</b> 沿著可通行地形移動。`);renderGrid();setTimeout(()=>runEnemyAI(actor),500);}
      else{logMsg(`<b>${actor.name}</b> 被地形阻擋，無法接近。`);renderGrid();endActorTurn();}
      return;
    }
    const dx = nearest.x - actor.x, dy = nearest.y - actor.y;
    let nx = actor.x + Math.sign(dx), ny = actor.y;
    if(unitAt(nx,ny)) { nx = actor.x; ny = actor.y + Math.sign(dy); }
    if(!unitAt(nx,ny) && nx>=0 && nx<BOARD_COLS && ny>=0 && ny<BOARD_ROWS){
      actor.x = nx; actor.y = ny;
      actor.movePts = Math.max(0, actor.movePts - 1);
      logMsg(`<b>${actor.name}</b> 向前逼近。`);
      renderGrid();
      setTimeout(()=> runEnemyAI(actor), 500); // 移動後再決策一次，讓「移動到相鄰後接著攻擊」可以在同一回合內發生
    } else {
      // 卡住走不過去（無路徑搜尋，見第十一節技術債待辦），本回合放棄剩餘移動
      logMsg(`<b>${actor.name}</b> 被擋住了，暫時無法前進。`);
      renderGrid();
      endActorTurn();
    }
    return;
  }

  endActorTurn(); // type==='pass'：沒有目標、沒有技能可用、也無法移動
}

/* ============================================================
   FLEE / END
============================================================ */
function doInspect(actor, x, y){
  logMsg(`<b>${actor.name}</b> 檢查了那個位置，似乎沒有什麼異常。`);
  actor.interactUsed = true; // 檢查併入互動名額，跟拾取共用同一個名額
  renderLog(false);
  afterAction(actor);
}

function doFlee(){
  const stopChance = battle.def.fleeBlockChance || 0;
  if(Math.random() < stopChance){
    logMsg('逃脫失敗!敵人擋住了去路。');
    renderLog(false);
    return;
  }
  logMsg('全隊成功脫離了戰鬥。');
  battle.finished = true;
  saveGame();
  endBattleReturnToPrep('你們暫時撤退了。');
}

function checkBattleEnd(){
  if(!battle || battle.finished) return false;
  const alliesAlive = battle.allies.some(u=>u.hp>0);
  const enemiesAlive = battle.enemies.some(u=>u.hp>0);
  if(!enemiesAlive){
    battle.finished = true;
    const goldGain = 20 + Math.floor(Math.random()*15);
    state.gold += goldGain;
    battle.allies.forEach(u=>{ if(u.ref) u.ref.hp = u.hp; });
    if(battle.def.unlockFlag) setFlag(battle.def.unlockFlag);
    if(battle.chapterId != null){
      state.maxChapterReached = Math.max(state.maxChapterReached||0, battle.chapterId);
    }
    saveGame();
    endBattleReturnToPrep(`戰鬥勝利！獲得 ${goldGain} 金幣。`);
    return true;
  }
  if(!alliesAlive){
    battle.finished = true;
    battle.allies.forEach(u=>{ if(u.ref) u.ref.hp = Math.ceil(u.ref.maxHp*0.3); });
    saveGame();
    endBattleReturnToPrep('全隊倒下……幸好只是暫時的，隊伍已撤回休整。');
    return true;
  }
  return false;
}

function endBattleReturnToPrep(msg){
  setNavLocked(false);
  // v0.35新增：戰鬥結束時強制收合三個overlay，避免其中一個剛好開著、蓋在下面的結算浮動列上面
  ['actionModal','logModal','unitInspectorModal'].forEach(id=>{
    const m = document.getElementById(id);
    if(m) m.classList.remove('show');
  });
  if(battle) battle.actionPanelOpen = false;
  const bgm = document.getElementById('bgm');
  bgm.pause();
  // v0.28修正：原本只pause()沒清data-cur，導致下次挑戰同一首曲子的戰鬥時，
  // playBgm()裡「data-cur===file就跳過」的判斷會誤判成「已經在播」而完全不重播——
  // 逃脫/獲勝後BGM只會響第一次，之後每次再進戰鬥都變成沒聲音，就是卡在這裡
  bgm.removeAttribute('data-cur');
  const el = document.getElementById('viewBattle');
  // 不再清空整個戰場畫面（原本會把grid/立繪等全部替換掉），
  // 改成疊加一條浮動結算列在畫面下方，讓玩家先看清楚戰場最終狀態，自己決定何時按返回
  const overlay = document.createElement('div');
  overlay.className = 'battle-result-overlay';
  const adventureReturn=!!(battle&&battle.adventureContext);
  overlay.innerHTML = `<div class="result-banner">${msg}</div>
    <button class="btn primary" id="btnBackPrep">${adventureReturn?'返回冒險地圖':'返回準備畫面'}</button>`;
  el.appendChild(overlay);
  document.getElementById('btnBackPrep').onclick = ()=>{
    if(adventureReturn){
      const mapId=battle.adventureContext.mapId,run=adventureRun(mapId);
      const won=battle.enemies.every(u=>u.hp<=0);
      run.phase='explore';run.selected=null;
      if(won){run.encounterWon=true;run.alert=Math.max(0,run.alert-1);run.lastResult='戰鬥勝利，敵人已被擊退。你可以繼續探索。';}
      else if(battle.finished&&battle.enemies.some(u=>u.hp>0))run.lastResult=msg+' 你可以重新集結後再次嘗試。';
      switchView('adventure');
    }else switchView('prep');
  };
}

/* v0.35新增：行動面板（左下角icon）overlay開關。
   跟log/status兩個純顯示面板不同，行動面板打開時要求「鎖定網格避免誤按」（見renderGrid()裡的
   battle.actionPanelOpen guard），所以額外用battle.actionPanelOpen這個旗標同時控制：
   1) actionModal的show/hide
   2) 網格是否能點擊(cell/unit-chip的onclick)
   流程：輪到我方單位→startActorTurn()把旗標設true；玩家選定一個動作(移動/技能/道具/檢查/脫逃)→
   旗標設false讓面板收合、網格解鎖進入選目標狀態；完成一個動作後若還有名額沒用完(afterAction())→
   旗標設回true自動重新彈出；玩家也能隨時手動點icon(toggleActionPanel)強制切換。 */
function toggleActionPanel(){
  if(!battle) return;
  battle.actionPanelOpen = !battle.actionPanelOpen;
  syncActionModal();
}
function syncActionModal(){
  const modal = document.getElementById('actionModal');
  if(!modal || !battle) return;
  const wasOpen = modal.classList.contains('show');
  const nowOpen = !!battle.actionPanelOpen;
  // v0.41新增：只有「真的變了」才播開/關音效，避免syncActionModal()被重複呼叫(這個函式很多地方都會呼叫)
  // 時，狀態其實沒變卻一直重播同一個音效
  if(wasOpen !== nowOpen) playSound(nowOpen ? UI_SFX.panelOpen : UI_SFX.panelClose);
  modal.classList.toggle('show', nowOpen);
  // v0.40修正：網格「鎖不鎖」是renderGrid()當下把cell/chip的onclick設成null或正常函式，
  // 只改battle.actionPanelOpen這個旗標、只切modal的show class，並不會讓已經畫出來的網格重新綁定
  // onclick——所以手動點icon關閉面板(toggleActionPanel)或點✕/背景關閉(actionModal的關閉按鈕)時，
  // 面板雖然收起來了，但網格其實還停在上一次renderGrid()當下鎖住的狀態，點了沒反應。
  // 這裡統一補一次renderGrid()，確保只要面板開關狀態一變，網格是否可點一定同步更新。
  renderGrid();
}
// v0.35：戰報改成右下角icon觸發的overlay（見logModal），不再有「展開/收合預覽6則」的分別，
// 開啟時一律顯示完整紀錄（上限100則，超出用modal-box自帶的滾動）。renderLog()本身仍會在每次
// 戰報有更新時被呼叫（不論modal是否開著），確保重新打開時內容已經是最新的。
function toggleLog(){
  const modal = document.getElementById('logModal');
  if(!modal) return;
  const nowOpen = modal.classList.toggle('show'); // toggle()回傳切換後的狀態(true=現在有show這個class)
  playSound(nowOpen ? UI_SFX.panelOpen : UI_SFX.panelClose);
  renderLog();
}
function renderLog(){
  const box = document.getElementById('msglog');
  if(!box || !battle) return;
  box.innerHTML = battle.log.map(m=>`<div class="row">${m}</div>`).join('');
  box.scrollTop = box.scrollHeight;
  const countEl = document.getElementById('logCount');
  if(countEl) countEl.textContent = `紀錄 ${battle.log.length}/100`;
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  const loaded = await loadGame();
  if(!loaded){ state = freshState(); saveGame(); }
  // 個體實例模型（iid+status）上線：舊存檔的 equipment/skills/items 存的是key字串，
  // 跟新格式不相容，且專案已定案不寫遷移腳本（見設計文件），偵測到舊格式就直接重開新局
  if(!state.equipInstances || !state.skillInstances || !state.itemInstances){
    toast('資料格式已更新，重新開始新的存檔');
    state = freshState(); saveGame();
  }
  // 相容舊存檔：補上這批更新新增的欄位，避免舊存檔缺欄位而報錯
  if(!state.flags) state.flags = {};
  if(state.maxChapterReached == null) state.maxChapterReached = 0;
  if(state.crystal == null) state.crystal = 3200; // 相容舊存檔：技能水晶貨幣，補上初始值
  if(state.sphere == null) state.sphere = 5000;
  if(state.expPool == null) state.expPool = 5000;
  const freshRef = freshParty(); // 拿新角色的預設unlockChapter/active，補進舊存檔的角色資料
  state.party.forEach(p=>{
    const ref = freshRef.find(f=>f.id===p.id);
    if(p.unlockChapter == null) p.unlockChapter = ref ? ref.unlockChapter : 0;
    if(p.active == null) p.active = ref ? ref.active : true;
    if(p.level == null) p.level = 1;
    if(!p.training) p.training = { hp:0, sp:0, atk:0, def:0 };
  });
  renderNav();
  switchView('adventure');
  initChangelogModal();
  initUnitInspectorModal();
  initBattleOverlayModals();
}
init();

/* ============================================================
   UNIT INSPECTOR（v0.33新增，測試用）
   顯示戰場上所有單位的即時數值(effectiveStat後的結果，含被動/buff疊加)、技能、被動，
   被動額外標「生效中/未生效」方便debug條件判斷對不對。開著的時候renderGrid()每次都會
   連帶重繪這裡，讓面板跟著戰鬥進度即時更新，不用自己手動重開視窗
============================================================ */
function toggleUnitInspector(){
  const modal = document.getElementById('unitInspectorModal');
  if(!modal) return;
  const opening = !modal.classList.contains('show');
  if(battle) battle.inspectorFocusUnit = null; // 右上角icon開的一律是「全部單位」清單，跟單點chip的聚焦狀態分開
  playSound(opening ? UI_SFX.panelOpen : UI_SFX.panelClose);
  modal.classList.toggle('show');
  if(opening) renderUnitInspector();
}
// v0.39新增：點戰場上的單位chip觸發，只看那一個單位的「生物檢視」卡片(跟右上角icon的全部清單共用同一個modal)
function openUnitInspectorFor(u){
  if(!battle) return;
  battle.inspectorFocusUnit = u;
  const modal = document.getElementById('unitInspectorModal');
  if(!modal) return;
  if(!modal.classList.contains('show')) playSound(UI_SFX.panelOpen); // 已經開著、只是切換聚焦單位就不重播開啟音
  modal.classList.add('show');
  renderUnitInspector();
}
// v0.39新增：battle.inspectorFocusUnit有值時只顯示那一個單位(「生物檢視」，點單位chip開的)，
// 沒值時維持原本「全部單位」清單(右上角icon開的，測試用)。兩者共用同一個modal跟同一套卡片排版，
// 差別只在要跑迴圈的units陣列是1筆還是全部，卡片內容(HP/屬性/技能/被動/狀態)完全共用不用另外寫一份。
function renderUnitInspector(){
  const modal = document.getElementById('unitInspectorModal');
  const body = document.getElementById('unitInspectorModalBody');
  const titleEl = document.getElementById('unitInspectorModalTitle');
  if(!modal || !body || !modal.classList.contains('show') || !battle) return;
  const statKeys = ['patk','pdef','eatk','edef','matk','mdef'];
  const focus = battle.inspectorFocusUnit;
  const units = focus ? [focus] : battle.allies.concat(battle.enemies);
  if(titleEl) titleEl.textContent = focus ? `生物檢視：${focus.name}` : '狀態（測試用）';
  body.innerHTML = units.map(u=>{
    const statLine = statKeys.map(k => `${STAT_LABELS[k]||k} ${effectiveStat(u,k)}`).join(' · ');
    const skillNames = (u.skills||[]).map(k => (SKILL_DB[k]&&SKILL_DB[k].name) || k).join('、') || '（無）';
    const passiveIds = getUnitPassiveIds(u);
    const passiveLines = passiveIds.length ? passiveIds.map(pid=>{
      const pdef = PASSIVE_DB[pid];
      if(!pdef) return `${pid}（找不到資料）`;
      const active = evaluatePassiveCondition(u, pdef.condition);
      return `${pdef.name}（${active ? '生效中' : '未生效'}）`;
    }).join('、') : '（無）';
    const statusLines = (u.statuses||[]).length ? u.statuses.map(s=>{
      const sdef = STATUS_DB[s.key];
      const name = (sdef && sdef.name) || s.key;
      const kind = s.value >= 0 ? 'buff' : 'debuff';
      const remain = s.duration ? `剩${s.duration.remaining}回合` : '';
      return `${name}(${kind}${s.value>=0?'+':''}${s.value}・${remain})`;
    }).join('、') : '（無）';
    return `<div style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border-dim,#3a3a3a);">
      <div style="font-size:13px;font-weight:600;color:var(--gold-bright);">${u.name}（${u.side==='ally'?'我方':'敵方'}）${u.hp<=0?' — 已倒下':''}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">HP ${u.hp}/${u.maxHp}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${statLine}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">技能：${skillNames}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">被動：${passiveLines}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">狀態：${statusLines}</div>
    </div>`;
  }).join('');
}

/* v0.35新增：行動面板(actionModal)／戰報(logModal) 這兩個新的overlay，
   關閉方式(右上✕、點背景)跟changelogModal/unitInspectorModal共用同一套modal-overlay慣例。
   actionModal額外要把battle.actionPanelOpen同步設回false，不然手動關閉後旗標仍是true，
   下次renderGrid()還是會誤判成「面板開著、網格鎖定」。
   v0.40修正：這裡改成呼叫syncActionModal()而不是自己手動toggle class，
   確保跟icon手動開關(toggleActionPanel)走同一條路、同樣會補renderGrid()解鎖網格 */
function initBattleOverlayModals(){
  const actionModal = document.getElementById('actionModal');
  const closeAction = ()=>{ if(battle) battle.actionPanelOpen = false; syncActionModal(); };
  document.getElementById('actionModalClose').onclick = closeAction;
  actionModal.onclick = (e)=>{ if(e.target === actionModal) closeAction(); };

  const logModal = document.getElementById('logModal');
  const closeLog = ()=>{
    if(logModal.classList.contains('show')) playSound(UI_SFX.panelClose); // 已經是關的就不重播
    logModal.classList.remove('show');
  };
  document.getElementById('logModalClose').onclick = closeLog;
  logModal.onclick = (e)=>{ if(e.target === logModal) closeLog(); };
}
function initUnitInspectorModal(){
  const modal = document.getElementById('unitInspectorModal');
  const closeModal = ()=>{
    if(modal.classList.contains('show')) playSound(UI_SFX.panelClose);
    modal.classList.remove('show'); if(battle) battle.inspectorFocusUnit = null;
  };
  document.getElementById('unitInspectorModalClose').onclick = closeModal;
  modal.onclick = (e)=>{ if(e.target === modal) closeModal(); };
}
function initChangelogModal(){
  const latest = CHANGELOG[0];
  document.getElementById('versionTag').textContent = latest ? latest.version : '';
  const modal = document.getElementById('changelogModal');
  const body = document.getElementById('changelogModalBody');
  body.innerHTML = '';
  CHANGELOG.forEach(entry=>{
    const block = document.createElement('div');
    block.style.marginBottom = '14px';
    block.innerHTML = `<div style="font-size:12.5px;color:var(--gold-bright);font-weight:600;margin-bottom:4px;">${entry.version} <span style="color:var(--text-dim);font-weight:400;">· ${entry.date}</span></div>
      <ul style="margin:0;padding-left:18px;font-size:12px;color:var(--text-dim);line-height:1.8;">
        ${entry.notes.map(n=>`<li>${n}</li>`).join('')}
      </ul>`;
    body.appendChild(block);
  });
  const openModal = ()=> modal.classList.add('show');
  const closeModal = ()=> modal.classList.remove('show');
  document.getElementById('versionTag').onclick = openModal;
  document.getElementById('changelogModalClose').onclick = closeModal;
  modal.onclick = (e)=>{ if(e.target === modal) closeModal(); };
}

})();
</script>
</body>
</html>
