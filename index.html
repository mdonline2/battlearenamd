<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>0.07標記為DW(戰棋版・第一階段)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink-night:#10121B; --panel:#181B27; --panel-2:#1F2333; --border:#2C3145;
  --gold:#C9A227; --gold-bright:#E4C34F; --text:#E7E4DA; --text-dim:#9A9CAE;
  --hp:#c14b4b; --hp-low:#e2604a; --ally:#3E8E82; --enemy:#C2542E;
  /* v0.37新增：有角色小圖的unit-chip，腳下陣營色改用這兩個半透明版本(alpha .32，想更透明/更明顯直接改最後的.32) */
  --ally-soft: rgba(62,142,130,.32); --enemy-soft: rgba(194,84,46,.32);
  --hp-flash:#e8c93a; /* 受傷時黃色殘影的顏色 */
  /* 裝備部位標籤色（色票先暫定，之後想改直接換這幾個hex即可）*/
  --eq-head:#8a95a5; --eq-chest:#b8763f; --eq-hands:#a8895f;
  --eq-waist:#7c9b6f; --eq-feet:#6f8a7c; --eq-acc:#a67cc4;
  /* 屬性八宮格色票（暫定，之後想改直接換這幾個hex即可）*/
  --attr-lv:#C9A227; --attr-sp:#6f8fc4; --attr-atk:#c47a4f; --attr-def:#6fae95;
  /* v0.26新增：稀有度色票(灰白金沿用上面既有變數，這裡只補綠/藍/紫/紅四個新的) */
  --rarity-green:#4CAF7D; --rarity-blue:#4F8FE4; --rarity-purple:#9B6FE0; --rarity-red:#E4574F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink-night);color:var(--text);font-family:'Inter',-apple-system,"PingFang TC","Noto Sans TC",sans-serif;}
.serif{font-family:'Spectral',Georgia,serif;}
.slot{ position:relative; min-width:0; }
/* ============================================================
   🔧 裝備部位顏色標記（小圓點）位置/大小怎麼調
   - 這個小圓點是靠 .slot 設定 position:relative 當定位基準，
     .slot-tagdot 用 position:absolute 相對於.slot的右上角定位
   - 想移動位置：改下面 top / right 這兩個數字（單位px，數字越大離邊角越遠）
   - 想改大小：改 width / height（兩個要一起改，保持正圓形）
   - 想改顏色：不要改這裡，去最上面 :root{} 裡改 --eq-head/--eq-chest/
     --eq-hands/--eq-waist/--eq-feet/--eq-acc 這幾個hex色碼即可
============================================================ */
/* v0.23：右上角分類色點全數刪除（裝備/技能已改用左側色條標色，色點變成重複資訊），
   .slot-tagdot 保留CSS定義以防之後別處還在用，但裝備/技能已不再輸出這個div */
.slot-tagdot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; }
/* v0.23：已裝備格的卸除按鈕，改成右上角Windows關閉鈕風格的✕，取代原本卡片底部的整排文字按鈕 */
.slot-close-btn{ position:absolute; top:4px; right:4px; width:18px; height:18px; line-height:16px; text-align:center;
  border-radius:4px; background:var(--panel); border:1px solid var(--border); color:var(--text-dim); font-size:12px; cursor:pointer; }
.slot-close-btn:hover{ background:var(--enemy); border-color:var(--enemy); color:#fff; }
/* v0.23：裝備／技能強化等級角標，統一右下角「+X」（X=強化次數，未強化顯示+0，不是隱藏），道具沒有強化系統不套用 */
.slot-level-badge{ position:absolute; bottom:4px; right:6px; font-size:10.5px; font-weight:700; color:var(--gold-bright); }
/* ============================================================
   🔧 卡片左側顏色條（v0.23比照MOMO參考的舊分支做法統一套用到所有.slot卡片）
   - 條的顏色吃每張卡自己inline style設定的 --accent 變數（跟.slot-tagdot共用同一個顏色值即可）
   - 沒有設定--accent的卡片（目前是道具卡，ITEM_DB還沒有分類/顏色資料）會fallback顯示--border，
     視覺上等於沒有特別標色，之後道具補上分類欄位後再接上即可
   - 想改粗細：改width（目前3px）；想改要不要圓角：改border-radius
============================================================ */
.slot::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:10px 0 0 10px; background:var(--accent, var(--border)); }
/* v0.26新增：裝備稀有度標示——只有裝備卡片(.has-rarity)用雙色分割版本，上半稀有度色/下半沿用原本分類色(--accent)，
   技能/道具卡片沒有.has-rarity class，維持原本單色不受影響 */
.slot.has-rarity::before{
  background: linear-gradient(to bottom,
    var(--rarity, var(--border)) 0%,  var(--rarity, var(--border)) 50%,
    var(--accent, var(--border)) 50%, var(--accent, var(--border)) 100%);
}
/* v0.26新增：戰報「無法穿透」高亮，跟一般白字傷害訊息明顯區隔 */
.log-block{ color:var(--gold-bright); font-weight:700; }
.app{


  
  max-width:1200px;margin:0 auto;padding:16px 14px 60px;


}
button{font-family:inherit;cursor:pointer;border:none;}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;}
.btn:hover{border-color:#454b66;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--gold);color:#20180a;border-color:var(--gold);}
.btn.primary:hover{background:var(--gold-bright);}
.btn.small{padding:5px 9px;font-size:11px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;}
/* v0.23：立繪底圖獨立成一層蓋在.card底下，只有這層負責淡入，不會連文字內容一起閃爍
   0.2秒是初始值，之後想調整動畫速度直接改這裡的transition時間即可 */
.card-bg-layer{ position:absolute; inset:0; background-size:cover; background-position:top center; opacity:0; transition:opacity .2s ease; z-index:0; pointer-events:none; }
.card-bg-layer.visible{ opacity:1; }
.card > *:not(.card-bg-layer){ position:relative; z-index:1; }

/* NAV */
.nav{display:flex;gap:8px;margin-bottom:16px;}
.navbtn{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--text-dim);}
.navbtn.active{color:var(--gold-bright);border-color:var(--gold);}
.navbtn:disabled{opacity:.35;cursor:not-allowed;}

/* CHAPTER SCREEN */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.chcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:left;}
.chcard.locked{opacity:.4;}
.chcard .num{font-size:10px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;}
.chcard .ttl{font-family:'Spectral',serif;font-size:15px;margin:4px 0 6px;}
.chcard .desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;}

/* CHAPTER PAGINATION */
.ch-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.ch-pager .ch-pager-title-wrap{flex:1;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:8px;}
.ch-pager .ch-pager-title{font-family:'Spectral',serif;font-size:18px;margin:0;}
.ch-pager .ch-pager-count{font-size:11px;color:var(--text-dim);letter-spacing:.05em;white-space:nowrap;}
.ch-pager-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;}
.ch-pager-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-bright);}
.ch-pager-btn:disabled{opacity:.3;cursor:not-allowed;}

/* PREP SCREEN */
.party-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.party-tab{flex:1 1 120px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px;text-align:center;font-size:12.5px;font-weight:600;}
.party-tab.active{border-color:var(--gold);color:var(--gold-bright);background:var(--panel-2);}
.prep-tabs{display:flex;gap:6px;margin-bottom:14px;}
/* v0.43：準備畫面統一管理矩陣，固定八欄，窄螢幕可水平滑動 */
.prep-matrix-wrap{overflow-x:auto;margin:4px 0 14px;padding-bottom:3px;}
.prep-matrix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;}
.prep-matrix-cell{position:relative;min-height:68px;padding:7px 5px;background:rgba(31,35,51,.72);border:1px solid var(--border);border-radius:8px;color:var(--text);text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.prep-matrix-cell:hover,.prep-matrix-cell.active{border-color:var(--gold);background:var(--panel-2);}
.prep-matrix-cell.active{box-shadow:inset 0 0 0 1px var(--gold);}
.prep-matrix-cell .matrix-kind{font-size:9px;color:var(--text-dim);}
.prep-matrix-cell .matrix-value{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prep-matrix-cell.empty .matrix-value{color:var(--text-dim);font-weight:400;}
#prepBody,#prepInfoPanel{display:none!important;}
.prep-picker-overlay{position:fixed;inset:0;z-index:10000;background:rgba(4,6,12,.78);display:flex;align-items:center;justify-content:center;padding:18px;}
.prep-picker{width:min(620px,100%);max-height:min(82vh,760px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--gold);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden;}
.prep-picker-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.prep-picker-title{font-family:'Spectral',serif;font-size:17px;color:var(--gold-bright);margin:0;}
.prep-picker-close{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 10px;cursor:pointer;}
.prep-picker-note{padding:10px 16px 0;color:var(--text-dim);font-size:11px;}
.prep-picker-list{overflow:auto;padding:10px 16px 16px;display:grid;gap:8px;}
.prep-picker-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;}
.prep-picker-entry.current{border-color:var(--gold);}
.prep-picker-copy{min-width:0;}
.prep-picker-name{font-size:13px;font-weight:600;color:var(--text);}
.prep-picker-desc{font-size:10.5px;line-height:1.45;color:var(--text-dim);margin-top:3px;}
.prep-picker-action{flex:0 0 auto;}
.prep-picker-empty{padding:18px;text-align:center;color:var(--text-dim);font-size:12px;}

.prep-pagination{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 8px;font-size:11.5px;color:var(--text-dim);}
.prep-pagination button{min-width:32px;}
.slot.owned .slot-tagdot{ box-shadow:0 0 0 2px var(--panel-2); }
.slot-status-badge{ position:absolute; top:6px; left:6px; font-size:9px; padding:1px 5px; border-radius:6px; background:var(--panel); color:var(--gold-bright); border:1px solid var(--gold); }
/* 【v0.22】共用說明浮動視窗：貼在.card底部，玩家自行收合/展開（狀態存在state.prepPanelOpen，會存檔記住） */
.prep-info-panel{ margin-top:14px; border:1px solid var(--border); border-radius:10px; background:var(--panel-2); overflow:hidden; }
.prep-info-head{ display:flex; justify-content:space-between; align-items:center; padding:8px 12px; cursor:pointer; font-size:12px; color:var(--gold-bright); font-weight:600; }
.prep-info-body{ padding:0 12px 12px; font-size:12px; color:var(--text); }
.prep-info-body .d{ color:var(--text-dim); font-size:11px; margin:4px 0 10px; line-height:1.5; }
.prep-info-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.prep-tab{flex:1;background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;color:var(--text-dim);font-weight:600;}
.prep-tab.active{background:var(--panel-2);color:var(--gold-bright);border-color:var(--gold);}
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.slot{background:rgba(31,35,51,0.6);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center;font-size:11.5px;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.slot .k{font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.slot .v{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;}
.slot.empty{color:var(--text-dim);border-style:dashed;}
.slot-effect{font-size:10px;color:var(--gold-bright);line-height:1.4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;}
.stat-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-row .k{color:var(--text-dim);}
.stat-row .v{font-weight:600;font-family:'Spectral',serif;}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.shop-item:last-child{border-bottom:none;}
.shop-item .d{color:var(--text-dim);font-size:10.5px;}

/* BATTLE SCREEN */
.battle-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px;}
.battle-top-zone{position:relative;overflow:hidden;}
.battle-layout{display:flex;gap:8px;align-items:stretch;}
.portrait-box{
  width:100px; flex:0 0 100px;
  border:2px dashed var(--border); border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel-2);
}
.portrait-placeholder{
  font-size:10.5px; color:var(--text-dim); text-align:center; line-height:1.6; padding:8px;
}
@media (max-width:760px){
  .portrait-box{ width:64px; flex:0 0 64px; }
  .portrait-placeholder{ font-size:9px; }
}
.battle-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5);}
.battle-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;gap:10px;flex-wrap:wrap;}
.turn-order{background:rgba(15,17,21,.72);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
.turn-order .lbl{font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.turn-order .row{display:flex;gap:5px;}
.tu{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;border:1px solid var(--border);background:var(--panel);flex:0 0 auto;position:relative;}
.tu.ally{color:var(--ally);}
.tu.enemy{color:var(--enemy);}
.tu.current{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bright) inset;}
.tu.dead{opacity:.3;}
.battle-actions-top{background:rgba(15,17,21,.72);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:11.5px;}

.grid-wrap{position:relative;z-index:2;padding:0 10px 10px;}
/* v0.35：戰場12x4→12x12（配合三個常駐UI icon化騰出的垂直空間），改用aspect-ratio讓格子維持正方形、
   隨容器寬度等比放大，不再靠固定px列高手動維護（欄/列數改成共用BOARD_COLS/BOARD_ROWS常數，見JS） */
.grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);gap:3px;aspect-ratio:1/1;}
.cell{background:rgba(20,22,32,.55);border:1px solid rgba(255,255,255,.06);border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;cursor:default;isolation:isolate;overflow:hidden;}
.loot-star{position:absolute;top:1px;right:2px;font-size:9px;color:var(--gold-bright);pointer-events:none;text-shadow:0 0 3px rgba(0,0,0,.8);}
.cell.selectable{cursor:pointer;}
.cell.aoe{background:transparent;}
/* v0.48繪製層：地形底色／紋理在底層，技能提示疊在其上，單位與圖示在最上層。 */
.cell::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.42;background:linear-gradient(135deg,#ffffff10,transparent 55%),repeating-linear-gradient(45deg,transparent 0 8px,#0000000b 9px 10px);}
.cell::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:transparent;}
.cell.selectable::after{background:rgba(244,207,78,.43);}
.cell.aoe::after{background:rgba(222,76,63,.50);}
.cell>*{z-index:2;}
/* 【斜紋雙色demo】預覽用，目前沒有任何指令實際套用這個class，純粹展示效果，
   實際套色靠JS內聯style動態設定（見下方stripeCellBackground()），這裡只是把它視覺化的容器。
   要拿掉這個demo時，把下面的.cell.stripe-preview規則跟stripeCellBackground()/applyStripePreviewDemo()一起刪掉即可。 */
.cell.stripe-preview{cursor:pointer;}
.unit-chip{width:34px;height:34px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;cursor:pointer;position:relative;}
.unit-chip.ally{background:var(--ally);color:#0d1a17;}
.unit-chip.enemy{background:var(--enemy);color:#2a0f06;}
/* v0.37新增：有圖的角色，腳下色塊換成半透明版本，比CSS規則順序後面的.unit-chip.ally/.enemy寫得更精確(兩個class)，
   會優先套用；沒圖的敵人不會有.has-img這個class，維持原本全不透明色塊 */
.unit-chip.has-img.ally{background:var(--ally-soft);}
.unit-chip.has-img.enemy{background:var(--enemy-soft);}
.unit-chip.current{box-shadow:0 0 0 2px var(--gold-bright);}
.unit-chip.down{opacity:.35;}
.unit-chip.target-red{box-shadow:0 0 0 3px #ff5b45;}
/* v0.35.1修正：改成絕對定位置中放大(145%)，允許超出格子範圍顯示，角色看起來更明顯；
   原本overflow:hidden是為了裁切圖片用，但一併把bubble(施法對話框，bottom:38px定位在格子外)、
   status-badge、hp條(這兩個也定位在格子邊界外一點點)都裁掉了，這次拿掉.unit-chip的overflow:hidden，
   改用z-index讓角色圖疊在陣營色塊上面、但疊在bubble/status-badge/hp條下面 */
.unit-chip img{position:absolute;left:50%;top:50%;width:145%;height:145%;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;z-index:1;}
/* v0.28新增：▲buff/▼debuff標記，疊在chip正上方，兩者可並存 */
.status-badge{ position:absolute; top:-11px; left:50%; transform:translateX(-50%); display:flex; gap:1px; font-size:10px; line-height:1; pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.8); z-index:2; }
.status-badge .buff-mark{ color:var(--gold-bright); }
.status-badge .debuff-mark{ color:var(--rarity-purple); }
/* v0.34新增：暈眩/束縛/恐懼/DOT共用一個符號(還沒細分每種狀態各自圖示)，跟target-red同色，呼應「控制/持續傷害」語意 */
.status-badge .special-mark{ color:#ff5b45; }
/* 施放預覽：紅底＝「點下去會生效/命中」的統一語意，同時用在棋盤unit-chip跟laser方向面板按鈕上 */
.btn.target-red{background:var(--enemy);color:#fff;border-color:var(--enemy);}
.btn.target-red:hover{background:#d8663e;}
/* laser 8方向面板：3x3排列，中間格放取消鍵 */
/* laser 8方向面板（.dir-panel）已於v0.15改回點格子版，不再需要，此CSS規則已移除 */
.unit-hp{position:absolute;bottom:-6px;left:2px;right:2px;height:3px;background:#000;border-radius:2px;overflow:hidden;z-index:2;}
/* v0.37新增：HP條改雙層——fill-back(黃色殘影，受傷時從舊寬度動畫縮到新寬度)疊在下面，
   fill-front(實際血量顏色)疊在上面直接顯示新寬度，兩者差的那一截就是視覺上的「黃色殘影」。
   衰減動畫時間目前1秒，想調快/慢直接改這裡的transition秒數即可 */
.unit-hp .fill{position:absolute;top:0;bottom:0;left:0;}
.unit-hp .fill-back{background:var(--hp-flash);z-index:1;transition:width 1s linear;}
.unit-hp .fill-front{background:var(--hp-low);z-index:2;}
/* v0.37新增：受傷飄字「-N」，浮在角色頭上方1秒內淡出上移；時間/顏色都在這裡調 */
.dmg-float{position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:#ff5b45;font-size:11px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none;z-index:4;animation:dmgFloat 1s ease-out forwards;}
@keyframes dmgFloat{ 0%{opacity:1; transform:translate(-50%,0);} 100%{opacity:0; transform:translate(-50%,-14px);} }
.bubble{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1a1a;font-size:10px;padding:4px 7px;border-radius:6px;white-space:nowrap;max-width:160px;white-space:normal;width:max-content;max-width:150px;text-align:center;line-height:1.3;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.bubble:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff;}

.side-panel{position:relative;z-index:2;background:rgba(15,17,21,.85);border-top:1px solid var(--border);padding:12px;}
.actor-info{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.actor-info .name{font-weight:600;font-size:14px;}

.actionbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.skillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.skillgrid button{font-size:11px;padding:8px 4px;}
.skillgrid button.locked{color:var(--text-dim);border-style:dashed;}

.msglog{position:relative;z-index:2;background:#0D0F17;border-top:1px solid var(--border);padding:8px 12px;font-size:12px;line-height:1.7;color:#C9C6BA;max-height:150px;overflow-y:auto;}

.msglog .row b{color:var(--text);}
.logbar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);border-top:1px solid var(--border);}
.logbar span{font-size:11px;color:var(--text-dim);}

.result-banner{position:relative;z-index:3;background:var(--gold);color:#20180a;text-align:center;padding:14px;font-weight:700;font-size:15px;}

/* 戰鬥結算浮動列：疊加在戰場畫面下方，不清空/遮擋整個戰場，讓玩家可以先看清楚戰場最終狀態再按返回 */
.battle-result-overlay{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:linear-gradient(180deg, transparent, var(--ink-night) 35%);
  padding:26px 16px 18px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  animation:resultFadeUp .3s ease;
}
.battle-result-overlay .result-banner{
  border-radius:10px; max-width:480px; width:100%;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
}
@keyframes resultFadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--gold);color:var(--gold-bright);padding:10px 18px;border-radius:10px;font-size:12.5px;opacity:0;transition:all .25s ease;z-index:60;pointer-events:none;font-weight:600;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.fullscreen-fx{
  position:fixed; inset:0; background:#000; z-index:200;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .25s ease;
}
.fullscreen-fx.show{ opacity:1; }
.fullscreen-fx.fx-fadeout{ opacity:0; }
.fullscreen-fx img{ max-width:100%; max-height:100%; }
.fx-placeholder{ color:#fff; text-align:center; font-family:'Spectral',serif; font-size:22px; line-height:1.7; padding:20px; }
.fx-placeholder .fx-sub{ font-size:12px; color:#888; display:block; margin-top:10px; font-family:'Inter'; }
footer.foot{text-align:center;margin-top:20px;font-size:11px;color:var(--text-dim);}
.version-tag{cursor:pointer;text-decoration:underline dotted;color:var(--text-dim);}
.version-tag:hover{color:var(--gold-bright);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-box .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-box .modal-close{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);width:26px;height:26px;font-size:14px;line-height:1;cursor:pointer;}

}

.adventure-cell::before{content:"";position:absolute;inset:0;z-index:0;opacity:.42;background:linear-gradient(135deg,#ffffff10,transparent 55%),repeating-linear-gradient(45deg,transparent 0 8px,#0000000b 9px 10px);pointer-events:none}.adventure-cell>*{position:relative;z-index:1}
.adventure-cell.grass{background:#3a4931}.adventure-cell.road{background:#756e55}.adventure-cell.wall{background:#514e43;box-shadow:inset 0 0 0 2px #272920}.adventure-cell.forest{background:#263b2c}.adventure-cell.forest::before{opacity:1;background:radial-gradient(ellipse at 50% 45%,#59704b 0 18%,#2b4832 19% 48%,transparent 50%),linear-gradient(135deg,#ffffff12,transparent)}.adventure-cell.cover{background:#625d4a;box-shadow:inset 0 0 0 2px #a28d58}.adventure-cell.door{background:#76563e}.adventure-cell.floor{background:#5a5143}

.adventure-panel h3{margin:0 0 7px;color:var(--gold-bright);font-size:13px}.adventure-panel p{margin:0;color:var(--text-dim);font-size:11.5px;line-height:1.55;}
.adventure-map-choice{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.adventure-map-choice button{flex:1;min-width:125px}.adventure-actions{display:grid;gap:6px;margin-top:9px}.adventure-actions button{width:100%;text-align:left;font-size:11.5px;}
.adventure-enemy-list{margin:8px 0 0;padding-left:18px;color:var(--text);font-size:11.5px;line-height:1.8}.adventure-legend{display:flex;gap:8px;flex-wrap:wrap;color:var(--text-dim);font-size:10px;margin-top:8px}.adventure-banner{margin:8px 0;padding:8px;border-left:2px solid var(--gold);background:rgba(201,162,39,.08);font-size:11px;color:var(--text);}

.battle-map-grass{background:#3a4931!important}.battle-map-grass::before{background:radial-gradient(circle,rgba(158,190,115,.24) 1px,transparent 1.7px) 0 0/8px 8px}.battle-map-road{background:#756e55!important}.battle-map-road::before{background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(225,207,154,.25) 6px 7px)}.battle-map-forest{background:#263b2c!important}.battle-map-forest::before{opacity:1;background:radial-gradient(ellipse at 50% 45%,#59704b 0 18%,#2b4832 19% 48%,transparent 50%),linear-gradient(135deg,#ffffff12,transparent)}.battle-map-wall{background:#514e43!important;box-shadow:inset 0 0 0 2px #272920}.battle-map-cover{background:#625d4a!important;box-shadow:inset 0 0 0 2px #a28d58}.battle-map-floor{background:#5a5143!important}.battle-map-door{background:#76563e!important}.battle-map-cover-adjacent{filter:brightness(1.22);}

/* v0.50地面底色切換：預設關閉；將MAP_SHOW_TERRAIN_BASE改為true即可恢復底色，切換同時套用冒險與戰鬥地圖。 */
body.map-no-ground .adventure-cell.grass{background:radial-gradient(circle,rgba(158,190,115,.3) 1px,transparent 1.7px) 0 0/8px 8px}body.map-no-ground .adventure-cell.road{background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(225,207,154,.32) 6px 7px)}body.map-no-ground .adventure-cell.wall{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(220,209,181,.34) 5px 7px)}body.map-no-ground .adventure-cell.forest{background:transparent}body.map-no-ground .adventure-cell.forest::before{opacity:1;background:radial-gradient(ellipse at 50% 45%,#59704b 0 18%,#2b4832 19% 48%,transparent 50%),linear-gradient(135deg,#ffffff12,transparent)}body.map-no-ground .adventure-cell.cover{background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(235,209,145,.36) 4px 6px)}body.map-no-ground .adventure-cell.floor{background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(220,198,167,.2) 8px 9px)}body.map-no-ground .adventure-cell.door{background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(250,181,130,.38) 4px 6px)}

  { version:'v0.44', date:'2026/09/29', notes:[
    '【準備畫面試作調整】管理格改成4欄×8列，四類各8格；倉庫清單改為點選格位後才彈出專用選擇視窗，並以指定格位進行裝備/技能/道具切換。里程碑格彈出對應說明。原有倉庫渲染保留在隱藏區作為資料/互動參照。',
  ]},
  { version:'v0.43', date:'2026/09/29', notes:[
    '【準備畫面整合】將裝備、技能、道具、里程碑改為固定4行×8格的統一入口矩陣；點擊各列格子切換至原有管理內容，裝備/技能/道具仍沿用原有持有、購買、卸除、裝備與強化操作，里程碑沿用現有解鎖資訊顯示。角色立繪與戰鬥系統未修改。',

  { version:'v0.42', date:'2026/09/28', notes:[
    '【介面調整】暫時移除主導航列的「章節／準備／回顧」三個分頁標籤；原本的章節、準備、回顧畫面與程式仍保留，只是不再由頂部導航按鈕顯示。',
  ]},
  { version:'v0.41', date:'2026/09/27', notes:[
    '【戰場UI音效】新增UI_SFX路徑集中設定＋沿用既有的playSound()：面板開/關(行動／狀態／戰報，三個共用同一組開啟音/關閉音)、選定行動/技能/道具、移動確認(共用另一組選定音)都會播放。查無音檔時playSound()本來就會靜默略過，不影響操作，MOMO把檔案放進assets/sfx/對應檔名(ui_panel_open.mp3／ui_panel_close.mp3／ui_select.mp3)就會直接生效；想幫特定動作換成不同音效，就在UI_SFX加新key、改對應呼叫處即可。開關面板的音效都有做「狀態真的有變化才播放」的判斷，避免同一個函式被重複呼叫時連續重播',
  ]},
  { version:'v0.40', date:'2026/09/27', notes:[
    '【修正】我方回合手動關閉行動面板後點不到單位的bug。根因：toggleActionPanel()(點左下角icon)、以及actionModal的✕/背景關閉，都只有切換battle.actionPanelOpen這個旗標跟modal的show class，沒有重新呼叫renderGrid()——而網格的cell/chip「能不能點」是renderGrid()當下依旗標把onclick設成null或正常函式，畫出來以後就固定住了，旗標之後再怎麼變都不會自動反映到已經畫好的DOM上。所以手動關閉面板當下，網格其實還停在「上一次renderGrid()時鎖住」的狀態，點了沒反應；敵方回合/戰鬥結束後之所以看起來正常，是因為那些流程本來就會在旗標改變後另外呼叫renderGrid()，只是巧合看起來像「換人/結束後才會恢復」。修法：syncActionModal()(所有開關行動面板的路徑最後都會經過這裡)裡統一補一次renderGrid()，確保面板開關狀態一變，網格可不可點一定同步更新，不用再等下一次其他流程剛好觸發renderGrid()',
  ]},
  { version:'v0.39', date:'2026/09/26', notes:[
    '【單位生物檢視】右上角「狀態」icon一次列出全部單位太累贅，改成：閒置狀態下(沒有正在選技能/道具/脫逃目標時)點戰場上任一單位的chip，只彈出那一個單位的狀態卡片(標題顯示「生物檢視：角色名」)。跟右上角icon的「全部單位」清單共用同一個modal跟卡片排版，只是battle.inspectorFocusUnit有沒有指定單一單位的差別；icon本身功能不變，兩種開法都還在',
    '【輸出檔名規則變更】這是MOMO說的「第五版」，往後輸出檔名改成game_dev50xx.html(50開頭)，跟這之前4034~4035那一批(第四版)區隔開；每次版本號往上跳都存成新檔名，不再共用同一個檔名互相覆蓋——這份就是第五版的第一個檔案game_dev5000.html',
  ]},
  { version:'v0.38', date:'2026/09/26', notes:[
    '【技能施放後delay】新增SKILL_RESULT_DELAY_MS常數(目前1000ms)，executeSkill()裡原本傷害/效果算完就立刻afterAction()(換下一步/行動面板重彈/敵方接著行動)，改成畫面(傷害/HP條/戰報)先立刻更新，afterAction()延遲這段時間才執行，讓玩家有時間看清楚剛剛發生了什麼。玩家/敵方AI共用executeSkill()這個入口，兩邊都會套用到；純移動/道具/檢查目前不受影響，只有技能施放會delay',
  ]},
  { version:'v0.37', date:'2026/09/26', notes:[
    '【角色腳下色塊半透明化】有CHIP_MAP圖片的unit-chip，陣營色塊改用半透明版本(--ally-soft/--enemy-soft，目前alpha .32)，效果比較像「腳下踩著一層陣營色」而不是蓋住角色圖的實心方塊；沒有圖片的敵人(目前皆是)維持原本全不透明色塊，不受影響',
    '【HP條受傷雙層動畫】改成fill-back(黃色殘影)+fill-front(實際血量)兩層：受傷當下fill-back先停在舊血量寬度，fill-front直接跳到新血量寬度，兩者差的一截露出黃色，接著fill-back用CSS transition(目前1秒，寫在.unit-hp .fill-back的transition秒數，直接改該行數字即可調整衰減速度)動畫縮到跟fill-front同寬，黃色殘影逐漸消失；用u._hpBarPrev記錄上一次renderGrid()看到的血量來判斷這次是否受傷、掉了多少',
    '【受傷飄字】受傷當下額外在角色頭上冒出「-N」紅字，1秒內淡出上移(見.dmg-float與@keyframes dmgFloat)，只有受傷(血量減少)會出現，治療目前不會觸發',
    '（衝刺移動效果本次先延後，待MOMO決定要哪種做法再處理）',
  ]},
  { version:'v0.36', date:'2026/09/26', notes:[
    '【修正】v0.35新增角色小圖時，幫.unit-chip加了overflow:hidden(原意是想裁切圖片邊緣)，結果連帶把定位在格子邊界外一點的.status-badge/.unit-hp、以及定位在格子上方的.bubble(技能施放時的對話框)也一起裁掉了，造成施放技能時的對話框消失。這次拿掉該overflow:hidden，改用z-index排順序(status-badge/unit-hp設z-index:2，維持在角色圖上面；bubble原本就有z-index:5不受影響)',
    '【角色小圖放大】改成絕對定位置中、放大到145%並允許超出.unit-chip範圍顯示(MOMO確認可以超出格子)，角色在棋盤上會更明顯；因為超出範圍顯示，相鄰格子的角色圖有機會互相輕微重疊，重疊時後渲染的(y、x較大者)會蓋在上面，屬於預期內的視覺效果',
  ]},
  { version:'v0.35', date:'2026/09/26', notes:[
    '【戰場12x4→12x12】棋盤放大成正方形(CSS改用aspect-ratio隨容器寬度縮放，不再是固定44px列高)；原本散落在renderGrid()/computeValidCells()/laserArea()/squareArea()/anchorCellCandidates()/敵方AI移動判斷等7處的寫死「4」「12」邊界，統一改吃新增的BOARD_COLS/BOARD_ROWS常數，之後棋盤尺寸要再調只需要改這裡',
    '【開戰站位改為固定座標】我方4人固定站(2,3)(3,4)(2,4)(3,3)、敵方鏡射站(8,3)(9,4)(8,4)(9,3)，皆為MOMO指定值。目前是依上場/生成順序對應，不是綁定特定角色/敵人一定站哪格；敵人數量不足4隻時只用前N格，超過4隻(目前戰鬥設定裡最多的是毀滅者4隻，剛好吃滿)沒有對應站位，先留簡單規則+程式碼註解，之後有需要再改',
    '【常駐UI icon化＋overlay】行動面板／戰報／單位數值狀態，三者原本常駐佔用戰場下方版面，這次改成三顆icon(左下/右下/右上)，點擊後以現有.modal-overlay樣式展開(跟版本紀錄面板同一套元件)。行動面板另外接了完整的開合流程：輪到我方單位自動彈出→選定移動/技能/道具/檢查/脫逃其中一項自動收合(讓網格解鎖進入選目標狀態)→動作完成後若還有名額沒用完自動重新彈出→玩家也能隨時手動點icon切換；面板開著時網格點擊(格子/單位)會鎖定，避免跟面板誤觸重疊。新增battle.actionPanelOpen旗標統一控制這整組狀態',
    '【修正回合數卡在第一回合的bug】根因：「第X回合」文字只在renderBattle()首次建立畫面時寫死一次，battle.round雖然在advanceOneSlot()有正確遞增，但沒有任何地方把新數字寫回畫面。改成在renderOrderRow()(每次換人/回合推進都會呼叫)裡同步更新對應的#roundLabel文字',
    '【角色戰場小圖】新增CHIP_MAP，四位主角(daren/sete/guran/charlotte)的unit-chip改用MOMO提供的去背128x128 PNG小圖(assets/portraits/{id}_chip.png)疊在原本的陣營色塊上，HP條/buff-debuff狀態標記維持疊加在最上層不受影響；查無圖片對應的單位(目前所有敵人)照舊退回文字姓名縮寫，不受影響',
    '測試方式：node --check驗證整份主程式語法無誤；比對修改前後diff逐段檢查BOARD_COLS/BOARD_ROWS替換無遺漏、所有getElementById參照的id都能在畫面裡找到對應元素、無重複id。尚未實機跑過完整UI點擊流程(開場自動彈出→選技能收合→選目標→動作完成後重新彈出這一輪操作，以及讀舊存檔相容性)，建議MOMO實機測試時多留意，尤其是行動面板反覆開合幾輪之後網格鎖定/解鎖有沒有卡住的情況',
  ]},
  { version:'v0.34', date:'2026/09/24', notes:[
    '【狀態抵抗系統上線】STATUS_DB新增category(cc控制/dot持續傷害)與resistStat欄位，新增rollStatusSuccess()：帶resistStat的狀態才需要判定(技能successValue + 亂數5~100 > 目標對應抵抗值(toughness/reflex/will)才成功)，沒有resistStat的既有buff/debuff(guard/song_buff/curse_verse的pdef debuff等)維持必然成功，行為完全不變。開工前MOMO確認：TOU/REF/WIL目前全員都是0，純測試佔位，之後有非0數值才會真的擋下來',
    '【分段技能(stages)】新增技能可以拆成多個stage，各自獨立指定target(self打自己/enemy走技能targets清單)與type(damage/status)，用來支援「打自己+打對方+附加狀態」這種同一技能混合多種效果/多種對象的情境。傷害計算抽成獨立的dealDamage()函式供新舊兩條路徑共用(新增fixed欄位：固定傷害不經ATK/DEF公式，目前只有自傷情境會用，這是開工前的假設而非MOMO明確確認過的設計，之後如需調整很好改)；狀態套用抽成applyStatusStage()同樣兩邊共用',
    '【重擊/詛咒之詩/痛苦燃燒/光明神威(新增)】重擊、痛苦燃燒改寫成stages(保留原本傷害數值，各自加一段附加狀態：暈眩/painBurnDot持續燒傷)；詛咒之詩改寫成stages並保留原本curseDebuff(pdef-4)，額外加一段附加束縛(這段是假設，MOMO還沒明確確認詛咒之詩要不要保留原本debuff效果，之後想拿掉很好改)；新增光明神威(AOE2x2/射程3/弱光明傷害+附加恐懼)，數值皆為MOMO指示的佔位值，尚未配給任何角色使用',
    '【回合流程接上CC/DOT】startActorTurn()新增：暈眩/恐懼鎖住整回合三個行動名額(movePts/skillUsed/interactUsed)，束縛只鎖movePts；endActorTurn()把「換槽位」抽成advanceOneSlot()並改用while迴圈往下跳過被暈眩/恐懼鎖住的行動者(不遞迴呼叫endActorTurn()本身，避免maybeRunEnemyTurn()的setTimeout被重複觸發、敵人AI跑兩次的風險)；DOT扣血邏輯接在同一個「回合結束」時機點，跟現有的buff/debuff到期遞減共用同一段迴圈。已知簡化：恐懼原本設計是「先隨機移動再跳過」，這次先簡化成跟暈眩一樣直接跳過整回合，隨機移動邏輯之後想做再另外接',
    '【狀態圖示】戰場單位頭像的▲(buff)/▼(debuff)標記之外，新增⊘(橘紅)代表暈眩/束縛/恐懼/DOT這類「特殊狀態」，避免CC/DOT的value若為0被誤判成金色▲buff；目前四種狀態共用同一個符號，還沒細分',
    '【AI/UI連動修正】分段技能(stages)沒有頂層power/effect，找出3處原本直接讀d.power/d.dmgType/d.effect的地方(技能卡摘要文字skillSummaryText、AI傷害估算scoreTarget、AI判斷debuff是否已生效needsCast)，新增primaryDamageStage()/primaryStatusStage()兩個小工具函式取代直接讀取，讓這幾個技能的卡片說明、AI選怪評分、AI避免重複施放debuff都能正常運作，不會出現undefined/NaN',
    '測試方式：node --check驗證整份主程式語法無誤；另外把rollStatusSuccess()/dealDamage()等新函式獨立抽出寫了6組隔離邏輯測試(抵抗值0必成功/抵抗值超過成功值+100必失敗/沒有resistStat的狀態必然成功/一般傷害公式/fixed自傷不吃防禦/DOT單次扣血)，全數通過；還沒跑完整的jsdom UI點擊流程(開戰→選重擊/詛咒之詩/痛苦燃燒實際點一輪)，建議MOMO實機測試時多留意',
  ]},
  { version:'v0.33', date:'2026/09/14', notes:[
    '【修正跨單位參照失效的根因bug】MOMO實測回報：護甲裝置不論怎麼打，左手都沒有修復；護甲破壞後本體防禦依然非常高。根因：startBattle()會用Object.assign({},e,{...})把enemies()回傳的每個單位複製成新物件，這一步會讓v0.32裡「core.armorUnit/lhand.repairTarget直接存物件參照」全部變成指向複製前舊物件的陳舊參照——舊物件的hp永遠不會變，所以護甲的condition/forceHealCondition永遠讀到最初的滿血值。修法：改成存armorUnitId/repairTargetId(字串id，複製時不會失效)，evaluatePassiveCondition()與decideEnemyAction()的forceHealCondition分支都改成即時用allUnits().find(id比對)解析，不再直接讀物件參照。這是通用bug，任何未來的跨單位參照設計都要用同樣的id查詢模式，不能存物件參照',
    '【測試用：待命技能】新增standby技能(無實際效果，純粹讓沒有實戰技能的生物在輪到回合時於戰報留下紀錄)，掛給毀滅者本體/護甲裝置，方便確認AI迴圈真的有正常輪到它們',
    '【測試用：單位數值檢視面板】側邊欄新增「顯示/關閉 單位數值」按鈕，開啟後列出戰場所有單位目前的即時數值(effectiveStat()結果，含被動/buff疊加後)、技能清單、被動清單(標示每個被動目前生效中/未生效，方便debug條件判斷對不對)，戰鬥中每次畫面更新都會跟著即時重繪',
  ]},
  { version:'v0.32', date:'2026/09/14', notes:[
    '【毀滅者實際資料+新章節】新增第六章(測試用·毀滅者)：四部位獨立敵人單位(destroyer_core/armor/rhand/lhand)，本體防禦靠新增的armor_guard被動(跨單位condition，讀取護甲裝置的hp)連動，左手新增forceHealCondition機制(重用PASSIVE_DB的condition schema，決定性地在護甲破損(hp<=DESTROYER_ARMOR_THRESHOLD)時強制修復、沒破損時走一般攻擊分支)，decideEnemyAction()新增對應分支。三個新技能(destroyer_slam/backhand/repair)+DESTROYER_ARMOR_THRESHOLD常數。跨單位參照(armorUnit/repairTarget)無法寫在模板裡，改在destroyer_solo的enemies()裡於實例產生後手動接線。所有數值為佔位，未做平衡調整',
    '【daren首個真實milestone】新增劍士(daren)的狂暴節點(level:2, grantPassive→berserk)，是被動系統的第一筆實際掛載資料。註記：角色等級系統目前仍是「尚未接上戰鬥數值計算/UI」的佔位欄位(level固定為1)，這個milestone目前無法在遊戲內實際被觸發看到效果，要等等級系統本身做出來才能真正驗證——這次先確保資料格式跟被動系統的串接邏輯是對的',
  ]},
  { version:'v0.31', date:'2026/09/14', notes:[
    '【被動能力系統上線(PASSIVE_DB／情境四)】effectiveStat()新增被動加成層，疊在STATUS_DB之後。跟STATUS_DB同樣的stat/value寫法，差別是沒有到期時間，多一個condition欄位，每次都即時判斷、不快取定值。condition用target欄位(\'self\'/\'linked\')統一處理自身條件(例如狂暴：HP比例<0.5)跟跨單位條件(例如本體防禦看另一個單位死活)，底層比較邏輯共用。getUnitPassiveIds()取得單位目前擁有的被動：敵人直接讀模板上的passives陣列，玩家角色透過ally.ref即時依目前等級篩MILESTONE_DB裡grantPassive節點，不需要另外存一份「已解鎖」清單。本版只建立系統本身+2筆示範資料(iron_body/berserk)，尚未實際掛到guran等角色或毀滅者身上，等各自的資料內容定案後再接',
  ]},
  { version:'v0.30', date:'2026/09/14', notes:[
    '【敵人AI新增最後手段治療】decideEnemyAction()第1步的治療判斷是門檻式(HP比例≤50%)+機率式(40%)雙重篩選，原意是避免AI濫用治療技能；但當buff/debuff已經全部生效(v0.29修正後)、又沒有攻擊技能可用時，領隊人偶即使受傷、即使super_repair完全免消耗免冷卻，也可能單純因為40%機率沒中就整回合pass、什麼都不做。新增第4.5步：攻擊判斷之後、移動判斷之前，如果前面都沒有決定要做什麼，且有治療技能的目標未滿血，這時候不再看門檻/機率，直接使用——只在真的沒有其他事可做時才會走到這裡，不影響領隊人偶原本「先ally_hack→再enemy_hack」的既有測試行為',

const DAMAGE_TYPES = ['敲擊','劈砍','穿刺','火焰','閃電','冷凍','聲波','治療','無傷害'];

/* v0.34新增：分段技能(d.stages)沒有頂層dmgType/power，抓stages裡第一個damage段代打——
   給skillSummaryText()跟AI的scoreTarget()這種只需要「一個代表性數值」的地方共用，
   沒有stages的技能直接回傳d本身，跟v0.33以前完全一樣，零影響 */
function primaryDamageStage(d){
  if(!d.stages) return d;
  return d.stages.find(s=> s.type === 'damage') || d;
}
/* v0.34新增：同理，分段技能沒有頂層effect，抓stages裡第一個status段代表——
   給skillSummaryText()的buff/debuff摘要文字、跟AI判斷「這個debuff是否已經生效中」用，
   兩處都只需要一個代表性的狀態key，不用列出全部段落 */
function primaryStatusStage(d){
  if(!d.stages) return d;
  return d.stages.find(s=> s.type === 'status') || d;
}

/* 依技能資料自動組出一句效果摘要文字（例如「劈砍 18・冷卻3回合・消耗10」），
   不用每個技能手動寫desc，資料改了摘要就自動跟著變 */
function skillSummaryText(d){
  let parts = [];
  if(d.type === 'attack'){
    // v0.28修正：dmgType改成數字碼後這裡忘了查表，原本會直接顯示數字(例如"0 10")，改成查DAMAGE_TYPE_DB還原文字
    // v0.34修正：分段技能改抓primaryDamageStage()代表的那一段，不然會顯示"undefined"
    const pd = primaryDamageStage(d);
    const catInfo = DAMAGE_TYPE_DB[pd.dmgType];
    parts.push(`${catInfo ? catInfo.name : '傷害'} ${pd.power}${d.stages ? '(＋附加效果)' : ''}`);
  } else if(d.type === 'heal'){
    parts.push(`治療 ${d.power}`);
  } else if(d.type === 'buff' || d.type === 'debuff'){
    // v0.28新增：直接寫出影響哪個屬性、漲跌多少、持續幾回合，取代原本的「功能性技能」空泛字樣
    // v0.34修正：分段技能(如詛咒之詩) 改抓primaryStatusStage()代表的那一段來顯示，
    // 有多段(curseDebuff+bind)時額外註明「(＋附加效果)」，避免看起來只有一種效果
    const ps = primaryStatusStage(d);
    const sdef = STATUS_DB[ps.effect];
    const stats = sdef ? (Array.isArray(sdef.stat) ? sdef.stat : [sdef.stat]) : [];
    const labels = stats.map(s=> STAT_LABELS[s] || s).join('/');
    const effectValue = ps.effectValue, statusDuration = ps.statusDuration;
    if(sdef && (sdef.category === 'cc' || sdef.category === 'dot')){
      parts.push(`附加${sdef.name}，持續${statusDuration}回合${d.stages && d.stages.length>1 ? '(＋附加效果)' : ''}`);
    } else {
      const sign = (effectValue||0) >= 0 ? '+' : '';
      parts.push(`${labels || '狀態'}${sign}${effectValue}，持續${statusDuration}回合${d.stages && d.stages.length>1 ? '(＋附加效果)' : ''}`);
    }
  } else if(d.type === 'utility' && d.effect === 'resetCooldowns'){
    parts.push('重置自身所有技能冷卻');
  } else {
    parts.push('功能性技能');
  }
  if(d.cd) parts.push(`冷卻${d.cd}回合`);
  if(d.cost && d.cost.res) parts.push(`消耗${d.cost.res}`);
  return parts.join(' · ');
}

/* 依裝備資料自動組出屬性摘要文字（例如「+5 鎧甲值, +1 防禦」），
   跟 skillSummaryText 同一套邏輯：不用手動寫lore，資料改了摘要就自動跟著變。
   EQUIP_DB / TREASURY_DB 裡原本手寫的 lore 欄位保留下來當作「故事敘述」，
   之後做 codex 圖鑑時可以直接拿 .lore 顯示，但一般裝備欄/商店/倉庫一律改用這個函式。
   想新增可以顯示的屬性種類，直接在 STAT_LABELS 裡加一行即可。 */
// v0.26：atk/def/armor改名，STAT_LABELS要跟著換，不然equipSummaryText()查不到欄位、
// 所有裝備的摘要文字都會變成「（無屬性加成）」——這裡順便把新增的元素/神秘系欄位也一起補上標籤
const STAT_LABELS = {
  patk:'物理攻擊', pdef:'物理防禦', pres:'物理減免',
  eatk:'元素攻擊', edef:'元素防禦', eres:'元素減免',
  matk:'神秘攻擊', mdef:'神秘防禦', mres:'神秘減免',
  spd:'速度', res:'資源上限',
};
/* 【v0.25】卡片上的效果說明文字硬截斷：CSS的ellipsis在grid/flex巢狀結構裡有時會失效（子項預設min-width:auto，
   內容撐爆容器寬度），這裡直接在字串層級砍掉超出的部分當雙重保險，不管CSS有沒有生效，卡片版面都不會被拉長。
   maxLen預設14個字，想改長度直接調這個數字就好；說明浮動視窗顯示完整文字時不要套用這個函式 */
function truncateText(str, maxLen=14){
  if(!str) return str;
  return str.length>maxLen ? str.slice(0,maxLen)+'…' : str;
}
function equipSummaryText(d){
  const parts = Object.keys(STAT_LABELS)
    .filter(k => d[k])
    .map(k => `+${d[k]} ${STAT_LABELS[k]}`);
  return parts.length ? parts.join(', ') : '（無屬性加成）';
}

/* 依道具資料自動組出效果摘要文字（例如「恢復30點HP」），
   跟 skillSummaryText / equipSummaryText 同一套邏輯：不用手動寫lore。
   想讓道具支援新效果（例如解除異常、增益等），直接在這裡加一個 if 判斷即可。 */
function itemSummaryText(d){
  let parts = [];
  if(d.heal) parts.push(`恢復${d.heal}點HP`);
  return parts.length ? parts.join(', ') : '（無效果）';
}

/* ============================================================
   【range 系統改版：shape enum 換成 reach + shape 兩參數，見 range_sim.html 模擬器與 dev4_design_todo.md 第十二節】
   - reach（number）：切比雪夫距離上限，決定「這個技能可以把錨點放在哪」
     reach:0 代表唯一合法錨點就是施放者自己，UI上會直接自動觸發，不用玩家再點一次
   - shape（number | 'all' | 'laser'）：以錨點為中心展開的命中範圍
     N（正整數）= N×N方塊，N=1即單體技能，N為偶數時往右下多蓋一格
     'all'      = 不看reach，直接套用在 targetSide 篩選出的「全部」單位身上（原本的 ally_all）
     'laser'    = 沿方向直線打到底（尚未實作，UI互動方式待設計，見 dev4_design_todo.md 第十節「尚待解決」；
                  目前 SKILL_DB 沒有技能使用這個值，資料格式先預留）
   - 錨點合法性規則：shape===1（單體）時，錨點必須落在有合法目標（matchesSide通過）的格子上才算數，
     所以由 onUnitClick 直接點單位判定；shape>1（AOE）允許空放，範圍內有沒有目標交給執行時的 matchesSide 判定，
     所以由 onCellClick 點格子判定，錨點只受 reach 限制、不要求該格有人
   - targetSide：不變，純粹決定套用在哪個陣營，相對於施放者自身陣營計算，敵我雙方共用同一套判斷：
     'enemy' = 施放者的敵對陣營　'ally' = 施放者的同陣營　'all' = 不分敵我　'self' = 僅施放者自己
   - reach 數值目前為暫定值（尤其 REACH_UNLIMITED 用來保留舊版「不限位置」行為，例如重擊/火球原本就能點全場任意格），
     之後平衡測試時可能會依角色設計調整（例如重擊改成真正的近戰限定射程），不影響本次架構
============================================================ */
const REACH_UNLIMITED = 99; // 全場任一格都在範圍內（12x4棋盤最大切比雪夫距離遠小於這個值），僅為保留舊版「不限位置」行為的權宜值

/* ============================================================
   【施放確認階段】不是每個技能單獨設定的欄位，而是由 shape 自動決定要走幾段確認流程，
   目前存在的3種：

   階段A（0次確認，按下即發動）：目前沒有任何技能在用。
     v0.13以前 self（reach:0）跟 shape:'all' 是這樣（選取後自動觸發），
     v0.14拿掉了，因為容易手滑誤觸、也沒有反悔機會。架構上還是可以做，
     只要在renderSidePanel()技能按鈕的onclick裡跳過「只選取」那段、直接showFullscreenFX+executeSkill即可，
     但目前刻意不用，全部技能都至少要求1次確認。

   階段B（1次確認，選取後立即預覽紅底，點紅底即發動）：shape===1（單體/自身）、shape==='all'（全體）、shape==='laser'。
     這幾種的共通點是「選了技能的當下，候選目標就已經是確定的」，不需要額外的「選範圍」步驟，
     紅底在點技能的那一刻就會立即顯示（不用等玩家做任何動作）。
     - shape===1：紅底顯示在 singleTargetCandidates() 篩出的unit-chip上（可能是敵人/隊友/自己）。
       如果選取後棋盤上完全沒有紅底，通常代表「目前沒有合法目標在範圍內」（例如相鄰系技能reach:1，
       但沒有敵人真的站在自己旁邊），這是正常情況、不是bug——移動靠近目標後重新選取技能，紅底就會出現。
     - shape==='all'：紅底顯示在所有matchesSide()篩出的unit-chip上，另外整場棋盤標黃（純視覺提示「這是全場技能」）。
     - shape==='laser'：紅底/黃底顯示在8條方向線的沿途格子上（見computeSkillHighlights），
       因為reach通常很大（例如聖光reach:12），幾乎每次選取都會立刻看到紅底，這是reach數值造成的差異，
       不是shape===1跟shape==='laser'的確認邏輯不同——兩者都是「選取當下就預覽，點一次confirm」。

   階段C（2次確認，先選範圍/方向再對範圍內容確認發動）：shape>1的AOE技能（例如fireball）。
     第一次確認＝選定/改選錨點（點黃底候選格，棋盤即時預覽該錨點展開的N×N紅底範圍）；
     第二次確認＝點紅底範圍內任一格才真正發動。改點別的黃底格會直接重新預覽新錨點，不用先取消。
     這是唯一需要「先看範圍長怎樣、才決定要不要打」的類型，因為AOE的錨點是連續空間、不像laser只有8個離散方向可選。

   之後如果想讓某個技能刻意套用不同階段（例如想讓某個技能維持階段A秒發），
   目前沒有專屬欄位可以直接標記，要靠shape間接決定——真的有需要時再討論是否要加一個獨立的confirmStage欄位覆寫這個預設對應規則。
============================================================ */

   - 這一版只做「固定回合數」，被動(情境四)留給之後milestone的grantPassive一起做

const STATUS_DB = {

  // v0.34新增：狀態抵抗系統。跟上面的數值型buff/debuff不同，這四個沒有stat欄位(不走effectiveStat疊加)，
  // 改用category標記走另一套邏輯：category:'cc' → startActorTurn()鎖三旗標名額；category:'dot' → endActorTurn()回合結束扣血。
  // resistStat指向角色/敵人身上的抵抗欄位(toughness/reflex/will，目前全員都是0，純測試佔位，之後有非0數值才會真的擋下來)。
  stun: { name:'暈眩', category:'cc', ccType:'stun', resistStat:'toughness' },
  bind: { name:'束縛', category:'cc', ccType:'bind', resistStat:'reflex' },
  fear: { name:'恐懼', category:'cc', ccType:'fear', resistStat:'will' },
  painBurnDot: { name:'痛苦燃燒', category:'dot', resistStat:'toughness', dotDamage:5 },
};

/* 施加狀態：value/duration由呼叫端（executeSkill）從技能資料帶進來，不查STATUS_DB要用多少 */
function applyStatus(target, statusKey, value, duration){
  const def = STATUS_DB[statusKey];
  if(!def) return;
  target.statuses = target.statuses || [];
  const existing = target.statuses.find(s=> s.key === statusKey);
  if(existing){
    // 目前只有refresh規則：新的數值/時間直接蓋掉舊的，不疊加
    existing.value = value;
    existing.duration.remaining = duration;
  } else {
    target.statuses.push({ key:statusKey, value, duration:{type:'turns', remaining:duration} });
  }
}

/* v0.34新增：狀態命中/抵抗判定。沒有resistStat的狀態(現有guard/song_buff/curse_verse等數值型buff/debuff)
   完全不受影響，維持必然成功；只有帶resistStat的新狀態(暈眩/束縛/恐懼/DOT)才會真的骰：
   技能/該段(stage)的successValue + 亂數(5~100) > 目標對應抵抗值 才算成功。
   MOMO開工前確認：目前TOU/REF/WIL(toughness/reflex/will)全員數值都是0，純測試佔位，
   所以現階段所有帶resistStat的狀態一樣是必定成功，等之後角色/敵人開始有非0抵抗值才會真的擋下來。 */
function rollStatusSuccess(stageOrSkillDef, target){
  const sdef = STATUS_DB[stageOrSkillDef.effect];
  if(!sdef || !sdef.resistStat) return true;
  const roll = (stageOrSkillDef.successValue || 0) + (5 + Math.floor(Math.random()*96));
  return roll > (target[sdef.resistStat] || 0);
}

/* 讀取「含buff/debuff後」的實際數值，取代原本直接讀 unit[statKey]。
   之後被動(情境四)接上時，這裡會再加一段讀角色被動清單的邏輯，現在先只處理statuses陣列。 */
function effectiveStat(unit, statKey){
  let val = unit[statKey] || 0;
  (unit.statuses || []).forEach(s=>{
    const def = STATUS_DB[s.key];
    if(!def) return;
    const stats = Array.isArray(def.stat) ? def.stat : [def.stat];
    if(stats.includes(statKey)) val += s.value;
  });
  // v0.31新增：被動能力(PASSIVE_DB)疊加——放在STATUS_DB之後，同樣是加總；
  // condition每次都即時判斷，不快取，狀態一變（例如HP回升）下次算就自動反映
  getUnitPassiveIds(unit).forEach(pid=>{
    const def = PASSIVE_DB[pid];
    if(!def) return;
    const stats = Array.isArray(def.stat) ? def.stat : [def.stat];
    if(stats.includes(statKey) && evaluatePassiveCondition(unit, def.condition)) val += def.value;
  });
  return val;
}
/* 判斷某單位目前是否掛著buff／debuff（給戰場▲▼標記用），任一狀態的value>=0算buff，<0算debuff，
   同一單位身上buff/debuff可能同時存在（各自來源不同狀態），兩個符號都要顯示 */
function unitStatusFlags(unit){
  let hasBuff = false, hasDebuff = false, hasSpecial = false;
  (unit.statuses || []).forEach(s=>{
    const def = STATUS_DB[s.key];
    // v0.34新增：暈眩/束縛/恐懼/DOT沒有數值意義的value，不該被硬塞進▲▼判斷(之前s.value若給0會被誤判成▲金色buff)，
    // 改用category標記獨立分流成一個新符號
    if(def && (def.category === 'cc' || def.category === 'dot')) hasSpecial = true;
    else if(s.value >= 0) hasBuff = true;
    else hasDebuff = true;
  });
  return { hasBuff, hasDebuff, hasSpecial };
}
/* v0.29新增：判斷某單位身上是否已經掛著某個status且尚未到期——給AI用，
   避免重複施放已生效的buff/debuff（見decideEnemyAction第3步）。
   statusKey為空（技能沒有effect欄位）時一律回傳false，維持原本行為不跳過。 */
function statusAlreadyActive(target, statusKey){
  if(!statusKey) return false;
  return (target.statuses || []).some(s => s.key === statusKey && s.duration && s.duration.remaining > 0);
}

/* ============================================================
   PASSIVE_DB（v0.31新增，被動能力系統／情境四）
   - 跟STATUS_DB同樣的stat/value疊加寫法，差別是：沒有到期時間(永久生效)，
     多一個condition欄位——effectiveStat()每次都即時判斷condition成不成立，
     不是「觸發當下定值就不再變」，例如狂暴的HP門檻，回血後加成會立刻消失
   - condition用target欄位統一處理「自身」跟「跨單位」兩種情況，底層比較邏輯共用：
       target:'self'   → 讀單位自己身上的stat
       target:'linked' → 先讀unit[linkKey]拿到參照的另一個單位，再讀那個單位的stat
     （linkKey怎麼被接上是各自場景的事，例如毀滅者本體的armorUnit要在建立戰鬥時手動接好）
   - stat支援'hpRatio'這個虛擬值(=hp/maxHp)，其餘直接讀單位對應欄位
   - 下面兩筆是設計階段的示範／預留條目，還沒有milestone或敵人實際掛上去，
     之後guran/daren/sete/charlotte的grantPassive節點、或毀滅者部位的passives欄位，
     直接指到這裡的key即可
============================================================ */
const PASSIVE_DB = {
  iron_body: { name:'鋼鐵之軀', stat:'pdef', value:20 }, // 無condition = 永久生效
  berserk:   { name:'狂暴', stat:'patk', value:30,
    condition:{ target:'self', stat:'hpRatio', op:'<', value:0.5 } },
  // v0.32新增：毀滅者本體的防禦加成——跨單位條件的實際案例，armorUnitId在battle建立時手動接好
  armor_guard: { name:'護甲防禦', stat:['pdef','edef','mdef'], value:100,
    condition:{ target:'linked', linkKey:'armorUnitId', stat:'hp', op:'>', value:0.5 } },
};
// v0.32新增：護甲裝置閾值——本體防禦加成、左手是否開始維修，兩處都即時比較HP vs這個值，
// 不用broken旗標。目前定案值0，之後想做「搖搖欲墜」式提前失能，改成正值(如maxHp*0.2)即可
const DESTROYER_ARMOR_THRESHOLD = 0;
function comparePassiveOp(a, op, b){
  switch(op){
    case '<': return a < b;
    case '<=': return a <= b;
    case '>': return a > b;
    case '>=': return a >= b;
    case '==': return a === b;
    default: return false;
  }
}
function readPassiveStat(unit, stat){
  if(stat === 'hpRatio') return unit.maxHp ? unit.hp / unit.maxHp : 0;
  return unit[stat] || 0;
}
function evaluatePassiveCondition(unit, condition){
  if(!condition) return true; // 沒有condition欄位 = 永久生效
  if(condition.target === 'linked'){
    // v0.33修正：linkKey存的是「參照單位的id」而不是物件本身直接參照——
    // 因為startBattle()會用Object.assign({}, e, {...})把enemies()產生的每個單位複製成新物件，
    // 複製後任何「A單位身上存B單位的物件參照」都會變成指向複製前的舊物件(陳舊參照，B的hp再怎麼變化A都讀不到最新值)。
    // id是字串，複製時會被正確帶過去，所以改成每次都用allUnits()即時查id，不會有這個問題
    const linkedId = unit[condition.linkKey];
    const linked = linkedId != null ? allUnits().find(u => u.id === linkedId) : null;
    if(!linked) return false; // 參照的單位id沒設定/戰場上找不到，安全起見視為條件不成立
    return comparePassiveOp(readPassiveStat(linked, condition.stat), condition.op, condition.value);
  }
  return comparePassiveOp(readPassiveStat(unit, condition.stat), condition.op, condition.value);
}
/* 取得某單位目前實際擁有的被動id清單：
   - 敵人（含毀滅者各部位）：直接讀模板上的passives陣列(靜態)
   - 玩家角色：透過ally.ref拿回state.party的角色物件，依目前等級即時篩MILESTONE_DB裡
     type==='grantPassive'且level<=目前等級的節點——不需要另外存一份「已解鎖」清單，
     等級本身就是唯一真相來源，跟前面護甲裝置閾值判斷同一個原則 */
function getUnitPassiveIds(unit){
  if(Array.isArray(unit.passives)) return unit.passives;
  if(unit.ref){
    const list = MILESTONE_DB[unit.ref.id] || [];
    return list.filter(m => m.type === 'grantPassive' && m.level <= unit.ref.level).map(m => m.passiveId);
  }
  return [];
}

/* ============================================================

   makeChar 最後兩個參數：
   - unlockChapter：從第幾章開始，這個角色會出現在「可選名單」裡。
     判斷方式是跟 state.maxChapterReached（玩家目前打贏過的最高章節）比較，
     unlockChapter <= maxChapterReached 就會解鎖。想調整誰何時解鎖，
     直接改這個數字即可，不用動其他程式碼。
   - defaultActive：這個角色資料一開始建立時，是否預設「上場中」
     （只有已解鎖的角色這個值才有意義；上場名單上限固定4人）
============================================================ */
function makeChar(id, name, role, hp, patk, pdef, res, resMax, skills, unlockChapter, defaultActive){
  return {
    id, name, role, side:'ally',
    // ── v0.26大改版：atk/def改名patk/pdef，armor改名pres（三者統稱「物理系」三連），
    //    另外新增元素系(eatk/edef/eres)、神秘系(matk/mdef/mres)，現階段沒有裝備/角色天生加值，

    hp, maxHp:hp, patk, pdef, spd:10, pres:0,
    eatk:0, edef:0, eres:0,
    matk:0, mdef:0, mres:0,
    // sanity(精神值)、強韌/反應/意志：先純佔位欄位，不接任何機制（見拜亞基/milestone討論）
    sanity:0, maxSanity:20, toughness:0, reflex:0, will:0,

    skills, // array of skill keys, up to 8 (null = empty slot)
    equipment:{ head:null, chest:null, hands:null, waist:null, feet:null, acc1:null, acc2:null, acc3:null },
    items:['potion','potion','bandage', null,null,null,null,null],
    alive:true, x:-1, y:-1,

    active: !!defaultActive,
    // ── 人物等級／屬性鍛鍊（新，設計文件第十六節）──────────────────
    // 尚未接上戰鬥數值計算／UI，先建立資料欄位，見 LEVEL_GROWTH_TABLE 與

    level: 1,

}

     不用改這個判斷函式本身
   目前 EQUIP_DB / SKILL_DB / ITEM_DB 尚未有任何一筆資料填上 charReq
   （哪些要鎖，待逐一設計時決定——見設計文件待辦清單第4項）
============================================================ */
function canUse(itemOrSkill, charId){
  if(!itemOrSkill || !itemOrSkill.charReq) return true; // 無欄位 = 通用
  const req = Array.isArray(itemOrSkill.charReq) ? itemOrSkill.charReq : [itemOrSkill.charReq];
  return req.includes(charId);
}

     每5級一次的里程碑掛勾點（目前留空）
============================================================ */
const LEVEL_GROWTH_TABLE = (()=>{
  // 暫定公式：先快後慢，Lv.20封頂。之後想要精確數值表，直接把這行改成寫死陣列即可
  const table = [0]; // index 0 不使用，index i = 升到 Lv.i 需要的經驗
  for(let lv=1; lv<=20; lv++){
    table.push(Math.round(50 * lv * Math.pow(lv, 0.6)));
  }
  return table;
})();

/* ============================================================
   個體實例模型（設計文件第二節／第十六節定案，Stage 2 實作）
   - state.equipInstances / skillInstances / itemInstances：
     { [iid]: {key, level, status} }，status: 'unowned' | 'owned' | 'equipped'
   - c.equipment[slot] / c.skills[i] / c.items[i] 現在存的是 iid，不是key字串
   - 商店庫存＝篩選 status==='unowned' 的實例；倉庫＝status==='owned'；
     角色身上＝status==='equipped'
   - 起始角色配裝（makeChar給的原始key字串）與商店庫存是分開各自建立的
     實例，不互相共用同一份（起始配裝不會佔用商店的庫存數量）
   - 目前每個key先各建1個「unowned」商店庫存（暫定數量，見設計文件
     待辦清單第1項，之後要改成逐項設計的正式數量，直接改 seedInstances()
     裡的迴圈次數即可）
============================================================ */
function makeIid(st, prefix){ st.iidCounter = (st.iidCounter||0) + 1; return prefix+'_'+st.iidCounter; }

/* v0.23新增：想讓某個key一開始就有多份庫存（例如同一把火球要備4份給玩家買齊、
   湊出4種不同強化等級），在這裡加一行 key:數量 即可；沒列到的key預設維持1份，不用逐一補。
   範例：SKILL_STOCK_OVERRIDE = { fireball: 4 } 代表商店一開始有4份「火球」技能書庫存，
   買了幾份、每份卸下後各自的等級都會分開記錄，因為每一份都是各自獨立的iid實例，不是共用一份數量疊加 */
const EQUIP_STOCK_OVERRIDE = {};
const SKILL_STOCK_OVERRIDE = {};
const ITEM_STOCK_OVERRIDE = {};

function seedInstances(st){
  // 起始角色配裝：把 makeChar 給的原始key字串轉成「已裝備」的個體實例
  st.party.forEach(c=>{
    c.skills = c.skills.map(key=>{
      if(!key) return null;
      const iid = makeIid(st,'sk');
      st.skillInstances[iid] = { key, level:1, status:'equipped' };
      return iid;
    });
    c.items = c.items.map(key=>{
      if(!key) return null;
      const iid = makeIid(st,'it');
      st.itemInstances[iid] = { key, level:1, status:'equipped' };
      return iid;
    });
    // c.equipment 起始全部是null，不用轉換
  });
  // 商店庫存：裝備(含寶物庫)/技能/道具，每個key預設1個unowned實例，除非在上面XXX_STOCK_OVERRIDE裡有另外指定數量
  Object.keys(EQUIP_DB).forEach(key=>{
    const count = EQUIP_STOCK_OVERRIDE[key] || 1;
    for(let i=0;i<count;i++){ const iid = makeIid(st,'eq'); st.equipInstances[iid] = { key, level:1, status:'unowned' }; }
  });
  // v0.26：寶物庫已併入EQUIP_DB，上面那個迴圈已經涵蓋，這裡不用再另外跑一次
  SKILL_SHOP_KEYS.forEach(key=>{
    const count = SKILL_STOCK_OVERRIDE[key] || 1;
    for(let i=0;i<count;i++){ const iid = makeIid(st,'sk'); st.skillInstances[iid] = { key, level:1, status:'unowned' }; }
  });
  Object.keys(ITEM_DB).forEach(key=>{
    const count = ITEM_STOCK_OVERRIDE[key] || 1;
    for(let i=0;i<count;i++){ const iid = makeIid(st,'it'); st.itemInstances[iid] = { key, level:1, status:'unowned' }; }
  });
}

/* ============================================================
   裝備／技能強化（設計文件第四節／待辦清單第22項）
   - Lv.5封頂，花費/效果全部先隨意填一個簡單公式，MOMO確認之後可以隨時調整
   - 效果暫定：每升1級，裝備身上「有的那幾個數值欄位」(atk/def/armor/spd)各自+1；
     技能每升1級，power/heal 欄位 +3（攻擊技能與治療技能共用同一個power欄位，
     所以兩者都吃得到，見 executeSkill()）
   - 花費暫定：金幣/水晶 × 下一級數，之後想換成正式的每級專屬數值表，
     直接把這兩個函式內容換掉即可，呼叫端不用改
============================================================ */
const EQUIP_UPGRADE_CAP = 5;
const SKILL_UPGRADE_CAP = 5;
function equipUpgradeCost(nextLevel){ return 20 * nextLevel; } // 金幣，暫定
function skillUpgradeCost(nextLevel){ return 20 * nextLevel; } // 水晶，暫定
const EQUIP_LEVEL_STAT_BONUS_PER_LEVEL = 1; // 裝備每級各數值欄位+1，暫定
const SKILL_LEVEL_POWER_BONUS_PER_LEVEL = 3; // 技能每級power/heal+3，暫定
function skillLevelBonus(actor, key){
  const lvl = (actor.skillLevels && actor.skillLevels[key]) || 1;
  return (lvl - 1) * SKILL_LEVEL_POWER_BONUS_PER_LEVEL;
}

function equipInstOf(iid){ return iid ? state.equipInstances[iid] : null; }
function equipDefOf(iid){ const inst = equipInstOf(iid); return inst ? lookupEquip(inst.key) : null; }
/* 裝備某個數值欄位「含強化等級加成」後的實際數值。沒有這個欄位就回傳0（方便直接加總）。 */
function equipEffectiveStat(iid, statKey){
  const inst = equipInstOf(iid);
  const def = equipDefOf(iid);
  if(!inst || !def || !def[statKey]) return 0;
  return def[statKey] + (inst.level - 1) * EQUIP_LEVEL_STAT_BONUS_PER_LEVEL;
}
function eqTagColor(slot){
  // 裝備部位色票（暫定，之後想改直接調整 :root 裡的 --eq-xxx hex 即可）
  const map = { head:'--eq-head', chest:'--eq-chest', hands:'--eq-hands', waist:'--eq-waist', feet:'--eq-feet', acc:'--eq-acc' };
  return `var(${map[slot] || '--eq-acc'})`;
}
function skillTypeColor(type){
  // 技能/道具共用同一套type色票：attack→敵方紅、heal→我方綠、buff→金(跟▲標記同色)、debuff→紫(跟▼標記同色)
  // v0.28：原本buff/debuff顏色相反(buff紫/debuff金)，這次跟戰場▲▼標記顏色統一，一致才好辨識
  const map = { attack:'var(--enemy)', heal:'var(--ally)', buff:'var(--gold-bright)', debuff:'var(--rarity-purple)' };
  return map[type] || 'var(--border)';
}
function skillInstOf(iid){ return iid ? state.skillInstances[iid] : null; }
function skillDefOf(iid){ const inst = skillInstOf(iid); return inst ? SKILL_DB[inst.key] : null; }
function itemInstOf(iid){ return iid ? state.itemInstances[iid] : null; }

async function loadGame(){
  try{
    const res = await window.storage.get('rpg-p1-save', false);

  }catch(e){}

}

function adventureBattleBlocked(map,x,y,run){return ['wall','forest','cover','door'].includes(adventureTile(map,x,y,run));}

  el.querySelectorAll('[data-map-choice]').forEach(btn=>btn.onclick=()=>{if(adventureState.runs[btn.dataset.mapChoice]?.phase==='encounter')return;adventureState.mapId=btn.dataset.mapChoice;renderAdventure()});
  if(run.phase==='encounter'){
    el.querySelector('#beginAdventureBattle').onclick=()=>startAdventureBattle(map,run);
    el.querySelector('#retreatAdventure').onclick=()=>{run.phase='explore';run.alert=Math.max(0,run.alert-1);run.lastResult='你退回較安全的位置，敵人仍在附近巡邏。';run.selected=null;renderAdventure()};
  }
  renderAdventureActions(map,run);
}
function renderAdventureActions(map,run){
  const wrap=document.getElementById('adventureActions');if(!wrap)return;wrap.innerHTML='';
  if(run.phase==='encounter')return;
  const p=map.points.find(p=>p.id===run.selected);if(!p)return;
  const distance=Math.abs(run.x-p.x)+Math.abs(run.y-p.y);
  const add=(label,action,disabled=false,cls='')=>{const b=document.createElement('button');b.className='btn small '+cls;b.textContent=label;b.disabled=disabled;b.onclick=()=>resolveAdventureAction(map,run,action);wrap.appendChild(b)};
  if(p.action==='door'){
    if(run.doorOpen){add('側門已打開','',true);return;}
    add('嘗試開鎖','pick',distance>1);add('破壞門鎖（警戒+2）','break',distance>1);
  }else{
    const labels={hide:'躲藏檢定',watch:'觀察周圍',search:run.searchDone?'已完成搜索':'翻找物品',knowledge:run.relicTaken?'聖物已取下':'辨認聖物',trigger:'進入警戒區'};
    const done=(p.action==='search'&&run.searchDone)||(p.action==='knowledge'&&run.relicTaken)||(p.action==='trigger'&&run.encounterWon);
    add(distance>1?`靠近後${labels[p.action]||'互動'}`:(labels[p.action]||'執行'),p.action,distance>1||done,p.action==='trigger'?'primary':'');
  }
}
function onAdventureCellClick(x,y,point){
  const map=ADVENTURE_MAPS[adventureState.mapId],run=adventureRun();if(run.phase==='encounter')return;
  if(point){run.selected=point.id;const d=Math.abs(run.x-x)+Math.abs(run.y-y);if(d>1){const step=adventureNextStep(map,run,{x,y});if(step){run.x=step.x;run.y=step.y;run.lastResult=`你向「${point.label}」靠近一步。移至相鄰格後即可互動。`}}renderAdventure();return;}
  if(!adventureWalkable(map,x,y,run)){run.lastResult='此地格被牆壁、樹木或石塊阻擋。';renderAdventure();return;}
  if(Math.abs(run.x-x)+Math.abs(run.y-y)===1){run.x=x;run.y=y;run.selected=null;run.lastResult=adventureNearbyCover(map,x,y)?'你移動到掩體旁。進入戰鬥後此處可降低受到的傷害。':'你沿著道路移動。';}else run.lastResult='每次移動一格，請選擇相鄰且可通行的地格。';renderAdventure();
}
function adventureNextStep(map,run,target){const q=[[run.x,run.y]],prev=new Map([[coordKey(run.x,run.y),null]]);while(q.length){const [x,y]=q.shift();if(x===target.x&&y===target.y)break;for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=coordKey(nx,ny);if(nx<0||nx>=12||ny<0||ny>=12||prev.has(k)||!adventureWalkable(map,nx,ny,run))continue;prev.set(k,[x,y]);q.push([nx,ny])}}let k=coordKey(target.x,target.y);if(!prev.has(k)){let best=null,bestDist=Infinity;for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){const ax=target.x+dx,ay=target.y+dy,ak=coordKey(ax,ay);if(prev.has(ak)&&prev.get(ak)!==undefined){let steps=0,t=ak;while(prev.get(t)){steps++;const [px,py]=prev.get(t);t=coordKey(px,py)}if(steps<bestDist){bestDist=steps;best=[ax,ay]}}}if(!best)return null;k=coordKey(best[0],best[1]);}let path=[];while(prev.get(k)){const [px,py]=prev.get(k);path.push({x:Number(k.split(',')[0]),y:Number(k.split(',')[1])});k=coordKey(px,py)}return path.length?path[path.length-1]:null;}
function raiseAdventureAlert(map,run,amount,message){run.alert=clamp(run.alert+amount,0,3);run.lastResult=message+(run.alert>=3?' 警戒值已滿，敵人現身！':'');if(run.alert>=3)run.phase='encounter';}
function resolveAdventureAction(map,run,action){if(action==='')return;
  const roll=Math.ceil(Math.random()*100);
  if(action==='trigger'){run.phase='encounter';run.lastResult='你進入敵方警戒區，敵人位置已揭露。確認站位後可開始戰鬥。';}
  else if(action==='hide'){if(roll<=72){run.alert=Math.max(0,run.alert-1);run.lastResult='躲藏成功，警戒降低。'}else raiseAdventureAlert(map,run,1,'踩斷枯枝，附近敵人開始警戒。');}
  else if(action==='watch'){run.clue=true;run.lastResult='觀察完成：你看清敵方巡邏方向，地圖上的線索已記錄。';}
  else if(action==='pick'){if(roll<=58){run.doorOpen=true;run.lastResult='開鎖成功，門已安靜打開。'}else raiseAdventureAlert(map,run,1,'開鎖失敗，工具刮過門鎖發出刺耳聲響。');}
  else if(action==='break'){run.doorOpen=true;raiseAdventureAlert(map,run,2,'你破壞門鎖，聲響在周圍傳開。');}
  else if(action==='search'){if(roll<=66){run.searchDone=true;run.clue=true;run.lastResult='搜索成功：找到補給與一份地圖線索。'}else raiseAdventureAlert(map,run,1,'翻找時撞落石塊，聲響引起敵人注意。');}
  else if(action==='knowledge'){if(roll<=74){run.relicTaken=true;run.clue=true;run.alert=Math.max(0,run.alert-1);run.lastResult='知識檢定成功：你安全辨認並取下聖物，敵人短暫退避。'}else raiseAdventureAlert(map,run,1,'誤觸封印，深處傳來腳步聲。');}
  run.selected=null;renderAdventure();
}
function startAdventureBattle(map,run){if(state.party.filter(p=>p.active).length===0){toast('請先在準備畫面選擇至少1名角色上場');return;}const context={mapId:map.id,returnView:'adventure',allySpawns:map.allySpawns,enemySpawns:map.encounter.enemySpawns};startBattle(map.encounter.battleKey,null,context);}

  const grid = document.getElementById('chGrid');

/* 【v0.22】角色底圖鋪底：每人3張變體，隨機選一張套在準備畫面.card背景。
   圖檔路徑還沒提供時直接fallback成不套背景（維持原本面板色），不會出現破圖。
   之後把對應檔名的圖丟進 assets/portraits/ 就會自動生效，不用改程式碼。 */
const CHAR_BG_MAP = {
  daren: ['assets/portraits/daren_bg1.png','assets/portraits/daren_bg2.png','assets/portraits/daren_bg3.png'],
  sete:  ['assets/portraits/sete_bg1.png','assets/portraits/sete_bg2.png','assets/portraits/sete_bg3.png'],
  guran: ['assets/portraits/guran_bg1.png','assets/portraits/guran_bg2.png','assets/portraits/guran_bg3.png'],
  charlotte: ['assets/portraits/charlotte_bg1.png','assets/portraits/charlotte_bg2.png','assets/portraits/charlotte_bg3.png'],
};
const _bgLoadCache = {}; // 記住每個路徑載入成功/失敗，避免重複嘗試載入同一張圖
/* v0.23：底圖改用獨立圖層(.card-bg-layer)淡入，cardEl參數改傳「圖層本身」而不是整個.card，
   這樣文字內容不會跟著閃，只有立繪本身有0.2秒淡入效果 */
function applyCardBg(bgLayerEl, charId){
  bgLayerEl.classList.remove('visible');
  bgLayerEl.style.backgroundImage = '';
  const pool = CHAR_BG_MAP[charId];
  if(!pool || !pool.length) return;
  if(prepState.bgIndex[charId] == null) prepState.bgIndex[charId] = 0; // 保險：萬一還沒被advancePrepBg()初始化過
  const src = pool[prepState.bgIndex[charId]];
  function setBg(){
    bgLayerEl.style.backgroundImage = `linear-gradient(rgba(24,27,39,.88),rgba(24,27,39,.88)), url('${src}')`;
    requestAnimationFrame(()=> bgLayerEl.classList.add('visible')); // 下一幀才加class，確保transition吃得到起始的opacity:0
  }
  if(_bgLoadCache[src] === true){ setBg(); return; }
  if(_bgLoadCache[src] === false){ return; } // 已知載入失敗，不用再試一次
  const img = new Image();
  img.onload = ()=>{ _bgLoadCache[src] = true; setBg(); };
  img.onerror = ()=>{ _bgLoadCache[src] = false; };
  img.src = src;
}

let prepState = { selectedId:null, tab:'equip', bgIndex:{}, panelTarget:null, page:{equip:1, skill:1, item:1, milestone:1}, statPage:1 };
/* v0.23：立繪改成「照順序輪播」（不再隨機），每次按下準備鍵（switchView進prep）才往前走一格，
   同一次停留在準備畫面期間（買裝備、切分頁等重繪）不會再變動，見switchView()裡的advancePrepBg() */
function advancePrepBg(){
  Object.keys(CHAR_BG_MAP).forEach(charId=>{
    const pool = CHAR_BG_MAP[charId];
    if(!pool || !pool.length) return;
    const cur = prepState.bgIndex[charId] != null ? prepState.bgIndex[charId] : -1;
    prepState.bgIndex[charId] = (cur+1) % pool.length;
  });
}

/* 統一的 4×8 準備畫面入口；實際操作仍由各分類原有渲染與資料邏輯處理。 */
function renderPrepMatrix(c){
  const grid = document.getElementById('prepMatrix');

  const equipSlots = ['head','chest','hands','waist','feet','acc1','acc2','acc3'];
  const equipLabels = ['頭部','胸部','手部','腰部','腳部','飾品1','飾品2','飾品3'];
  const milestones = getMilestoneSlots(c.id);
  const milestonePage = paginate(milestones, prepState.page.milestone);
  const rows = [
    {tab:'equip', label:'裝備', values:equipSlots.map((slot,i)=>{
      const d=equipDefOf(c.equipment[slot]); return {name:d?d.name:'空位', sub:equipLabels[i], empty:!d};
    })},
    {tab:'skill', label:'技能', values:Array.from({length:8},(_,i)=>{
      const d=skillDefOf(c.skills[i]); return {name:d?d.name:'空位', sub:`技能${i+1}`, empty:!d};
    })},
    {tab:'item', label:'道具', values:Array.from({length:8},(_,i)=>{
      const d=itemDefOf(c.items[i]); return {name:d?d.name:'空位', sub:`道具${i+1}`, empty:!d};
    })},
    {tab:'stat', label:'里程碑', values:Array.from({length:8},(_,i)=>{
      const ms=milestonePage.pageItems[i];
      return {name:ms?ms.name:'未定', sub:ms?`Lv.${ms.level}`:'里程碑', empty:!ms};
    })}
  ];
  grid.innerHTML = rows.map(row=>row.values.map((item,i)=>
    `<button type="button" class="prep-matrix-cell ${item.empty?'empty':''} ${prepState.tab===row.tab?'active':''}" data-matrix-tab="${row.tab}" data-matrix-index="${i}" aria-label="${row.label} ${i+1}：${item.name}">
      <span class="matrix-kind">${row.label} · ${item.sub}</span><span class="matrix-value">${item.name}</span>
    </button>`
  ).join('')).join('');
  grid.querySelectorAll('[data-matrix-tab]').forEach(cell=>{
    cell.onclick=()=>{
      prepState.tab=cell.dataset.matrixTab;
      if(prepState.tab==='stat') prepState.statPage=1;
      const category=cell.dataset.matrixTab;
      const index=Number(cell.dataset.matrixIndex);
      renderPrep();
      openPrepSlotPicker(state.party.find(p=>p.id===prepState.selectedId),category,index);
    };
  });
}

function closePrepSlotPicker(){ document.getElementById('prepSlotPicker')?.remove(); }
function showPrepSlotPicker(c,title,note,entries){

function openPrepSlotPicker(c,category,index){
  if(!c) return;
  if(category==='equip'){
    const slots=['head','chest','hands','waist','feet','acc1','acc2','acc3'];
    const labels=['頭部','胸部','手部','腰部','腳部','飾品1','飾品2','飾品3'];
    const slot=slots[index], currentId=c.equipment[slot], current=equipDefOf(currentId), entries=[];
    if(current) entries.push({name:current.name+'（目前裝備）',desc:equipSummaryText(current),label:'使用中',disabled:true,current:true});
    Object.entries(state.equipInstances).forEach(([iid,inst])=>{
      if(inst.status==='equipped') return;
      const d=EQUIP_DB[inst.key]; if(!d || !(d.slot===slot || (slot.startsWith('acc')&&d.slot==='acc'))) return;
      const owned=inst.status==='owned';
      entries.push({name:d.name+(inst.level>1?`（+${inst.level-1}）`:''),desc:`${equipSummaryText(d)} · ${owned?'已持有':d.cost+' 金'}`,label:owned?'切換裝備':`購買並裝備（${d.cost}金）`,disabled:!owned&&state.gold<d.cost,onClick:()=>{
        if(!owned){if(state.gold<d.cost){toast('金幣不足');return;}state.gold-=d.cost;}
        if(currentId){const old=equipInstOf(currentId);if(old)old.status='owned';}
        inst.status='equipped';c.equipment[slot]=iid;toast('已裝備 '+d.name);saveGame();closePrepSlotPicker();renderPrep();
      }});
    });
    showPrepSlotPicker(c,`${labels[index]} · 裝備選擇`,'選擇後會直接裝入這個欄位；原裝備會收回倉庫。',entries); return;
  }
  if(category==='skill'){
    const currentId=c.skills[index], current=skillDefOf(currentId), knownKeys=new Set(c.skills.filter(Boolean).map(iid=>skillInstOf(iid)?.key).filter(Boolean)), entries=[];
    if(current) entries.push({name:current.name+'（目前技能）',desc:skillSummaryText(current),label:'使用中',disabled:true,current:true});
    const allKeys=[...new Set([...SKILL_SHOP_KEYS,...Object.values(state.skillInstances).map(inst=>inst.key)])];
    allKeys.forEach(key=>{
      const d=SKILL_DB[key]; if(!d||!canUse(d,c.id)) return;
      Object.entries(state.skillInstances).forEach(([iid,inst])=>{
        if(inst.key!==key||inst.status==='equipped') return;
        const owned=inst.status==='owned', known=knownKeys.has(key), cost=SKILL_SHOP_COST[key]||0;
        entries.push({name:d.name+(inst.level>1?`（+${inst.level-1}）`:''),desc:`${skillSummaryText(d)} · ${owned?'已持有':cost+' 水晶'}`,label:known?'已在其他技能格':owned?'切換技能':`購買並切換（${cost}水晶）`,disabled:known||(!owned&&state.crystal<cost),onClick:()=>{
          if(known){toast('此角色已經會這個技能了');return;}
          if(!owned){if(state.crystal<cost){toast('水晶不足');return;}state.crystal-=cost;}
          if(currentId){const old=skillInstOf(currentId);if(old)old.status='owned';}
          inst.status='equipped';c.skills[index]=iid;toast('已切換技能：'+d.name);saveGame();closePrepSlotPicker();renderPrep();
        }});
      });
    });
    showPrepSlotPicker(c,`技能 ${index+1} · 技能選擇`,'選擇想放入技能 '+(index+1)+' 的技能；確認後會直接切換該格。',entries); return;
  }
  if(category==='item'){
    const currentId=c.items[index], current=itemDefOf(currentId), entries=[];
    if(current) entries.push({name:current.name+'（目前道具）',desc:itemSummaryText(current),label:'使用中',disabled:true,current:true});
    Object.entries(state.itemInstances).forEach(([iid,inst])=>{
      if(inst.status==='equipped') return;
      const d=ITEM_DB[inst.key];if(!d)return;const owned=inst.status==='owned';
      entries.push({name:d.name,desc:`${itemSummaryText(d)} · ${owned?'已持有':d.cost+' 金'}`,label:owned?'切換道具':`購買並放入（${d.cost}金）`,disabled:!owned&&state.gold<d.cost,onClick:()=>{
        if(!owned){if(state.gold<d.cost){toast('金幣不足');return;}state.gold-=d.cost;}
        if(currentId){const old=itemInstOf(currentId);if(old)old.status='owned';}
        inst.status='equipped';c.items[index]=iid;toast('已取得 '+d.name);saveGame();closePrepSlotPicker();renderPrep();
      }});
    });
    showPrepSlotPicker(c,`道具 ${index+1} · 道具選擇`,'選擇要放入這個道具欄位的物品；原道具會收回倉庫。',entries); return;
  }
  if(category==='stat'){
    const all=getMilestoneSlots(c.id),page=paginate(all,prepState.page.milestone),ms=page.pageItems[index];
    if(!ms){showPrepSlotPicker(c,`里程碑 ${index+1}`,'這個位置目前尚未設定內容。',[]);return;}
    const unlocked=c.level>=ms.level;
    showPrepSlotPicker(c,ms.name,`解鎖等級：Lv.${ms.level} · ${unlocked?ms.desc:'尚未解鎖'}`,[{name:unlocked?'已解鎖':'尚未解鎖',desc:ms.desc,label:unlocked?'已達成':`角色 Lv.${ms.level} 解鎖`,disabled:true,current:unlocked}]);
  }
}

/* ============================================================
   【v0.22】準備畫面：裝備/技能/道具三分頁共用的輔助函式
   - paginate()：切頁，每頁固定8項，不足補空卡（由呼叫端補，這裡只算頁碼/切片）
   - renderPager()：畫「上一頁 頁X/共Y 下一頁」，總頁數＝項目數/8無條件進位（至少1頁）
   - openPrepPanel()／renderPrepInfoPanel()：三分頁共用同一塊浮動說明視窗，
     點卡片只更新內容（prepState.panelTarget），是否顯示由state.prepPanelOpen（玩家自行收合/展開，存檔記住）決定，
     不會因為點卡片就強制展開，尊重玩家自己收合的選擇
============================================================ */
const PREP_PAGE_SIZE = 8;
function paginate(list, page){
  const totalPages = Math.max(1, Math.ceil(list.length / PREP_PAGE_SIZE));
  const clampedPage = clamp(page, 1, totalPages);
  const start = (clampedPage-1) * PREP_PAGE_SIZE;
  return { pageItems: list.slice(start, start+PREP_PAGE_SIZE), totalPages, page: clampedPage };
}
function renderPager(containerId, category, page, totalPages){
  const el = document.getElementById(containerId);
  if(!el) return;
  if(totalPages<=1){ el.innerHTML=''; return; }
  el.innerHTML = `
    <button class="btn small" id="${containerId}Prev" ${page<=1?'disabled':''}>‹ 上一頁</button>
    <span>頁 ${page} / 共 ${totalPages}</span>
    <button class="btn small" id="${containerId}Next" ${page>=totalPages?'disabled':''}>下一頁 ›</button>
  `;
  document.getElementById(containerId+'Prev').onclick = ()=>{ prepState.page[category]--; renderPrepBody(state.party.find(p=>p.id===prepState.selectedId)); };
  document.getElementById(containerId+'Next').onclick = ()=>{ prepState.page[category]++; renderPrepBody(state.party.find(p=>p.id===prepState.selectedId)); };
}
function openPrepPanel(target){
  prepState.panelTarget = target;
  renderPrepInfoPanel();
}
/* target格式：
   { title, desc, actions:[{label, onClick, disabled}] }
   actions由呼叫端組好（賣出/強化各自的花費/上限判斷交給呼叫端），這裡只負責畫面 */
function renderPrepInfoPanel(){
  const el = document.getElementById('prepInfoPanel');
  if(!el) return;
  const open = state.prepPanelOpen !== false; // 存檔沒有這欄位時預設當作開啟
  const t = prepState.panelTarget;
  el.innerHTML = `
    <div class="prep-info-panel">
      <div class="prep-info-head" id="prepInfoToggle">
        <span>${t ? '說明：'+t.title : '說明'}</span>
        <span>${open ? '收合 ▲' : '展開 ▼'}</span>
      </div>
      ${open ? `<div class="prep-info-body">
        ${t ? `<div class="d">${t.desc}</div><div class="prep-info-actions" id="prepInfoActions"></div>` : `<div class="d">點擊上方卡片查看說明與操作（賣出／強化）。</div>`}
      </div>` : ''}
    </div>
  `;
  document.getElementById('prepInfoToggle').onclick = ()=>{
    state.prepPanelOpen = !open;
    saveGame();
    renderPrepInfoPanel();
  };
  if(open && t){
    const actionsEl = document.getElementById('prepInfoActions');
    t.actions.forEach(a=>{
      const btn = document.createElement('button');
      btn.className = 'btn small';
      btn.textContent = a.label;
      if(a.disabled) btn.disabled = true; else btn.onclick = a.onClick;
      actionsEl.appendChild(btn);
    });
  }
}

function renderPrepBody(c){
  const body = document.getElementById('prepBody');

  if(prepState.tab === 'equip'){
    const slots = ['head','chest','hands','waist','feet','acc1','acc2','acc3'];
    const labels = {head:'頭部',chest:'胸部',hands:'手部',waist:'腰部',feet:'腳部',acc1:'飾品1',acc2:'飾品2',acc3:'飾品3'};
    body.innerHTML = `

<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">裝備欄位（8格）</div>

<div class="slotgrid">` + slots.map(s=>{
      const iid = c.equipment[s];
      const eqData = equipDefOf(iid);
      const inst = equipInstOf(iid);
      return `<div class="slot ${eqData?'has-rarity':'empty'}" ${eqData?`data-equipped-slot="${s}"`:''} style="--accent:${eqTagColor(s.startsWith('acc')?'acc':s)};${eqData?`--rarity:${rarityColor(eqData.rarity)};`:''}">
        ${eqData ? `<button class="slot-close-btn" data-unequip="${s}" title="卸除">✕</button>` : ''}
        ${eqData ? '' : `<div class="k">${labels[s]}</div>`}
        <div class="v">${eqData ? eqData.name : '（空）'}</div>
        ${eqData ? `<div class="slot-effect">${truncateText(equipSummaryText(eqData))}</div>` : ''}
        ${eqData ? `<div class="slot-level-badge">+${inst.level-1}</div>` : ''}
      </div>`;
    }).join('') + `</div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">裝備商店 · 每一份裝備都各自一張卡（含已持有），點卡片看說明</div>
      <div class="prep-pagination" id="equipPager"></div>
      <div class="slotgrid" id="equipShopGrid"></div>`;
    body.querySelectorAll('[data-unequip]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const slot = btn.dataset.unequip;
        const iid = c.equipment[slot];
        const inst = equipInstOf(iid);
        if(inst) inst.status = 'owned';
        c.equipment[slot] = null;
        toast('已卸除，收進倉庫');
        saveGame(); renderPrep();
      };
    });
    // 已裝備格：點卡片（非✕按鈕）開浮動說明視窗，強化按鈕在裡面
    body.querySelectorAll('[data-equipped-slot]').forEach(div=>{
      div.onclick = ()=>{
        const s = div.dataset.equippedSlot;
        const iid = c.equipment[s];
        const eqData = equipDefOf(iid);
        const inst = equipInstOf(iid);
        if(!eqData) return;
        const maxed = inst && inst.level >= EQUIP_UPGRADE_CAP;
        const nextCost = inst ? equipUpgradeCost(inst.level+1) : 0;
        openPrepPanel({
          title: eqData.name,
          desc: equipSummaryText(eqData) + (inst && inst.level>1 ? `（強化中，各數值再+${(inst.level-1)*EQUIP_LEVEL_STAT_BONUS_PER_LEVEL}）` : ''),
          actions: [{
            label: maxed ? '已滿級' : `強化 (${nextCost}金)`,
            disabled: maxed || state.gold<nextCost,
            onClick: ()=>{
              if(!inst || inst.level>=EQUIP_UPGRADE_CAP) return;
              const cost = equipUpgradeCost(inst.level+1);
              if(state.gold<cost){ toast('金幣不足'); return; }
              state.gold -= cost;
              inst.level++;
              toast('已強化至 Lv.'+inst.level);
              saveGame(); renderPrep();
            }
          }]
        });
      };
    });
    // 【v0.25】改回「每份實例各自一張卡」（不論重複與否），不再合併成一張key卡：
    // - unowned／owned都各自算一份、各自一張卡，預設每個key只有1份庫存所以通常長得跟以前一樣，
    //   只有用EQUIP_STOCK_OVERRIDE設定多份庫存時才會看到同一個裝備出現好幾張「購買」卡
    // - 賣出功能拿掉（MOMO確認不重要，乾脆刪除）
    // - 強化現在owned卡也能直接點卡片使用，不用先裝上（跟已裝備格一樣都是點卡片開說明視窗操作）
    // - 已裝備中的那一份不會出現在這份清單（它顯示在上面的裝備欄位格），卸下來才會回到這裡
    const equipInstList = Object.entries(state.equipInstances);
    let equipCards = [];
    Object.keys(EQUIP_DB).forEach(key=>{
      const def = EQUIP_DB[key];
      const instsOfKey = equipInstList.filter(([iid,inst])=> inst.key===key && inst.status!=='equipped');
      instsOfKey.forEach(([iid,inst])=> equipCards.push({key, def, iid, status:inst.status, level:inst.level}));
    });
    const pg = paginate(equipCards, prepState.page.equip);
    prepState.page.equip = pg.page;
    renderPager('equipPager', 'equip', pg.page, pg.totalPages);
    const equipGrid = document.getElementById('equipShopGrid');
    for(let i=0;i<PREP_PAGE_SIZE;i++){
      if(i >= pg.pageItems.length){
        const div = document.createElement('div');
        div.className = 'slot empty';
        div.innerHTML = `<div class="k">格 ${i+1}</div><div class="v">尚未上架</div>`;
        equipGrid.appendChild(div);
        continue;
      }
      const {key, def, iid, status, level} = pg.pageItems[i];
      const owned = status==='owned';
      const div = document.createElement('div');
      div.className = 'slot has-rarity' + (owned ? ' owned' : '');
      div.style.setProperty('--accent', eqTagColor(def.slot));
      div.style.setProperty('--rarity', rarityColor(def.rarity));
      div.innerHTML = `${owned ? `<div class="slot-status-badge">已持有</div>` : ''}
        <div class="k">${def.cost} 金</div>
        <div class="v">${def.name}</div>
        ${owned ? `<div class="slot-level-badge">+${level-1}</div>` : ''}`;
      const btn = document.createElement('button');
      btn.className = 'btn small';
      btn.style.marginTop = '4px'; btn.style.width = '100%';
      const equipThis = ()=>{
        const slot = def.slot === 'acc' ? (['acc1','acc2','acc3'].find(s=>!c.equipment[s]) || 'acc1') : def.slot;
        if(c.equipment[slot]){ const old = equipInstOf(c.equipment[slot]); if(old) old.status='owned'; }
        state.equipInstances[iid].status = 'equipped';
        c.equipment[slot] = iid;
        toast('已裝備 '+def.name);
        saveGame(); renderPrep();
      };
      if(owned){
        btn.textContent = '裝上';
        btn.onclick = (e)=>{ e.stopPropagation(); equipThis(); };
      } else {
        btn.textContent = '購買';
        if(state.gold < def.cost) btn.disabled = true;
        btn.onclick = (e)=>{ e.stopPropagation(); if(state.gold < def.cost) return; state.gold -= def.cost; equipThis(); };
      }
      div.appendChild(btn);
      div.onclick = ()=>{
        const actions = [];
        if(owned){
          const inst = state.equipInstances[iid];
          const maxed = inst.level >= EQUIP_UPGRADE_CAP;
          const nextCost = equipUpgradeCost(inst.level+1);
          actions.push({ label: maxed ? '已滿級' : `強化 (${nextCost}金)`, disabled: maxed || state.gold<nextCost, onClick: ()=>{
            if(maxed) return;
            if(state.gold<nextCost){ toast('金幣不足'); return; }
            state.gold -= nextCost;
            inst.level++;
            toast('已強化至 Lv.'+inst.level);
            saveGame(); renderPrep();
          }});
        }
        openPrepPanel({ title: def.name + (owned?`（Lv.${level}）`:''), desc: equipSummaryText(def), actions });
      };
      equipGrid.appendChild(div);
    }
    renderPrepInfoPanel();
  }

  if(prepState.tab === 'skill'){
    body.innerHTML = `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">技能欄位（8格）</div>
      <div class="slotgrid">` + c.skills.map((sk,i)=>{
        const d = skillDefOf(sk);
        const inst = skillInstOf(sk);
        return `<div class="slot ${d?'':'empty'}" ${d?`data-equipped-skill="${i}"`:''} style="${d?`--accent:${skillTypeColor(d.type)}`:''}">
          ${d ? `<button class="slot-close-btn" data-unequip-skill="${i}" title="卸除">✕</button>` : ''}
          ${d ? '' : `<div class="k">格 ${i+1}</div>`}
          <div class="v">${d?d.name:'空位'}</div>
          ${d ? `<div class="slot-effect">${truncateText(skillSummaryText(d))}</div>` : ''}
          ${d ? `<div class="slot-level-badge">+${inst.level-1}</div>` : ''}
        </div>`;
      }).join('') + `</div>
      <div style="font-size:12px;color:var(--text-dim);margin:16px 0 8px;">技能商店 · 每一本技能書都各自一張卡（含已持有），點卡片看說明</div>
      <div class="prep-pagination" id="skillPager"></div>
      <div class="slotgrid" id="skillShopGrid"></div>`;
    body.querySelectorAll('[data-unequip-skill]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const idx = parseInt(btn.dataset.unequipSkill);
        const iid = c.skills[idx];
        const inst = skillInstOf(iid);
        if(inst) inst.status = 'owned';
        c.skills[idx] = null;
        toast('已卸除，收進技能書倉庫');
        saveGame(); renderPrep();
      };
    });
    body.querySelectorAll('[data-equipped-skill]').forEach(div=>{
      div.onclick = ()=>{
        const idx = parseInt(div.dataset.equippedSkill);
        const iid = c.skills[idx];
        const d = skillDefOf(iid);
        const inst = skillInstOf(iid);
        if(!d) return;
        const maxed = inst && inst.level >= SKILL_UPGRADE_CAP;
        const nextCost = inst ? skillUpgradeCost(inst.level+1) : 0;
        openPrepPanel({
          title: d.name,
          desc: skillSummaryText(d) + (inst && inst.level>1 ? `（強化中，power/heal再+${(inst.level-1)*SKILL_LEVEL_POWER_BONUS_PER_LEVEL}）` : ''),
          actions: [{
