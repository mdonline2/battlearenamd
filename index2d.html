function doInspect(actor, x, y){
  logMsg(`<b>${actor.name}</b> 檢查了那個位置，似乎沒有什麼異常。`);
  actor.interactUsed = true; // 檢查併入互動名額，跟拾取共用同一個名額
  renderLog(false);
  afterAction(actor);
}

function doFlee(){
  // v0.47：測試用簡化脫逃——ESCAPE_FX_ENABLED=false時，不擲脫逃失敗率、不播任何特效，直接回準備畫面。
  // （點「脫逃」後仍需再點自己的頭像confirm，避免手滑；那一步是選取流程，不算特效，保留）
  if(!ESCAPE_FX_ENABLED){
    battle.finished = true;
    saveGame();
    quickReturnToPrep();
    return;
  }
  // 以下是原本的脫逃流程（含脫逃失敗率、結算列），正式版把ESCAPE_FX_ENABLED改true就會接回來
  const stopChance = battle.def.fleeBlockChance || 0;
  if(Math.random() < stopChance){
    logMsg('逃脫失敗!敵人擋住了去路。');
    renderLog(false);
    return;
  }
  logMsg('全隊成功脫離了戰鬥。');
  battle.finished = true;
  saveGame();
  endBattleReturnToPrep('你們暫時撤退了。');
}

function checkBattleEnd(){
  if(!battle || battle.finished) return false;
  const alliesAlive = battle.allies.some(u=>u.hp>0);
  const enemiesAlive = battle.enemies.some(u=>u.hp>0);
  if(!enemiesAlive){
    battle.finished = true;
    // v0.47：獎勵改由computeBattleRewards()決定（金幣不再隨機，見DEFAULT_BATTLE_REWARDS），
    // 一般獎勵＋（第一次勝利時）首勝額外獎勵，發放後交給playVictoryOutro()演出
    const rw = computeBattleRewards(battle.def, battle.key);
    const newsNorm = applyRewardBlock(rw.norm);
    const newsFirst = rw.isFirst ? applyRewardBlock(rw.first) : [];
    battle.allies.forEach(u=>{ if(u.ref) u.ref.hp = u.hp; });
    if(battle.def.unlockFlag) setFlag(battle.def.unlockFlag);
    if(battle.chapterId != null){
      state.maxChapterReached = Math.max(state.maxChapterReached||0, battle.chapterId);
    }
    saveGame();
    playVictoryOutro(rw, newsNorm, newsFirst);
    return true;
  }
  if(!alliesAlive){
    battle.finished = true;
    battle.allies.forEach(u=>{ if(u.ref) u.ref.hp = Math.ceil(u.ref.maxHp*0.3); });
    saveGame();
    playDefeatOutro();
    return true;
  }
  return false;
}

function endBattleReturnToPrep(msg){
  setNavLocked(false);
  // v0.35新增：戰鬥結束時強制收合三個overlay，避免其中一個剛好開著、蓋在下面的結算浮動列上面
  ['actionModal','logModal','unitInspectorModal'].forEach(id=>{
    const m = document.getElementById(id);
    if(m) m.classList.remove('show');
  });
  if(battle) battle.actionPanelOpen = false;
  const bgm = document.getElementById('bgm');
  bgm.pause();
  // v0.28修正：原本只pause()沒清data-cur，導致下次挑戰同一首曲子的戰鬥時，
  // playBgm()裡「data-cur===file就跳過」的判斷會誤判成「已經在播」而完全不重播——
  // 逃脫/獲勝後BGM只會響第一次，之後每次再進戰鬥都變成沒聲音，就是卡在這裡
  bgm.removeAttribute('data-cur');
  const el = document.getElementById('viewBattle');
  // 不再清空整個戰場畫面（原本會把grid/立繪等全部替換掉），
  // 改成疊加一條浮動結算列在畫面下方，讓玩家先看清楚戰場最終狀態，自己決定何時按返回
  const overlay = document.createElement('div');
  overlay.className = 'battle-result-overlay';
  overlay.innerHTML = `<div class="result-banner">${msg}</div>
    <button class="btn primary" id="btnBackPrep">返回準備畫面</button>`;
  el.appendChild(overlay);
  // v0.44新增：離場轉場——勝利/戰敗/脫逃都共用這個「返回準備畫面」按鈕，蓋滿畫面才真正切回準備畫面
  document.getElementById('btnBackPrep').onclick = ()=> playBattleTransition(()=> switchView('prep'));
}

/* v0.35新增：行動面板（左下角icon）overlay開關。
   跟log/status兩個純顯示面板不同，行動面板打開時要求「鎖定網格避免誤按」（見renderGrid()裡的
   battle.actionPanelOpen guard），所以額外用battle.actionPanelOpen這個旗標同時控制：
   1) actionModal的show/hide
   2) 網格是否能點擊(cell/unit-chip的onclick)
   流程：輪到我方單位→startActorTurn()把旗標設true；玩家選定一個動作(移動/技能/道具/檢查/脫逃)→
   旗標設false讓面板收合、網格解鎖進入選目標狀態；完成一個動作後若還有名額沒用完(afterAction())→
   旗標設回true自動重新彈出；玩家也能隨時手動點icon(toggleActionPanel)強制切換。 */
function toggleActionPanel(){
  if(!battle) return;
  battle.actionPanelOpen = !battle.actionPanelOpen;
  syncActionModal();
}
function syncActionModal(){
  const modal = document.getElementById('actionModal');
  if(!modal || !battle) return;
  const wasOpen = modal.classList.contains('show');
  const nowOpen = !!battle.actionPanelOpen;
  // v0.41新增：只有「真的變了」才播開/關音效，避免syncActionModal()被重複呼叫(這個函式很多地方都會呼叫)
  // 時，狀態其實沒變卻一直重播同一個音效
  if(wasOpen !== nowOpen) playSound(nowOpen ? UI_SFX.panelOpen : UI_SFX.panelClose);
  modal.classList.toggle('show', nowOpen);
  // v0.40修正：網格「鎖不鎖」是renderGrid()當下把cell/chip的onclick設成null或正常函式，
  // 只改battle.actionPanelOpen這個旗標、只切modal的show class，並不會讓已經畫出來的網格重新綁定
  // onclick——所以手動點icon關閉面板(toggleActionPanel)或點✕/背景關閉(actionModal的關閉按鈕)時，
  // 面板雖然收起來了，但網格其實還停在上一次renderGrid()當下鎖住的狀態，點了沒反應。
  // 這裡統一補一次renderGrid()，確保只要面板開關狀態一變，網格是否可點一定同步更新。
  renderGrid();
}
// v0.35：戰報改成右下角icon觸發的overlay（見logModal），不再有「展開/收合預覽6則」的分別，
// 開啟時一律顯示完整紀錄（上限100則，超出用modal-box自帶的滾動）。renderLog()本身仍會在每次
// 戰報有更新時被呼叫（不論modal是否開著），確保重新打開時內容已經是最新的。
function toggleLog(){
  const modal = document.getElementById('logModal');
  if(!modal) return;
  const nowOpen = modal.classList.toggle('show'); // toggle()回傳切換後的狀態(true=現在有show這個class)
  playSound(nowOpen ? UI_SFX.panelOpen : UI_SFX.panelClose);
  renderLog();
}
function renderLog(){
  const box = document.getElementById('msglog');
  if(!box || !battle) return;
  box.innerHTML = battle.log.map(m=>`<div class="row">${m}</div>`).join('');
  box.scrollTop = box.scrollHeight;
  const countEl = document.getElementById('logCount');
  if(countEl) countEl.textContent = `紀錄 ${battle.log.length}/100`;
}


/* ============================================================
   v0.47 戰場開場／結算演出、獎勵、暫時音效、戰場UI（提示小卡／發動提示／迷你戰報）
   ────────────────────────────────────────────────────────────
   【怎麼調整】所有時長／開關都集中在下面幾個設定物件，改數字即可，不用動其他程式碼：
   - BATTLE_INTRO：開場序列每一步的時長(ms)
   - OUTRO：勝利/戰敗結算每一步的時長(ms)
   - DEFAULT_BATTLE_REWARDS：獎勵的預設值（每場戰鬥也可在BATTLES裡自己覆寫，見BATTLES上方說明）
   - FIRST_CLEAR_ALWAYS_FOR_TEST：測試用，true=每次勝利都當「第一次勝利」（方便反覆看獎勵面板演出）
   - ESCAPE_FX_ENABLED：脫逃特效開關（false=測試用直接回準備畫面，true=原本的脫逃流程）
   - SFX_FILES：三種主要音效現在用程式合成的暫時音效，之後要換成真的檔案，把路徑填進去即可
   - MINI_LOG / CAST_BANNER_MS：底部迷你戰報、技能發動提示的時長
============================================================ */
const BATTLE_INTRO = {
  curtainMs: 600,        // 1. 黑幕蓋上
  titleInMs: 700,        // 2. 標題淡入
  titleHoldMs: 1200,     //    標題停留（一般戰）
  bossTitleHoldMs: 2200, //    標題停留（introStyle:'boss'的戰場）
  revealMs: 800,         // 3. 標題與黑幕一起退去
  unitsInMs: 900,        // 4. 人物進場（單位一個接一個滑入，間隔見下）
  unitStaggerMs: 120,    //    單位之間的進場間隔
  commenceMs: 900,       // 5. "COMMENCE" 停留
};
const OUTRO = {
  pauseMs: 900,          // 最後一擊後的停頓（讓玩家看到敵人/我方倒下）
  bgmFadeMs: 700,        // BGM淡出
  bannerHoldMs: 1600,    // VICTORY/DEFEAT橫幅停留，之後上移、跳出面板
  rowStaggerMs: 380,     // 獎勵一列一列出現的間隔
  countMs: 650,          // 數字跳動時長
};
const FIRST_CLEAR_ALWAYS_FOR_TEST = true; // ⚠️ 測試期間true；正式版改false，才會「只有第一次勝利」才給首勝額外獎勵
const ESCAPE_FX_ENABLED = false;          // 測試用脫逃：false=按下直接回準備畫面、沒有任何特效；正式版改true接回原本脫逃流程
const SFX_FILES = { victory:null, defeat:null, commence:null, title:null, tick:null }; // null=用程式合成的暫時音效；填 'assets/sfx/xxx.mp3' 就改用檔案
const CAST_BANNER_MS = 1400;              // 技能發動提示總長（要同步改CSS castBannerAnim的1.4s）
const MINI_LOG = { enabled:true, showMs:1000, fadeMs:350, staggerMs:500, maxLines:3 };
/* 迷你戰報：每次logMsg()都會丟一份進來排隊，一筆一筆依序跳出(間隔staggerMs)，各自顯示showMs後淡出，
   例如一次火球炸6人就會變6筆、每0.5秒跳一筆；同時最多顯示maxLines行 */

/* 獎勵預設值。欄位：gold金幣／crystal水晶／sphere天賦天球（天賦用的資源）＝數字；
   skills/equips/items＝要發放的SKILL_DB/EQUIP_DB/ITEM_DB的key陣列（發到倉庫，status:'owned'）；
   talents＝天賦名稱（顯示用文字）陣列，目前只顯示並記旗標('talent_got_名稱')，還沒接到天賦節點。
   normal＝每次勝利都拿；firstClear＝第一次勝利「額外」再拿一份（跟normal分開顯示）。
   ▶ 想改全部戰鬥的預設：改這裡。▶ 想改單場戰鬥：在BATTLES那場加 rewards:{...} 或 firstClearRewards:{...}，
     有寫的欄位覆蓋預設、沒寫的沿用預設（例如只寫 rewards:{gold:100} 就是金幣100、其他照預設）。
   目前四種數值都先設30供美術測試。 */
const DEFAULT_BATTLE_REWARDS = {
  normal:     { gold:30, crystal:30, sphere:30, skills:[], equips:[], items:[], talents:[] },
  firstClear: { gold:30, crystal:30, sphere:30, skills:['slash'], equips:['acc_power'], items:['potion'], talents:['Test Talent 測試天賦'] },
};

const __sleep = ms => new Promise(r=> setTimeout(r, ms));
const __nextFrame = ()=> new Promise(r=> requestAnimationFrame(()=> r()));

/* ---------- 暫時音效（Web Audio合成，不需要檔案） ---------- */
let __audioCtx = null;
const SYNTH_SFX = {
  // f=頻率Hz t=開始秒 d=長度秒 type=波形 v=音量
  victory: [
    {f:261.6,t:0,d:.16},{f:329.6,t:.14,d:.16},{f:392,t:.28,d:.16},{f:523.3,t:.42,d:.3},
    {f:523.3,t:.85,d:1.3},{f:659.3,t:.85,d:1.3},{f:784,t:.85,d:1.3},{f:1046.5,t:1.3,d:.9,v:.14},
  ],
  defeat: [
    {f:440,t:0,d:.55,type:'triangle'},{f:349.2,t:.55,d:.55,type:'triangle'},
    {f:293.7,t:1.1,d:.55,type:'triangle'},{f:220,t:1.65,d:1.6,type:'triangle'},{f:110,t:1.65,d:1.6,type:'sine',v:.2},
  ],
  commence: [ {f:110,t:0,d:.55,type:'sawtooth',v:.16},{f:165,t:0,d:.55,type:'sawtooth',v:.1},{f:440,t:.02,d:.45,type:'square',v:.07} ],
  title:    [ {f:82.4,t:0,d:1.5,type:'triangle',v:.2},{f:123.5,t:.1,d:1.3,type:'sine',v:.1} ],
  tick:     [ {f:880,t:0,d:.06,type:'square',v:.05} ],
};
function playCue(name){
  const file = SFX_FILES[name];
  if(file){ playSound(file, 0.7); return; }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    __audioCtx = __audioCtx || new AC();
    if(__audioCtx.state === 'suspended') __audioCtx.resume();
    const t0 = __audioCtx.currentTime + 0.02;
    (SYNTH_SFX[name] || []).forEach(n=>{
      const osc = __audioCtx.createOscillator(), g = __audioCtx.createGain();
      osc.type = n.type || 'square';
      osc.frequency.value = n.f;
      const v = n.v != null ? n.v : .11;
      g.gain.setValueAtTime(0.0001, t0+n.t);
      g.gain.exponentialRampToValueAtTime(v, t0+n.t+.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+n.t+n.d);
      osc.connect(g); g.connect(__audioCtx.destination);
      osc.start(t0+n.t); osc.stop(t0+n.t+n.d+.05);
    });
  }catch(e){ /* 音效失敗不影響遊戲 */ }
}

function stopBgmNow(){
  const bgm = document.getElementById('bgm');
  bgm.pause();
  bgm.removeAttribute('data-cur'); // 同v0.28修正：清掉data-cur，下次才能重播同一首
}
function fadeOutBgm(ms){
  const bgm = document.getElementById('bgm');
  const v0 = bgm.volume, t0 = performance.now();
  return new Promise(res=>{
    const step = ()=>{
      const k = Math.min(1, (performance.now()-t0)/ms);
      bgm.volume = v0 * (1-k);
      if(k < 1) requestAnimationFrame(step);
      else { stopBgmNow(); bgm.volume = 0.35; res(); }
    };
    step();
  });
}
function closeBattleOverlays(){
  ['actionModal','logModal','unitInspectorModal'].forEach(id=>{
    const m = document.getElementById(id);
    if(m) m.classList.remove('show');
  });
  if(battle) battle.actionPanelOpen = false;
  const tip = document.getElementById('skillTip'); if(tip) tip.classList.remove('show');
}

/* ---------- 開場序列 ---------- */
async function playBattleIntro(def, onCovered){
  const B = BATTLE_INTRO;
  const boss = def.introStyle === 'boss';
  miniLogClear();
  const wrap = document.createElement('div');
  wrap.className = 'battle-intro' + (boss ? ' boss' : '');
  wrap.innerHTML = `<div class="intro-curtain"></div>
    <div class="intro-title"><div class="it-en">${def.titleEn || def.name}</div><div class="it-line"></div><div class="it-zh">${def.name}</div></div>
    <div class="intro-commence"><span>COMMENCE</span><small>開戰</small></div>`;
  const curtain = wrap.querySelector('.intro-curtain');
  const title = wrap.querySelector('.intro-title');
  const commence = wrap.querySelector('.intro-commence');
  curtain.style.transitionDuration = B.curtainMs + 'ms';
  document.body.appendChild(wrap);
  // 1. 黑幕
  await __nextFrame(); curtain.classList.add('show');
  await __sleep(B.curtainMs + 40);
  onCovered(); // 黑幕蓋滿才切到戰鬥畫面
  await __nextFrame();
  // 2. 標題
  title.style.transitionDuration = B.titleInMs + 'ms';
  title.classList.add('show');
  playCue('title');
  await __sleep(B.titleInMs + (boss ? B.bossTitleHoldMs : B.titleHoldMs));
  // 3. 標題與黑幕一起退去
  curtain.style.transitionDuration = B.revealMs + 'ms';
  title.style.transitionDuration = B.revealMs + 'ms';
  curtain.classList.remove('show'); title.classList.remove('show');
  await __sleep(B.revealMs);
  // 4. 人物進場（我方從左、敵方從右，各自依序滑入）
  const grid = document.getElementById('grid');
  let maxIdx = 0;
  if(grid){
    const cnt = { ally:0, enemy:0 };
    grid.querySelectorAll('.unit-chip').forEach(c=>{
      const side = c.classList.contains('ally') ? 'ally' : 'enemy';
      const i = cnt[side]++; maxIdx = Math.max(maxIdx, i);
      c.style.animationDelay = (i * B.unitStaggerMs) + 'ms';
    });
    grid.classList.remove('intro-hidden'); grid.classList.add('intro-enter');
  }
  await __sleep(B.unitsInMs + maxIdx * B.unitStaggerMs);
  // 5. COMMENCE
  playCue('commence');
  commence.classList.add('show');
  await __sleep(B.commenceMs);
  commence.classList.remove('show');
  await __sleep(280);
}
function finishBattleIntro(){
  document.querySelectorAll('.battle-intro').forEach(e=> e.remove());
  const g = document.getElementById('grid');
  if(g){
    g.classList.remove('intro-hidden','intro-enter');
    g.querySelectorAll('.unit-chip').forEach(c=>{ c.style.animationDelay = ''; });
  }
  if(!battle || battle.finished) return;
  battle.introPlaying = false;
  const a = currentActor();
  battle.actionPanelOpen = !!(a && a.side === 'ally' && a.hp > 0);
  syncActionModal(); // 序列結束才彈出行動面板、解鎖網格
  checkBattleEnd();
  maybeRunEnemyTurn(); // 第一位若是敵方，這時才開始行動
}

/* ---------- 獎勵 ---------- */
function computeBattleRewards(def, key){
  const norm = Object.assign({}, DEFAULT_BATTLE_REWARDS.normal, def.rewards || {});
  const first = Object.assign({}, DEFAULT_BATTLE_REWARDS.firstClear, def.firstClearRewards || {});
  const flagKey = 'cleared_' + key;
  const isFirst = FIRST_CLEAR_ALWAYS_FOR_TEST || !hasFlag(flagKey);
  setFlag(flagKey);
  return { norm, first, isFirst };
}
function grantSkillReward(key){
  const d = SKILL_DB[key]; if(!d) return null;
  const iid = makeIid(state,'sk'); state.skillInstances[iid] = { key, level:1, status:'owned' };
  return d.name;
}
function grantEquipReward(key){
  const d = lookupEquip(key); if(!d) return null;
  const iid = makeIid(state,'eq'); state.equipInstances[iid] = { key, level:1, status:'owned' };
  return d.name;
}
function grantItemReward(key){
  const d = ITEM_DB[key]; if(!d) return null;
  const iid = makeIid(state,'it'); state.itemInstances[iid] = { key, level:1, status:'owned' };
  return d.name;
}
/* 把一份獎勵發到存檔，回傳給面板顯示用的資料 */
function applyRewardBlock(r){
  state.gold += r.gold || 0;
  state.crystal += r.crystal || 0;
  state.sphere += r.sphere || 0;
  const news = [];
  (r.skills||[]).forEach(k=>{ const n = grantSkillReward(k); if(n) news.push({kind:'SKILL', zh:'技能', name:n}); });
  (r.equips||[]).forEach(k=>{ const n = grantEquipReward(k); if(n) news.push({kind:'EQUIP', zh:'裝備', name:n}); });
  (r.items||[]).forEach(k=>{ const n = grantItemReward(k); if(n) news.push({kind:'ITEM', zh:'道具', name:n}); });
  (r.talents||[]).forEach(t=>{ setFlag('talent_got_'+t); news.push({kind:'TALENT', zh:'天賦', name:t}); });
  return news;
}

/* ---------- 結算演出 ---------- */
function buildOutroLayer(kind){
  const layer = document.createElement('div');
  layer.className = 'outro-layer ' + kind;
  layer.id = 'outroLayer';
  layer.innerHTML = `<div class="outro-dim"></div><div class="outro-vignette"></div><div class="outro-flash"></div>
    <div class="outro-banner ${kind}"><div class="ob-en">${kind==='victory'?'VICTORY':'DEFEAT'}</div><div class="ob-zh">${kind==='victory'?'勝利':'敗北'}</div></div>
    <div class="reward-panel" id="rewardPanel"></div>`;
  document.body.appendChild(layer);
  return layer;
}
function outroReturnToPrep(layer){
  const btn = layer.querySelector('.rp-btn');
  if(btn) btn.disabled = true;
  playBattleTransition(()=>{
    layer.remove();
    const v = document.getElementById('viewBattle'); if(v) v.classList.remove('defeat-gray');
    if(battle) battle.outroPlaying = false;
    setNavLocked(false);
    switchView('prep');
  });
}
function rewardRowHtml(ico, en, zh, val){
  return `<div class="rw-row" data-val="${val}"><span class="rw-ico">${ico}</span><span class="rw-lbl">${en}<small>${zh}</small></span><span class="rw-val">+0</span></div>`;
}
function rewardBlockRows(r){
  let h = '';
  if(r.gold)    h += rewardRowHtml('🪙','Gold','金幣', r.gold);
  if(r.crystal) h += rewardRowHtml('💎','Crystal','水晶', r.crystal);
  if(r.sphere)  h += rewardRowHtml('🔮','Talent Orb','天賦天球', r.sphere);
  return h;
}
function newCardsHtml(news){
  return news.map(n=> `<div class="rw-card"><span class="rw-kind">${n.kind}<br>${n.zh}</span><span class="rw-name">${n.name}</span><span class="rw-new">NEW</span></div>`).join('');
}
async function playVictoryOutro(rw, newsNorm, newsFirst){
  const O = OUTRO;
  battle.outroPlaying = true;
  closeBattleOverlays(); miniLogClear();
  const layer = buildOutroLayer('victory');
  const banner = layer.querySelector('.outro-banner');
  const panel = layer.querySelector('#rewardPanel');
  await __sleep(O.pauseMs);                       // 1. 最後一擊後停頓
  await fadeOutBgm(O.bgmFadeMs);                  // 2. BGM淡出
  layer.classList.add('dimmed');
  layer.querySelector('.outro-flash').classList.add('go');
  playCue('victory');                             // 3. Fanfare + VICTORY橫幅
  banner.classList.add('show');
  await __sleep(O.bannerHoldMs);
  banner.classList.add('up');                     // 4. 橫幅上移，跳出獎勵面板
  // 組面板內容（有才顯示的項目才有那一列）
  let h = `<div class="rp-scroll"><div class="rp-title">REWARDS<small>獲得獎勵</small></div>` + rewardBlockRows(rw.norm);
  if(newsNorm.length) h += `<div class="rp-sec">NEW 新獲得</div>` + newCardsHtml(newsNorm);
  if(rw.isFirst){
    const fr = rewardBlockRows(rw.first);
    if(fr || newsFirst.length){
      h += `<div class="rp-sec first">★ FIRST CLEAR BONUS 首次勝利額外獎勵</div>` + fr;
      if(newsFirst.length) h += newCardsHtml(newsFirst);
    }
  }
  h += `</div><button class="btn primary rp-btn" id="btnBackPrep">Return 返回準備畫面</button>`;
  panel.innerHTML = h;
  await __sleep(350);
  panel.classList.add('show');
  await __sleep(350);
  const items = Array.from(panel.querySelectorAll('.rw-row, .rw-card'));
  for(const el of items){
    el.classList.add('in');
    playCue('tick');
    if(el.classList.contains('rw-row')){
      const target = Number(el.dataset.val) || 0, valEl = el.querySelector('.rw-val'), t0 = performance.now();
      const tick = ()=>{
        const k = Math.min(1, (performance.now()-t0)/O.countMs);
        valEl.textContent = '+' + Math.round(target * k);
        if(k < 1) requestAnimationFrame(tick);
      };
      tick();
    }
    await __sleep(O.rowStaggerMs);
  }
  const btn = panel.querySelector('.rp-btn');
  btn.classList.add('in');
  btn.onclick = ()=> outroReturnToPrep(layer);
}
async function playDefeatOutro(){
  const O = OUTRO;
  battle.outroPlaying = true;
  closeBattleOverlays(); miniLogClear();
  const layer = buildOutroLayer('defeat');
  const banner = layer.querySelector('.outro-banner');
  const panel = layer.querySelector('#rewardPanel');
  await __sleep(O.pauseMs);
  const v = document.getElementById('viewBattle'); if(v) v.classList.add('defeat-gray'); // 去飽和
  layer.classList.add('dimmed');
  await fadeOutBgm(O.bgmFadeMs);
  playCue('defeat');
  banner.classList.add('show');
  await __sleep(O.bannerHoldMs + 400);
  banner.classList.add('up');
  panel.innerHTML = `<div class="rp-title">DEFEAT<small>戰敗</small></div>
    <div class="rp-msg">The party has fallen... but only for now.<br>全隊倒下……幸好只是暫時的，隊伍已撤回休整。</div>
    <button class="btn primary rp-btn" id="btnBackPrep">Return 返回準備畫面</button>`;
  await __sleep(350);
  panel.classList.add('show');
  await __sleep(400);
  const btn = panel.querySelector('.rp-btn');
  btn.classList.add('in');
  btn.onclick = ()=> outroReturnToPrep(layer);
}
/* 測試用脫逃：直接回準備畫面，沒有任何轉場/特效/結算面板 */
function quickReturnToPrep(){
  stopBgmNow(); closeBattleOverlays(); miniLogClear();
  setNavLocked(false);
  switchView('prep');
}

/* ---------- 戰場UI：右上角提示小卡 ---------- */
function syncSelectionTip(){
  const tip = document.getElementById('skillTip');
  if(!tip || !battle) return;
  const sel = battle.selected || {};
  let tag=null, name=null, eff=null, color=null;
  if(sel.mode === 'skill' && sel.skillDef){
    const d = sel.skillDef;
    tag = 'SKILL ' + ({attack:'ATTACK 攻擊',heal:'HEAL 治療',buff:'BUFF 增益',debuff:'DEBUFF 減益'}[d.type] || ''); name = d.name; eff = skillSummaryText(d); color = skillTypeColor(d.type);
  } else if(sel.mode === 'item' && sel.itemDef){
    tag = 'ITEM 道具'; name = sel.itemDef.name; eff = itemSummaryText(sel.itemDef); color = skillTypeColor('heal');
  }
  if(!name){ tip.classList.remove('show'); tip.dataset.k = ''; return; }
  const k = tag + '|' + name;
  if(tip.dataset.k !== k){
    tip.innerHTML = `<div class="st-tag">${tag}</div><div class="st-name">${name}</div><div class="st-eff">${eff}</div>`;
    tip.style.setProperty('--tip-color', color);
    tip.dataset.k = k;
  }
  tip.classList.add('show');
}
/* ---------- 戰場UI：技能/道具發動提示（畫面中上） ---------- */
function showCastBanner(actor, name, eff){
  const el = document.createElement('div');
  el.className = 'cast-banner';
  el.innerHTML = `<div class="cb-who">${actor ? actor.name : ''}</div><div class="cb-name">${name}</div><div class="cb-eff">${eff || ''}</div>`;
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), CAST_BANNER_MS + 100);
}
/* ---------- 戰場UI：底部迷你戰報 ---------- */
let __miniQ = [], __miniTimer = null;
function miniLogPush(html){
  if(!MINI_LOG.enabled) return;
  __miniQ.push(html);
  if(!__miniTimer) miniLogPump();
}
function miniLogPump(){
  const box = document.getElementById('miniLog');
  if(!box || __miniQ.length === 0){ __miniTimer = null; return; }
  const html = __miniQ.shift();
  const row = document.createElement('div');
  row.className = 'mini-log-row';
  row.innerHTML = html;
  box.appendChild(row);
  while(box.children.length > MINI_LOG.maxLines) box.removeChild(box.firstChild);
  setTimeout(()=> row.classList.add('out'), MINI_LOG.showMs);
  setTimeout(()=> row.remove(), MINI_LOG.showMs + MINI_LOG.fadeMs);
  __miniTimer = setTimeout(()=>{ __miniTimer = null; if(__miniQ.length) miniLogPump(); }, MINI_LOG.staggerMs);
}
function miniLogClear(){
  __miniQ = [];
  if(__miniTimer){ clearTimeout(__miniTimer); __miniTimer = null; }
  const box = document.getElementById('miniLog'); if(box) box.innerHTML = '';
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  const loaded = await loadGame();
  if(!loaded){ state = freshState(); saveGame(); }
  // 個體實例模型（iid+status）上線：舊存檔的 equipment/skills/items 存的是key字串，
  // 跟新格式不相容，且專案已定案不寫遷移腳本（見設計文件），偵測到舊格式就直接重開新局
  if(!state.equipInstances || !state.skillInstances || !state.itemInstances){
    toast('資料格式已更新，重新開始新的存檔');
    state = freshState(); saveGame();
  }
  // 相容舊存檔：補上這批更新新增的欄位，避免舊存檔缺欄位而報錯
  if(!state.flags) state.flags = {};
  if(state.maxChapterReached == null) state.maxChapterReached = 0;
  if(state.crystal == null) state.crystal = 3200; // 相容舊存檔：技能水晶貨幣，補上初始值
  if(state.sphere == null) state.sphere = 5000;
  if(state.expPool == null) state.expPool = 5000;
  const freshRef = freshParty(); // 拿新角色的預設unlockChapter/active，補進舊存檔的角色資料
  state.party.forEach(p=>{
    const ref = freshRef.find(f=>f.id===p.id);
    if(p.unlockChapter == null) p.unlockChapter = ref ? ref.unlockChapter : 0;
    if(p.active == null) p.active = ref ? ref.active : true;
    if(p.level == null) p.level = 1;
    if(!p.training) p.training = { hp:0, sp:0, atk:0, def:0 };
  });
  renderNav();
  switchView('chapters');
  initVersionTag();
  initUnitInspectorModal();
  initBattleOverlayModals();
}
init();

/* ============================================================
   版本紀錄彈窗（隱藏版本號觸發）
============================================================ */
/* ============================================================
   UNIT INSPECTOR（v0.33新增，測試用）
   顯示戰場上所有單位的即時數值(effectiveStat後的結果，含被動/buff疊加)、技能、被動，
   被動額外標「生效中/未生效」方便debug條件判斷對不對。開著的時候renderGrid()每次都會
   連帶重繪這裡，讓面板跟著戰鬥進度即時更新，不用自己手動重開視窗
============================================================ */
function toggleUnitInspector(){
  const modal = document.getElementById('unitInspectorModal');
  if(!modal) return;
  const opening = !modal.classList.contains('show');
  if(battle) battle.inspectorFocusUnit = null; // 右上角icon開的一律是「全部單位」清單，跟單點chip的聚焦狀態分開
  playSound(opening ? UI_SFX.panelOpen : UI_SFX.panelClose);
  modal.classList.toggle('show');
  if(opening) renderUnitInspector();
}
// v0.39新增：點戰場上的單位chip觸發，只看那一個單位的「生物檢視」卡片(跟右上角icon的全部清單共用同一個modal)
function openUnitInspectorFor(u){
  if(!battle) return;
  battle.inspectorFocusUnit = u;
  const modal = document.getElementById('unitInspectorModal');
  if(!modal) return;
  if(!modal.classList.contains('show')) playSound(UI_SFX.panelOpen); // 已經開著、只是切換聚焦單位就不重播開啟音
  modal.classList.add('show');
  renderUnitInspector();
}
// v0.39新增：battle.inspectorFocusUnit有值時只顯示那一個單位(「生物檢視」，點單位chip開的)，
// 沒值時維持原本「全部單位」清單(右上角icon開的，測試用)。兩者共用同一個modal跟同一套卡片排版，
// 差別只在要跑迴圈的units陣列是1筆還是全部，卡片內容(HP/屬性/技能/被動/狀態)完全共用不用另外寫一份。
function renderUnitInspector(){
  const modal = document.getElementById('unitInspectorModal');
  const body = document.getElementById('unitInspectorModalBody');
  const titleEl = document.getElementById('unitInspectorModalTitle');
  if(!modal || !body || !modal.classList.contains('show') || !battle) return;
  const focus = battle.inspectorFocusUnit;
  const units = focus ? [focus] : battle.allies.concat(battle.enemies);
  if(titleEl) titleEl.textContent = focus ? `生物檢視：${focus.name}` : '狀態（測試用）';
  body.innerHTML = units.map(u=>{
    // v0.43修正：9個屬性逐項全名→ 3組「物/元/神」各寫「攻擊/防禦/格擋」的5/5/5縮寫，敵人沒設定的系統本來就是0，直接顯示0即可不用另外判斷
    const statLine = STAT_GROUPS.map(g => `${g.label} ${g.keys.map(k=>effectiveStat(u,k)).join('/')}`).join('　');
    // v0.43新增：TP/SP(技能資源)比照側邊欄HP那行的做法，跟在HP後面顯示，resName==='-'代表這個單位沒有設定資源，直接省略不寫
    const hpLine = `HP ${u.hp}/${u.maxHp}${u.resName!=='-'?` · ${u.resName} ${u.res}/${u.resMax}`:''}`;
    const skillNames = (u.skills||[]).map(k => (SKILL_DB[k]&&SKILL_DB[k].name) || k).join('、') || '（無）';
    const passiveIds = getUnitPassiveIds(u);
    const passiveLines = passiveIds.length ? passiveIds.map(pid=>{
      const pdef = PASSIVE_DB[pid];
      if(!pdef) return `${pid}（找不到資料）`;
      const active = evaluatePassiveCondition(u, pdef.condition);
      return `${pdef.name}（${active ? '生效中' : '未生效'}）`;
    }).join('、') : '（無）';
    const statusLines = (u.statuses||[]).length ? u.statuses.map(s=>{
      const sdef = STATUS_DB[s.key];
      const name = (sdef && sdef.name) || s.key;
      const kind = s.value >= 0 ? 'buff' : 'debuff';
      const remain = s.duration ? `剩${s.duration.remaining}回合` : '';
      return `${name}(${kind}${s.value>=0?'+':''}${s.value}・${remain})`;
    }).join('、') : '（無）';
    return `<div style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border-dim,#3a3a3a);">
      <div style="font-size:13px;font-weight:600;color:var(--gold-bright);">${u.name}（${u.side==='ally'?'我方':'敵方'}）${u.hp<=0?' — 已倒下':''}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${hpLine}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${statLine}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">技能：${skillNames}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">被動：${passiveLines}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">狀態：${statusLines}</div>
    </div>`;
  }).join('');
}

/* v0.35新增：行動面板(actionModal)／戰報(logModal) 這兩個新的overlay，
   關閉方式(右上✕、點背景)跟changelogModal/unitInspectorModal共用同一套modal-overlay慣例。
   actionModal額外要把battle.actionPanelOpen同步設回false，不然手動關閉後旗標仍是true，
   下次renderGrid()還是會誤判成「面板開著、網格鎖定」。
   v0.40修正：這裡改成呼叫syncActionModal()而不是自己手動toggle class，
   確保跟icon手動開關(toggleActionPanel)走同一條路、同樣會補renderGrid()解鎖網格 */
function initBattleOverlayModals(){
  const actionModal = document.getElementById('actionModal');
  const closeAction = ()=>{ if(battle) battle.actionPanelOpen = false; syncActionModal(); };
  document.getElementById('actionModalClose').onclick = closeAction;
  actionModal.onclick = (e)=>{ if(e.target === actionModal) closeAction(); };

  const logModal = document.getElementById('logModal');
  const closeLog = ()=>{
    if(logModal.classList.contains('show')) playSound(UI_SFX.panelClose); // 已經是關的就不重播
    logModal.classList.remove('show');
  };
  document.getElementById('logModalClose').onclick = closeLog;
  logModal.onclick = (e)=>{ if(e.target === logModal) closeLog(); };
}
function initUnitInspectorModal(){
  const modal = document.getElementById('unitInspectorModal');
  const closeModal = ()=>{
    if(modal.classList.contains('show')) playSound(UI_SFX.panelClose);
    modal.classList.remove('show'); if(battle) battle.inspectorFocusUnit = null;
  };
  document.getElementById('unitInspectorModalClose').onclick = closeModal;
  modal.onclick = (e)=>{ if(e.target === modal) closeModal(); };
}
function initVersionTag(){
  // v0.47：changelog彈窗已移除，版本號只是純顯示（不可點擊）
  const tag = document.getElementById('versionTag');
  if(tag) tag.textContent = GAME_VERSION;
}

})();
